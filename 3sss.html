<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D太陽系シミュレーター</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Helvetica Neue',Arial,'Hiragino Sans','Noto Sans JP',sans-serif;background:#000;overflow:hidden;color:#fff;user-select:none;-webkit-user-select:none}
#canvas-container{width:100vw;height:100vh;position:fixed;top:0;left:0;z-index:1}
#ui-layer{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;pointer-events:none}
#ui-layer>*{pointer-events:auto}
.planet-label{position:absolute;color:#fff;font-size:14px;text-shadow:0 0 4px #000,0 0 10px #000,0 0 18px rgba(0,0,0,.8);white-space:nowrap;pointer-events:none;transform:translate(-50%,-130%);opacity:.95;transition:opacity .2s;font-weight:700;letter-spacing:.6px}
.planet-label.hidden{opacity:0}
#controls{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(10,15,30,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:12px 20px;border-radius:16px;display:flex;align-items:center;gap:14px;border:1px solid rgba(100,150,255,.15);box-shadow:0 8px 32px rgba(0,0,0,.5);max-width:calc(100vw - 32px);flex-wrap:wrap;justify-content:center}
#controls button{background:rgba(60,100,200,.25);border:1px solid rgba(100,150,255,.3);color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s;min-width:64px}
#controls button:hover{background:rgba(80,130,240,.4);border-color:rgba(120,170,255,.5)}
#controls button:active{transform:scale(.95)}
#speed-slider{width:120px;cursor:pointer}
#speed-val{color:#8ec5ff;font-size:12px;min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
#info-panel{position:fixed;top:16px;right:16px;background:rgba(10,15,30,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:16px 20px;border-radius:14px;border:1px solid rgba(100,150,255,.15);box-shadow:0 8px 32px rgba(0,0,0,.5);min-width:200px;max-width:280px;opacity:0;transform:translateY(-10px);transition:all .3s;pointer-events:auto}
#info-panel.visible{opacity:1;transform:translateY(0)}
#info-panel h2{margin:0 0 10px;font-size:16px;color:#8ec5ff;border-bottom:1px solid rgba(100,150,255,.2);padding-bottom:6px}
#info-panel .info-row{display:flex;justify-content:space-between;margin:5px 0;font-size:12px;color:#c0d0e8}
#info-panel .info-row span:first-child{color:#8899aa}
#info-panel .close-btn{position:absolute;top:8px;right:10px;background:none;border:none;color:#8899aa;font-size:18px;cursor:pointer;line-height:1;padding:2px 6px;border-radius:4px}
#info-panel .close-btn:hover{color:#fff;background:rgba(255,255,255,.1)}
#title{position:fixed;top:16px;left:16px;font-size:18px;font-weight:700;color:#fff;text-shadow:0 0 12px rgba(100,150,255,.5);letter-spacing:1px;pointer-events:none}
#hint{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);color:rgba(180,200,230,.6);font-size:11px;pointer-events:none;text-align:center;line-height:1.6}
@media(max-width:640px){
#controls{bottom:12px;padding:10px 14px;gap:10px}
#controls button{padding:7px 12px;font-size:12px;min-width:56px}
#speed-slider{width:90px}
#info-panel{top:auto;bottom:140px;right:12px;left:12px;max-width:none}
#hint{bottom:62px;font-size:10px}
.planet-label{font-size:11px}
#title{font-size:14px;top:12px;left:12px}
}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="canvas-container"></div>
<div id="ui-layer">
<div id="title">3D 太陽系シミュレーター</div>
<div id="info-panel">
<button class="close-btn" onclick="closeInfo()">&times;</button>
<h2 id="info-name">惑星名</h2>
<div class="info-row"><span>太陽からの距離</span><span id="info-dist">-</span></div>
<div class="info-row"><span>公転周期</span><span id="info-period">-</span></div>
<div class="info-row"><span>直径</span><span id="info-dia">-</span></div>
<div class="info-row"><span>表面温度</span><span id="info-temp">-</span></div>
<div class="info-row"><span>衛星数</span><span id="info-moons">-</span></div>
</div>
<div id="controls">
<button id="btn-pause">一時停止</button>
<button id="btn-reset">全体表示</button>
<input type="range" id="speed-slider" min="0" max="5" step="0.1" value="1">
<span id="speed-val">1.0x</span>
</div>
<div id="hint">惑星をクリック／タップでフォーカス<br>ドラッグで回転・ピンチ/スクロールでズーム</div>
</div>
<div id="labels-container"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.0005);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 25, 55);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000);
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 300;
controls.enablePan = false;

const ambientLight = new THREE.AmbientLight(0x8899aa, 0.7);
scene.add(ambientLight);

const sunLight = new THREE.PointLight(0xffaa33, 4, 600);
sunLight.position.set(0, 0, 0);
scene.add(sunLight);

const sunGlow = new THREE.PointLight(0xff6600, 1.2, 250);
sunGlow.position.set(0, 0, 0);
scene.add(sunGlow);

function createStarField() {
  const count = 12000;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const r = 400 + Math.random() * 600;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i * 3 + 2] = r * Math.cos(phi);
    const t = Math.random();
    const c = t > 0.9 ? [1, 0.9, 0.7] : t > 0.7 ? [0.8, 0.9, 1] : [0.6, 0.7, 0.9];
    col[i * 3] = c[0];
    col[i * 3 + 1] = c[1];
    col[i * 3 + 2] = c[2];
    sizes[i] = 0.5 + Math.random() * 1.5;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  const mat = new THREE.PointsMaterial({ size: 0.7, vertexColors: true, transparent: true, opacity: 0.8, sizeAttenuation: true });
  scene.add(new THREE.Points(geo, mat));
}
createStarField();

function createTexture(color, stripes = false, hasBands = false, spot = false, isEarth = false) {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 256;
  const x = c.getContext('2d');
  if (isEarth) {
    x.fillStyle = '#1a5fb4';
    x.fillRect(0, 0, 512, 256);
    const landColors = ['#2d8a4e', '#3a9d5c', '#268b45', '#4db068'];
    for (let i = 0; i < 18; i++) {
      x.fillStyle = landColors[Math.floor(Math.random() * landColors.length)];
      const lx = Math.random() * 512;
      const ly = 20 + Math.random() * 200;
      const lw = 30 + Math.random() * 80;
      const lh = 15 + Math.random() * 40;
      x.beginPath();
      x.ellipse(lx, ly, lw, lh, Math.random() * 0.5, 0, Math.PI * 2);
      x.fill();
    }
    for (let i = 0; i < 25; i++) {
      x.fillStyle = 'rgba(255,255,255,.35)';
      const cx = Math.random() * 512;
      const cy = Math.random() * 256;
      const cr = 8 + Math.random() * 25;
      x.beginPath();
      x.arc(cx, cy, cr, 0, Math.PI * 2);
      x.fill();
    }
    const grad = x.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0, 'rgba(255,255,255,.15)');
    grad.addColorStop(0.5, 'rgba(255,255,255,0)');
    grad.addColorStop(1, 'rgba(255,255,255,.15)');
    x.fillStyle = grad;
    x.fillRect(0, 0, 512, 256);
  } else {
    const r = parseInt(color.slice(1, 3), 16), g = parseInt(color.slice(3, 5), 16), b = parseInt(color.slice(5, 7), 16);
    const grad = x.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0, `rgb(${Math.min(255, r + 40)},${Math.min(255, g + 40)},${Math.min(255, b + 40)})`);
    grad.addColorStop(0.5, `rgb(${r},${g},${b})`);
    grad.addColorStop(1, `rgb(${Math.max(0, r - 30)},${Math.max(0, g - 30)},${Math.max(0, b - 30)})`);
    x.fillStyle = grad;
    x.fillRect(0, 0, 512, 256);
    if (stripes) {
      for (let i = 0; i < 10; i++) {
        x.fillStyle = `rgba(${Math.max(0, r - 50)},${Math.max(0, g - 50)},${Math.max(0, b - 50)},.4)`;
        x.fillRect(0, 15 + i * 24, 512, 6 + Math.random() * 14);
      }
    }
    if (hasBands) {
      for (let i = 0; i < 8; i++) {
        const y = 20 + i * 28;
        x.fillStyle = `rgba(${Math.max(0, r - 30)},${Math.max(0, g - 30)},${Math.max(0, b - 30)},.35)`;
        x.fillRect(0, y, 512, 6 + Math.random() * 10);
      }
    }
    if (spot) {
      x.beginPath();
      x.ellipse(360, 110, 35, 22, 0, 0, Math.PI * 2);
      x.fillStyle = 'rgba(180,40,20,.55)';
      x.fill();
      x.beginPath();
      x.ellipse(360, 110, 28, 16, 0, 0, Math.PI * 2);
      x.fillStyle = 'rgba(200,60,30,.35)';
      x.fill();
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const planetData = [
  { name: '太陽', distance: 0, period: 0, speed: 0, size: 4, color: '#FDB813', temp: '5,500°C', moons: '-', diameter: '139万km', realDist: '0 km', emissive: 0xffaa00, emissiveInt: 1, glow: true },
  { name: '水星', distance: 8, period: '88日', speed: 0.02, size: 1.4, color: '#B8B8B8', temp: '167°C', moons: '0', diameter: '4,879km', realDist: '5,790万km' },
  { name: '金星', distance: 12, period: '225日', speed: 0.015, size: 1.8, color: '#E8C87A', temp: '464°C', moons: '0', diameter: '12,104km', realDist: '1億820万km' },
  { name: '地球', distance: 17, period: '365日', speed: 0.012, size: 2, color: '#4F86F7', temp: '15°C', moons: '1', diameter: '12,742km', realDist: '1億4,960万km', isEarth: true },
  { name: '火星', distance: 23, period: '687日', speed: 0.01, size: 1.6, color: '#D85A2A', temp: '-65°C', moons: '2', diameter: '6,779km', realDist: '2億2,790万km', stripes: true },
  { name: '木星', distance: 35, period: '12年', speed: 0.005, size: 5, color: '#E8B87A', temp: '-110°C', moons: '95', diameter: '13万9,820km', realDist: '7億7,850万km', hasBands: true, spot: true },
  { name: '土星', distance: 50, period: '29年', speed: 0.0035, size: 4.2, color: '#F0D878', temp: '-140°C', moons: '146', diameter: '11万6,460km', realDist: '14億3,400万km', hasBands: true, ring: true },
  { name: '天王星', distance: 65, period: '84年', speed: 0.0025, size: 3, color: '#7EC8E3', temp: '-195°C', moons: '27', diameter: '5万724km', realDist: '28億7,100万km' },
  { name: '海王星', distance: 78, period: '165年', speed: 0.002, size: 2.8, color: '#4A9EFF', temp: '-200°C', moons: '16', diameter: '4万9,244km', realDist: '45億4,000万km' }
];

const planets = [];
const trails = [];
const trailLength = 120;
const labelsContainer = document.getElementById('labels-container');
const labelEls = [];

planetData.forEach((d, i) => {
  const group = new THREE.Group();
  let mesh;
  if (d.name === '太陽') {
    const geo = new THREE.SphereGeometry(d.size, 32, 32);
    const mat = new THREE.MeshBasicMaterial({ color: d.color, emissive: d.emissive, emissiveIntensity: d.emissiveInt });
    mesh = new THREE.Mesh(geo, mat);
    const glowGeo = new THREE.SphereGeometry(d.size * 1.4, 32, 32);
    const glowMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.2, side: THREE.BackSide });
    const glowMesh = new THREE.Mesh(glowGeo, glowMat);
    group.add(glowMesh);
    const glowGeo2 = new THREE.SphereGeometry(d.size * 1.9, 32, 32);
    const glowMat2 = new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.08, side: THREE.BackSide });
    const glowMesh2 = new THREE.Mesh(glowGeo2, glowMat2);
    group.add(glowMesh2);
  } else {
    const tex = createTexture(d.color, d.stripes, d.hasBands, d.spot, d.isEarth);
    const geo = new THREE.SphereGeometry(d.size, 22, 22);
    const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.7, metalness: 0.05 });
    mesh = new THREE.Mesh(geo, mat);
    if (d.ring) {
      const ringGeo = new THREE.RingGeometry(d.size * 1.4, d.size * 2.3, 64);
      const ringMat = new THREE.MeshBasicMaterial({ color: '#E8D5A8', transparent: true, opacity: 0.7, side: THREE.DoubleSide });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = Math.PI / 2.4;
      group.add(ring);
    }
  }
  group.add(mesh);
  if (d.distance > 0) {
    const orbitGeo = new THREE.RingGeometry(d.distance - 0.03, d.distance + 0.03, 128);
    const orbitMat = new THREE.MeshBasicMaterial({ color: 0x334466, transparent: true, opacity: 0.1, side: THREE.DoubleSide });
    const orbit = new THREE.Mesh(orbitGeo, orbitMat);
    orbit.rotation.x = -Math.PI / 2;
    scene.add(orbit);
    const trailGeo = new THREE.BufferGeometry();
    const trailPos = new Float32Array(trailLength * 3);
    trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
    const trailMat = new THREE.LineBasicMaterial({ color: d.color, transparent: true, opacity: 0.4 });
    const trailLine = new THREE.Line(trailGeo, trailMat);
    scene.add(trailLine);
    trails.push({ line: trailLine, positions: [], color: d.color });
  } else {
    trails.push(null);
  }
  mesh.userData = { planetIndex: i, planetData: d };
  scene.add(group);
  planets.push({ group, mesh, data: d, angle: Math.random() * Math.PI * 2, trailIndex: i });
  const label = document.createElement('div');
  label.className = 'planet-label';
  label.textContent = d.name;
  labelsContainer.appendChild(label);
  labelEls.push(label);
});

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let focusedPlanet = null;
let targetCameraPos = null;
let isPaused = false;
let simSpeed = 1;
let selectedPlanetIndex = -1;

const btnPause = document.getElementById('btn-pause');
const btnReset = document.getElementById('btn-reset');
const speedSlider = document.getElementById('speed-slider');
const speedVal = document.getElementById('speed-val');
const infoPanel = document.getElementById('info-panel');

btnPause.addEventListener('click', () => {
  isPaused = !isPaused;
  btnPause.textContent = isPaused ? '再開' : '一時停止';
});

btnReset.addEventListener('click', () => {
  focusedPlanet = null;
  targetCameraPos = null;
  selectedPlanetIndex = -1;
  closeInfo();
  const dur = 1200;
  const startPos = camera.position.clone();
  const endPos = new THREE.Vector3(0, 25, 55);
  const startTime = performance.now();
  function animateReset(now) {
    const t = Math.min((now - startTime) / dur, 1);
    const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    camera.position.lerpVectors(startPos, endPos, e);
    controls.target.lerp(new THREE.Vector3(0, 0, 0), e);
    if (t < 1) requestAnimationFrame(animateReset);
  }
  requestAnimationFrame(animateReset);
});

speedSlider.addEventListener('input', e => {
  simSpeed = parseFloat(e.target.value);
  speedVal.textContent = simSpeed.toFixed(1) + 'x';
});

function onPointerDown(e) {
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  mouse.x = (clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(planets.map(p => p.mesh));
  if (intersects.length > 0) {
    const idx = intersects[0].object.userData.planetIndex;
    focusPlanet(idx);
  }
}
renderer.domElement.addEventListener('pointerdown', onPointerDown);

function focusPlanet(idx) {
  selectedPlanetIndex = idx;
  const p = planets[idx];
  focusedPlanet = p;
  showInfo(p.data);
  const offset = p.data.size * 3 + 3;
  const endPos = new THREE.Vector3(p.group.position.x + offset, p.group.position.y + offset * 0.6, p.group.position.z + offset);
  const dur = 1000;
  const startPos = camera.position.clone();
  const startTime = performance.now();
  function animateFocus(now) {
    const t = Math.min((now - startTime) / dur, 1);
    const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    camera.position.lerpVectors(startPos, endPos, e);
    controls.target.lerp(p.group.position, e);
    if (t < 1) requestAnimationFrame(animateFocus);
  }
  requestAnimationFrame(animateFocus);
}

function showInfo(d) {
  document.getElementById('info-name').textContent = d.name;
  document.getElementById('info-dist').textContent = d.realDist;
  document.getElementById('info-period').textContent = d.period;
  document.getElementById('info-dia').textContent = d.diameter;
  document.getElementById('info-temp').textContent = d.temp;
  document.getElementById('info-moons').textContent = d.moons;
  infoPanel.classList.add('visible');
}

window.closeInfo = function () {
  infoPanel.classList.remove('visible');
  selectedPlanetIndex = -1;
};

function updateLabels() {
  planets.forEach((p, i) => {
    const pos = p.group.position.clone();
    pos.y += p.data.size + 1.5;
    pos.project(camera);
    const x = (pos.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-(pos.y * 0.5) + 0.5) * window.innerHeight;
    const el = labelEls[i];
    if (pos.z < 1 && x > 0 && x < window.innerWidth && y > 0 && y < window.innerHeight) {
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.classList.remove('hidden');
    } else {
      el.classList.add('hidden');
    }
  });
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);
  if (!isPaused && simSpeed > 0) {
    planets.forEach((p, i) => {
      if (p.data.distance > 0) {
        p.angle += p.data.speed * simSpeed * delta * 60;
        p.group.position.x = Math.cos(p.angle) * p.data.distance;
        p.group.position.z = Math.sin(p.angle) * p.data.distance;
        p.mesh.rotation.y += 0.005 * simSpeed;
        if (trails[i]) {
          trails[i].positions.push(p.group.position.clone());
          if (trails[i].positions.length > trailLength) trails[i].positions.shift();
          const posArr = trails[i].line.geometry.attributes.position.array;
          for (let j = 0; j < trailLength; j++) {
            if (j < trails[i].positions.length) {
              posArr[j * 3] = trails[i].positions[j].x;
              posArr[j * 3 + 1] = trails[i].positions[j].y;
              posArr[j * 3 + 2] = trails[i].positions[j].z;
            } else {
              posArr[j * 3] = p.group.position.x;
              posArr[j * 3 + 1] = p.group.position.y;
              posArr[j * 3 + 2] = p.group.position.z;
            }
          }
          trails[i].line.geometry.attributes.position.needsUpdate = true;
        }
      }
    });
  }
  if (focusedPlanet && !isPaused && simSpeed > 0) {
    const offset = focusedPlanet.data.size * 3 + 3;
    const targetPos = focusedPlanet.group.position.clone().add(new THREE.Vector3(offset, offset * 0.6, offset));
    camera.position.lerp(targetPos, 0.04);
    controls.target.lerp(focusedPlanet.group.position, 0.08);
  }
  controls.update();
  updateLabels();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
