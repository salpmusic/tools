<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>蒼穹のレゾナンス v1.0</title><style>*{box-sizing:border-box}body{margin:0;background:#080e23;color:#e8f5ff;font-family:system-ui;text-align:center;overflow:hidden}header{height:38px;display:flex;justify-content:space-around;align-items:center;background:#101d39;font-weight:800;font-size:13px}canvas{display:block;margin:auto;background:#123d65;image-rendering:pixelated;touch-action:none;max-width:100vw}#bomb{position:fixed;bottom:24px;right:14px;border:2px solid #f5c66c;background:#922b4d;color:white;border-radius:50%;width:72px;height:72px;font-weight:900;font-size:15px}#panel{position:fixed;inset:38px 0 0;background:#07132bea;display:flex;align-items:center;justify-content:center;padding:18px}#inner{max-width:370px;width:100%;border:2px solid #55d9fc;padding:20px;background:#132b4e;box-shadow:0 0 30px #159cd866}h1{font-size:25px;color:#ffe2a2}button{cursor:pointer;font-size:17px;padding:13px;margin:7px;border:2px solid #75c8f9;border-radius:5px;background:#204d7b;color:white}p{line-height:1.7}</style><header><span id="score">SCORE 000000</span><span id="life">LIFE ♥♥♥</span><span id="power">P 1</span><button id="music" style="position:fixed;z-index:2;top:41px;left:5px;padding:5px 8px;font-size:12px;background:#102c48">♫ ON</button></header><canvas id="c" width="320" height="540"></canvas><button id="bomb">BOMB</button><div id="panel"><div id="inner"><h1>蒼穹のレゾナンス</h1><p>1995 ARCADE STYLE<br>STAGE 1 海上都市<br>指を滑らせて相対移動・ショット自動</p><button id="start">出撃 START</button></div></div><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),panel=document.querySelector('#panel'),inner=document.querySelector('#inner');g.imageSmoothingEnabled=false;
function fit(){c.style.height=Math.min(innerHeight-38,innerWidth*540/320)+'px';c.style.width=(parseFloat(c.style.height)*320/540)+'px'}onresize=fit;fit();
let state='menu',tick=0,score=0,lives=3,power=1,bombs=3,player={x:160,y:470,inv:0},shots=[],enemies=[],bullets=[],fx=[],boss=null,spawn=0,route=0;
let musicOn=true,audio=null,musicTimer=null,beat=0,bossMusic=false;
const TRACKS=['STAGE_1_Azure_Assault.mp3','STAGE_1_Azure_Assault_2.mp3','Iron_Fortress_Gradion.mp3','Iron_Fortress_Gradion_2.mp3'];let bgm=null,currentTrack=-1;
function playTrack(i){if(currentTrack===i&&bgm&&!bgm.paused)return;currentTrack=i;if(bgm){bgm.pause();bgm=null}if(!musicOn)return;const btn=document.querySelector('#music');const target=new Audio();bgm=target;target.preload='auto';target.src=new URL(TRACKS[i],location.href).href+'?audiofix=c70e4ea2';target.loop=true;target.volume=.75;btn.textContent='♫ v1.8 読込中';target.addEventListener('playing',()=>{if(bgm===target)btn.textContent='♫ v1.8 MP3'});target.addEventListener('error',()=>{if(bgm===target){const code=target.error?.code||0;btn.textContent='♫ v1.8 E'+code;console.error('BGM error',code,target.error?.message,target.currentSrc)}});target.play().catch(e=>{if(bgm===target){btn.textContent='♫ '+(e.name==='NotAllowedError'?'タップ再生':'再生失敗');console.error('BGM play rejected',e.name,e.message,target.currentSrc)}})}
function stopTrack(){if(bgm){bgm.pause();bgm=null}currentTrack=-1}
let stage=1;const stageNames={1:'海上都市',2:'工業都市',3:'砂漠遺跡'};let formation=0;
let hi=Number(localStorage.getItem('soukyu.hi')||0);
function reset(nextStage=1){stage=nextStage;state='play';tick=0;score=0;lives=3;power=1;bombs=3;player={x:160,y:470,inv:90};shots=[];enemies=[];bullets=[];fx=[];boss=null;spawn=0;panel.style.display='none';playTrack(0)}
document.querySelector('#start').onclick=()=>reset();
function sound(f,d=.09,type='square',vol=.012){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.value=f;v.gain.value=vol;o.connect(v);v.connect(a.destination);o.start();o.stop(a.currentTime+d);o.onended=()=>a.close()}catch(e){}}
function blast(x,y,n=12){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=1+Math.random()*3;fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:18+Math.random()*20})}sound(75,.18,'sawtooth',.06)}
function bomb(){if(state!=='play'||bombs<1)return;bombs--;bullets=[];enemies.forEach(e=>{e.hp-=12;blast(e.x,e.y,5)});if(boss){boss.hp-=70;blast(boss.x,boss.y,30)};player.inv=100;sound(100,.4,'sawtooth',.1)}
document.querySelector('#bomb').onclick=bomb;document.querySelector('#music').onclick=()=>{if(musicOn&&bgm&&bgm.paused){bgm.play().catch(()=>{});return}musicOn=!musicOn;document.querySelector('#music').textContent=musicOn?'♫ ON':'♫ OFF';if(!musicOn){stopTrack();document.querySelector('#music').textContent='♫ OFF'}else {playTrack(boss?(boss.phase===2?3:2):(tick>=1050?1:0))}};
function pos(e){let r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*320/r.width,y:(e.clientY-r.top)*540/r.height}}
let dragging=false,lastTouch=null;c.addEventListener('pointerdown',e=>{if(state!=='play')return;dragging=true;c.setPointerCapture(e.pointerId);lastTouch=pos(e)});c.addEventListener('pointermove',e=>{if(!dragging||state!=='play'||!lastTouch)return;let p=pos(e);player.x=Math.max(15,Math.min(305,player.x+p.x-lastTouch.x));player.y=Math.max(70,Math.min(518,player.y+p.y-lastTouch.y));lastTouch=p});function endDrag(){dragging=false;lastTouch=null}c.addEventListener('pointerup',endDrag);c.addEventListener('pointercancel',endDrag);
let keys={};onkeydown=e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();bomb()}};onkeyup=e=>keys[e.key]=false;
function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(Math.round(x),Math.round(y),w,h)}
function ship(x,y,col='#62dbff',size=1){g.save();g.translate(Math.round(x),Math.round(y));g.scale(size,size);rect(-3,-13,6,25,'#d3eaff');rect(-2,-17,4,9,'#fff2ae');rect(-12,-2,24,7,col);rect(-15,3,7,7,'#22588b');rect(8,3,7,7,'#22588b');rect(-5,0,10,13,'#2360a5');rect(-2,-7,4,9,'#ff715c');rect(-10,9,5,6,'#ffb35a');rect(5,9,5,6,'#ffb35a');g.restore()}
function pixelShip(x,y,scale=1){g.save();g.translate(Math.round(x),Math.round(y));g.scale(scale,scale);const p=['....cc....','....ww....','...cwwc...','...cbbc...','..ssbbss..','.ssssssss.','ssbbssbbss','ssbbssbbss','s.bbssbb.s','..bbrrbb..','...r..r...'];let cols={c:'#ffe69a',w:'#dff8ff',b:'#2670a6',s:'#70d9f3',r:'#ff9745'};p.forEach((row,j)=>[...row].forEach((v,i)=>{if(cols[v])rect((i-5)*3,(j-6)*3,3,3,cols[v])}));g.restore()}
function enemyDraw(e){g.save();g.translate(e.x,e.y);g.rotate(Math.PI);pixelShip(0,0,e.kind?1.2:.9);g.restore()}
function spawnEnemy(xOverride){let x=xOverride??(25+Math.random()*270),kind=Math.random()<.22?1:0;enemies.push({x,y:-20,kind,hp:kind?8:3,phase:Math.random()*6.28,age:0,drop:Math.random()<.24})}
function hit(a,b,r){return Math.hypot(a.x-b.x,a.y-b.y)<r}
function damage(){if(player.inv>0)return;lives--;player.inv=100;power=Math.max(1,power-1);blast(player.x,player.y,20);if(lives<=0){stopTrack();state='over';show('<h1>GAME OVER</h1><p>SCORE '+score+'<br>HIGH SCORE '+hi+'</p><button onclick="reset()">再出撃</button>')}}
function show(html){inner.innerHTML=html;panel.style.display='flex'}
function clear(){stopTrack();state='clear';hi=Math.max(hi,score);localStorage.setItem('soukyu.hi',hi);stage===1?show('<h1>STAGE 1 CLEAR!</h1><p>グラディオン撃破！<br>次の進路を選択</p><button onclick="choose(2)">A 工業都市</button><button onclick="choose(3)">B 砂漠遺跡</button>'):show('<h1>STAGE '+stage+' CLEAR!</h1><p>'+stageNames[stage]+'を突破！<br>次の分岐は今後追加予定</p><button onclick="reset(1)">最初からプレイ</button>')}
function choose(n){route=n;localStorage.setItem('soukyu.route',n);reset(n)}
function update(){if(state!=='play')return;tick++;if(keys.ArrowLeft||keys.a)player.x-=3;if(keys.ArrowRight||keys.d)player.x+=3;if(keys.ArrowUp||keys.w)player.y-=3;if(keys.ArrowDown||keys.s)player.y+=3;player.x=Math.max(15,Math.min(305,player.x));player.y=Math.max(70,Math.min(518,player.y));if(player.inv)player.inv--;
if(tick%9===0){shots.push({x:player.x,y:player.y-15,vy:-9});if(power>1){shots.push({x:player.x-9,y:player.y-8,vy:-9,vx:-.7},{x:player.x+9,y:player.y-8,vy:-9,vx:.7})}if(tick%27===0)sound(680,.035)}
if(tick===1050)playTrack(1);if(tick<2100&&tick%Math.max(23,55-Math.floor(tick/170))===0){if(tick%4===0){for(let j=0;j<5;j++)enemies.push({x:160+(j-2)*36,y:-20-Math.abs(j-2)*24,kind:0,hp:3,phase:j,age:0,drop:false})}else spawnEnemy()}
if(tick===2150){enemies=[];bullets=[];boss={x:160,y:-85,hp:260,max:260,age:0,phase:1,turrets:[28,28]};playTrack(2);sound(140,.5,'sawtooth',.06)}
for(let e of enemies){e.age++;e.y+=e.kind?1.2:2;e.x+=Math.sin(e.age*.05+e.phase)*1.3;if(e.age%75===0){let dx=player.x-e.x,dy=player.y-e.y,l=Math.hypot(dx,dy)||1;bullets.push({x:e.x,y:e.y,vx:dx/l*2,vy:dy/l*2})}if(hit(e,player,15))damage()}
enemies=enemies.filter(e=>e.y<570&&e.hp>0);
if(boss){boss.age++;boss.y+=(boss.y<95?1.2:0);boss.x=160+Math.sin(boss.age*.018)*70;if(boss.age%(boss.phase===2?24:38)===0){for(let i=-3;i<=3;i++){let a=Math.PI/2+i*(boss.phase===2?.29:.2);bullets.push({x:boss.x,y:boss.y+35,vx:Math.cos(a)*(boss.phase===2?3.1:2.5),vy:Math.sin(a)*(boss.phase===2?3.1:2.5)})}}if(boss.age%90===0){for(let k=0;k<2;k++)if(boss.turrets[k]>0){let xx=boss.x+(k?43:-43),dx=player.x-xx,dy=player.y-boss.y,l=Math.hypot(dx,dy)||1;bullets.push({x:xx,y:boss.y,vx:dx/l*3,vy:dy/l*3})}}if(boss.hp<=boss.max*.5&&boss.phase===1){boss.phase=2;playTrack(3);blast(boss.x,boss.y,40);bullets=[];sound(180,.6,'sawtooth',.09)}if(boss.hp<=0){blast(boss.x,boss.y,90);score+=10000;boss=null;clear()}}
for(let s of shots){s.y+=s.vy;s.x+=s.vx||0;for(let e of enemies){if(hit(s,e,e.kind?18:13)){e.hp--;s.y=-100;if(e.hp<=0){score+=e.kind?350:100;blast(e.x,e.y);if(e.drop)enemies.push({x:e.x,y:e.y,kind:2,hp:999,age:0,phase:0,drop:false})}break}}if(boss&&Math.abs(s.x-boss.x)<62&&Math.abs(s.y-boss.y)<46){let turret=s.x<boss.x?0:1;if(Math.abs(s.x-(boss.x+(turret?43:-43)))<15&&boss.turrets[turret]>0){boss.turrets[turret]--;if(boss.turrets[turret]===0){score+=1500;blast(boss.x+(turret?43:-43),boss.y,35)}}else boss.hp--;s.y=-100;if(tick%5===0)blast(s.x,s.y,2)}}shots=shots.filter(s=>s.y>-30);
for(let b of bullets){b.x+=b.vx;b.y+=b.vy;if(hit(b,player,9)){damage();b.y=999}}bullets=bullets.filter(b=>b.y<550&&b.y>-20&&b.x>-20&&b.x<340);
for(let e of enemies){if(e.kind===2){e.y+=.7;if(hit(e,player,19)){power=Math.min(3,power+1);score+=500;e.hp=0;sound(920,.2,'sine',.07)}}}
for(let f of fx){f.x+=f.vx;f.y+=f.vy;f.t--}fx=fx.filter(f=>f.t>0);hi=Math.max(hi,score);document.querySelector('#score').textContent='SCORE '+String(score).padStart(6,'0');document.querySelector('#life').textContent='LIFE '+'♥'.repeat(Math.max(0,lives));document.querySelector('#power').textContent='P '+power+' B'+bombs}
function draw(){let off=tick*1.25;rect(0,0,320,540,stage===1?'#12547d':stage===2?'#292e43':'#8c6648');for(let i=0;i<22;i++){let x=(i*79+33)%320,y=(i*113+off*(.6+i%3*.25))%580-20;rect(x,y,18,2,stage===1?(i%3?'#317ea2':'#8ac6d6'):stage===2?(i%3?'#5a6475':'#d07d40'):(i%3?'#bd9461':'#e3c18b'))}for(let i=0;i<28;i++){let wx=(i*83+17)%320,wy=(i*91+off*(.4+i%3*.12))%570;rect(wx,wy,11+(i%4)*3,1,i%2?'#a4d5e3':'#3b9abb')}for(let i=0;i<5;i++){let y=(i*160+off*.55)%750-110,x=i%2?258:0;rect(x,y,52,95,stage===1?'#54727a':stage===2?'#4c4c58':'#a77c50');rect(x+4,y+4,44,87,stage===1?'#87908b':stage===2?'#737481':'#c2a079');for(let j=0;j<5;j++)rect(x+8+(j%2)*19,y+10+j*15,11,5,'#344c65')}
for(let s of shots){rect(s.x-2,s.y-9,4,12,'#e6faff');rect(s.x-1,s.y-14,2,6,'#5aeaff')}for(let e of enemies){if(e.kind===2){rect(e.x-9,e.y-9,18,18,'#f3c65c');rect(e.x-4,e.y-5,8,10,'#fff');rect(e.x-2,e.y-3,4,6,'#d27a17')}else enemyDraw(e)}
for(let b of bullets){rect(b.x-3,b.y-3,6,6,'#ffb85b');rect(b.x-1,b.y-1,2,2,'#fff5c2')}
if(boss){let b=boss;g.save();g.translate(b.x,b.y);rect(-66,-21,132,42,'#172b46');rect(-61,-16,122,32,'#3d5c72');rect(-50,-33,100,67,'#34465d');rect(-45,-29,90,57,'#72818c');rect(-24,-45,48,89,'#384c65');rect(-18,-40,36,78,b.phase===2?'#e16b54':'#a3a6a2');if(b.phase===2){rect(-29,-25,58,48,'#802f46');rect(-18,-20,36,35,'#ef704e');rect(-9,-12,18,20,'#fff0a4');rect(-3,-9,6,15,'#fff')}rect(-8,-27,16,44,'#bd584c');rect(-58,-7,116,20,'#263c5e');for(let k=0;k<2;k++){let x=k?43:-43;if(b.turrets[k]>0){rect(x-10,-18,20,38,'#283952');rect(x-5,-13,10,12,'#ffb75c')}else{rect(x-11,-8,22,19,'#281e2c');rect(x-5,-3,10,7,'#f16b3e')}}rect(-12,-52,24,20,'#f6c76b');for(let i=-2;i<=2;i++){rect(i*15-5,25,10,12,'#1b304c');rect(i*15-3,29,6,5,'#e5a55d')}rect(-5,-37,10,14,'#d4e7ed');g.restore();rect(32,15,256,9,'#1b273c');rect(33,16,254*Math.max(0,b.hp/b.max),7,'#ff6260');g.fillStyle='white';g.font='bold 10px monospace';g.fillText('GRADION',115,12)}
if(state==='play'&&(player.inv%8<4))pixelShip(player.x,player.y,1.15);for(let f of fx){rect(f.x,f.y,Math.max(2,f.t/9),Math.max(2,f.t/9),f.t>22?'#fff1a5':f.t>10?'#ff8e4b':'#d83e4a')}if(state==='play'&&tick<150){g.fillStyle='#fff';g.font='bold 16px monospace';g.fillText('STAGE '+stage+'  '+(stage===1?'SEA CITY':stage===2?'IRON CITY':'DESERT RUINS'),28,100)}}
function loop(){update();draw();requestAnimationFrame(loop)}loop();</script></html>
