function playTrack(i){if(currentTrack===i&&bgm)return;currentTrack=i;if(!musicOn)return;const el=document.querySelector('#nativeAudio'),btn=document.querySelector('#music');bgm=el;const begin=()=>{if(currentTrack!==i||!musicOn)return;el.pause();el.onerror=null;el.onplaying=null;audioSourceIndex=0;el.volume=0;el.loop=true;function attempt(){if(currentTrack!==i)return;if(audioSourceIndex>=AUDIO_BASES.length){btn.textContent='♫ E4';return}el.src=AUDIO_BASES[audioSourceIndex++]+TRACKS[i];btn.textContent='♫ 読込中';el.load();el.play().catch(()=>{})}el.onerror=attempt;el.onplaying=()=>{if(currentTrack===i){btn.textContent='♫ ON';fade(el,.75,1400)}};attempt()};if(!el.paused)fade(el,0,900,begin);else{fadeId++;begin()}}

let sfxCtx=null;function sound(f,d=.09,type='square',vol=.012){try{if(!sfxCtx)sfxCtx=new (window.AudioContext||window.webkitAudioContext)();if(sfxCtx.state==='suspended')sfxCtx.resume();const t=sfxCtx.currentTime,o=sfxCtx.createOscillator(),v=sfxCtx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(40,f*.45),t+d);v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(sfxCtx.destination);o.start(t);o.stop(t+d+.01)}catch(e){}}
function blast(x,y,n=12){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=1+Math.random()*3;fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:18+Math.random()*20})}sound(75,.18,'sawtooth',.06)}

let dragging=false,lastTouch=null;c.addEventListener('pointerdown',e=>{if(state!=='play')return;dragging=true;c.setPointerCapture(e.pointerId);lastTouch=pos(e)});c.addEventListener('pointermove',e=>{if(!dragging||state!=='play'||!lastTouch)return;let p=pos(e);player.x=Math.max(15,Math.min(305,player.x+p.x-lastTouch.x));player.y=Math.max(70,Math.min(518,player.y+p.y-lastTouch.y));lastTouch=p});function endDrag(){dragging=false;lastTouch=null}c.addEventListener('pointerup',endDrag);c.addEventListener('pointercancel',endDrag);

function pixelShip(x,y,scale=1){g.save();g.translate(Math.round(x),Math.round(y));g.scale(scale,scale);const p=['....cc....','....ww....','...cwwc...','...cbbc...','..ssbbss..','.ssssssss.','ssbbssbbss','ssbbssbbss','s.bbssbb.s','..bbrrbb..','...r..r...'];let cols={c:'#ffe69a',w:'#dff8ff',b:'#2670a6',s:'#70d9f3',r:'#ff9745'};p.forEach((row,j)=>[...row].forEach((v,i)=>{if(cols[v])rect((i-5)*3,(j-6)*3,3,3,cols[v])}));g.restore()}

function update(){if(state!=='play')return;tick++;if(keys.ArrowLeft||keys.a)player.x-=3;if(keys.ArrowRight||keys.d)player.x+=3;if(keys.ArrowUp||keys.w)player.y-=3;if(keys.ArrowDown||keys.s)player.y+=3;player.x=Math.max(15,Math.min(305,player.x));player.y=Math.max(70,Math.min(518,player.y));if(player.inv)player.inv--;

function scenery(off){g.save();if(stage===1){for(let i=0;i<10;i++){let x=(i*71+29)%320,y=(i*147+off*.42)%710-100;g.fillStyle='rgba(116,219,255,.14)';g.fillRect(x,y,58,2);g.fillStyle='rgba(4,23,51,.24)';g.fillRect(x+7,y+7,38,15);g.fillStyle='rgba(151,240,255,.35)';g.fillRect(x+10,y+9,20,2)}}else if(stage===2){for(let i=0;i<9;i++){let x=(i*113+11)%320,y=(i*143+off*.6)%780-170;g.fillStyle='#171c30';g.fillRect(x,y,37,112);g.fillStyle='#4e5669';g.fillRect(x+4,y+4,29,104);g.fillStyle='#151f31';g.fillRect(x+9,y-27,11,40);g.fillStyle='#b55b32';g.fillRect(x+9,y-29,11,4);for(let j=0;j<5;j++){g.fillStyle=j%2?'#df9b4c':'#ffd57d';g.fillRect(x+6+(j%2)*12,y+12+j*17,9,3)}g.fillStyle='rgba(245,119,55,.12)';g.fillRect(x-9,y-39,56,15)}for(let i=0;i<7;i++){let y=(i*101+off*.85)%640-30;g.fillStyle='#212639';g.fillRect(0,y,320,7);g.fillStyle='#b38b50';for(let x=0;x<320;x+=32)g.fillRect(x,y+2,15,2)}}else{for(let i=0;i<13;i++){let x=(i*97+19)%320,y=(i*89+off*.72)%690-70;g.fillStyle=i%2?'#a67a4b':'#d0a268';g.fillRect(x,y,50+(i%3)*17,4);g.fillStyle='rgba(255,221,153,.23)';g.fillRect(x+9,y+6,28,2)}for(let i=0;i<5;i++){let x=(i*89+34)%320,y=(i*167+off*.55)%750-100;g.fillStyle='#86613f';g.fillRect(x,y,34,42);g.fillStyle='#d7b17c';g.fillRect(x+3,y+3,28,36);g.fillStyle='#775337';g.fillRect(x+12,y+12,10,27);g.fillStyle='#f4d69d';g.fillRect(x+3,y+3,28,3)}g.fillStyle='rgba(255,226,159,.08)';for(let i=0;i<4;i++){let y=(i*141+off*.31)%560;g.fillRect(0,y,320,14)}}g.restore()}
