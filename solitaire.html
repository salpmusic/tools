<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>SALP SOLITAIRE</title>
<style>
:root{
  --bg:#2e7d32;
  --card-w:clamp(42px,12vw,86px);
  --card-h:calc(var(--card-w) * 1.4);
  --gap:clamp(3px,1vw,10px);
  --radius:8px;
  --card-border:#d7d7d7;
  --rank-size:calc(var(--card-w) * .30);
  --suit-size:calc(var(--card-w) * .62);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:#fff;
  padding:calc(env(safe-area-inset-top) + 8px) 4px calc(env(safe-area-inset-bottom) + 14px);
  overflow-x:hidden;
  touch-action:manipulation;
}
body.easyMode{
  --card-w:clamp(50px,13.6vw,98px);
  --gap:clamp(4px,1.2vw,12px);
  --rank-size:calc(var(--card-w) * .36);
  --suit-size:calc(var(--card-w) * .78);
  --card-border:#bdbdbd;
}
button{font:inherit}
header{
  width:min(100%,760px);margin:0 auto 10px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
}
h1{font-size:1.15rem;margin:0}
.controls{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.btn{
  border:0;border-radius:999px;padding:8px 12px;
  background:#fff;color:#1b5e20;font-weight:800;
  box-shadow:0 2px 5px #0003;
}
.btn.active{
  background:linear-gradient(135deg,#fff7a8,#ffe082);
  color:#3b2a1e;
}
.btn:active{transform:scale(.97)}
.helperText{
  width:min(100%,760px);margin:0 auto 8px;
  font-size:.9rem;color:#f2fff0;font-weight:700;
}
#board{width:min(100%,760px);margin:auto}
.top-region{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:var(--gap);margin-bottom:16px;
}
.group{display:flex;gap:var(--gap)}
.slot,.tableau-column{
  width:var(--card-w);height:calc(var(--card-w) * 1.4);
  border:2px dashed #ffffff4f;border-radius:var(--radius);
  position:relative;flex:0 0 auto;
}
.slot.hint::after{
  position:absolute;inset:0;display:grid;place-items:center;
  color:#ffffff7a;font-size:calc(var(--card-w)*.42);font-weight:900;
  pointer-events:none;
}
#stock.hint::after{content:"↻"}
.foundation.hint::after{content:"A"}
.tableau-region{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:var(--gap);min-height:calc(var(--card-w)*6.5)
}
.tableau-column{
  height:auto;min-height:calc(var(--card-w) * 1.4);
  border-color:#ffffff26;
}
.card{
  width:var(--card-w);height:calc(var(--card-w) * 1.4);
  border-radius:var(--radius);position:absolute;left:-2px;top:-2px;
  background:#fff;color:#111;border:1px solid var(--card-border);
  box-shadow:0 1px 5px #0005;
  user-select:none;-webkit-user-select:none;
  touch-action:none;cursor:grab;overflow:hidden;
}
.card.face-down{
  background:
    linear-gradient(135deg,#0d47a1 25%,#1976d2 25%,#1976d2 50%,#0d47a1 50%,#0d47a1 75%,#1976d2 75%);
  background-size:12px 12px;border:2px solid #fff;
}
.card.face-down>*{display:none}
.card.selected{
  outline:3px solid #ffeb3b;
  box-shadow:0 0 0 2px #0004,0 8px 18px #0006;
}
.rankTop,.rankBottom{
  position:absolute;left:7px;
  font-weight:900;font-size:var(--rank-size);line-height:1;
  color:#111;
  text-shadow:0 1px 0 #fff, 0 0 1px #fff;
  letter-spacing:.02em;
  pointer-events:none;
}
.rankTop{top:6px}
.rankBottom{right:7px;left:auto;bottom:6px;transform:rotate(180deg)}
.centerSuit{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:var(--suit-size);line-height:1;pointer-events:none;
  font-weight:900;
}
.centerSuit.redSuit{
  color:#e22323;
  text-shadow:
    -1.6px -1.6px 0 #7a0000,
     1.6px -1.6px 0 #7a0000,
    -1.6px  1.6px 0 #7a0000,
     1.6px  1.6px 0 #7a0000,
     0 0 1px #fff;
}
.centerSuit.blackSuit{
  color:#111;
  text-shadow:
    -1.4px -1.4px 0 #666,
     1.4px -1.4px 0 #666,
    -1.4px  1.4px 0 #666,
     1.4px  1.4px 0 #666,
     0 0 1px #fff;
}
body.easyMode .rankTop,
body.easyMode .rankBottom{
  color:#000;
  text-shadow:
    -1px -1px 0 #fff,
     1px -1px 0 #fff,
    -1px  1px 0 #fff,
     1px  1px 0 #fff;
}
body.easyMode .centerSuit.redSuit{
  color:#ff1f1f;
  text-shadow:
    -2.2px -2.2px 0 #6f0000,
     2.2px -2.2px 0 #6f0000,
    -2.2px  2.2px 0 #6f0000,
     2.2px  2.2px 0 #6f0000,
     0 0 1px #fff;
}
body.easyMode .centerSuit.blackSuit{
  color:#000;
  text-shadow:
    -2px -2px 0 #7d7d7d,
     2px -2px 0 #7d7d7d,
    -2px  2px 0 #7d7d7d,
     2px  2px 0 #7d7d7d,
     0 0 1px #fff;
}
.drag-ghost{
  position:fixed;z-index:9999;pointer-events:none;
  filter:drop-shadow(0 10px 10px #0006)
}
.drag-ghost .card{position:absolute;left:0}
#message{
  min-height:24px;width:min(100%,760px);margin:7px auto 0;
  text-align:center;font-size:.9rem;font-weight:800;color:#efffe9
}
#win-overlay{
  display:none;position:fixed;inset:0;background:#000b;
  z-index:20000;align-items:center;justify-content:center;padding:20px
}
.win-modal{
  color:#222;background:#fff;padding:26px;border-radius:18px;text-align:center;
  max-width:360px;width:100%;box-shadow:0 16px 50px #0008
}
.win-modal h2{color:#2e7d32;margin:0 0 8px}
.win-modal p{margin:0 0 17px}
@media(max-width:560px){
  .controls{width:100%}
}
@media(max-width:390px){
  :root{--card-w:12.2vw;--gap:2px}
  body.easyMode{--card-w:13vw}
  .btn{padding:7px 10px;font-size:.82rem}
  h1{font-size:1rem}
  .helperText{font-size:.82rem}
}
</style>
</head>
<body>
<header>
  <h1>♠ SALP SOLITAIRE</h1>
  <div class="controls">
    <button class="btn" id="viewBtn">見やすいモード OFF</button>
    <button class="btn" id="undoBtn">↶ 戻す</button>
    <button class="btn" id="newBtn">新しいゲーム</button>
  </div>
</header>

<div class="helperText">見やすいモードでは、数字を大きく黒で表示し、マークを中央に大きく表示します。</div>

<div id="board">
  <div class="top-region">
    <div class="group">
      <div id="stock" class="slot hint" data-zone="stock"></div>
      <div id="waste" class="slot" data-zone="waste"></div>
    </div>
    <div class="group">
      <div class="slot foundation hint" data-zone="foundation" data-index="0"></div>
      <div class="slot foundation hint" data-zone="foundation" data-index="1"></div>
      <div class="slot foundation hint" data-zone="foundation" data-index="2"></div>
      <div class="slot foundation hint" data-zone="foundation" data-index="3"></div>
    </div>
  </div>

  <div class="tableau-region">
    <div class="tableau-column" data-zone="tableau" data-index="0"></div>
    <div class="tableau-column" data-zone="tableau" data-index="1"></div>
    <div class="tableau-column" data-zone="tableau" data-index="2"></div>
    <div class="tableau-column" data-zone="tableau" data-index="3"></div>
    <div class="tableau-column" data-zone="tableau" data-index="4"></div>
    <div class="tableau-column" data-zone="tableau" data-index="5"></div>
    <div class="tableau-column" data-zone="tableau" data-index="6"></div>
  </div>
</div>

<div id="message"></div>

<div id="win-overlay">
  <div class="win-modal">
    <h2>🎉 CLEAR! 🎉</h2>
    <p>おめでとうございます！</p>
    <button class="btn" id="restartBtn">もう一度遊ぶ</button>
  </div>
</div>

<script>
(() => {
  const SUITS=['♠','♥','♦','♣'];
  const RED=new Set(['♥','♦']);
  const board=document.getElementById('board');
  const msg=document.getElementById('message');
  const viewBtn=document.getElementById('viewBtn');
  const VIEW_KEY='salpSolitaireEasyMode';

  let stock=[],waste=[],foundations=[[],[],[],[]],tableau=[[],[],[],[],[],[],[]];
  let selected=null;
  let history=[];
  let lastTap={id:null,time:0};
  let pointerDown=null;
  let drag=null;

  const rankText=r=>({1:'A',11:'J',12:'Q',13:'K'}[r]||String(r));
  const colorOf=s=>RED.has(s)?'red':'black';

  function snapshot(){
    return JSON.stringify({stock,waste,foundations,tableau});
  }
  function restore(s){
    const x=JSON.parse(s);
    stock=x.stock; waste=x.waste; foundations=x.foundations; tableau=x.tableau;
    selected=null; render();
  }
  function remember(){
    history.push(snapshot());
    if(history.length>100) history.shift();
  }
  function undo(){
    if(!history.length){flash('これ以上戻せません');return}
    restore(history.pop());
    flash('1手戻しました');
  }
  function flash(text){
    msg.textContent=text;
    clearTimeout(flash.t);
    flash.t=setTimeout(()=>{if(msg.textContent===text)msg.textContent=''},1400);
  }

  function applyViewMode(on){
    document.body.classList.toggle('easyMode', on);
    viewBtn.classList.toggle('active', on);
    viewBtn.textContent='見やすいモード ' + (on ? 'ON' : 'OFF');
    localStorage.setItem(VIEW_KEY, on ? 'on' : 'off');
    render();
  }

  function init(){
    stock=[];waste=[];foundations=[[],[],[],[]];tableau=[[],[],[],[],[],[],[]];
    selected=null;history=[];lastTap={id:null,time:0};
    document.getElementById('win-overlay').style.display='none';

    const deck=[];
    let id=0;
    for(const suit of SUITS){
      for(let rank=1;rank<=13;rank++){
        deck.push({id:'c'+(id++),suit,rank,color:colorOf(suit),faceUp:false});
      }
    }
    for(let i=deck.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [deck[i],deck[j]]=[deck[j],deck[i]];
    }
    for(let col=0;col<7;col++){
      for(let n=0;n<=col;n++){
        const c=deck.pop();
        c.faceUp=(n===col);
        tableau[col].push(c);
      }
    }
    stock=deck;
    render();
  }

  function cardHTML(card){
    const div=document.createElement('div');
    div.className='card '+card.color+(card.faceUp?'':' face-down');
    div.dataset.cardId=card.id;
    if(card.faceUp){
      const r=rankText(card.rank);
      const suitClass=card.color==='red' ? 'redSuit' : 'blackSuit';
      div.innerHTML=
        '<div class="rankTop">'+r+'</div>'+
        '<div class="centerSuit '+suitClass+'">'+card.suit+'</div>'+
        '<div class="rankBottom">'+r+'</div>';
    }
    return div;
  }

  function selectedIncludes(loc){
    if(!selected)return false;
    if(selected.source!==loc.source)return false;
    if(loc.source==='tableau') return selected.col===loc.col && loc.index>=selected.index;
    return selected.col===loc.col && selected.index===loc.index;
  }

  function render(){
    const stockEl=document.getElementById('stock');
    stockEl.innerHTML='';
    if(stock.length){
      const c=cardHTML({...stock[stock.length-1],faceUp:false});
      stockEl.appendChild(c);
    }

    const wasteEl=document.getElementById('waste');
    wasteEl.innerHTML='';
    if(waste.length){
      const c=cardHTML(waste[waste.length-1]);
      const loc={source:'waste',col:null,index:waste.length-1};
      if(selectedIncludes(loc))c.classList.add('selected');
      wasteEl.appendChild(c);
    }

    document.querySelectorAll('.foundation').forEach((el,i)=>{
      el.innerHTML='';
      const f=foundations[i];
      if(f.length){
        const c=cardHTML(f[f.length-1]);
        const loc={source:'foundation',col:i,index:f.length-1};
        if(selectedIncludes(loc))c.classList.add('selected');
        el.appendChild(c);
      }
    });

    document.querySelectorAll('.tableau-column').forEach((el,col)=>{
      el.innerHTML='';
      let y=0;
      tableau[col].forEach((card,index)=>{
        const c=cardHTML(card);
        c.style.top=y+'px';
        c.style.zIndex=String(index+1);
        const loc={source:'tableau',col,index};
        if(selectedIncludes(loc))c.classList.add('selected');
        el.appendChild(c);
        y += card.faceUp ? faceOffset() : downOffset();
      });
      el.style.minHeight=Math.max(cardHeight(), y+80)+'px';
    });
  }

  function cardWidth(){
    return document.querySelector('.slot').getBoundingClientRect().width || 60;
  }
  function cardHeight(){
    return cardWidth() * 1.4;
  }
  function faceOffset(){
    return document.body.classList.contains('easyMode')
      ? (innerWidth<500?31:38)
      : (innerWidth<500?27:34);
  }
  function downOffset(){ return innerWidth<500?14:18 }

  function locate(id){
    if(waste.length && waste[waste.length-1].id===id)
      return {source:'waste',col:null,index:waste.length-1,card:waste[waste.length-1]};
    for(let f=0;f<4;f++){
      const i=foundations[f].findIndex(c=>c.id===id);
      if(i>=0)return {source:'foundation',col:f,index:i,card:foundations[f][i]};
    }
    for(let t=0;t<7;t++){
      const i=tableau[t].findIndex(c=>c.id===id);
      if(i>=0)return {source:'tableau',col:t,index:i,card:tableau[t][i]};
    }
    return null;
  }

  function movable(loc){
    if(!loc||!loc.card.faceUp)return false;
    if(loc.source==='waste') return loc.index===waste.length-1;
    if(loc.source==='foundation') return loc.index===foundations[loc.col].length-1;
    if(loc.source==='tableau'){
      const seq=tableau[loc.col].slice(loc.index);
      for(let i=0;i<seq.length;i++){
        if(!seq[i].faceUp)return false;
        if(i>0){
          const a=seq[i-1],b=seq[i];
          if(a.color===b.color || b.rank!==a.rank-1)return false;
        }
      }
      return true;
    }
    return false;
  }

  function movingCards(loc){
    if(loc.source==='waste')return [waste[waste.length-1]];
    if(loc.source==='foundation')return [foundations[loc.col][foundations[loc.col].length-1]];
    return tableau[loc.col].slice(loc.index);
  }

  function canFoundation(card,f){
    if(!card)return false;
    if(!f.length)return card.rank===1;
    const top=f[f.length-1];
    return top.suit===card.suit && card.rank===top.rank+1;
  }

  function canTableau(card,t){
    if(!card)return false;
    if(!t.length)return card.rank===13;
    const top=t[t.length-1];
    return top.faceUp && top.color!==card.color && card.rank===top.rank-1;
  }

  function removeSource(loc,count){
    if(loc.source==='waste')waste.pop();
    else if(loc.source==='foundation')foundations[loc.col].pop();
    else tableau[loc.col].splice(loc.index,count);
  }

  function flipExposed(col){
    if(col==null)return;
    const t=tableau[col];
    if(t.length && !t[t.length-1].faceUp)t[t.length-1].faceUp=true;
  }

  function move(loc,targetType,targetCol){
    if(!movable(loc))return false;
    const cards=movingCards(loc);
    if(!cards.length)return false;

    if(targetType==='foundation'){
      if(cards.length!==1 || !canFoundation(cards[0],foundations[targetCol]))return false;
    }else if(targetType==='tableau'){
      if(loc.source==='tableau' && loc.col===targetCol)return false;
      if(!canTableau(cards[0],tableau[targetCol]))return false;
    }else return false;

    remember();
    removeSource(loc,cards.length);
    if(targetType==='foundation')foundations[targetCol].push(cards[0]);
    else tableau[targetCol].push(...cards);
    if(loc.source==='tableau')flipExposed(loc.col);

    selected=null;
    render();
    checkWin();
    return true;
  }

  function autoMove(loc){
    if(!movable(loc))return false;
    const cards=movingCards(loc);
    if(cards.length===1){
      for(let f=0;f<4;f++){
        if(canFoundation(cards[0],foundations[f]) && move(loc,'foundation',f))return true;
      }
    }
    for(let t=0;t<7;t++){
      if(loc.source==='tableau'&&loc.col===t)continue;
      if(canTableau(cards[0],tableau[t]) && move(loc,'tableau',t))return true;
    }
    return false;
  }

  function drawStock(){
    selected=null;
    remember();
    if(stock.length){
      const c=stock.pop(); c.faceUp=true; waste.push(c);
    }else if(waste.length){
      stock=waste.reverse().map(c=>({...c,faceUp:false}));
      waste=[];
    }else{
      history.pop();
      flash('山札は空です');
      return;
    }
    render();
  }

  function checkWin(){
    if(foundations.reduce((n,f)=>n+f.length,0)===52){
      setTimeout(()=>document.getElementById('win-overlay').style.display='flex',250);
    }
  }

  function targetFromPoint(x,y){
    const el=document.elementFromPoint(x,y);
    if(!el)return null;
    const zone=el.closest('[data-zone]');
    if(!zone)return null;
    const type=zone.dataset.zone;
    if(type==='foundation'||type==='tableau'){
      return {type,col:Number(zone.dataset.index)};
    }
    return null;
  }

  function handleTap(id){
    const now=Date.now();
    const loc=locate(id);
    if(!loc)return;

    if(!loc.card.faceUp){
      if(loc.source==='tableau' && loc.index===tableau[loc.col].length-1){
        remember();
        loc.card.faceUp=true;
        selected=null;
        render();
      }
      return;
    }

    const doubleTap=(lastTap.id===id && now-lastTap.time<360);
    lastTap={id,time:now};

    if(doubleTap){
      selected=null;
      if(!autoMove(loc)){render();flash('自動移動できません')}
      return;
    }

    if(selected){
      const same=selected.source===loc.source && selected.col===loc.col && selected.index===loc.index;
      if(same){
        selected=null;render();return;
      }
      if(loc.source==='tableau' && move(selected,'tableau',loc.col))return;
      if(loc.source==='foundation' && move(selected,'foundation',loc.col))return;
    }

    if(movable(loc)){
      selected={source:loc.source,col:loc.col,index:loc.index,card:loc.card};
      render();
    }
  }

  board.addEventListener('click',e=>{
    if(drag?.didDrag)return;
    const zone=e.target.closest('[data-zone]');
    const card=e.target.closest('.card');

    if(zone?.dataset.zone==='stock'){drawStock();return}

    if(card){handleTap(card.dataset.cardId);return}

    if(selected && zone){
      const type=zone.dataset.zone;
      if(type==='foundation'||type==='tableau'){
        if(move(selected,type,Number(zone.dataset.index)))return;
      }
      selected=null;render();
    }
  });

  board.addEventListener('pointerdown',e=>{
    const card=e.target.closest('.card');
    if(!card)return;
    const loc=locate(card.dataset.cardId);
    if(!movable(loc))return;
    pointerDown={id:e.pointerId,x:e.clientX,y:e.clientY,loc};
  });

  window.addEventListener('pointermove',e=>{
    if(!pointerDown || pointerDown.id!==e.pointerId)return;
    const dx=e.clientX-pointerDown.x,dy=e.clientY-pointerDown.y;
    if(!drag && Math.hypot(dx,dy)>8){
      const cards=movingCards(pointerDown.loc);
      const ghost=document.createElement('div');
      ghost.className='drag-ghost';
      ghost.style.width=cardWidth()+'px';
      cards.forEach((c,i)=>{
        const el=cardHTML(c);
        el.style.top=(i*faceOffset())+'px';
        ghost.appendChild(el);
      });
      document.body.appendChild(ghost);
      drag={ghost,loc:pointerDown.loc,didDrag:true};
      selected=null;render();
    }
    if(drag){
      drag.ghost.style.left=(e.clientX-20)+'px';
      drag.ghost.style.top=(e.clientY-20)+'px';
    }
  },{passive:true});

  window.addEventListener('pointerup',e=>{
    if(!pointerDown || pointerDown.id!==e.pointerId)return;
    if(drag){
      const t=targetFromPoint(e.clientX,e.clientY);
      drag.ghost.remove();
      if(t && move(drag.loc,t.type,t.col)){
        flash('移動しました');
      }else{
        render();
      }
      setTimeout(()=>{drag=null},0);
    }
    pointerDown=null;
  });

  viewBtn.onclick=()=>applyViewMode(!document.body.classList.contains('easyMode'));
  document.getElementById('newBtn').onclick=init;
  document.getElementById('restartBtn').onclick=init;
  document.getElementById('undoBtn').onclick=undo;
  window.addEventListener('resize',render);

  applyViewMode(localStorage.getItem(VIEW_KEY)==='on');
  init();
})();
</script>
</body>
</html>
