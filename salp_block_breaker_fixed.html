<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SALP BLOCK BREAKER</title>
<style>
  :root{
    --bg:#111526;
    --panel:rgba(7,10,22,.88);
    --text:#fff;
    --muted:#b8bfd7;
    --accent:#e65369;
    --purple:#985dc1;
    --green:#62d58a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  body{position:fixed;inset:0}
  #gameContainer{
    position:relative;width:100vw;height:100dvh;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  #gameCanvas{
    display:block;
    background:#11182d;
    border-radius:10px;
    box-shadow:0 0 30px rgba(0,0,0,.55);
  }

  .hud{
    position:absolute;
    left:50%;top:max(6px,env(safe-area-inset-top));
    transform:translateX(-50%);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    width:min(96vw,580px);
    z-index:20;
    pointer-events:none;
  }
  .hud-item{
    min-width:0;
    padding:5px 4px;
    text-align:center;
    color:white;
    text-shadow:0 2px 4px rgba(0,0,0,.65);
  }
  .hud-label{font-size:10px;letter-spacing:1px;color:#bfc4d8;font-weight:800}
  .hud-value{font-size:17px;color:var(--accent);font-weight:900}

  #gameToolbar{
    position:absolute;
    top:54px;left:50%;
    transform:translateX(-50%);
    z-index:30;
    width:min(96vw,580px);
    display:none;
    justify-content:center;
    gap:6px;
    pointer-events:auto;
  }
  #gameToolbar.show{display:flex}
  .mini-btn{
    border:1px solid rgba(255,255,255,.3);
    background:rgba(5,8,18,.82);
    color:#fff;
    border-radius:18px;
    min-height:36px;
    padding:6px 11px;
    font-size:12px;
    font-weight:800;
    white-space:nowrap;
    touch-action:manipulation;
  }
  .mini-btn:active{transform:scale(.96)}
  .mini-btn.easy-on{background:#277a48;border-color:#8bffb2}
  .mini-btn.sound-off{background:#5a3343}

  .overlay{
    position:absolute;inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.78);
    padding:24px;
    pointer-events:auto;
  }
  .overlay.hidden{display:none}
  .panel{
    width:min(94vw,620px);
    background:rgba(5,8,19,.78);
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:26px 18px;
    text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.35);
  }
  .title-text{
    font-size:clamp(34px,8vw,62px);
    line-height:1.05;
    font-weight:950;
    letter-spacing:4px;
    color:var(--accent);
    text-shadow:0 0 20px rgba(230,83,105,.45);
    margin-bottom:24px;
  }
  .subtitle-text{
    color:#c3c7d8;
    font-size:clamp(14px,3.2vw,20px);
    line-height:1.7;
    margin-bottom:20px;
  }
  .btn-group{
    display:flex;flex-wrap:wrap;justify-content:center;gap:10px;
  }
  .btn{
    border:0;border-radius:999px;
    min-width:170px;min-height:58px;
    padding:12px 24px;
    color:#fff;font-weight:900;
    letter-spacing:2px;
    font-size:17px;
    touch-action:manipulation;
  }
  .btn:active{transform:scale(.97)}
  .btn-start{background:var(--accent)}
  .btn-sound{background:var(--purple)}
  .btn-easy{background:var(--green);color:#102719}
  .btn-restart{background:#3587c9}

  .stage-msg{
    position:absolute;z-index:60;
    left:50%;top:50%;transform:translate(-50%,-50%);
    font-weight:950;font-size:clamp(30px,7vw,56px);
    color:#fff;
    text-shadow:0 0 24px rgba(230,83,105,.9),0 3px 8px #000;
    opacity:0;pointer-events:none;transition:opacity .2s;
    text-align:center;
  }
  .stage-msg.show{opacity:1}

  #touchArea{
    position:absolute;
    left:0;right:0;bottom:0;
    height:34%;
    z-index:15;
    touch-action:none;
  }

  body.easy-mode .hud{
    background:rgba(0,0,0,.72);
    border:2px solid #fff;
    border-radius:12px;
    padding:4px;
  }
  body.easy-mode .hud-label{font-size:13px;color:#fff}
  body.easy-mode .hud-value{font-size:23px;color:#7fff9f}
  body.easy-mode #gameToolbar{top:72px}
  body.easy-mode .mini-btn{
    min-height:44px;
    font-size:14px;
    border-width:2px;
  }

  @media (max-height:650px){
    #gameToolbar{top:45px}
    .mini-btn{min-height:32px;padding:4px 8px;font-size:11px}
    .hud-value{font-size:15px}
  }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>

  <div class="hud" id="hud">
    <div class="hud-item"><div class="hud-label">SCORE</div><div class="hud-value" id="scoreVal">0</div></div>
    <div class="hud-item"><div class="hud-label">HIGH</div><div class="hud-value" id="highVal">0</div></div>
    <div class="hud-item"><div class="hud-label">STAGE</div><div class="hud-value" id="stageVal">1</div></div>
    <div class="hud-item"><div class="hud-label">LIFE</div><div class="hud-value" id="lifeVal">3</div></div>
  </div>

  <div id="gameToolbar">
    <button class="mini-btn" id="btnPause">⏸ PAUSE</button>
    <button class="mini-btn" id="btnSoundGame">🔊 SOUND</button>
    <button class="mini-btn" id="btnEasyGame">👁 見やすい</button>
  </div>

  <div class="stage-msg" id="stageMsg"></div>
  <div id="touchArea"></div>

  <div class="overlay" id="titleScreen">
    <div class="panel">
      <div class="title-text">SALP BLOCK<br>BREAKER</div>
      <div class="subtitle-text">スマホは画面下部を左右にスライド<br>PCはマウス移動・← →キー</div>
      <div class="btn-group">
        <button class="btn btn-start" id="btnStart">START</button>
        <button class="btn btn-sound" id="btnSound">SOUND: ON</button>
        <button class="btn btn-easy" id="btnEasy">見やすいモード: OFF</button>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="pauseScreen">
    <div class="panel">
      <div class="title-text">PAUSED</div>
      <div class="btn-group">
        <button class="btn btn-start" id="btnResume">RESUME</button>
        <button class="btn btn-restart" id="btnRestartP">RESTART</button>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="gameOverScreen">
    <div class="panel">
      <div class="title-text">GAME OVER</div>
      <div class="subtitle-text" id="goScore">SCORE: 0</div>
      <div class="btn-group"><button class="btn btn-start" id="btnRestartGO">RESTART</button></div>
    </div>
  </div>

  <div class="overlay hidden" id="clearScreen">
    <div class="panel">
      <div class="title-text" style="color:#65e590">ALL CLEAR!</div>
      <div class="subtitle-text" id="clearScore">SCORE: 0</div>
      <div class="btn-group"><button class="btn btn-start" id="btnRestartC">RESTART</button></div>
    </div>
  </div>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

function roundRect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

class SoundManager{
  constructor(){this.ctx=null;this.enabled=true}
  ensure(){
    if(!this.enabled)return;
    try{
      if(!this.ctx){
        const AC=window.AudioContext||window.webkitAudioContext;
        if(AC)this.ctx=new AC();
      }
      if(this.ctx?.state==="suspended") this.ctx.resume().catch(()=>{});
    }catch(_){}
  }
  toggle(){
    this.enabled=!this.enabled;
    if(this.enabled)this.ensure();
    return this.enabled;
  }
  tone(freq,dur=.08,type="sine",vol=.08,delay=0){
    if(!this.enabled)return;
    this.ensure();
    if(!this.ctx)return;
    try{
      const t=this.ctx.currentTime+delay;
      const o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.connect(g);g.connect(this.ctx.destination);
      o.type=type;o.frequency.setValueAtTime(freq,t);
      g.gain.setValueAtTime(vol,t);
      g.gain.exponentialRampToValueAtTime(.001,t+dur);
      o.start(t);o.stop(t+dur);
    }catch(_){}
  }
  play(type){
    if(!this.enabled)return;
    const map={
      paddle:[480,.07,"sine"],
      block:[900,.08,"square"],
      hard:[170,.12,"sawtooth"],
      item:[720,.12,"sine"],
      miss:[180,.3,"sawtooth"]
    };
    if(map[type]){this.tone(...map[type]);return}
    if(type==="clear"){
      [523,659,784,1047].forEach((f,i)=>this.tone(f,.18,"sine",.08,i*.1));
    }else if(type==="gameover"){
      [380,320,260,180].forEach((f,i)=>this.tone(f,.2,"sawtooth",.07,i*.13));
    }
  }
}

class Particle{
  constructor(x,y,color){
    this.x=x;this.y=y;this.color=color;
    this.vx=(Math.random()-.5)*6;this.vy=(Math.random()-.5)*6;
    this.life=1;this.size=2+Math.random()*3;
  }
  update(dt){this.x+=this.vx*dt*60;this.y+=this.vy*dt*60;this.vy+=.06*dt*60;this.life-=1.8*dt}
  draw(ctx){ctx.globalAlpha=Math.max(0,this.life);ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
}

const BLOCK_TYPES={
  NORMAL:{hp:1,score:10,color:"#3498db",mark:"1"},
  DOUBLE:{hp:2,score:30,color:"#f39c12",mark:"2"},
  TRIPLE:{hp:3,score:60,color:"#e74c3c",mark:"3"},
  SOLID:{hp:-1,score:0,color:"#7f8c8d",mark:"X"},
  SPECIAL:{hp:1,score:50,color:"#9b59b6",mark:"★"}
};

class Block{
  constructor(x,y,w,h,type){
    Object.assign(this,{x,y,w,h,type});
    const d=BLOCK_TYPES[type];
    this.hp=d.hp;this.maxHp=d.hp;this.score=d.score;this.color=d.color;this.hitFlash=0;
  }
  hit(){this.hitFlash=.2;if(this.hp<0)return false;this.hp--;return this.hp<=0}
  update(dt){this.hitFlash=Math.max(0,this.hitFlash-dt)}
  draw(ctx,easy){
    const border=easy?4:1.5;
    ctx.fillStyle=this.color;
    roundRect(ctx,this.x,this.y,this.w,this.h,easy?5:3);ctx.fill();

    const gr=ctx.createLinearGradient(this.x,this.y,this.x,this.y+this.h);
    gr.addColorStop(0,"rgba(255,255,255,.35)");
    gr.addColorStop(1,"rgba(0,0,0,.25)");
    ctx.fillStyle=gr;roundRect(ctx,this.x,this.y,this.w,this.h,easy?5:3);ctx.fill();

    ctx.strokeStyle=easy?"#fff":"rgba(255,255,255,.4)";
    ctx.lineWidth=border;
    roundRect(ctx,this.x+border/2,this.y+border/2,this.w-border,this.h-border,easy?5:3);ctx.stroke();

    const cx=this.x+this.w/2,cy=this.y+this.h/2;
    const mark=this.hp>1?String(this.hp):BLOCK_TYPES[this.type].mark;
    if(easy || this.type!=="NORMAL"){
      ctx.fillStyle=easy?"#000":"rgba(0,0,0,.6)";
      ctx.font=`900 ${Math.max(11,this.h*(easy?.58:.48))}px sans-serif`;
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(mark,cx,cy);
    }
    if(this.hitFlash>0){
      ctx.fillStyle=`rgba(255,255,255,${Math.min(.65,this.hitFlash*3)})`;
      roundRect(ctx,this.x,this.y,this.w,this.h,4);ctx.fill();
    }
  }
}

const ITEM_TYPES=[
  {icon:"W",easy:"大",color:"#2ecc71",effect:"wide"},
  {icon:"N",easy:"小",color:"#e74c3c",effect:"narrow"},
  {icon:"M",easy:"分",color:"#f39c12",effect:"multi"},
  {icon:"S",easy:"遅",color:"#3498db",effect:"slow"},
  {icon:"F",easy:"速",color:"#e67e22",effect:"fast"},
  {icon:"1UP",easy:"1UP",color:"#e94560",effect:"1up"},
  {icon:"T",easy:"貫",color:"#ff00ff",effect:"through"},
  {icon:"K",easy:"吸",color:"#00cfd8",effect:"sticky"}
];

class Item{
  constructor(x,y,typeIndex){
    this.x=x;this.y=y;this.type=ITEM_TYPES[typeIndex];this.vy=1.55;
  }
  update(dt){this.y+=this.vy*dt*60}
  draw(ctx,easy){
    const r=easy?19:13;
    ctx.shadowBlur=easy?14:7;ctx.shadowColor=this.type.color;
    ctx.fillStyle=this.type.color;ctx.beginPath();ctx.arc(this.x,this.y,r,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle="#fff";ctx.lineWidth=easy?3:1.5;ctx.stroke();
    ctx.fillStyle="#fff";ctx.font=`900 ${easy?15:11}px sans-serif`;
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(easy?this.type.easy:this.type.icon,this.x,this.y);
  }
}

class Paddle{
  constructor(game){
    this.game=game;this.x=game.width/2;this.targetX=this.x;this.y=game.height-42;
    this.baseWidth=game.easyMode?140:94;this.width=this.baseWidth;
  }
  update(dt){
    this.width=this.baseWidth*(this.game.easyMode?1.08:1);
    this.height=this.game.easyMode?22:13;
    this.x+=(this.targetX-this.x)*Math.min(1,dt*18);
    this.x=Math.max(this.width/2,Math.min(this.game.width-this.width/2,this.x));
    this.y=this.game.height-42;
  }
  draw(ctx){
    const x=this.x-this.width/2,y=this.y-this.height/2;
    const gr=ctx.createLinearGradient(x,y,x,y+this.height);
    gr.addColorStop(0,"#ff7182");gr.addColorStop(1,"#c83c51");
    ctx.fillStyle=gr;roundRect(ctx,x,y,this.width,this.height,this.height/2);ctx.fill();
    if(this.game.easyMode){
      ctx.strokeStyle="#fff";ctx.lineWidth=3;
      roundRect(ctx,x,y,this.width,this.height,this.height/2);ctx.stroke();
    }
  }
}

class Ball{
  constructor(x,y,radius,speed,game){
    this.x=x;this.y=y;this.radius=radius;this.speed=speed;this.game=game;
    const a=-Math.PI/2+(Math.random()-.5)*.7;
    this.vx=Math.cos(a)*speed;this.vy=Math.sin(a)*speed;
    this.through=false;this.throughTimer=0;this.sticky=false;this.stickyTimer=0;this.stuck=false;
    this.trail=[];
  }
  normalize(){
    let s=Math.hypot(this.vx,this.vy);
    if(s<.001){this.vx=this.speed*.4;this.vy=-this.speed*.92;s=Math.hypot(this.vx,this.vy)}
    this.vx=this.vx/s*this.speed;this.vy=this.vy/s*this.speed;

    const ax=Math.abs(this.vx/this.speed), ay=Math.abs(this.vy/this.speed);
    if(ax<.22){
      const sx=this.vx>=0?1:-1,sy=this.vy>=0?1:-1;
      this.vx=sx*this.speed*.28;this.vy=sy*this.speed*Math.sqrt(1-.28*.28);
    }
    if(ay<.22){
      const sx=this.vx>=0?1:-1,sy=this.vy>=0?1:-1;
      this.vy=sy*this.speed*.28;this.vx=sx*this.speed*Math.sqrt(1-.28*.28);
    }
  }
  update(dt){
    if(this.stuck)return true;
    if(this.throughTimer>0){this.throughTimer-=dt;if(this.throughTimer<=0)this.through=false}
    if(this.stickyTimer>0){this.stickyTimer-=dt;if(this.stickyTimer<=0)this.sticky=false}
    this.x+=this.vx*dt*60;this.y+=this.vy*dt*60;

    this.trail.push({x:this.x,y:this.y,a:1});
    if(this.trail.length>8)this.trail.shift();
    this.trail.forEach(t=>t.a-=.13);

    if(this.x-this.radius<0){this.x=this.radius;this.vx=Math.abs(this.vx)}
    if(this.x+this.radius>this.game.width){this.x=this.game.width-this.radius;this.vx=-Math.abs(this.vx)}
    if(this.y-this.radius<0){this.y=this.radius;this.vy=Math.abs(this.vy)}
    return this.y-this.radius<=this.game.height+40;
  }
  draw(ctx,easy){
    for(const t of this.trail){
      if(t.a<=0)continue;
      ctx.globalAlpha=t.a*.28;ctx.fillStyle=this.through?"#ff4cff":this.sticky?"#50ffff":"#fff";
      ctx.beginPath();ctx.arc(t.x,t.y,this.radius*t.a*.7,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.shadowBlur=easy?22:12;
    ctx.shadowColor=this.through?"#ff00ff":this.sticky?"#00ffff":"#ff526b";
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    if(easy){
      ctx.strokeStyle="#000";ctx.lineWidth=3;ctx.stroke();
      ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.beginPath();ctx.arc(this.x,this.y,this.radius+3,0,Math.PI*2);ctx.stroke();
    }
  }
}

function buildStage(n,w,h,easy){
  const cols=10, marginX=easy?13:10, gap=easy?4:2;
  const top=easy?125:95;
  const rows=10;
  const bw=(w-marginX*2)/cols;
  const bh=Math.max(16,Math.min(easy?27:24,(h*.34)/rows));
  const blocks=[];
  const add=(r,c,type)=>{
    if(r<0||c<0||c>=cols)return;
    blocks.push(new Block(marginX+c*bw,top+r*bh,bw-gap,bh-gap,type));
  };
  const s=((n-1)%10)+1;
  switch(s){
    case 1:
      for(let r=0;r<5;r++)for(let c=0;c<cols;c++)add(r,c,Math.random()<.1?"SPECIAL":"NORMAL");
      break;
    case 2:
      for(let r=0;r<5;r++)for(let c=r;c<cols-r;c++)add(r,c,Math.random()<.16?"DOUBLE":"NORMAL");
      break;
    case 3:{
      const p=["01100110","11111111","11111111","01111110","00111100","00011000"];
      p.forEach((row,r)=>[...row].forEach((v,c)=>v==="1"&&add(r,c+1,Math.random()<.15?"SPECIAL":"NORMAL")));
      break;
    }
    case 4:
      for(let r=0;r<8;r++)for(let c=0;c<cols;c++){
        const dx=c-4.5,dy=r-3.5,d=Math.hypot(dx,dy);
        if(d>2&&d<4.7)add(r,c,Math.random()<.2?"DOUBLE":"NORMAL");
      }
      break;
    case 5:
      for(let r=0;r<8;r++)for(let c=0;c<cols;c++)if((r+c)%3===0)add(r,c,Math.random()<.2?"DOUBLE":"NORMAL");
      break;
    case 6:
      for(let r=0;r<5;r++)for(let c=0;c<cols;c++)add(r,c,"NORMAL");
      [[2,2],[2,7],[4,4],[4,5]].forEach(([r,c])=>add(r,c,"SOLID"));
      break;
    case 7:
      for(let r=0;r<6;r++)for(let c=0;c<cols;c++){
        const d=Math.abs(c-4.5)+Math.abs(r-2);
        add(r,c,d<2.5?"TRIPLE":d<4.5?"DOUBLE":"NORMAL");
      }
      break;
    case 8:
      for(let r=0;r<5;r++)for(let c=0;c<cols;c++)add(r,c,Math.random()<.32?"SPECIAL":"NORMAL");
      break;
    case 9:
      for(let r=0;r<6;r++)for(let c=0;c<cols;c++){
        const x=Math.random();
        add(r,c,x<.12?"TRIPLE":x<.3?"DOUBLE":x<.38?"SOLID":"NORMAL");
      }
      break;
    default:
      for(let r=0;r<7;r++)for(let c=0;c<cols;c++){
        const x=Math.random();
        add(r,c,x<.18?"TRIPLE":x<.37?"DOUBLE":x<.46?"SOLID":x<.58?"SPECIAL":"NORMAL");
      }
  }
  return blocks;
}

class Game{
  constructor(){
    this.canvas=$("gameCanvas");this.ctx=this.canvas.getContext("2d");
    this.sound=new SoundManager();
    this.easyMode=false;this.state="title";
    this.score=0;this.stage=1;this.lives=3;
    this.highScore=parseInt(localStorage.getItem("salp_block_high")||"0",10);
    this.blocks=[];this.balls=[];this.items=[];this.particles=[];this.paddle=null;
    this.pointerX=null;this.keys={};this.lastTime=performance.now();
    this.setupUI();this.setupInput();this.resize();
    addEventListener("resize",()=>this.resize(),{passive:true});
    requestAnimationFrame(t=>this.loop(t));
  }

  resize(){
    const dpr=Math.min(2,window.devicePixelRatio||1);
    const availW=window.innerWidth-8;
    const availH=(window.visualViewport?.height||window.innerHeight)-8;
    let w=Math.min(availW,600),h=availH;
    if(w/h>.64)w=h*.64;else h=w/.64;
    w=Math.floor(w);h=Math.floor(h);
    this.canvas.style.width=w+"px";this.canvas.style.height=h+"px";
    this.canvas.width=Math.floor(w*dpr);this.canvas.height=Math.floor(h*dpr);
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.width=w;this.height=h;
    if(this.paddle){
      this.paddle.x=Math.min(this.width-this.paddle.width/2,Math.max(this.paddle.width/2,this.paddle.x));
      this.paddle.targetX=this.paddle.x;
    }
  }

  setupUI(){
    $("highVal").textContent=this.highScore;

    const startSafely=()=>{
      try{this.sound.ensure()}catch(_){}
      this.start();
    };
    $("btnStart").addEventListener("click",startSafely);
    $("btnResume").addEventListener("click",()=>this.resume());
    $("btnRestartP").addEventListener("click",()=>this.restart());
    $("btnRestartGO").addEventListener("click",()=>this.restart());
    $("btnRestartC").addEventListener("click",()=>this.restart());
    $("btnPause").addEventListener("click",e=>{e.stopPropagation();this.pause()});

    const soundToggle=e=>{
      e?.stopPropagation();
      const on=this.sound.toggle();
      $("btnSound").textContent="SOUND: "+(on?"ON":"OFF");
      $("btnSoundGame").textContent=on?"🔊 SOUND":"🔇 SOUND";
      $("btnSoundGame").classList.toggle("sound-off",!on);
    };
    $("btnSound").addEventListener("click",soundToggle);
    $("btnSoundGame").addEventListener("click",soundToggle);

    const easyToggle=e=>{
      e?.stopPropagation();
      this.setEasyMode(!this.easyMode);
    };
    $("btnEasy").addEventListener("click",easyToggle);
    $("btnEasyGame").addEventListener("click",easyToggle);
  }

  setEasyMode(on){
    this.easyMode=on;
    document.body.classList.toggle("easy-mode",on);
    $("btnEasy").textContent="見やすいモード: "+(on?"ON":"OFF");
    $("btnEasyGame").textContent=on?"👁 見やすい ON":"👁 見やすい";
    $("btnEasyGame").classList.toggle("easy-on",on);

    if(this.paddle){
      this.paddle.baseWidth=on?140:94;
      this.paddle.height=on?22:13;
    }
    this.balls.forEach(b=>b.radius=on?11:6);
    this.items.forEach(()=>{});
    // ブロック間隔・上位置まで確実に切り替えるため、プレイ前なら再生成。
    // プレイ中は進行を壊さないため現在のブロックを維持し、描画だけ即変更。
    this.updateHUD();
  }

  setupInput(){
    addEventListener("keydown",e=>{
      this.keys[e.key]=true;
      if(["ArrowLeft","ArrowRight"," ","Escape"].includes(e.key))e.preventDefault();
      if(e.key==="Escape"||e.key==="p"||e.key==="P"){
        if(this.state==="playing")this.pause();else if(this.state==="paused")this.resume();
      }
      if(e.key===" "&&this.state==="playing")this.releaseSticky();
    },{passive:false});
    addEventListener("keyup",e=>this.keys[e.key]=false);

    const posFromEvent=e=>{
      const rect=this.canvas.getBoundingClientRect();
      return Math.max(0,Math.min(this.width,e.clientX-rect.left));
    };
    this.canvas.addEventListener("pointermove",e=>{
      if(e.pointerType==="mouse")this.pointerX=posFromEvent(e);
    });

    const touch=$("touchArea");
    const handleDown=e=>{
      if(this.state!=="playing")return;
      e.preventDefault();
      touch.setPointerCapture?.(e.pointerId);
      this.pointerX=posFromEvent(e);
      this.releaseSticky();
    };
    const handleMove=e=>{
      if(this.state!=="playing")return;
      e.preventDefault();
      this.pointerX=posFromEvent(e);
    };
    touch.addEventListener("pointerdown",handleDown,{passive:false});
    touch.addEventListener("pointermove",handleMove,{passive:false});
    this.canvas.addEventListener("pointerdown",e=>{
      if(e.target!==this.canvas||this.state!=="playing")return;
      e.preventDefault();this.pointerX=posFromEvent(e);this.releaseSticky();
    },{passive:false});
    this.canvas.addEventListener("pointermove",e=>{
      if(e.pointerType!=="mouse"&&this.state==="playing"){e.preventDefault();this.pointerX=posFromEvent(e)}
    },{passive:false});

    document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
  }

  start(){
    this.score=0;this.stage=1;this.lives=3;
    $("titleScreen").classList.add("hidden");
    $("pauseScreen").classList.add("hidden");
    $("gameOverScreen").classList.add("hidden");
    $("clearScreen").classList.add("hidden");
    $("gameToolbar").classList.add("show");
    this.state="playing";
    this.loadStage();
    this.updateHUD();
    this.lastTime=performance.now();
  }
  restart(){this.start()}
  pause(){
    if(this.state!=="playing")return;
    this.state="paused";$("pauseScreen").classList.remove("hidden");
  }
  resume(){
    if(this.state!=="paused")return;
    $("pauseScreen").classList.add("hidden");
    this.state="playing";this.lastTime=performance.now();
  }
  releaseSticky(){
    for(const b of this.balls){
      if(b.stuck){
        b.stuck=false;b.vx=(Math.random()-.5)*b.speed*.7;b.vy=-Math.abs(b.speed);b.normalize();
      }
    }
  }

  loadStage(){
    this.blocks=buildStage(this.stage,this.width,this.height,this.easyMode);
    this.items=[];this.particles=[];
    this.paddle=new Paddle(this);
    const speed=Math.min(6.7,3.1+(this.stage-1)*.18);
    this.balls=[new Ball(this.width/2,this.height*.58,this.easyMode?11:6,speed,this)];
    this.showMessage("STAGE "+this.stage);
  }

  showMessage(text){
    const el=$("stageMsg");el.textContent=text;el.classList.add("show");
    clearTimeout(this.msgTimer);
    this.msgTimer=setTimeout(()=>el.classList.remove("show"),1000);
  }

  updateHUD(){
    $("scoreVal").textContent=this.score;
    $("highVal").textContent=this.highScore;
    $("stageVal").textContent=this.stage;
    $("lifeVal").textContent=this.lives;
  }

  spawnParticles(x,y,color,n=9){
    for(let i=0;i<n;i++)this.particles.push(new Particle(x,y,color));
  }

  applyItem(it){
    this.sound.play("item");
    const effect=it.type.effect;
    if(effect==="wide")this.paddle.baseWidth=Math.min(190,this.paddle.baseWidth+30);
    else if(effect==="narrow")this.paddle.baseWidth=Math.max(this.easyMode?95:55,this.paddle.baseWidth-22);
    else if(effect==="multi"){
      const add=[];
      for(const b of this.balls.slice(0,4)){
        [-.42,.42].forEach(d=>{
          const nb=new Ball(b.x,b.y,b.radius,b.speed,this),a=Math.atan2(b.vy,b.vx)+d;
          nb.vx=Math.cos(a)*b.speed;nb.vy=Math.sin(a)*b.speed;add.push(nb);
        });
      }
      this.balls.push(...add.slice(0,8));
    }else if(effect==="slow"){
      this.balls.forEach(b=>{b.speed=Math.max(2.3,b.speed*.78);b.normalize()});
    }else if(effect==="fast"){
      this.balls.forEach(b=>{b.speed=Math.min(7,b.speed*1.18);b.normalize()});
    }else if(effect==="1up"){this.lives++}
    else if(effect==="through"){this.balls.forEach(b=>{b.through=true;b.throughTimer=6})}
    else if(effect==="sticky"){this.balls.forEach(b=>{b.sticky=true;b.stickyTimer=7})}
  }

  update(dt){
    if(this.state!=="playing")return;

    let target=this.paddle.targetX;
    if(this.pointerX!==null)target=this.pointerX;
    if(this.keys.ArrowLeft)target-=520*dt;
    if(this.keys.ArrowRight)target+=520*dt;
    this.paddle.targetX=Math.max(this.paddle.width/2,Math.min(this.width-this.paddle.width/2,target));
    this.paddle.update(dt);

    for(let i=this.balls.length-1;i>=0;i--){
      const b=this.balls[i];
      if(b.stuck){
        b.x=this.paddle.x;b.y=this.paddle.y-this.paddle.height/2-b.radius-1;continue;
      }
      if(!b.update(dt)){this.balls.splice(i,1);continue}
      b.normalize();

      const pw=this.paddle.width,ph=this.paddle.height;
      const px=this.paddle.x-pw/2,py=this.paddle.y-ph/2;
      if(b.vy>0&&b.y+b.radius>=py&&b.y-b.radius<=py+ph&&b.x>=px-b.radius&&b.x<=px+pw+b.radius){
        if(b.sticky){
          b.stuck=true;b.vx=0;b.vy=0;
        }else{
          const rel=Math.max(-.95,Math.min(.95,(b.x-this.paddle.x)/(pw/2)));
          const ang=-Math.PI/2+rel*(Math.PI/3);
          b.vx=Math.cos(ang)*b.speed;b.vy=Math.sin(ang)*b.speed;
          b.y=py-b.radius-.2;this.sound.play("paddle");
        }
      }

      for(let j=this.blocks.length-1;j>=0;j--){
        const blk=this.blocks[j];
        if(b.x+b.radius<blk.x||b.x-b.radius>blk.x+blk.w||b.y+b.radius<blk.y||b.y-b.radius>blk.y+blk.h)continue;

        const solid=blk.hp<0;
        if(b.through&&!solid){
          this.score+=blk.score;this.spawnParticles(blk.x+blk.w/2,blk.y+blk.h/2,blk.color,8);
          if(blk.type==="SPECIAL"&&Math.random()<.65)this.items.push(new Item(blk.x+blk.w/2,blk.y+blk.h/2,Math.floor(Math.random()*ITEM_TYPES.length)));
          this.blocks.splice(j,1);this.sound.play("block");
          continue;
        }

        const destroyed=blk.hit();
        if(destroyed){
          this.score+=blk.score;this.spawnParticles(blk.x+blk.w/2,blk.y+blk.h/2,blk.color,10);
          if(blk.type==="SPECIAL"&&Math.random()<.65)this.items.push(new Item(blk.x+blk.w/2,blk.y+blk.h/2,Math.floor(Math.random()*ITEM_TYPES.length)));
          this.blocks.splice(j,1);this.sound.play("block");
        }else this.sound.play("hard");

        const cx=blk.x+blk.w/2,cy=blk.y+blk.h/2;
        const dx=b.x-cx,dy=b.y-cy;
        const ox=blk.w/2+b.radius-Math.abs(dx),oy=blk.h/2+b.radius-Math.abs(dy);
        if(ox<oy){b.vx=-b.vx;b.x+=dx>=0?ox+.6:-ox-.6}
        else{b.vy=-b.vy;b.y+=dy>=0?oy+.6:-oy-.6}
        break;
      }
    }

    for(let i=this.items.length-1;i>=0;i--){
      const it=this.items[i];it.update(dt);
      const r=this.easyMode?19:13;
      const px=this.paddle.x-this.paddle.width/2,py=this.paddle.y-this.paddle.height/2;
      if(it.y-r>this.height){this.items.splice(i,1);continue}
      if(it.y+r>=py&&it.y-r<=py+this.paddle.height&&it.x>=px-r&&it.x<=px+this.paddle.width+r){
        this.applyItem(it);this.items.splice(i,1);
      }
    }

    this.blocks.forEach(b=>b.update(dt));
    for(let i=this.particles.length-1;i>=0;i--){
      this.particles[i].update(dt);
      if(this.particles[i].life<=0)this.particles.splice(i,1);
    }

    if(this.blocks.every(b=>b.hp<0)){this.stageClear();return}

    if(this.balls.length===0){
      this.lives--;this.sound.play("miss");
      if(this.lives<=0){this.gameOver();return}
      const speed=Math.min(6.7,3.1+(this.stage-1)*.18);
      this.balls=[new Ball(this.width/2,this.height*.58,this.easyMode?11:6,speed,this)];
      this.showMessage("READY");
    }
    this.updateHUD();
  }

  stageClear(){
    this.sound.play("clear");this.score+=this.lives*100;
    if(this.stage>=10){
      this.state="clear";this.saveHigh();
      $("clearScore").textContent="SCORE: "+this.score;
      $("clearScreen").classList.remove("hidden");
      $("gameToolbar").classList.remove("show");
    }else{
      this.stage++;this.loadStage();this.updateHUD();
    }
  }

  saveHigh(){
    if(this.score>this.highScore){
      this.highScore=this.score;
      localStorage.setItem("salp_block_high",String(this.highScore));
    }
    this.updateHUD();
  }

  gameOver(){
    this.state="gameover";this.sound.play("gameover");this.saveHigh();
    $("goScore").textContent="SCORE: "+this.score;
    $("gameOverScreen").classList.remove("hidden");
    $("gameToolbar").classList.remove("show");
  }

  draw(){
    const c=this.ctx,w=this.width,h=this.height;
    c.clearRect(0,0,w,h);
    const gr=c.createLinearGradient(0,0,0,h);
    gr.addColorStop(0,"#101629");gr.addColorStop(.55,"#10345b");gr.addColorStop(1,"#151526");
    c.fillStyle=gr;c.fillRect(0,0,w,h);

    c.strokeStyle="rgba(255,255,255,.035)";c.lineWidth=1;
    for(let x=0;x<w;x+=40){c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke()}
    for(let y=0;y<h;y+=40){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}

    if(this.state==="title")return;
    this.blocks.forEach(b=>b.draw(c,this.easyMode));
    this.items.forEach(i=>i.draw(c,this.easyMode));
    if(this.paddle)this.paddle.draw(c);
    this.balls.forEach(b=>b.draw(c,this.easyMode));
    this.particles.forEach(p=>p.draw(c));
  }

  loop(t){
    const dt=Math.min(.034,Math.max(0,(t-this.lastTime)/1000||0));
    this.lastTime=t;
    this.update(dt);this.draw();
    requestAnimationFrame(n=>this.loop(n));
  }
}

addEventListener("DOMContentLoaded",()=>new Game());
</script>
