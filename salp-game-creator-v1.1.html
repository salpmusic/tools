<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>salp Game Creator</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font:16px system-ui}header{padding:15px;background:#243451}h1{font-size:21px;margin:0}main{padding:12px;display:grid;gap:12px;grid-template-columns:1fr 1fr}.panel{background:#223047;border-radius:15px;padding:12px}button,select,input{font:inherit;border-radius:9px;padding:10px;margin:4px;background:#415e91;color:#fff;border:1px solid #7c94b5;min-height:42px}button{cursor:pointer}.tools{display:flex;flex-wrap:wrap}.map{position:relative;height:330px;overflow:auto;background:#101c31;border-radius:12px;touch-action:pan-x pan-y}.world{position:relative;width:800px;height:500px}.node{position:absolute;width:150px;background:#385578;border:2px solid #89c4ec;border-radius:10px;padding:12px;touch-action:none;user-select:none}.node small{display:block}.wires{position:absolute;inset:0;pointer-events:none}label{display:block;margin:8px 0}select,input{width:100%;margin:3px 0;background:#16243a}.setting{padding:10px;background:#30405a;margin:8px 0;border-radius:10px}canvas{width:100%;aspect-ratio:4/3;background:#dff2ff;border-radius:10px}#msg{min-height:25px;color:#a8f0c5}a{color:#b5e4ff}@media(max-width:760px){main{grid-template-columns:1fr}}</style><header><h1>🐈 salp Game Creator v1.1</h1>無料でゲームをつくろう！　<a href="./index.html">🏠 ホームへ</a>　<a href="./salp-game-creator-tutorial.html">📘 チュートリアル</a></header><main><section class="panel"><h2>🧩 ノードエディター</h2><p>指でノードを移動。下の設定で「次へ」をつなげよう。</p><div class="tools" id="palette"></div><div class="map"><div class="world"><svg class="wires" id="wires" width="800" height="500"></svg><div id="mapnodes"></div></div></div><h3>⚙ 設定</h3><div id="settings"></div></section><section class="panel"><h2>🎮 プレビュー</h2><canvas id="stage" width="640" height="480"></canvas><div class="tools"><button id="play">▶ 実行</button><button id="stop">■ 停止</button><button id="save">💾 保存</button><button id="load">📂 読込</button><button id="export">⬇ 作品HTML</button><button id="backup">⬇ JSON</button><button id="import">⬆ JSON読込</button><input id="file" type="file" accept=".json" hidden></div><p id="msg">準備OK！</p><p>登録不要・広告なし。データはこの端末に保存されます。</p></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),names={move:'➡ 移動',jump:'🐈 ジャンプ',sound:'🔔 音',wait:'⏳ 待機',score:'⭐ 得点',turn:'↩ 反転'},defaults={move:80,jump:90,sound:440,wait:400,score:10,turn:-1},key='salp.creator.v1.1';let nodes=[{id:1,type:'move',value:80,next:2,x:20,y:20},{id:2,type:'jump',value:90,next:3,x:240,y:20},{id:3,type:'sound',value:440,next:4,x:460,y:20},{id:4,type:'score',value:10,next:null,x:460,y:150}],start=1,token=0,c=$('stage'),g=c.getContext('2d'),cx=100,cy=370,points=0,dir=1,ac;function msg(s){$('msg').textContent=s}function draw(){g.fillStyle='#dff2ff';g.fillRect(0,0,640,480);g.fillStyle='#90c97e';g.fillRect(0,410,640,70);g.font='66px system-ui';g.textAlign='center';g.fillText('🐈',cx,cy);g.font='bold 28px system-ui';g.textAlign='left';g.fillStyle='#243451';g.fillText('⭐ '+points,20,45)}function reset(){cx=100;cy=370;points=0;dir=1;draw()}function stop(){token++;msg('停止しました')}function wires(){let svg=$('wires');svg.replaceChildren();nodes.forEach(n=>{let t=nodes.find(a=>a.id===n.next);if(!t)return;let p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d','M '+(n.x+150)+' '+(n.y+35)+' C '+(n.x+210)+' '+(n.y+35)+', '+(t.x-60)+' '+(t.y+35)+', '+t.x+' '+(t.y+35));p.setAttribute('stroke','#72f2c0');p.setAttribute('stroke-width','4');p.setAttribute('fill','none');svg.append(p)})}function render(){let map=$('mapnodes'),settings=$('settings');map.replaceChildren();settings.replaceChildren();nodes.forEach(n=>{let el=document.createElement('div');el.className='node';el.style.left=n.x+'px';el.style.top=n.y+'px';el.textContent=names[n.type]+' #'+n.id+(n.id===start?' 🟢':'');let sx,sy,ox,oy;el.onpointerdown=e=>{sx=e.clientX;sy=e.clientY;ox=n.x;oy=n.y;el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(!el.hasPointerCapture(e.pointerId))return;n.x=Math.max(0,Math.min(650,ox+e.clientX-sx));n.y=Math.max(0,Math.min(440,oy+e.clientY-sy));el.style.left=n.x+'px';el.style.top=n.y+'px';wires()};map.append(el);let d=document.createElement('div');d.className='setting';let title=document.createElement('b');title.textContent=names[n.type]+' #'+n.id;d.append(title);let label=document.createElement('label');label.textContent='値';let inp=document.createElement('input');inp.type='number';inp.value=n.value;inp.onchange=()=>n.value=Math.max(-1000,Math.min(3000,Number(inp.value)||0));label.append(inp);d.append(label);let l=document.createElement('label');l.textContent='🔗 次へ';let sel=document.createElement('select');[['','終了'],...nodes.filter(a=>a.id!==n.id).map(a=>[a.id,'#'+a.id+' '+names[a.type]])].forEach(([v,t])=>{let o=document.createElement('option');o.value=v;o.textContent=t;sel.append(o)});sel.value=n.next??'';sel.onchange=()=>{n.next=sel.value===''?null:Number(sel.value);wires()};l.append(sel);d.append(l);let b=document.createElement('button');b.textContent=n.id===start?'🟢 開始':'開始にする';b.onclick=()=>{start=n.id;render()};d.append(b);let del=document.createElement('button');del.textContent='削除';del.onclick=()=>{nodes=nodes.filter(a=>a.id!==n.id);nodes.forEach(a=>{if(a.next===n.id)a.next=null});if(start===n.id)start=nodes[0]?.id??null;render()};d.append(del);settings.append(d)});wires()}function add(type){let id=Math.max(0,...nodes.map(n=>n.id))+1,last=nodes.at(-1);if(last&&last.next==null)last.next=id;nodes.push({id,type,value:defaults[type],next:null,x:20+(nodes.length%3)*220,y:25+Math.floor(nodes.length/3)*120});if(start==null)start=id;render()}Object.keys(names).forEach(type=>{let b=document.createElement('button');b.textContent='＋ '+names[type];b.onclick=()=>add(type);$('palette').append(b)});const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function play(){stop();reset();let t=token,id=start,steps=0;msg('実行中');while(id!=null&&t===token&&steps++<100){let n=nodes.find(a=>a.id===id);if(!n)break;let v=Number(n.value)||0;if(n.type==='move'||n.type==='jump'){let from=cx,to=Math.max(35,Math.min(605,cx+v*dir));for(let i=0;i<=20&&t===token;i++){if(n.type==='move')cx=from+(to-from)*i/20;else cy=370-Math.max(0,v)*Math.sin(Math.PI*i/20);draw();await sleep(20)}}if(n.type==='wait')await sleep(Math.max(0,Math.min(3000,v)));if(n.type==='score')points+=v;if(n.type==='turn')dir=v<0?-1:1;if(n.type==='sound')try{ac??=new(window.AudioContext||window.webkitAudioContext)();await ac.resume();let o=ac.createOscillator(),a=ac.createGain();o.frequency.value=Math.max(80,Math.min(1800,v));a.gain.value=.06;o.connect(a).connect(ac.destination);o.start();o.stop(ac.currentTime+.2)}catch(e){}draw();id=n.next;await sleep(70)}if(t===token)msg('完成！ '+points+'点')}function data(){return {nodes,start}}function valid(p){if(!p||!Array.isArray(p.nodes)||p.nodes.length>200)throw Error('データ形式');let ids=new Set();for(let n of p.nodes){if(!Number.isSafeInteger(n.id)||ids.has(n.id)||!names[n.type]||!Number.isFinite(Number(n.value)))throw Error('ノード不正');ids.add(n.id);n.x=Math.max(0,Math.min(650,Number(n.x)||0));n.y=Math.max(0,Math.min(440,Number(n.y)||0))}for(let n of p.nodes)if(n.next!=null&&!ids.has(n.next))throw Error('接続不正');if(p.start!=null&&!ids.has(p.start))throw Error('開始不正');return p}function download(name,body,type){let u=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('play').onclick=play;c.onclick=play;$('stop').onclick=stop;$('save').onclick=()=>{localStorage.setItem(key,JSON.stringify(data()));msg('保存しました')};$('load').onclick=()=>{try{let p=valid(JSON.parse(localStorage.getItem(key)));nodes=p.nodes;start=p.start;stop();render();reset();msg('読み込みました')}catch(e){msg('保存データなし／読込失敗')}};$('backup').onclick=()=>download('salp-project.json',JSON.stringify(data(),null,2),'application/json');$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>100000)throw Error('容量超過');let p=valid(JSON.parse(await f.text()));nodes=p.nodes;start=p.start;stop();render();reset();msg('読み込みました')}catch(err){msg('エラー: '+err.message)}e.target.value=''};$('export').onclick=()=>{let payload=JSON.stringify(data()).replace(/</g,'\\u003c');let out='<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My salp Game</title><body style="font:20px system-ui;text-align:center;background:#16233a;color:white"><h2>🐈 My Game</h2><canvas id="stage" width="640" height="480" style="width:100%;max-width:640px"></canvas><p><button id="play" style="padding:15px">▶ Play</button></p><p id="msg"></p><script>const project='+payload+';let nodes=project.nodes,start=project.start,token=0,c=document.getElementById("stage"),g=c.getContext("2d"),cx=100,cy=370,points=0,dir=1,ac;'+draw.toString()+';'+sleep.toString()+';'+stop.toString()+';'+play.toString()+';function msg(s){document.getElementById("msg").textContent=s}function reset(){cx=100;cy=370;points=0;dir=1;draw()}document.getElementById("play").onclick=play;c.onclick=play;draw();<\\/script></body></html>';download('my-salp-game.html',out,'text/html')};render();draw()})();
</script></html>
