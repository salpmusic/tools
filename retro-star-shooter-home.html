<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RETRO STAR SHOOTER</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#05070c;color:#dff;font-family:monospace;overflow:hidden}
  body{display:grid;place-items:center}
  .wrap{width:min(100vw,720px);height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
  .hud{width:100%;max-width:540px;display:flex;justify-content:space-between;gap:8px;font-size:14px;letter-spacing:1px}
  canvas{
    width:min(100%,540px);
    aspect-ratio:3/4;
    max-height:78vh;
    background:#000;
    border:2px solid #6ff;
    image-rendering:pixelated;
    touch-action:none;
    box-shadow:0 0 18px #0ff5;
  }
  .help{font-size:12px;opacity:.75;text-align:center;line-height:1.45}
  .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button,.homeBtn{
    background:#111827;color:#dff;border:1px solid #6ff;padding:8px 12px;
    border-radius:8px;font:inherit
  }
  .homeBtn{
    display:inline-flex;align-items:center;justify-content:center;
    text-decoration:none;
  }
  .homeBtn:hover,button:hover{background:#17243a}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div id="score">SCORE 000000</div>
    <div id="life">LIFE 3</div>
    <div id="hi">HI 000000</div>
  </div>
  <canvas id="game" width="360" height="480"></canvas>
  <div class="btns">
    <button id="startBtn">START / RESTART</button>
    <a class="homeBtn" href="./index.html">← salp Tools HOME</a>
  </div>
  <div class="help">PC: ← → / A D で移動・SPACEで連射　スマホ: 画面を指で動かすと自機移動＋自動射撃</div>
</div>

<script>
(() => {
  const c = document.getElementById('game');
  const x = c.getContext('2d');
  const scoreEl = document.getElementById('score');
  const lifeEl = document.getElementById('life');
  const hiEl = document.getElementById('hi');
  const startBtn = document.getElementById('startBtn');

  const W=c.width,H=c.height;
  let keys={}, running=false, gameOver=false, score=0, hi=+(localStorage.retroShooterHi||0), lives=3;
  let bullets=[], enemies=[], enemyBullets=[], stars=[], particles=[], powerups=[];
  let spawnTimer=0, fireTimer=0, enemyFireTimer=0, level=1, t=0;
  let touchActive=false, touchX=W/2;
  let audioCtx=null;

  const ship={x:W/2,y:H-45,w:18,h:18,speed:4.2,inv:0,rapid:0};

  for(let i=0;i<80;i++) stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+1,v:Math.random()*1.4+.3});

  function beep(freq=440,dur=.05,type='square',vol=.025){
    try{
      audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type=type;o.frequency.value=freq;g.gain.value=vol;
      o.connect(g).connect(audioCtx.destination);o.start();
      g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
      o.stop(audioCtx.currentTime+dur);
    }catch(e){}
  }

  function reset(){
    running=true;gameOver=false;score=0;lives=3;level=1;t=0;
    bullets=[];enemies=[];enemyBullets=[];particles=[];powerups=[];
    ship.x=W/2;ship.y=H-45;ship.inv=0;ship.rapid=0;
    updateHud();
    beep(660,.08,'square',.03); setTimeout(()=>beep(880,.08,'square',.03),90);
  }

  function updateHud(){
    scoreEl.textContent='SCORE '+String(score).padStart(6,'0');
    lifeEl.textContent='LIFE '+lives;
    hiEl.textContent='HI '+String(Math.max(hi,score)).padStart(6,'0');
  }

  function addExplosion(px,py,n=18){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, sp=Math.random()*2.8+.4;
      particles.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:20+Math.random()*20});
    }
  }

  function spawnEnemy(){
    const r=Math.random();
    let e;
    if(r<.68){
      e={type:'grunt',x:20+Math.random()*(W-40),y:-20,w:18,h:16,hp:1,vy:1.2+level*.08,phase:Math.random()*6.28};
    }else if(r<.9){
      e={type:'zig',x:20+Math.random()*(W-40),y:-20,w:20,h:18,hp:2,vy:1+level*.07,phase:Math.random()*6.28};
    }else{
      e={type:'tank',x:25+Math.random()*(W-50),y:-24,w:28,h:22,hp:5,vy:.65+level*.05,phase:0};
    }
    enemies.push(e);
  }

  function shoot(){
    bullets.push({x:ship.x,y:ship.y-13,vy:ship.rapid? -7.5:-6.3});
    beep(ship.rapid?780:620,.025,'square',.012);
  }

  function enemyShoot(e){
    const dx=ship.x-e.x,dy=ship.y-e.y,len=Math.hypot(dx,dy)||1;
    const sp=1.7+level*.04;
    enemyBullets.push({x:e.x,y:e.y+8,vx:dx/len*sp,vy:dy/len*sp,r:3});
  }

  function rectHit(a,b){
    return Math.abs(a.x-b.x)<(a.w+b.w)/2 && Math.abs(a.y-b.y)<(a.h+b.h)/2;
  }

  function hitShip(b){
    if(ship.inv>0)return;
    const dx=ship.x-b.x,dy=ship.y-b.y;
    if(Math.hypot(dx,dy)<12){
      lives--;ship.inv=110;addExplosion(ship.x,ship.y,28);beep(90,.18,'sawtooth',.05);
      enemyBullets.length=0;
      if(lives<=0){
        running=false;gameOver=true;
        if(score>hi){hi=score;localStorage.retroShooterHi=hi;}
      }
      updateHud();
    }
  }

  function update(){
    t++;
    for(const s of stars){s.y+=s.v;if(s.y>H){s.y=0;s.x=Math.random()*W}}
    if(!running)return;

    level=1+Math.floor(score/1500);
    if(keys.ArrowLeft||keys.a||keys.A) ship.x-=ship.speed;
    if(keys.ArrowRight||keys.d||keys.D) ship.x+=ship.speed;
    if(touchActive) ship.x += (touchX-ship.x)*.18;
    ship.x=Math.max(12,Math.min(W-12,ship.x));
    if(ship.inv>0)ship.inv--;
    if(ship.rapid>0)ship.rapid--;

    fireTimer--;
    if((keys[' ']||touchActive) && fireTimer<=0){
      shoot(); fireTimer=ship.rapid?5:10;
    }

    spawnTimer--;
    if(spawnTimer<=0){
      spawnEnemy();
      spawnTimer=Math.max(18,52-level*2)+Math.random()*18;
    }

    for(const b of bullets)b.y+=b.vy;
    bullets=bullets.filter(b=>b.y>-20);

    enemyFireTimer--;
    if(enemyFireTimer<=0 && enemies.length){
      const e=enemies[(Math.random()*enemies.length)|0];
      if(e.y>20&&e.y<H*.7) enemyShoot(e);
      enemyFireTimer=Math.max(18,60-level*2);
    }

    for(const e of enemies){
      e.y+=e.vy;
      if(e.type==='zig')e.x+=Math.sin(t*.05+e.phase)*1.4;
      else if(e.type==='grunt')e.x+=Math.sin(t*.035+e.phase)*.45;
    }

    for(const b of enemyBullets){b.x+=b.vx;b.y+=b.vy;hitShip(b)}
    enemyBullets=enemyBullets.filter(b=>b.y<H+20&&b.x>-20&&b.x<W+20);

    for(const b of bullets){
      for(const e of enemies){
        if(b.dead||e.dead)continue;
        if(Math.abs(b.x-e.x)<e.w/2+2 && Math.abs(b.y-e.y)<e.h/2+6){
          b.dead=true;e.hp--;addExplosion(b.x,b.y,4);
          if(e.hp<=0){
            e.dead=true;
            const pts=e.type==='tank'?250:e.type==='zig'?120:70;
            score+=pts;
            addExplosion(e.x,e.y,e.type==='tank'?28:14);
            beep(e.type==='tank'?120:180,.08,'square',.035);
            if(Math.random()<.08) powerups.push({x:e.x,y:e.y,vy:1.1,r:7});
            updateHud();
          }
        }
      }
    }
    bullets=bullets.filter(b=>!b.dead);
    enemies=enemies.filter(e=>{
      if(e.dead)return false;
      if(e.y>H+30){
        if(ship.inv<=0){lives--;ship.inv=80;beep(110,.1,'square',.03);updateHud(); if(lives<=0){running=false;gameOver=true}}
        return false;
      }
      return true;
    });

    for(const p of powerups){
      p.y+=p.vy;
      if(Math.hypot(p.x-ship.x,p.y-ship.y)<16){
        p.dead=true;ship.rapid=600;score+=100;beep(1000,.12,'sine',.035);updateHud();
      }
    }
    powerups=powerups.filter(p=>!p.dead&&p.y<H+10);

    for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vx*=.98;p.vy*=.98;p.life--}
    particles=particles.filter(p=>p.life>0);

    if(score>hi)hi=score;
  }

  function drawShip(){
    if(ship.inv>0 && ((ship.inv/5)|0)%2===0)return;
    x.save();x.translate(ship.x,ship.y);
    x.fillStyle='#7ff';x.fillRect(-2,-10,4,14);
    x.fillStyle='#fff';x.fillRect(-7,-3,14,9);
    x.fillStyle='#2af';x.fillRect(-10,4,20,5);
    x.fillStyle='#f85';x.fillRect(-4,9,3,5);x.fillRect(1,9,3,5);
    x.restore();
  }

  function drawEnemy(e){
    x.save();x.translate(e.x,e.y);
    if(e.type==='grunt'){
      x.fillStyle='#f55';x.fillRect(-8,-6,16,12);x.fillStyle='#fff';x.fillRect(-4,-2,3,3);x.fillRect(2,-2,3,3);
    }else if(e.type==='zig'){
      x.fillStyle='#fc5';x.fillRect(-10,-5,20,10);x.fillRect(-5,-9,10,18);x.fillStyle='#111';x.fillRect(-2,-2,4,4);
    }else{
      x.fillStyle='#b6f';x.fillRect(-13,-8,26,16);x.fillRect(-8,-11,16,22);x.fillStyle='#fff';x.fillRect(-3,-3,6,6);
    }
    x.restore();
  }

  function render(){
    x.fillStyle='#000';x.fillRect(0,0,W,H);
    for(const s of stars){
      x.fillStyle=s.s>2?'#9ff':'#446';x.fillRect(s.x,s.y,s.s,s.s);
    }

    for(const p of powerups){
      x.strokeStyle='#6f6';x.lineWidth=2;x.strokeRect(p.x-6,p.y-6,12,12);
      x.fillStyle='#fff';x.font='10px monospace';x.fillText('R',p.x-3,p.y+3);
    }

    x.fillStyle='#7ff';
    for(const b of bullets)x.fillRect(b.x-1,b.y-6,3,10);

    x.fillStyle='#f88';
    for(const b of enemyBullets){x.beginPath();x.arc(b.x,b.y,b.r,0,Math.PI*2);x.fill()}

    for(const e of enemies)drawEnemy(e);

    x.fillStyle='#fff';
    for(const p of particles)x.fillRect(p.x,p.y,2,2);

    drawShip();

    x.fillStyle='#7ff';x.font='12px monospace';x.fillText('LEVEL '+level,8,16);
    if(ship.rapid>0){x.fillStyle='#6f6';x.fillText('RAPID',W-46,16)}

    if(!running){
      x.fillStyle='#000b';x.fillRect(0,0,W,H);
      x.textAlign='center';
      x.fillStyle='#7ff';x.font='bold 24px monospace';x.fillText('RETRO STAR',W/2,H/2-60);
      x.fillStyle='#fff';x.font='bold 28px monospace';x.fillText('SHOOTER',W/2,H/2-28);
      x.font='14px monospace';
      if(gameOver){
        x.fillStyle='#f88';x.fillText('GAME OVER',W/2,H/2+20);
        x.fillStyle='#fff';x.fillText('SCORE '+score,W/2,H/2+46);
      }else{
        x.fillStyle='#fff';x.fillText('PRESS START',W/2,H/2+30);
      }
      x.font='11px monospace';x.fillStyle='#8aa';x.fillText('JavaScript Retro Arcade',W/2,H-24);
      x.textAlign='left';
    }
  }

  function loop(){
    update();render();requestAnimationFrame(loop);
  }

  addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});
  addEventListener('keyup',e=>keys[e.key]=false);

  function touchPos(ev){
    const r=c.getBoundingClientRect(), p=ev.touches?ev.touches[0]:ev;
    touchX=(p.clientX-r.left)/r.width*W;
  }
  c.addEventListener('pointerdown',e=>{touchActive=true;touchPos(e)});
  c.addEventListener('pointermove',e=>{if(touchActive)touchPos(e)});
  addEventListener('pointerup',()=>touchActive=false);
  c.addEventListener('touchstart',e=>{touchActive=true;touchPos(e);e.preventDefault()},{passive:false});
  c.addEventListener('touchmove',e=>{touchPos(e);e.preventDefault()},{passive:false});
  c.addEventListener('touchend',()=>touchActive=false);

  startBtn.addEventListener('click',reset);
  c.addEventListener('dblclick',reset);

  updateHud();loop();
})();
</script>
</body>
</html>
