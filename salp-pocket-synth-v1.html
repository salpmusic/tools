<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#141a2a"><title>salp Pocket Synth Ver.1</title><meta name="description" content="スマホでも弾けるスクロール鍵盤のブラウザーシンセ"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23141a2a'/%3E%3Cpath d='M11 16h42v32H11z' fill='%23fff'/%3E%3Cpath d='M20 16h7v19h-7m14-19h7v19h-7' fill='%237a65fa'/%3E%3C/svg%3E"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#edf1ff;background:#141a2a}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 80% 0%,#293061,#141a2a 55%)}main{max-width:1100px;margin:auto;padding:22px 16px 42px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(24px,6vw,38px);margin:0;letter-spacing:-.04em}.tag{color:#aab3d2;font-size:13px;margin:5px 0 0}.badge{border:1px solid #606993;border-radius:99px;padding:7px 11px;color:#c5ccef;font-size:12px;white-space:nowrap}.panel{margin-top:24px;padding:20px;background:#242b43;border:1px solid #465072;border-radius:22px;box-shadow:0 18px 45px #090e2188}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}label{font-size:13px;color:#cbd3ef;display:flex;flex-direction:column;gap:9px}select,input[type=range]{width:100%}select{background:#151b30;color:white;border:1px solid #606a8d;border-radius:10px;padding:11px;font-size:16px}input{accent-color:#a18fff}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px}.row strong{font-size:17px}.hint{color:#afb9da;font-size:13px}.scroller{overflow-x:auto;overflow-y:hidden;touch-action:pan-x;overscroll-behavior-x:contain;border-radius:13px;background:#0c1120;scrollbar-color:#8575e8 #151b30;scrollbar-width:auto}.keyboard{height:260px;width:max-content;display:flex;position:relative;padding:0 10px 10px;user-select:none;-webkit-user-select:none;touch-action:pan-x}.white{position:relative;width:57px;height:248px;flex:none;border:1px solid #aeb6c9;border-radius:0 0 8px 8px;background:linear-gradient(#fff,#dde4ef);color:#59627e;display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px;font-size:12px}.white.active{background:linear-gradient(#d7ceff,#8d7cf3)}.black{position:absolute;z-index:2;top:0;width:35px;height:155px;border:1px solid #1f2440;border-radius:0 0 7px 7px;background:linear-gradient(#343b5a,#101526);box-shadow:2px 3px 5px #12172b99}.black.active{background:linear-gradient(#9886f6,#604dc1)}.footer{color:#aeb8d7;font-size:13px;line-height:1.5;margin:16px 2px}button{border:0;border-radius:10px;background:#806cf3;color:#fff;padding:10px 15px;font:inherit;cursor:pointer}button:active{transform:scale(.97)}@media(max-width:600px){main{padding:17px 10px}.panel{padding:14px;margin-top:17px}.controls{grid-template-columns:1fr 1fr}.controls label:first-child{grid-column:span 2}.keyboard{height:230px}.white{width:54px;height:218px}.black{width:33px;height:135px}.row{align-items:flex-start}.hint{max-width:170px;text-align:right}}
</style></head><body><main><header><div><h1>salp Pocket Synth <small style="font-size:.42em;color:#bfb4ff;vertical-align:middle">Ver.1</small></h1><p class="tag">指先で弾く、小さなシンセサイザー</p></div><span class="badge">♪ Web Audio</span></header><section class="panel"><div class="controls"><label>音色 / Sound<select id="wave"><option value="sine">やわらかい / Soft</option><option value="triangle">まろやか / Mellow</option><option value="sawtooth" selected>シンセ / Synth</option><option value="square">レトロ / Retro</option></select></label><label>音量 / Volume<input id="volume" type="range" min="0" max="100" value="55"></label><label>余韻 / Release<input id="release" type="range" min="5" max="150" value="35"></label></div><div class="row"><strong>鍵盤 / Keyboard</strong><span class="hint">左右にスワイプして音域を移動 ↔</span></div><div class="scroller" id="scroller"><div class="keyboard" id="keyboard" aria-label="スクロールできるピアノ鍵盤"></div></div><p class="footer">鍵盤をタップして演奏。複数の指で和音も弾けます。パソコンでは A W S E D F T G Y H U J K でも演奏できます。</p></section></main><script>
(()=>{'use strict';const kb=document.getElementById('keyboard'),scroller=document.getElementById('scroller'),wave=document.getElementById('wave'),volume=document.getElementById('volume'),release=document.getElementById('release');let ctx,master;const active=new Map(),notes=new Map();const blackSet=new Set([1,3,6,8,10]);const names=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];const start=36,end=96,w=57;for(let n=start;n<=end;n++){if(blackSet.has(n%12))continue;const el=document.createElement('div');el.className='white';el.dataset.note=n;el.textContent=n%12===0?'C'+(Math.floor(n/12)-1):'';kb.appendChild(el);notes.set(n,el)}for(let n=start;n<=end;n++){if(!blackSet.has(n%12))continue;const el=document.createElement('div');el.className='black';el.dataset.note=n;const preceding=[...notes.keys()].filter(x=>x<n).length;el.style.left=(10+preceding*w-17.5)+'px';el.setAttribute('aria-label',names[n%12]+(Math.floor(n/12)-1));kb.appendChild(el);notes.set(n,el)}kb.style.setProperty('--w',w+'px');scroller.scrollLeft=7*w;function setup(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.7;master.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume()}function on(id,n){if(active.has(id))off(id);setup();const osc=ctx.createOscillator(),gain=ctx.createGain(),now=ctx.currentTime;osc.type=wave.value;osc.frequency.value=440*Math.pow(2,(n-69)/12);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(Math.max(.0001,(+volume.value/100)*.27),now+.018);osc.connect(gain);gain.connect(master);osc.start();active.set(id,{osc,gain,n});notes.get(n)?.classList.add('active')}function off(id){const v=active.get(id);if(!v)return;const now=ctx.currentTime,d=Math.max(.05,+release.value/100);v.gain.gain.cancelScheduledValues(now);v.gain.gain.setValueAtTime(Math.max(.0001,v.gain.gain.value),now);v.gain.gain.exponentialRampToValueAtTime(.0001,now+d);v.osc.stop(now+d+.03);active.delete(id);if(![...active.values()].some(a=>a.n===v.n))notes.get(v.n)?.classList.remove('active')}function noteAt(x,y){const el=document.elementFromPoint(x,y)?.closest('[data-note]');return el&&kb.contains(el)?+el.dataset.note:null}let touches=new Map();kb.addEventListener('pointerdown',e=>{const n=noteAt(e.clientX,e.clientY);if(n==null)return;const id='p'+e.pointerId;touches.set(id,{x:e.clientX,y:e.clientY,n,playing:false,timer:null});const t=touches.get(id);if(e.pointerType==='mouse'){on(id,n);t.playing=true;kb.setPointerCapture(e.pointerId)}else{t.timer=setTimeout(()=>{if(touches.get(id)===t){on(id,n);t.playing=true}},90)}});kb.addEventListener('pointermove',e=>{const id='p'+e.pointerId,t=touches.get(id);if(!t)return;if(!t.playing&&Math.abs(e.clientX-t.x)>10){clearTimeout(t.timer);touches.delete(id);return}if(t.playing&&e.pointerType==='mouse'){const n=noteAt(e.clientX,e.clientY);if(n!==t.n){off(id);if(n!=null)on(id,n);t.n=n}}});kb.addEventListener('pointerup',e=>{const id='p'+e.pointerId,t=touches.get(id);if(!t)return;clearTimeout(t.timer);if(!t.playing){const n=noteAt(e.clientX,e.clientY);if(n!=null)on(id,n)}off(id);touches.delete(id)});kb.addEventListener('pointercancel',e=>{const id='p'+e.pointerId;clearTimeout(touches.get(id)?.timer);off(id);touches.delete(id)});const keys='awsedftgyhujk';const held=new Set();document.addEventListener('keydown',e=>{if(e.repeat||e.target.matches('input,select'))return;const i=keys.indexOf(e.key.toLowerCase());if(i<0)return;e.preventDefault();const id='k'+e.key.toLowerCase();if(!held.has(id)){held.add(id);on(id,60+i)}});document.addEventListener('keyup',e=>{const id='k'+e.key.toLowerCase();held.delete(id);off(id)});window.addEventListener('blur',()=>{for(const id of [...active.keys()])off(id);held.clear()});})();
</script></body></html>
