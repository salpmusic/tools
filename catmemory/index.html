<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{

  font-size:16px;line-height:1.45;

  touch-action:manipulation;overscroll-behavior:none;
  padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
}
body.large{font-size:21px}
button,select,input{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
.app{
  --bs:min(calc(100vw - 24px),calc(100dvh - 330px),560px);
  max-width:640px;margin:0 auto;display:grid;gap:10px;justify-items:center;
  grid-template-areas:"head" "info" "bar" "board" "ctrl";
}
body.large .app{--bs:min(calc(100vw - 20px),calc(100dvh - 400px),600px)}
.app>*{width:100%}
header{grid-area:head;display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:1.25rem;letter-spacing:.04em}
.home{color:#b0603a;font-size:.85rem;text-decoration:none;border:2px solid #f0b88f;border-radius:999px;padding:4px 12px;white-space:nowrap;background:#fff7ef}
.info{grid-area:info;display:grid;gap:8px}
.top{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcard{background:#fff7ef;border:3px solid #f0b88f;border-radius:14px;padding:6px 10px;text-align:center}
.pcard .name{font-size:.8rem;color:#a2735a}
.pcard .val{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:.85rem;color:#8a5d46}
.stats b{color:#5a3a2a;font-variant-numeric:tabular-nums}
#msg{min-height:2.9em;display:flex;align-items:center;justify-content:center;text-align:center;background:#fff;border:2px dashed #f0b88f;border-radius:12px;padding:6px 10px;font-weight:700}
#bonus{min-height:1.3em;text-align:center;color:#d2561f;font-size:.9rem;font-weight:700}

#board{
  grid-area:board;width:var(--bs);height:var(--bs);justify-self:center;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:calc(var(--bs)/30);
  padding:calc(var(--bs)/30);background:#f6c9a3;border-radius:24px;
}
.cat{
  --bg:#fff;--glow:#fff;
  position:relative;border:0;border-radius:20px;background:var(--bg);padding:6%;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  transition:transform .08s,box-shadow .08s,filter .08s;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;filter:saturate(.75) brightness(.92);
}
.cat:nth-child(1){--bg:#ffe1c2;--glow:#ffb35c}
.cat:nth-child(2){--bg:#e2f0ff;--glow:#6fb6ff}
.cat:nth-child(3){--bg:#ffe0ef;--glow:#ff7fbf}
.cat:nth-child(4){--bg:#e3f7d6;--glow:#7bd957}
.cat.lit{filter:none;transform:scale(1.04);z-index:1;box-shadow:0 0 calc(var(--bs)/10) var(--glow),inset 0 0 0 calc(var(--bs)/60) var(--glow);background:#fff}
.cat.bad{animation:shake .3s;box-shadow:inset 0 0 0 calc(var(--bs)/50) #ff4d4d}
.cat:disabled{cursor:default}
.cat svg,.cat .art{width:100%;height:100%;display:block;pointer-events:none;object-fit:contain}
.cat .mo,.cat .artOpen{display:none}
.cat.meow .mo{display:inline}
.cat.meow .mc,.cat.meow .artClosed{display:none}
.cat.meow .artOpen{display:block}
.cat.meow svg,.cat.meow .art{animation:bob .25s ease-in-out}
@keyframes bob{50%{transform:translateY(-4%) scale(1.04)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.ctrl{grid-area:ctrl;display:grid;gap:10px}
.box{background:#fff7ef;border:2px solid #f0b88f;border-radius:14px;padding:10px 12px}
.box h2{font-size:.85rem;color:#a2735a;margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.main{width:100%;border:0;border-radius:14px;background:#ff8f5a;color:#fff;font-weight:800;font-size:1.15rem;padding:12px;box-shadow:0 4px 0 #d5622f}
.main.stop{background:#b9987f;box-shadow:0 4px 0 #8c6d57}
.tog{background:#fff;border:2px solid #f0b88f;border-radius:999px;padding:6px 14px;font-weight:700;color:#8a5d46}
.tog[aria-pressed=true]{background:#ff8f5a;border-color:#d5622f;color:#fff}
.vol{display:flex;align-items:center;gap:8px;flex:1;min-width:150px}
.vol input{flex:1;accent-color:#ff8f5a;height:28px}
#result{background:#fff;border:3px solid #ff8f5a;border-radius:14px;padding:10px 12px;text-align:center}
#result[hidden]{display:none}
#result h2{font-size:1.2rem;color:#d2561f;margin-bottom:4px}
.note{font-size:.75rem;color:#a2735a;text-align:center}

body.hc{background:#000;color:#fff}
body.hc .pcard,body.hc .box,body.hc #msg,body.hc #result{background:#000;border:3px solid #fff;color:#fff}
body.hc .pcard .name,body.hc .stats,body.hc .stats b,body.hc .box h2,body.hc .note{color:#fff}
body.hc #bonus,body.hc #result h2{color:#ffff00}
body.hc #board{background:#fff}
body.hc .cat{background:#000;filter:none;border:calc(var(--bs)/60) solid #fff}
body.hc .cat.lit{background:#ffff00;box-shadow:none;transform:scale(1.03)}
body.hc .cat.bad{box-shadow:inset 0 0 0 calc(var(--bs)/30) #ff0000}
body.hc .home{background:#000;color:#ffff00;border-color:#ffff00}
body.hc .tog{background:#000;border-color:#fff;color:#fff}
body.hc .tog[aria-pressed=true]{background:#ffff00;color:#000}
body.hc .main{background:#ffff00;color:#000;box-shadow:none}
body.hc .main.stop{background:#fff;color:#000}

@media (orientation:landscape) and (max-height:700px){
  .app{
    --bs:min(calc(100dvh - 28px),calc(100vw - 340px),560px);
    max-width:1000px;align-items:start;justify-items:stretch;
    grid-template-columns:var(--bs) 1fr;column-gap:14px;
    grid-template-areas:"board head" "board info" "board bar" "board ctrl";grid-template-rows:auto auto auto 1fr;
  }
  body.large .app{--bs:min(calc(100dvh - 28px),calc(100vw - 380px),600px)}
  #board{align-self:start}
}
.hbtn{display:flex;gap:6px;margin-left:auto}
.tog.sm{padding:4px 10px;font-size:.85rem}
#board:focus{outline:none}
#board:focus-visible{outline:4px solid #3d7be8;outline-offset:3px}
.cat.sel{outline:5px dashed #3d7be8;outline-offset:-9px}
#board:not(.kb) .cat.sel{outline:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:4px solid #3d7be8;outline-offset:2px}
body.hc .cat.sel,body.hc #board:focus-visible,body.hc button:focus-visible{outline-color:#00ffff}
#board.n9{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:calc(var(--bs)/45);padding:calc(var(--bs)/45)}
#board.n9 .cat{border-radius:14px;padding:3%}
.cat:nth-child(5){--bg:#efe3ff;--glow:#a77bff}
.cat:nth-child(6){--bg:#dff6f8;--glow:#4fc8d6}
.cat:nth-child(7){--bg:#ffe6e6;--glow:#ff6f7d}
.cat:nth-child(8){--bg:#fff4cc;--glow:#f0c419}
.cat:nth-child(9){--bg:#e8ecf2;--glow:#8fa3c0}
.cat .kn{position:absolute;left:6%;top:5%;font-size:calc(var(--bs)/26);font-weight:800;line-height:1;color:#8a5d46;opacity:.75;pointer-events:none}
#board.n9 .cat .kn{font-size:calc(var(--bs)/32)}
body.hc .cat .kn{color:#fff;opacity:1}
body.hc .cat.lit .kn{color:#000}
/* compact fit (scroll stays available inside .app even if the iframe disables page scroll) */
html,body{height:100%;overflow:hidden}

.bar .tog{padding:4px 10px;font-size:.85rem;flex:0 1 auto;line-height:1.15}
header{flex-wrap:wrap;row-gap:4px}
h1{font-size:1.1rem}
.pcard{padding:2px 8px;border-width:2px}
.pcard .val{font-size:1.25rem}
.pcard .name{font-size:.72rem}
#msg{min-height:2.6em;padding:4px 8px;font-size:.9rem;line-height:1.3}
#bonus{min-height:1.2em;font-size:.82rem}
#tN{white-space:nowrap}
.info{gap:4px}
@media (max-height:700px),(max-width:420px){
  .top{display:flex;gap:6px}.pcard{flex:1;display:flex;align-items:center;justify-content:center;gap:8px}
  .pcard .val{font-size:1.1rem}
}
@media (orientation:landscape) and (max-height:700px){
  .app{column-gap:10px}
  .info .stats{font-size:.78rem}
}
@media (prefers-reduced-motion:reduce){.cat,.cat.bad,.cat.meow svg,.cat.meow .art{transition:none;animation:none}}
</style>

var ctx=null, master=null;
/* ===== SalpAudio: 音声アンロック共通ヘルパー(各単一HTMLにインラインコピーして使う) =====
   使い方:
     var ctx=null, master=null;
     SalpAudio.init({onCreate:function(c,m){ctx=c;master=m;applyVol()}});
     var unlockAudio=SalpAudio.unlock;          // 「開始」クリック等の中で呼ぶ
     sfx[k]=SalpAudio.gate(sfx[k]);             // 発音関数は gate() で包む(resume完了後に鳴らす)
   要件: 最初の touchstart/pointerdown/mousedown/click/keydown 内で AudioContext 生成+resume+無音1回再生。
         running になるまでリスナーを外さない。visibilitychange/pageshow/focus/statechange で再アーム。
         'interrupted'(iOS) も running 以外として扱う。navigator.audioSession.type='playback' (対応環境)。 */
var SalpAudio=(function(){
  var ctx=null,master=null,cfg={},armed=false,silentEl=null,silentOk=false;
  var EVS=['touchstart','touchend','pointerdown','mousedown','click','keydown'];
  function AC(){return window.AudioContext||window.webkitAudioContext}
  function session(){try{if(navigator.audioSession&&navigator.audioSession.type!=='playback')navigator.audioSession.type='playback'}catch(e){}}
  function silentWav(){
    var n=800,b=new Uint8Array(44+n),dv=new DataView(b.buffer);
    function s(o,t){for(var i=0;i<t.length;i++)b[o+i]=t.charCodeAt(i)}
    s(0,'RIFF');dv.setUint32(4,36+n,true);s(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
    dv.setUint32(24,8000,true);dv.setUint32(28,8000,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);s(36,'data');dv.setUint32(40,n,true);
    for(var i=0;i<n;i++)b[44+i]=128;
    var str='';for(i=0;i<b.length;i++)str+=String.fromCharCode(b[i]);
    return 'data:audio/wav;base64,'+btoa(str);
  }
  function silentAudio(){ /* iOSのミュートスイッチ回避の補助: 無音の<audio>を1回再生 */
    try{
      if(silentOk)return;
      if(!silentEl){silentEl=new Audio();silentEl.src=silentWav();silentEl.setAttribute('playsinline','');silentEl.preload='auto'}
      var p=silentEl.play();
      if(p&&p.then)p.then(function(){silentOk=true}).catch(function(){silentOk=false});else silentOk=true;
    }catch(e){}
  }
  function silentBuffer(){try{var b=ctx.createBuffer(1,1,22050),s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);s.start(0)}catch(e){}}
  function create(){
    var C=AC();if(!C)return false;
    ctx=new C();master=ctx.createGain();master.connect(ctx.destination);
    try{ctx.onstatechange=function(){if(ctx.state==='running')disarm();else arm()}}catch(e){}
    if(cfg.onCreate)cfg.onCreate(ctx,master);
    return true;
  }
  function resume(){
    if(!ctx)return Promise.resolve(false);
    if(ctx.state==='running')return Promise.resolve(true);
    var p;try{p=ctx.resume()}catch(e){return Promise.resolve(false)}
    return Promise.resolve(p).then(function(){return ctx.state==='running'},function(){return false});
  }
  function unlock(){ /* ユーザー操作の同期区間内で呼ぶ */
    try{
      session();
      if(!ctx||ctx.state==='closed'){if(!create())return}
      if(ctx.state!=='running'){silentBuffer();silentAudio()}
      resume().then(function(ok){if(ok)disarm();else arm()});
    }catch(e){arm()}
  }
  function onEv(){unlock()}
  function arm(){if(armed)return;armed=true;EVS.forEach(function(t){document.addEventListener(t,onEv,{capture:true,passive:true})})}
  function disarm(){if(!armed)return;if(ctx&&ctx.state!=='running')return;armed=false;EVS.forEach(function(t){document.removeEventListener(t,onEv,{capture:true})})}
  function recheck(){ /* 復帰時: 動いていなければ再resumeを試み、次の操作でも再試行できるようアーム */
    if(ctx&&ctx.state!=='running'){resume().then(function(ok){if(!ok)arm()});arm()}
  }
  /* 発音関数を包む: running なら即実行、そうでなければ resume 完了を待ってから実行(失敗時は鳴らさず次回再試行) */
  function gate(fn){

})();

var BASE=[480,560,660,780,520,610,720,840,920]; /* 猫ごとの基本の高さ(Hz) */

/* ニャー風: のこぎり波の高さを上げて下げる + 2つの帯域フィルタ(母音「ア」っぽい響き) */
function meow(i,dur){
  if(!ready())return;
  var t=ctx.currentTime+0.005,f=BASE[i];dur=Math.min(0.5,Math.max(0.2,dur||0.35));
  var o=ctx.createOscillator();o.type='sawtooth';
  o.frequency.setValueAtTime(f*0.8,t);
  o.frequency.linearRampToValueAtTime(f*1.3,t+dur*0.3);
  o.frequency.linearRampToValueAtTime(f*0.85,t+dur);
  var lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=7;lg.gain.value=f*0.015;lfo.connect(lg);lg.connect(o.frequency);
  var f1=ctx.createBiquadFilter();f1.type='bandpass';f1.Q.value=4;
  f1.frequency.setValueAtTime(500,t);f1.frequency.linearRampToValueAtTime(1100,t+dur*0.35);f1.frequency.linearRampToValueAtTime(700,t+dur);
  var f2=ctx.createBiquadFilter();f2.type='bandpass';f2.Q.value=6;
  f2.frequency.setValueAtTime(1800,t);f2.frequency.linearRampToValueAtTime(2600,t+dur*0.35);f2.frequency.linearRampToValueAtTime(2000,t+dur);
  var g1=ctx.createGain(),g2=ctx.createGain(),eg=ctx.createGain();
  g1.gain.value=1.4;g2.gain.value=0.7;
  eg.gain.setValueAtTime(0.0001,t);eg.gain.linearRampToValueAtTime(0.5,t+0.04);
  eg.gain.setValueAtTime(0.5,t+dur*0.6);eg.gain.linearRampToValueAtTime(0.0001,t+dur);
  o.connect(f1);o.connect(f2);f1.connect(g1);f2.connect(g2);g1.connect(eg);g2.connect(eg);eg.connect(master);
  o.start(t);lfo.start(t);o.stop(t+dur+0.03);lfo.stop(t+dur+0.03);
}
function blip(freq,t0,dur,type,vol,slideTo){
  if(!ready())return;
  var o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'triangle';
  o.frequency.setValueAtTime(freq,t0);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);

  function fit(){
    var H=app.clientHeight,W=app.clientWidth,bs;
    if(mq.matches){bs=Math.min(H-4,W-Math.max(250,W*0.42),600)}
    else{var top=board.offsetTop;bs=Math.min(W-4,H-top-6,560)}
    app.style.setProperty('--bs',Math.max(150,Math.floor(bs))+'px');
  }
  window.SalpFit=fit;
  window.addEventListener('resize',fit);window.addEventListener('orientationchange',function(){setTimeout(fit,200)});
  if(window.visualViewport)visualViewport.addEventListener('resize',fit);
  ['tLang','tLg','tN'].forEach(function(id){$(id).addEventListener('click',function(){setTimeout(fit,0)})});
  new MutationObserver(function(){fit()}).observe($('msg'),{childList:true,characterData:true,subtree:true});
  fit();setTimeout(fit,300);
})();
})();
</script>
<!-- SalpBGM v1 begin -->
<script>
/* ===== SalpBGM v1: BGMプレーヤー共通ヘルパー(各単一HTMLにインラインコピーして使う) =====
   使い方: SalpBGM.init({id:'memory9', after:'tSound'});
     - 曲: <id>/bgm/<id>_1.mp3, <id>_2.mp3 (このHTMLからの相対 'bgm/...')。曲が終わると次の曲へ、交互にループ。
     - 音量 0.35(効果音より控えめ)。iOS など audio.volume が効かない環境では専用 AudioContext+GainNode で絞る。
     - 自動再生しない: 最初のユーザー操作(click/touchend/pointerup/keydown)の中でだけ play()。
     - 🎵ボタンを #after の直後に追加(class="tog")。ON/OFF は localStorage 'salpToolsBgm_v1' (全ゲーム共通, 初期値ON)。
     - タブ非表示で一時停止→復帰で再開。曲が無い/読めない時は静かに無効化(ボタンも隠す)。例外は外へ出さない。
     - SalpAudio(効果音)とは別系統の <audio> 要素なので unlock と競合しない。 */
var SalpBGM=(function(){
  var KEY='salpToolsBgm_v1',VOL=0.35,EVS=['click','touchend','pointerup','keydown'];
  var L={ja:['BGM','BGM(音楽)'],vi:['Nhạc','Nhạc nền'],en:['Music','Background music'],tl:['Musika','Musika sa background']};
  var el=null,btn=null,tracks=[],bad={},idx=0,on=true,gest=false,armed=false,dead=false,want=false,hiddenPause=false,ac=null,gain=null,routed=false;
  function q(f){try{return f()}catch(e){}}
  function lang(){var l=(document.documentElement.lang||'ja').slice(0,2).toLowerCase();return L[l]?l:'ja'}
  function label(){
    if(!btn)return;var t=L[lang()];
    btn.textContent='🎵 '+t[0]+(on?' ON':' OFF');
    btn.setAttribute('aria-pressed',String(on));btn.setAttribute('aria-label',t[1]+(on?' ON':' OFF'));btn.title=t[1];
  }
  function volFixed(){var a=q(function(){var x=new Audio();x.volume=0.5;return x.volume});return a!==0.5}
  function route(){ /* iOS: volume が無視されるので Web Audio のゲインで絞る(ユーザー操作内で呼ぶ) */
    if(routed||!volFixed())return;routed=true;
    q(function(){
      var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
      ac=new C();gain=ac.createGain();gain.gain.value=VOL;gain.connect(ac.destination);
      ac.createMediaElementSource(el).connect(gain);
    });
  }
  function acResume(){if(ac&&ac.state!=='running')q(function(){var p=ac.resume();if(p&&p.catch)p.catch(function(){})})}
  function alive(){for(var i=0;i<tracks.length;i++)if(!bad[i])return true;return false}
  function kill(){dead=true;want=false;disarm();if(el)q(function(){el.pause();el.removeAttribute('src');el.load()});if(btn)btn.hidden=true}
  function load(i){idx=i;q(function(){el.src=tracks[i]})}
  function next(){
    for(var k=1;k<=tracks.length;k++){var j=(idx+k)%tracks.length;if(!bad[j]){load(j);return true}}
    return false;
  }
  function play(){
    if(dead||!on||!gest||document.hidden)return;
    want=true;acResume();
    var p=q(function(){return el.play()});
    if(p&&p.then)p.then(function(){disarm()},function(e){if(e&&e.name==='NotAllowedError')arm()});
  }
  function pause(){want=false;if(el)q(function(){el.pause()})}
  function onGesture(e){
    if(btn&&e&&e.target&&btn.contains&&btn.contains(e.target))return; /* 🎵ボタン自身はボタン側で処理 */
    if(e&&e.type==='keydown'&&(e.key==='Tab'||e.key==='Shift'||e.key==='Escape'))return;
    gest=true;
    if(!routed&&on)route();
    acResume();
    if(on&&el&&el.paused)play();else if(!on||!el||!el.paused)disarm();
  }
  function arm(){if(armed||dead)return;armed=true;EVS.forEach(function(t){document.addEventListener(t,onGesture,true)})}
  function disarm(){if(!armed)return;armed=false;EVS.forEach(function(t){document.removeEventListener(t,onGesture,true)})}
  function toggle(){
    on=!on;q(function(){localStorage.setItem(KEY,on?'1':'0')});label();
    if(on){gest=true;route();play()}else{pause();disarm()}
  }
  function init(o){
    q(function(){
      o=o||{};var id=o.id;if(!id||el)return;
      on=q(function(){return localStorage.getItem(KEY)})!=='0';
      tracks=[1,2].map(function(n){return 'bgm/'+id+'_'+n+'.mp3'});
      el=new Audio();el.preload='none';el.loop=false;el.setAttribute('playsinline','');el.setAttribute('webkit-playsinline','');
      q(function(){el.volume=VOL});
      el.addEventListener('ended',function(){if(next())play();});
      el.addEventListener('error',function(){
        if(!el.getAttribute('src'))return;
        bad[idx]=true;
        if(!alive()){kill();return}
        next();if(want)play();
      });
      el.addEventListener('pause',function(){ /* iOS の割り込み等で止まった: 次の操作で再開できるようにする */
        if(want&&on&&!document.hidden&&!el.ended)arm();
      });
      load(0);
      var ref=o.after&&document.getElementById(o.after);
      btn=document.createElement('button');btn.type='button';btn.className=o.className||'tog';btn.id='tBgm';
      btn.addEventListener('click',toggle);
      if(ref&&ref.parentNode)ref.parentNode.insertBefore(btn,ref.nextSibling);
      label();
      q(function(){new MutationObserver(label).observe(document.documentElement,{attributes:true,attributeFilter:['lang']})});
      document.addEventListener('visibilitychange',function(){
        if(document.hidden){if(el&&(want||!el.paused)){hiddenPause=true;q(function(){el.pause()})}}
        else if(hiddenPause){hiddenPause=false;if(on&&want)play()}
      });
      window.addEventListener('pagehide',function(){if(el&&(want||!el.paused)){hiddenPause=true;q(function(){el.pause()})}});
      window.addEventListener('pageshow',function(e){if(e&&e.persisted&&hiddenPause&&!document.hidden){hiddenPause=false;if(on&&want)play()}});
      arm();
      /* http(s) では曲の有無を軽く確認し、1曲も無ければボタンごと隠す(file:// では再生時に判定) */
      if(/^https?:$/.test(location.protocol)&&window.fetch){
        var left=tracks.length;
        tracks.forEach(function(u,i){
          fetch(u,{method:'HEAD',cache:'no-cache'}).then(function(r){if(!r.ok)bad[i]=true},function(){bad[i]=true}).then(function(){
            if(--left===0){if(!alive())kill();else if(bad[idx])next()}
          });
        });
      }
    });
  }
  return {init:init,toggle:toggle,get on(){return on},get playing(){return !!(el&&!el.paused)},get track(){return idx},get disabled(){return dead},get el(){return el}};
})();
SalpBGM.init({id:'catmemory',after:'tSound'});
</script>
<!-- SalpBGM v1 end -->
