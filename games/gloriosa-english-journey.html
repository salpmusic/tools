<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>グロリオサと三毛猫の英語ゲーム</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#302b2a;background:#fff9f1}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:16px 14px 42px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:clamp(23px,6vw,32px);line-height:1.3;margin:14px 0 5px}p{line-height:1.6}.scene{border-radius:22px;background:linear-gradient(130deg,#ffedcc,#f7d5bd);padding:18px;text-align:center;font-size:50px;margin:16px 0;box-shadow:0 4px 14px #6c3e1b20}.scene small{display:block;font-size:15px;color:#75462c}.card{background:white;border:2px solid #ead9c7;border-radius:20px;padding:20px 16px;box-shadow:0 5px 18px #6c3e1b15}.progress{font-weight:700;color:#825235}progress{width:100%;height:14px;accent-color:#dc783d}.english{font-size:clamp(23px,6vw,31px);font-weight:750;line-height:1.45;margin:22px 0}.choice{display:block;width:100%;text-align:left;background:#fff9f1;color:#302b2a;border:2px solid #d8b99b;border-radius:16px;padding:17px;margin:10px 0;font-size:18px;font-weight:650;min-height:66px}.choice:disabled{opacity:1}.choice.correct{background:#d9f7dd;border-color:#238c50}.choice.wrong{background:#ffe2df;border-color:#ca5347}button{cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #1671bf}.tools{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.tool,.next{background:#834e2b;color:white;border:0;border-radius:14px;padding:13px 16px;font-size:17px;min-height:50px}.next{width:100%;background:#236b49;margin-top:10px;font-weight:750}.feedback{min-height:58px;font-size:19px;font-weight:700;margin-top:12px}.translation{font-size:17px;color:#5d4639}body.easy{font-size:21px}body.easy .choice{font-size:24px;min-height:90px}body.easy .english{font-size:34px}body.easy .tool,body.easy .next{font-size:22px;min-height:64px}.hidden{display:none}a{color:#5e452d}footer{text-align:center;padding-top:18px;font-size:14px}</style></head><body><main><header><a href="../index.html">← salp Tools</a><button class="tool" id="easy">👁 見やすい</button></header><h1>🌺 グロリオサと三毛猫の英語ゲーム</h1><p>ふわふわ日記・10月19日の朝。英語を読んで、日本語の意味を選ぼう！</p><div class="scene" aria-label="三毛猫、グロリオサ、朝の紅茶">🌺 🐈 🍵<small>Fluffy Drifting — Morning English Journey</small></div><div class="card"><div id="quiz"><div class="progress" id="progressText"></div><progress id="bar" max="16" value="0"></progress><div class="english" id="english"></div><div class="tools"><button class="tool" id="speak">🔊 英語を読む</button></div><div id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="translation" id="translation"></div><button class="next hidden" id="next">次の問題 →</button></div><div id="result" class="hidden"><h2>🎉 おつかれさま！</h2><p id="scoreText"></p><button class="next" id="restart">もう一度遊ぶ</button></div></div><footer>salp • HTML / CSS / JavaScript • スマホ対応</footer></main><script>
const DATA=[["It's half past seven in the morning...","朝の7時半…","朝の7時半です"],["I open the window","窓を開ける","私は窓を開ける"],["And the cool autumn air slowly drifts into the room","涼しい秋の空気がゆっくり部屋に入ってくる","涼しい秋の風が部屋へ"],["The sky is bright today","今日の空は明るい","空は明るい"],["Blue above with only a few soft white clouds","青空に少しだけ柔らかい白い雲","真っ青な空に白い雲が少し"],["By the window gloriosa flowers are blooming","窓辺でグロリオサが咲いている","窓辺にグロリオサの花"],["Red and orange petals curl upward like little flames","赤とオレンジの花びらが小さな炎のように上へカール","赤とオレンジの花びらが炎のように"],["Sits the calico cat","三毛猫が座っている","三毛猫がいる"],["Her front paws together","前足をそろえて","前足をそろえて座る"],["On the table a warm cup of tea","テーブルの上には温かい紅茶","テーブルの上に温かい紅茶"],["A thin ribbon of steam slowly rises","細い湯気がゆっくり立ちのぼる","細い湯気が上がる"],["From the old radio comes a song I don't quite recognize","古いラジオから知らない曲が流れてくる","ラジオから知らない曲が"],["Today is October nineteenth Overseas Travel Day","今日は10月19日、海外旅行の日","今日は海外旅行の日"],["And suddenly I begin thinking about places I've never seen","ふと、見たことのない場所を想像し始める","行ったことのない場所を想う"],["Every little journey can begin with a little curiosity","小さな旅は小さな好奇心から始まる","小さな好奇心が旅の始まり"],["Every familiar window can open onto a wider world","見慣れた窓も、広い世界へ開いている","いつもの窓が広い世界に繋がる"]];
const $=id=>document.getElementById(id);let index=0,score=0,answered=false,order=[];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function updateEasy(){const yes=document.body.classList.contains("easy");$("easy").textContent=yes?"✓ 見やすい ON":"👁 見やすい";try{localStorage.setItem("salp.gloriosa.easy",yes?"1":"0")}catch(e){}}
$("easy").onclick=()=>{document.body.classList.toggle("easy");updateEasy()};
try{if(localStorage.getItem("salp.gloriosa.easy")==="1")document.body.classList.add("easy")}catch(e){}updateEasy();
function speak(){if(!("speechSynthesis" in window))return alert("このブラウザーは読み上げに対応していません");speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(DATA[order[index]][0]);u.lang="en-US";u.rate=.82;speechSynthesis.speak(u)}
$("speak").onclick=speak;
function draw(){answered=false;$("next").classList.add("hidden");$("feedback").textContent="";$("translation").textContent="";const item=DATA[order[index]];$("progressText").textContent=(index+1)+" / "+DATA.length+" 問　正解 "+score+" 問";$("bar").value=index;$("english").textContent=item[0];const distractors=shuffle(DATA.map((x,i)=>({text:x[1],i})).filter(x=>x.i!==order[index])).slice(0,2).map(x=>x.text);const opts=shuffle([item[1],...distractors]);$("choices").replaceChildren();for(const label of opts){const b=document.createElement("button");b.className="choice";b.textContent=label;b.onclick=()=>answer(b,label===item[1],item);$("choices").append(b)}}
function answer(button,correct,item){if(answered)return;answered=true;if(correct)score++;for(const b of $("choices").children){b.disabled=true;if(b.textContent===item[1])b.classList.add("correct");else if(b===button)b.classList.add("wrong")}$("feedback").textContent=correct?"⭕ 正解！ +1点":"もう少し！ 正解を緑色で表示したよ";$("translation").textContent="意味："+item[1]+"　／　"+item[2];$("next").textContent=index===DATA.length-1?"結果を見る →":"次の問題 →";$("next").classList.remove("hidden")}
$("next").onclick=()=>{index++;if(index<DATA.length){draw();return}$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("scoreText").textContent=DATA.length+"問中 "+score+"問正解！　正答率 "+Math.round(score/DATA.length*100)+"％";};
$("restart").onclick=start;
function start(){index=0;score=0;order=shuffle(DATA.map((_,i)=>i));$("quiz").classList.remove("hidden");$("result").classList.add("hidden");draw()}
start();
</script></body></html>
