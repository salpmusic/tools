<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f5eb"><title>ダックスちゃんとお庭さんぽ</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f5eb;color:#283a2d;font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif}main{max-width:640px;margin:auto;padding:22px 18px max(24px,env(safe-area-inset-bottom))}header{text-align:center}header small{letter-spacing:.12em;color:#53654b;font-weight:700}h1{font-size:clamp(23px,5.8vw,32px);margin:8px 0 14px;letter-spacing:.01em}.request{background:white;border:2px solid #b5c7a4;border-radius:24px;padding:12px;text-align:center;min-height:110px;box-shadow:0 5px 0 #e3e8d8}.request p{margin:0;font-size:23px;font-weight:750;line-height:1.55}.request span{display:block;font-size:18px;color:#506449;margin-top:3px}.garden{height:280px;position:relative;overflow:hidden;border-radius:28px;margin:15px 0;background:linear-gradient(#dfedf4 0%,#eef5ef 45%,#bfce9c 46%,#d5deb9 100%);border:2px solid #b4c396}.sun{position:absolute;top:20px;right:30px;width:48px;height:48px;border-radius:50%;background:#f5d37b;box-shadow:0 0 0 10px #f5d37b30}.hill{position:absolute;top:70px;left:-10%;width:120%;height:120px;background:#9db289;border-radius:50% 50% 0 0}.fence{position:absolute;top:110px;left:0;right:0;height:35px;background:repeating-linear-gradient(90deg,transparent 0 24px,#f5efdc 24px 36px,transparent 36px 60px);border-bottom:7px solid #f5efdc;border-top:6px solid #f5efdc}.flowers{position:absolute;bottom:16px;left:15px;right:15px;display:flex;justify-content:space-between;font-size:28px}.dog{position:absolute;width:270px;height:175px;left:50%;bottom:25px;transform:translateX(-50%);border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.dog svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 7px 2px #67724c33)}.tail{transform-box:fill-box;transform-origin:90% 70%;animation:wag 1s ease-in-out infinite}.dog.fetch{animation:fetch 1.45s ease-in-out}.dog.happy svg{animation:bounce .38s ease-in-out 3}.heartpop{position:absolute;top:22px;left:48%;font-size:40px;opacity:0;pointer-events:none}.heartpop.show{animation:love 1.4s ease-out}.carried{position:absolute;left:60px;top:85px;font-size:34px;display:none;pointer-events:none}.fetch .carried{display:block}.hint{text-align:center;font-size:18px;margin:8px 0;color:#506449}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.toy{background:white;border:3px solid #829768;border-radius:23px;padding:12px 2px;min-height:116px;color:#283a2d;font:750 21px system-ui;box-shadow:0 5px 0 #d8ddc9;touch-action:manipulation;cursor:pointer}.toy b{display:block;font-size:46px;font-weight:400;margin-bottom:5px}.toy:active{transform:translateY(3px);box-shadow:0 2px 0 #d8ddc9}button:focus-visible{outline:4px solid #a45b26;outline-offset:4px}.toy:disabled{opacity:.7;cursor:default}.progress{text-align:center;font-size:25px;letter-spacing:.14em;margin:19px 0 0;min-height:38px}.reward{display:none;background:#fff9df;border:2px solid #d3ac55;border-radius:24px;text-align:center;padding:18px;margin-top:14px}.reward p{font-size:23px;font-weight:700;margin:0 0 12px}.again{border:0;border-radius:18px;background:#48633c;color:white;font:700 23px system-ui;padding:16px 25px;cursor:pointer;min-height:60px}.footer{text-align:center;font-size:16px;color:#66745d;margin:18px 0 0}@keyframes wag{50%{transform:rotate(-24deg)}}@keyframes fetch{0%,100%{transform:translateX(-50%)}45%{transform:translateX(1%) rotate(-3deg)}70%{transform:translateX(-15%) rotate(2deg)}}@keyframes bounce{50%{transform:translateY(-9px)}}@keyframes love{20%{opacity:1}100%{opacity:0;transform:translateY(-65px)}}@media(max-height:740px){main{padding-top:12px}.garden{height:230px;margin:12px 0}.request{min-height:98px}h1{margin-bottom:10px}.toy{min-height:105px}.progress{margin-top:13px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.heartpop.show{opacity:1}}

.levelbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:20px;font-weight:750}.levelbar span:last-child{font-size:17px}.tools{display:flex;gap:10px;margin-top:12px}.tools button{flex:1;padding:13px 5px;border:2px solid #829768;background:#fff;border-radius:16px;color:#283a2d;font:700 19px system-ui;min-height:56px;touch-action:manipulation;cursor:pointer}.request p{font-size:23px}.request{min-height:128px}.garden{height:235px}.choices{gap:10px}.toy{font-size:19px;min-height:98px;padding:8px 2px}.toy b{font-size:40px}.toy small{display:block;font-size:15px;color:#53654b}.start{display:block;margin:14px auto;width:100%}.progress{font-size:22px;letter-spacing:.05em}.footer{line-height:1.6}.clock{font-size:21px;text-align:center;font-weight:750;min-height:32px;margin:10px 0 0;font-variant-numeric:tabular-nums}.clock.urgent{color:#a23f16}.heard{font-size:18px;text-align:center;min-height:28px;margin:10px 0;color:#43553e}@media(max-height:740px){.garden{height:190px}.dog{bottom:10px}.request{min-height:115px}.hint{margin:5px 0}main{padding-top:10px}}
</style></head><body><main><header><small>salp のやさしいゲーム</small><h1>ダックスちゃんとお庭さんぽ</h1></header><div class="levelbar"><span id="level">レベル 1 / 50</span><span id="steps">あと3問でレベルアップ</span></div><section class="request" aria-live="polite" aria-atomic="true"><p id="message">ボールを とってきてね</p><span id="sub">下のおもちゃを タップしてね</span></section><div class="garden"><div class="sun"></div><div class="hill"></div><div class="fence"></div><div class="flowers" aria-hidden="true"><span>🌼</span><span>🌷</span><span>🌼</span><span>🌷</span></div><button class="dog" id="dog" aria-label="ダックスちゃんをなでる"><svg viewBox="0 0 320 190" role="img" aria-label="黒と茶色の長い毛、垂れ耳のミニチュアダックス"><defs><linearGradient id="coat" x2="0" y2="1"><stop stop-color="#34343b"/><stop offset="1" stop-color="#16191f"/></linearGradient><linearGradient id="ear" x2="1" y2="1"><stop stop-color="#22232a"/><stop offset=".65" stop-color="#323038"/><stop offset="1" stop-color="#8c542c"/></linearGradient></defs><ellipse cx="170" cy="166" rx="112" ry="9" fill="#798854" opacity=".25"/><path class="tail" d="M250 96 Q286 78 292 52 Q306 80 286 107 L266 117 Q290 112 293 93 Q279 110 260 119" fill="url(#coat)"/><path d="M103 78 C151 63 211 71 252 83 Q278 101 264 126 Q246 144 196 137 L103 133 Q76 125 79 105Z" fill="url(#coat)"/><path d="M103 126 Q173 149 242 129 L228 140 231 150 210 141 193 151 181 143 160 151 151 143 128 149 126 140Z" fill="#2e2c30"/><path d="M102 126 L103 155 Q95 170 120 168 Q132 167 126 157 L130 130 M225 127 L226 154 Q217 170 243 168 Q254 166 248 156 L252 122" fill="#b2753d"/><path d="M113 122 L113 147 129 149 131 123 M232 117 L232 145 248 148 254 119" fill="#23242b"/><path d="M91 76 Q60 63 50 84 L47 102 Q21 103 22 116 Q23 131 57 132 L84 131 Q109 122 108 100Z" fill="url(#coat)"/><path d="M50 107 Q33 102 24 113 Q20 128 57 130 L67 117Z" fill="#ba7d43"/><ellipse cx="26" cy="113" rx="9" ry="7" fill="#131519"/><path d="M83 76 Q116 71 116 95 L113 134 106 148 100 138 93 150 87 139 80 142 Q75 116 74 93Z" fill="url(#ear)"/><path d="M85 94 Q83 116 90 132 M94 89 Q94 115 100 138 M103 90 Q107 110 105 130" fill="none" stroke="#625044" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="61" cy="93" rx="7" ry="4" fill="#bb8049" transform="rotate(-12 61 93)"/><ellipse cx="59" cy="102" rx="4.8" ry="5.5" fill="#090b10"/><circle cx="60" cy="100" r="1.8" fill="#fff"/><path d="M35 124 Q45 127 52 122" fill="none" stroke="#694224" stroke-width="2.5" stroke-linecap="round"/><path d="M56 130 Q70 137 78 121 L80 137 73 144 66 138 61 143Z" fill="#b2753d"/><path d="M126 83 Q177 73 226 85" stroke="#56535b" stroke-width="4" fill="none" opacity=".5" stroke-linecap="round"/></svg><span class="carried" id="carried"></span></button><span class="heartpop" id="heart" aria-hidden="true">💕</span></div><p class="hint">ダックスちゃんも なでられるよ</p><button class="again start" id="start">▶ タップして あそぶ</button><div class="choices" id="choices" style="display:none"></div><div class="tools" id="tools" style="display:none"><button id="repeat">🔊 もう一度きく</button><button id="help">💡 ヒント</button></div><p class="clock" id="clock" role="timer" aria-label="制限時間"></p><p class="heard" id="heard"></p><div class="progress" id="progress"></div><section class="reward" id="reward"><p>レベル50 クリア！<br>ダックスちゃんと大のなかよし 💕</p><button class="again" id="again">レベル50で あそぶ</button></section><p class="footer">レベル1〜5は時間制限なし。<br>時間切れでも同じレベルで再挑戦。<br>続きは自動で保存されます。</p></main><script>
'use strict';
const toys=[{jp:'ボール',en:'ball',icon:'⚽'},{jp:'くまさん',en:'teddy bear',icon:'🧸'},{jp:'ほね',en:'bone',icon:'🦴'},{jp:'あひる',en:'duck',icon:'🦆'},{jp:'りんご',en:'apple',icon:'🍎'},{jp:'お花',en:'flower',icon:'🌼'}];
const $=id=>document.getElementById(id),key='salp.dachs.garden.english.v2';let level=1,wins=0,sequence=[],cursor=0,busy=false,started=false,complete=false,utterance=null,roundId=0,concealTimer=null,audioContext,remaining=null,lastTick=Date.now(),voiceBusyUntil=0;
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&Number.isInteger(saved.level)){level=Math.max(1,Math.min(50,saved.level));wins=Math.max(0,Math.min(2,Number(saved.wins)||0));complete=saved.complete===true&&level===50}}catch{}
function save(){try{localStorage.setItem(key,JSON.stringify({level,wins,complete}))}catch{}}
function config(l=level){return{length:l<=10?1:l<=20?2:l<=30?3:l<=40?4:5,pool:l<=5?3:l<=20?4:l<=30?5:6,rate:.72+(l-1)*.0045,hide:l>=31,seconds:l<=5?null:Math.ceil((l<=10?1:l<=20?2:l<=30?3:l<=40?4:5)*(18-l*.24))}}
function levelUI(){ $('level').textContent=`レベル ${level} / 50`;$('steps').textContent=complete?'全レベル クリア！':`あと${3-wins}問で${level===50?'クリア':'レベルアップ'}`}
function names(japanese=false){return sequence.map(i=>japanese?toys[i].jp:toys[i].en)}
function instruction(){const ns=names();if(level<=5)return`Please bring me the ${ns[0]}.`;if(level<=10)return level%2?`Can you find the ${ns[0]}?`:`Let's get the ${ns[0]}.`;return 'First, the '+ns.map((n,i)=>i===0?n:i===ns.length-1?'finally, the '+n:'then, the '+n).join(', ')+'.'}
function showInstruction(hint=false){$('message').textContent=instruction();$('sub').textContent=hint||level<=10?names(true).join(' → ')+(sequence.length===1?'を選んでね':' の順に選んでね'):'英語の順番どおりに タップしてね'}
function cancelSpeech(){clearTimeout(concealTimer);try{window.speechSynthesis?.cancel()}catch{}utterance=null;voiceBusyUntil=0}
function speak(text,isInstruction=false){cancelSpeech();if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){$('sub').textContent='この端末では声を使えません。英語とヒントで遊べます';return}try{utterance=new window.SpeechSynthesisUtterance(text);utterance.lang='en-US';utterance.rate=config().rate;utterance.volume=1;const voices=window.speechSynthesis.getVoices();utterance.voice=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'))||null;const id=roundId;utterance.onend=()=>{if(isInstruction&&config().hide&&cursor===0&&!busy&&id===roundId){concealTimer=setTimeout(()=>{if(cursor===0&&!busy&&id===roundId){$('message').textContent='順番を 覚えているかな？';$('sub').textContent='何度でも「もう一度きく」を押せるよ'}},3000)}};utterance.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')$('sub').textContent='声が出ないときは「もう一度きく」を押してね'};voiceBusyUntil=Date.now()+Math.min(16000,2500+text.length*65);utterance.onstart=()=>{voiceBusyUntil=Date.now()+30000};const ended=utterance.onend;utterance.onend=()=>{voiceBusyUntil=0;lastTick=Date.now();ended?.()};window.speechSynthesis.speak(utterance)}catch{$('sub').textContent='声が出ないときも ヒントで遊べます'}}
function happy(){const d=$('dog'),h=$('heart');d.classList.remove('happy');h.classList.remove('show');void h.offsetWidth;d.classList.add('happy');h.classList.add('show');setTimeout(()=>{d.classList.remove('happy');h.classList.remove('show')},1450)}
function chime(){try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();audioContext.resume().then(()=>{[523,659,784].forEach((freq,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain(),t=audioContext.currentTime+i*.1;o.frequency.value=freq;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.035,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.24);o.connect(g);g.connect(audioContext.destination);o.start(t);o.stop(t+.26)})}).catch(()=>{})}catch{}}
function drawChoices(){let order=Array.from({length:config().pool},(_,i)=>i);if(level>=21){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}$('choices').replaceChildren();order.forEach(i=>{const b=document.createElement('button');b.className='toy';b.dataset.toy=String(i);b.innerHTML=`<b aria-hidden="true">${toys[i].icon}</b>${toys[i].en}<small>${toys[i].jp}</small>`;b.addEventListener('click',()=>pick(i));$('choices').append(b)})}
function lock(value){document.querySelectorAll('.toy').forEach(b=>b.disabled=value)}
function progress(){ $('progress').textContent=sequence.map((_,i)=>i<cursor?'♥':'♡').join(' ');$('progress').setAttribute('aria-label',`${sequence.length}個中${cursor}個 選びました`);$('heard').textContent=cursor?`選んだもの：${sequence.slice(0,cursor).map(i=>toys[i].jp).join(' → ')}`:''}
function newRound(){roundId++;cursor=0;busy=false;const c=config();sequence=[];for(let i=0;i<c.length;i++){let n=Math.floor(Math.random()*c.pool);if(i&&n===sequence[i-1])n=(n+1)%c.pool;sequence.push(n)}remaining=c.seconds;lastTick=Date.now();clockUI();drawChoices();progress();levelUI();showInstruction();speak(instruction(),true)}
function pick(i){if(!started||busy||complete)return;if(i!==sequence[cursor]){$('sub').textContent='大丈夫！ もう一度聞いてみよう';showInstruction(true);$('sub').textContent=names(true).join(' → ')+' の順だよ';speak(instruction(),true);return}cancelSpeech();busy=true;lock(true);$('carried').textContent=toys[i].icon;$('dog').classList.add('fetch');cursor++;progress();const id=roundId;setTimeout(()=>{if(id!==roundId)return;$('dog').classList.remove('fetch');if(cursor<sequence.length){busy=false;lock(false);$('sub').textContent='いいね！ 次のおもちゃは？';return}chime();happy();wins++;if(wins>=3){wins=0;if(level<50){level++;$('message').textContent=`レベル ${level} にアップ！`;$('sub').textContent='すごいね！ 次も一緒にあそぼう';speak('Great job! Level up!')}else{complete=true;$('message').textContent='レベル50 クリア！';$('sub').textContent='いっぱい遊んでくれて ありがとう';$('choices').style.display='none';$('tools').style.display='none';$('reward').style.display='block';busy=false;speak('Wonderful! You are my best friend!')}}else{$('message').textContent='Great job!';$('sub').textContent='上手にできたね！';speak('Great job! Thank you!')}save();levelUI();if(!complete)setTimeout(()=>{if(id===roundId)newRound()},2100)},1500)}
function clockUI(){ $('clock').textContent=remaining===null?'時間制限なし':`あと ${Math.max(0,Math.ceil(remaining))} 秒`;$('clock').classList.toggle('urgent',remaining!==null&&remaining<=5)}
function timeOut(){roundId++;const id=roundId;cancelSpeech();busy=true;lock(true);$('message').textContent='もう一度 やってみよう！';$('sub').textContent='レベルはそのまま。あわてなくて大丈夫';$('clock').textContent='時間になりました';setTimeout(()=>{if(id===roundId)newRound()},2500)}
setInterval(()=>{const now=Date.now(),delta=Math.min(1,(now-lastTick)/1000);lastTick=now;if(!started||busy||complete||remaining===null||document.hidden||now<voiceBusyUntil||window.speechSynthesis?.speaking)return;remaining=Math.max(0,remaining-delta);clockUI();if(remaining<=0)timeOut()},200);
$('start').addEventListener('click',()=>{started=true;complete=false;save();$('start').style.display='none';$('choices').style.display='grid';$('tools').style.display='flex';newRound()});
$('repeat').addEventListener('click',()=>{if(busy)return;showInstruction();speak(instruction(),true)});$('help').addEventListener('click',()=>{if(busy)return;showInstruction(true)});
$('dog').addEventListener('click',()=>{if(busy)return;happy();if(started)speak('I love you!');$('sub').textContent='うれしいな！ しっぽ ふりふり 💕'});
$('again').addEventListener('click',()=>{complete=false;wins=0;save();$('reward').style.display='none';$('choices').style.display='grid';$('tools').style.display='flex';newRound()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelSpeech()});levelUI();$('message').textContent='英語で おもちゃさがし';$('sub').textContent=level>1?`レベル${level}の続きから あそべるよ`:'タップすると 英語の声でお願いするよ';clockUI();$('progress').textContent='🐾 ゆっくり、いっしょに 🐾';
</script></body></html>
