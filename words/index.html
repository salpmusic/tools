<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#162018">
<title>SALP WORDS | 単語学習 部屋編</title>

<style>
:root{
  --bg:#101510;
  --panel:rgba(18,27,20,.94);
  --panel2:rgba(255,255,255,.95);
  --text:#fffdf6;
  --sub:#d5ddcf;
  --accent:#ffd86a;
  --accent2:#94d68b;
  --danger:#ff9c8d;
  --line:rgba(255,255,255,.18);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    "Noto Sans",
    sans-serif;
}

body{
  overscroll-behavior:none;
}

button,
select,
input,
a{
  font:inherit;
}

button{
  cursor:pointer;
}

:root{
  --sw:min(100vw,calc(100vh * 9 / 16));
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
}

@supports (height:100dvh){
  :root{
    --sw:min(100vw,calc(100dvh * 9 / 16));
  }
}

html,body{
  height:100%;
  overflow:hidden;
}

.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  margin:-1px;
  padding:0;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}

.app{
  position:relative;
  height:100vh;
  height:100dvh;
  overflow:hidden;
}

/* ---------- 上部コンパクトバー(絵に重ねる) ---------- */
header{
  position:fixed;
  z-index:2000;
  top:0;
  left:calc((100% - var(--sw)) / 2);
  width:var(--sw);
  padding:calc(var(--safe-top) + 6px) 8px 8px;
  border-radius:0 0 18px 18px;
  background:rgba(12,18,14,.62);
  pointer-events:none;
}

header a,
header button,
header select,
header input,
.sceneBand,
.menuPanel{
  pointer-events:auto;
}

.sceneToggle{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  min-width:0;
  min-height:48px;
  padding:0 12px;
  border:3px solid var(--accent);
  border-radius:14px;
  background:#12301c;
  color:#ffe278;
  font-weight:900;
  font-size:.95rem;
  text-align:left;
}

.sceneToggleText{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

header.scenesClosed .sceneBand{
  display:none;
}

header.scenesClosed .headerTop{
  padding-bottom:0;
}

header.scenesClosed{
  padding-bottom:6px;
}

header::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  border-radius:inherit;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.headerTop{
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 0 6px;
}

.backLink{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:none;
  min-width:48px;
  min-height:48px;
  padding:0 10px;
  color:white;
  text-decoration:none;
  border:1px solid rgba(255,255,255,.28);
  border-radius:14px;
  background:rgba(255,255,255,.12);
  font-weight:700;
}

.titleWrap{
  min-width:0;
  flex:1;
}

.title{
  margin:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:1rem;
  font-weight:900;
  letter-spacing:.02em;
}

.subtitle{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  margin-top:1px;
  color:var(--sub);
  font-size:.72rem;
  font-weight:700;
}

.sceneBand{
  padding:0;
}

.sceneLabel{
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
}

.sceneSwitcher{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  grid-auto-flow:row;
  gap:6px;
}

.sceneButton:last-child:nth-child(3n+1){
  grid-column:1 / -1;
}

.sceneButton{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  min-width:0;
  min-height:58px;
  border:3px solid #4d5f4f;
  border-radius:14px;
  padding:4px 4px;
  background:#fff;
  color:#17201a;
  font-size:.8rem;
  font-weight:800;
  line-height:1.15;
  text-align:center;
}

.sceneIcon{
  flex:none;
  font-size:1.5rem;
  line-height:1;
}

.sceneText{
  min-width:0;
  max-width:100%;
  overflow-wrap:anywhere;
}

.sceneCheck{
  display:none;
  position:absolute;
  top:1px;
  right:5px;
  font-size:.9rem;
  font-weight:900;
}

.sceneButton[aria-pressed="true"]{
  border-color:var(--accent);
  background:#12301c;
  color:#ffe278;
  font-weight:900;
  box-shadow:0 4px 10px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.25);
}

.sceneButton[aria-pressed="true"] .sceneCheck{
  display:inline;
}

@media (max-width:380px){
  .sceneButton{
    padding:4px 2px;
    font-size:.74rem;
  }
}

.sceneButton:focus-visible{
  outline:4px solid #0b57d0;
  outline-offset:2px;
}

.sceneButton[aria-pressed="true"]:focus-visible{
  outline-color:#fff;
}

@media (prefers-reduced-motion:no-preference){
  .sceneButton{
    transition:background-color .15s,color .15s,box-shadow .15s;
  }
}

select,
.modeButton,
.menuButton{
  min-height:48px;
  border:none;
  border-radius:14px;
  color:#182018;
  background:#fffdf6;
  padding:0 12px;
  font-weight:900;
}

.modeButton{
  flex:none;
  padding:0 10px;
  font-size:.86rem;
  white-space:nowrap;
}

.modeButton[aria-pressed="true"]{
  background:var(--accent);
}

.menuButton{
  flex:none;
  min-width:48px;
  padding:0;
  font-size:1.3rem;
  line-height:1;
}

.menuButton[aria-expanded="true"]{
  background:var(--accent);
}

/* ---------- 設定ドロワー(言語・音量・速度) ---------- */
.menuPanel{
  position:absolute;
  top:100%;
  left:0;
  right:0;
  margin-top:6px;
  max-height:calc(100vh - 140px);
  max-height:calc(100dvh - 140px);
  overflow-y:auto;
  padding:10px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(12,18,14,.94);
  box-shadow:0 10px 30px rgba(0,0,0,.45);
}

.menuPanel[hidden]{
  display:none;
}

.menuPanel select{
  width:100%;
}

.settingsRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}

.setting{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;
  padding:8px 10px;
}

.setting label{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  color:var(--sub);
  font-size:.78rem;
  font-weight:800;
  margin-bottom:5px;
}

.setting output{
  color:white;
  font-variant-numeric:tabular-nums;
}

input[type="range"]{
  width:100%;
  accent-color:var(--accent);
}

/* ---------- 絵のステージ(全画面) ---------- */
main{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#1d281f;
}

.stageBg{
  position:absolute;
  inset:-6%;
  width:112%;
  height:112%;
  object-fit:cover;
  filter:blur(22px) brightness(.55) saturate(1.1);
  pointer-events:none;
}

.sceneShell{
  position:relative;
  width:var(--sw);
}

.sceneInfo{
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
}

.scene{
  position:relative;
  isolation:isolate;
  width:100%;
  aspect-ratio:9 / 16;
  overflow:hidden;
  background:#263027;
  user-select:none;
  touch-action:manipulation;
}

.sceneImage{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  pointer-events:none;
}

.hotspot{
  position:absolute;
  border:0;
  padding:0;
  margin:0;
  background:transparent;
  border-radius:18px;
  touch-action:manipulation;
  cursor:pointer;
}

.hotspot::before{
  content:"";
  position:absolute;
  inset:2px;
  border:2px solid transparent;
  border-radius:inherit;
  transition:
    background .15s ease,
    border-color .15s ease,
    transform .15s ease;
}

.hotspot:active::before{
  transform:scale(.96);
  background:rgba(255,222,97,.25);
}

.hotspot:focus-visible::before{
  outline:4px solid #fff;
  outline-offset:2px;
  border-color:#ffd75e;
  background:rgba(255,215,94,.18);
}

.easy .hotspot::before{
  border-color:rgba(255,242,166,.62);
  background:rgba(255,224,99,.09);
  box-shadow:
    0 0 0 2px rgba(0,0,0,.14),
    inset 0 0 16px rgba(255,236,145,.10);
}

.hotspotTag{
  display:none;
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  white-space:nowrap;
  pointer-events:none;
  padding:4px 7px;
  border-radius:999px;
  background:rgba(10,15,11,.82);
  color:white;
  font-size:.67rem;
  font-weight:900;
  box-shadow:0 2px 8px rgba(0,0,0,.24);
}

.easy .hotspotTag{
  display:block;
}


/* ---------- 花屋など zoom:true 場面の拡大オーバーレイ ---------- */
.zoomOverlay{
  position:fixed;
  inset:0;
  z-index:3000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:10px;
  padding:max(12px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
  background:rgba(6,10,8,.86);
  color:#fff;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  touch-action:manipulation;
  cursor:pointer;
}
.zoomOverlay[hidden]{display:none !important}
.zoomHint{
  flex:0 0 auto;
  font-size:.78rem;
  font-weight:800;
  opacity:.85;
  text-align:center;
}
.zoomCrop{
  flex:0 1 auto;
  position:relative;
  width:min(92vw, 520px);
  max-height:min(52vh, 520px);
  margin:0 auto;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 10px 36px rgba(0,0,0,.45);
  background:#111;
  pointer-events:none;
}
.zoomCropInner{
  position:absolute;
  background-repeat:no-repeat;
  background-color:#222;
}
.zoomMeta{
  flex:0 1 auto;
  width:min(92vw, 520px);
  max-height:min(38vh, 360px);
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);
  border-radius:16px;
  padding:14px 16px 16px;
  pointer-events:auto;
  cursor:default;
}
.zoomEmoji{font-size:1.6rem;line-height:1}
.zoomWord{
  font-size:clamp(1.35rem, 5.5vw, 2rem);
  font-weight:900;
  line-height:1.2;
  margin:.2rem 0 .15rem;
  word-break:break-word;
}
.easy .zoomWord{font-size:clamp(1.7rem, 6.5vw, 2.4rem)}
.zoomReading{
  font-size:clamp(.95rem, 3.6vw, 1.15rem);
  font-weight:700;
  opacity:.9;
  margin-bottom:.55rem;
}
.easy .zoomReading{font-size:clamp(1.1rem, 4.2vw, 1.35rem)}
.zoomDesc{
  font-size:clamp(.92rem, 3.4vw, 1.05rem);
  font-weight:600;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}
.easy .zoomDesc{font-size:clamp(1.05rem, 4vw, 1.25rem); line-height:1.6}
.zoomSpeakDesc{
  margin-top:10px;
  border:0;
  border-radius:999px;
  padding:8px 14px;
  font-weight:900;
  font-size:.85rem;
  background:#ffe07a;
  color:#1a1a12;
  cursor:pointer;
  touch-action:manipulation;
}
@media (orientation:landscape) and (max-height:430px){
  .zoomOverlay{flex-direction:row; flex-wrap:wrap; align-items:stretch; justify-content:center; gap:12px}
  .zoomHint{width:100%}
  .zoomCrop{width:min(46vw, 420px); max-height:min(78vh, 360px)}
  .zoomMeta{width:min(46vw, 420px); max-height:min(78vh, 360px)}
}

/* ---------- 単語オーバーレイ(絵の下部・タップを邪魔しない) ---------- */
.wordPanel{
  position:fixed;
  z-index:1500;
  left:50%;
  bottom:calc(10px + var(--safe-bottom));
  transform:translateX(-50%);
  width:calc(var(--sw) - 16px);
  max-height:42vh;
  max-height:42dvh;
  border-radius:20px;
  padding:10px 12px;
  background:rgba(8,12,9,.66);
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 8px 28px rgba(0,0,0,.4);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.6);
  pointer-events:none;
}

.wordPanel button{
  pointer-events:auto;
}

.wordTop{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:8px;
}

.wordText{
  min-width:0;
}

.bigWord{
  font-size:clamp(1.9rem,calc(var(--sw) * .08),2.9rem);
  line-height:1.08;
  font-weight:900;
  overflow-wrap:anywhere;
  hyphens:auto;
}

.reading{
  min-height:1.25em;
  margin-top:3px;
  color:#ffe891;
  font-size:clamp(.95rem,calc(var(--sw) * .04),1.15rem);
  font-weight:800;
  overflow-wrap:anywhere;
}

.speakAgain{
  min-width:52px;
  min-height:52px;
  border:0;
  border-radius:16px;
  background:var(--accent);
  color:#1e210f;
  font-size:1.6rem;
  font-weight:900;
  text-shadow:none;
}

.voiceStatus{
  margin-top:5px;
  font-size:.7rem;
  line-height:1.3;
  color:var(--sub);
  min-height:1em;
  overflow-wrap:anywhere;
}

.panelToggle{
  position:absolute;
  right:12px;
  bottom:100%;
  margin-bottom:6px;
  min-height:36px;
  padding:0 14px;
  border:1px solid rgba(255,255,255,.3);
  border-radius:999px;
  background:rgba(8,12,9,.7);
  color:#fff;
  font-size:.85rem;
  font-weight:800;
  text-shadow:none;
}

/* 物をタッチして数秒たつと帯を薄くし、下端の物をタッチしやすくする */
@media (prefers-reduced-motion:no-preference){
  .wordPanel{
    transition:opacity .4s ease;
  }
}

.wordPanel.faded{
  opacity:.3;
}

.wordPanel.faded:focus-within{
  opacity:1;
}

.wordPanel.faded .speakAgain,
.wordPanel.faded .panelToggle{
  pointer-events:none;
}

.wordPanel.faded:focus-within .speakAgain,
.wordPanel.faded:focus-within .panelToggle{
  pointer-events:auto;
}

/* 未選択: 小さなヒントだけ */
.wordPanel.idle{
  width:auto;
  max-width:calc(var(--sw) - 16px);
  padding:7px 16px;
  border-radius:999px;
  text-align:center;
}

.wordPanel.idle .bigWord{
  font-size:1.05rem;
  line-height:1.2;
}

.wordPanel.idle .reading{
  min-height:0;
  margin-top:1px;
  font-size:.82rem;
}

.wordPanel.idle .speakAgain,
.wordPanel.idle .panelToggle{
  display:none;
}

.wordPanel.idle .wordTop{
  grid-template-columns:minmax(0,1fr);
}

.wordPanel.idle .voiceStatus:not(:has(.noSpeech)){
  display:none;
}

/* 畳んだ状態: ボタンだけ残す */
.wordPanel.collapsed{
  width:auto;
  padding:0;
  border:0;
  background:none;
  box-shadow:none;
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
}

.wordPanel.collapsed .wordBox{
  display:none;
}

.wordPanel.collapsed .panelToggle{
  position:static;
  margin:0;
  background:rgba(8,12,9,.78);
}

/* 見やすいモード */
.easy .bigWord{
  font-size:clamp(2.2rem,calc(var(--sw) * .1),3.6rem);
  font-weight:950;
}

.easy .reading{
  font-size:clamp(1.2rem,calc(var(--sw) * .05),1.5rem);
}

.easy .wordPanel{
  background:rgba(4,7,5,.9);
  border:3px solid #ffe278;
}

.easy .wordPanel.idle .bigWord{
  font-size:1.35rem;
}

.easy .wordPanel.idle .reading{
  font-size:1.05rem;
}

.easy .speakAgain{
  min-width:60px;
  min-height:60px;
}

.easy .wordPanel.collapsed{
  border:0;
  background:none;
}

.easy .voiceStatus{
  font-size:.82rem;
}

.easy .sceneToggle{
  min-height:56px;
  font-size:1.05rem;
}

.easy select,
.easy .modeButton,
.easy .menuButton,
.easy .backLink{
  min-height:56px;
  font-size:1.02rem;
}

.easy .menuButton,
.easy .backLink{
  min-width:56px;
}

.easy .sceneButton{
  min-height:66px;
  font-size:.95rem;
}

.easy .sceneIcon{
  font-size:1.7rem;
}

.help{
  margin-top:8px;
  padding:9px 12px;
  border-radius:14px;
  color:#e8eee5;
  background:rgba(255,255,255,.06);
  font-size:.79rem;
  line-height:1.5;
}

.noSpeech{
  color:var(--danger);
  font-weight:800;
}

@media (max-width:480px){
  .modeButton{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:0 7px;
    font-size:.72rem;
    line-height:1.15;
  }
}

/* ---------- スマホ横向き: 左に操作レール、右に単語パネル、中央に絵 ---------- */
@media (orientation:landscape) and (max-height:520px){
  header{
    top:0;
    bottom:0;
    left:0;
    width:min(200px,calc((100vw - 100vh * 9 / 16) / 2 - 6px));
    padding:calc(var(--safe-top) + 6px) 8px 6px calc(var(--safe-left) + 8px);
    border-radius:0 18px 18px 0;
    display:flex;
    flex-direction:column;
    gap:6px;
    pointer-events:auto;
  }

  .sceneToggle{
    display:none;
  }

  header.scenesClosed .sceneBand{
    display:block;
  }

  .headerTop{
    padding:0;
    gap:6px;
  }

  .titleWrap{
    display:none;
  }

  .backLink,
  .menuButton{
    min-width:0;
    flex:1;
    min-height:44px;
  }

  .modeButton{
    flex-direction:row;
    gap:3px;
    min-height:44px;
    padding:0 8px;
    font-size:.78rem;
  }

  .sceneBand{
    flex:1;
    min-height:0;
    overflow-y:auto;
  }

  .sceneSwitcher{
    grid-template-columns:none;
    grid-auto-flow:row;
    grid-auto-rows:minmax(38px,1fr);
    grid-auto-columns:auto;
    height:100%;
    max-height:260px;
  }

  .sceneButton{
    flex-direction:row;
    gap:6px;
    min-height:38px;
    padding:2px 6px;
    font-size:.85rem;
    justify-content:flex-start;
  }

  .sceneIcon{
    font-size:1.3rem;
  }

  .sceneCheck{
    top:auto;
    right:6px;
  }

  .easy .sceneButton{
    min-height:40px;
    font-size:.9rem;
  }

  .easy .backLink,
  .easy .menuButton,
  .easy .modeButton{
    min-height:48px;
  }

  .menuPanel{
    top:6px;
    left:100%;
    right:auto;
    margin:0 0 0 6px;
    width:min(340px,calc(100vw - 100% - 16px));
    max-height:calc(100vh - 12px);
    max-height:calc(100dvh - 12px);
  }

  .wordPanel,
  .wordPanel.idle{
    left:calc(50% + var(--sw) / 2 + 10px);
    right:calc(10px + var(--safe-right));
    width:auto;
    max-width:none;
    transform:none;
    max-height:calc(100vh - 70px);

          en: "Queen of the night has very large, pure white flowers with many long, narrow petals and a strong fragrance. It generally blooms from late spring into summer, opening in the evening or at night and fading by morning. It is native from Mexico through Central America, and its Japanese name, gekkabijin, evokes the image of a beautiful woman blooming beneath the moon. Common flower meanings include “glamorous beauty” and “fleeting love.”",

          fr: "La reine de la nuit possède de très grandes fleurs d’un blanc pur, composées de nombreux pétales longs et fins, et dégage un parfum puissant. Elle fleurit généralement de la fin du printemps à l’été ; ses fleurs s’ouvrent le soir ou pendant la nuit et se fanent avant le matin. Elle est originaire du Mexique et d’Amérique centrale, et son nom japonais, gekkabijin, évoque une belle femme fleurissant sous la lune. Ses significations florales les plus connues sont « beauté éclatante » et « amour éphémère ».",

          zh: "昙花拥有非常大的纯白色花朵，许多细长的花瓣层层展开，并带有浓郁的香气。它通常在春末至夏季开花，傍晚或夜间开放，到清晨便会凋谢。它原产于墨西哥至中美洲一带，日语名“月下美人”让人联想到月光下盛开的美丽女子。代表性的花语有“艳丽的美人”和“短暂的爱”。",

        desc: {
          ja: "細長い茎の片側に、白、黄、ピンク、赤、紫などのラッパ形の花が並び、甘くさわやかな香りがあります。日本では春を代表する花の一つで、主に3～4月ごろに咲きます。アフリカ南部を中心とする地域が原産で、「フリージア」という属名はドイツの医師で植物学者のフリードリヒ・フレーゼにちなみます。代表的な花言葉は「親愛の情」「友情」「感謝」です。",
          en: "Freesias have trumpet-shaped flowers in colors such as white, yellow, pink, red, and purple, arranged along one side of slender stems, and many have a sweet, fresh fragrance. In Japan they are familiar spring flowers, commonly blooming around March and April. The genus is native mainly to southern Africa, and the name Freesia honors the German physician and botanist Friedrich Freese. Common flower meanings include “affection,” “friendship,” and “gratitude.”",
          es: "Las freesias tienen flores en forma de trompeta de colores como blanco, amarillo, rosa, rojo y morado, dispuestas a un lado de tallos delgados, y muchas poseen un aroma dulce y fresco. En Japón son flores típicas de primavera y suelen florecer alrededor de marzo y abril. El género es originario principalmente del sur de África, y el nombre Freesia honra al médico y botánico alemán Friedrich Freese. Entre sus significados florales más conocidos están “afecto”, “amistad” y “gratitud”.",
          fr: "Les freesias portent des fleurs en forme de trompette, blanches, jaunes, roses, rouges ou violettes, disposées d’un côté de tiges fines, et beaucoup dégagent un parfum doux et frais. Au Japon, ce sont des fleurs familières du printemps, qui fleurissent généralement vers mars et avril. Le genre est principalement originaire d’Afrique australe, et le nom Freesia rend hommage au médecin et botaniste allemand Friedrich Freese. Ses significations florales les plus connues sont « affection », « amitié » et « gratitude ».",
          de: "Freesien tragen trompetenförmige Blüten in Weiß, Gelb, Rosa, Rot oder Violett, die auf einer Seite schlanker Stiele angeordnet sind; viele Sorten duften süß und frisch. In Japan gehören sie zu den bekannten Frühlingsblumen und blühen meist im März und April. Die Gattung stammt hauptsächlich aus dem südlichen Afrika, und der Name Freesia ehrt den deutschen Arzt und Botaniker Friedrich Freese. Bekannte Blumenbedeutungen sind „Zuneigung“, „Freundschaft“ und „Dankbarkeit“.",
          zh: "小苍兰的细长花茎一侧排列着白、黄、粉、红、紫等颜色的喇叭形花朵，许多品种还带有甜美清新的香气。在日本，它是常见的春季花卉，通常在3月至4月开放。小苍兰属主要原产于非洲南部，“Freesia”这个属名是为了纪念德国医生兼植物学家弗里德里希·弗雷泽。代表性的花语有“亲爱”“友情”和“感谢”。",
          ko: "프리지어는 가느다란 줄기의 한쪽에 흰색, 노란색, 분홍색, 빨간색, 보라색 등의 나팔 모양 꽃이 줄지어 피며, 많은 품종에서 달콤하고 상쾌한 향기가 납니다. 일본에서는 대표적인 봄꽃 가운데 하나로 보통 3~4월 무렵에 핍니다. 주로 아프리카 남부가 원산지이며, Freesia라는 속명은 독일의 의사이자 식물학자인 프리드리히 프레제를 기려 붙인 이름입니다. 대표적인 꽃말은 ‘친애’, ‘우정’, ‘감사’입니다."

        desc: {
          ja: "白い6枚の花びらが星や小さなユリのように開き、中心には黄色い雄しべが見えます。夏から秋に咲き、まとまった雨のあとに一斉に花を咲かせることから「レインリリー」と呼ばれます。南アメリカ原産で、ゼフィランサスという名前はギリシャ語の「西風」と「花」に由来します。代表的な花言葉は「純白な愛」「期待」です。",
          en: "Rain lily has six white petals that open like a star or a small lily, with yellow stamens visible in the center. It blooms from summer into fall and is called “rain lily” because its flowers often appear together after a good rainfall. It is native to South America, and the name Zephyranthes comes from Greek words referring to the west wind and a flower. Common flower meanings include “pure love” and “expectation.”",
          es: "El lirio de lluvia tiene seis pétalos blancos que se abren como una estrella o un pequeño lirio, con estambres amarillos visibles en el centro. Florece desde el verano hasta el otoño y recibe el nombre de “lirio de lluvia” porque suele producir muchas flores después de una lluvia abundante. Es originario de Sudamérica, y el nombre Zephyranthes procede de palabras griegas relacionadas con el viento del oeste y la flor. Sus significados florales más conocidos son “amor puro” y “esperanza”.",
          fr: "Le lis de pluie possède six pétales blancs qui s’ouvrent comme une étoile ou un petit lis, avec des étamines jaunes visibles au centre. Il fleurit de l’été à l’automne et doit son nom de « lis de pluie » au fait que de nombreuses fleurs apparaissent souvent après une bonne pluie. Il est originaire d’Amérique du Sud, et le nom Zephyranthes vient de mots grecs évoquant le vent d’ouest et la fleur. Ses significations florales les plus connues sont « amour pur » et « attente pleine d’espoir ».",
          de: "Die Regenlilie besitzt sechs weiße Blütenblätter, die sich sternförmig oder wie eine kleine Lilie öffnen; in der Mitte sind gelbe Staubblätter zu sehen. Sie blüht vom Sommer bis in den Herbst und heißt Regenlilie, weil nach kräftigem Regen oft viele Blüten gleichzeitig erscheinen. Sie stammt aus Südamerika, und der Name Zephyranthes leitet sich von griechischen Wörtern für Westwind und Blume ab. Bekannte Blumenbedeutungen sind „reine Liebe“ und „Erwartung“.",
          zh: "葱莲有六片白色花瓣，开放时像星星或小百合，花朵中央可以看到黄色的雄蕊。它从夏季开到秋季，经常在一场较大的雨后一起开放，因此也被称为“雨百合”。它原产于南美洲，Zephyranthes这个名字来自表示“西风”和“花”的希腊语词。代表性的花语有“纯洁的爱”和“期待”。",
          ko: "흰꽃나도사프란은 여섯 장의 흰 꽃잎이 별이나 작은 백합처럼 펼쳐지고 중앙에는 노란 수술이 보입니다. 여름부터 가을까지 피며, 비가 많이 내린 뒤 한꺼번에 꽃을 피우는 경우가 많아 ‘레인 릴리’라고 불립니다. 남아메리카가 원산지이며, Zephyranthes라는 이름은 ‘서풍’과 ‘꽃’을 뜻하는 그리스어에서 유래했습니다. 대표적인 꽃말은 ‘순백의 사랑’과 ‘기대’입니다."

        desc: {
          ja: "細長い茎の先に白やピンクの花を咲かせ、中心には黄色い雄しべが集まっています。夏の終わりから秋、主に8～11月ごろに咲く多年草です。中国原産で、日本には古い時代に伝わり、「秋明菊」という名前は秋に咲く菊のような姿にちなみますが、キクの仲間ではなくアネモネの仲間です。代表的な花言葉は「薄れゆく愛」「淡い思い」です。",
          en: "Japanese anemone produces white or pink flowers on slender stems, with a cluster of yellow stamens in the center. It is a perennial that blooms from late summer through fall, generally from about August to November. It is native to China and was introduced to Japan long ago; its Japanese name means “bright autumn chrysanthemum,” referring to its chrysanthemum-like appearance, although it is actually an anemone rather than a chrysanthemum. Common flower meanings include “fading love” and “gentle affection.”",
          es: "La anémona japonesa produce flores blancas o rosadas sobre tallos delgados, con un grupo de estambres amarillos en el centro. Es una planta perenne que florece desde finales del verano hasta el otoño, generalmente entre agosto y noviembre. Es originaria de China y llegó a Japón hace mucho tiempo; su nombre japonés significa “crisantemo luminoso de otoño” por su aspecto parecido al crisantemo, aunque en realidad pertenece al grupo de las anémonas. Sus significados florales más conocidos son “amor que se desvanece” y “sentimientos delicados”.",
          fr: "L’anémone du Japon porte des fleurs blanches ou roses sur de fines tiges, avec un groupe d’étamines jaunes au centre. C’est une plante vivace qui fleurit de la fin de l’été à l’automne, généralement d’août à novembre. Originaire de Chine, elle a été introduite au Japon il y a longtemps ; son nom japonais signifie « chrysanthème lumineux d’automne » en raison de son apparence, bien qu’elle appartienne en réalité aux anémones et non aux chrysanthèmes. Ses significations florales les plus connues sont « amour qui s’efface » et « tendre sentiment ».",
          de: "Die Herbst-Anemone trägt weiße oder rosafarbene Blüten auf schlanken Stielen, in deren Mitte zahlreiche gelbe Staubblätter sitzen. Sie ist eine mehrjährige Pflanze und blüht vom Spätsommer bis in den Herbst, meist von August bis November. Sie stammt aus China und gelangte schon vor langer Zeit nach Japan; ihr japanischer Name bedeutet sinngemäß „leuchtende Herbstchrysantheme“, weil die Blüten an Chrysanthemen erinnern, obwohl die Pflanze zu den Anemonen gehört. Bekannte Blumenbedeutungen sind „verblassende Liebe“ und „zarte Gefühle“.",
          zh: "秋明菊在细长的花茎顶端开出白色或粉色花朵，中央聚集着许多黄色雄蕊。它是多年生植物，从夏末到秋季开花，通常花期约为8月至11月。它原产于中国，很早以前传入日本；日语名“秋明菊”来自它秋天开放、外形似菊的特点，不过它并不是菊科植物，而是银莲花的近亲。代表性的花语有“逐渐淡去的爱”和“淡淡的思念”。",
          ko: "추명국은 가느다란 줄기 끝에 흰색이나 분홍색 꽃을 피우며 중앙에는 노란 수술이 모여 있습니다. 늦여름부터 가을까지, 주로 8~11월 무렵에 피는 여러해살이풀입니다. 중국이 원산지이며 오래전에 일본으로 전해졌고, 일본 이름 ‘슈메이기쿠’는 가을에 피는 국화 같은 모습에서 유래했지만 실제로는 국화가 아니라 아네모네의 한 종류입니다. 대표적인 꽃말은 ‘희미해져 가는 사랑’과 ‘옅은 그리움’입니다."

        desc: {
          ja: "小さな純白の花が傘のように集まり、外側の花びらが大きいため、全体が白いレースのように見えます。春から初夏を中心に、細い茎の先に軽やかな花を咲かせます。ヨーロッパから地中海沿岸などに分布し、「ホワイトレースフラワー」という名前は繊細な白いレースを思わせる花姿に由来します。代表的な花言葉は「可憐な心」「静寂」「細やかな愛情」です。",
          en: "White lace flower has many tiny pure-white flowers gathered into flat, umbrella-like clusters, with larger outer petals that make the whole bloom look like delicate white lace. It flowers mainly from spring into early summer on slender, branching stems. It is native to parts of Europe and the Mediterranean region, and the name “white lace flower” comes from its fine, lace-like appearance. Common flower meanings include “delicate heart,” “tranquility,” and “tender affection.”",
          es: "La flor de encaje blanco reúne muchas pequeñas flores blancas en grupos planos parecidos a sombrillas, y sus pétalos exteriores más grandes hacen que el conjunto parezca un delicado encaje blanco. Florece principalmente desde la primavera hasta comienzos del verano sobre tallos finos y ramificados. Es originaria de partes de Europa y de la región mediterránea, y el nombre “flor de encaje blanco” procede de su aspecto fino y parecido al encaje. Sus significados florales más conocidos son “corazón delicado”, “tranquilidad” y “afecto tierno”.",
          fr: "La fleur de dentelle blanche rassemble de nombreuses petites fleurs d’un blanc pur en ombelles plates, et ses pétales extérieurs plus grands donnent à l’ensemble l’apparence d’une fine dentelle blanche. Elle fleurit principalement du printemps au début de l’été sur des tiges fines et ramifiées. Elle est originaire de certaines régions d’Europe et du bassin méditerranéen, et son nom vient naturellement de son aspect délicat rappelant la dentelle. Ses significations florales les plus connues sont « cœur délicat », « tranquillité » et « tendre affection ».",
          de: "Die Weiße Spitzenblume trägt viele kleine, reinweiße Blüten in flachen, schirmartigen Blütenständen; größere äußere Blütenblätter lassen den gesamten Blütenstand wie feine weiße Spitze wirken. Sie blüht hauptsächlich vom Frühling bis zum Frühsommer an schlanken, verzweigten Stielen. Sie stammt aus Teilen Europas und dem Mittelmeerraum, und ihr englischer Name „White Lace Flower“ bezieht sich auf ihr zartes, spitzenartiges Aussehen. Bekannte Blumenbedeutungen sind „zartes Herz“, „Stille“ und „liebevolle Zuneigung“.",
          zh: "白蕾丝花由许多纯白色小花组成扁平的伞状花序，外侧花瓣较大，使整朵花看起来像精致的白色蕾丝。它主要在春季至初夏开花，细长而分枝的花茎显得十分轻盈。它原产于欧洲部分地区和地中海沿岸，“White Lace Flower”这个名字正是来自它像白色蕾丝一样细致的外形。代表性的花语有“可爱的心”“宁静”和“细腻的爱”。",
          ko: "화이트 레이스 플라워는 작은 순백색 꽃들이 평평한 우산 모양으로 모여 피고, 바깥쪽 꽃잎이 더 커서 전체가 섬세한 흰 레이스처럼 보입니다. 주로 봄부터 초여름까지 가늘고 가지가 갈라진 줄기 끝에서 가볍고 아름답게 핍니다. 유럽 일부와 지중해 지역이 원산지이며, ‘화이트 레이스 플라워’라는 이름은 흰 레이스를 닮은 섬세한 꽃 모양에서 유래했습니다. 대표적인 꽃말은 ‘가련한 마음’, ‘고요함’, ‘섬세한 사랑’입니다."

        desc: {
          ja: "白、ピンク、紫などの4枚の花びらから長い雄しべが大きく突き出し、蝶やクモが舞うような独特の姿をしています。夏から秋にかけて咲き、一つ一つの花は夕方ごろに開き始め、翌日にはしぼむ一日花です。園芸でよく使われるクレオメは南アメリカ原産で、英語では長い雄しべをクモの脚に見立てて「Spider flower」とも呼ばれます。代表的な花言葉は「秘密のひととき」「あなたの容姿に酔う」「小さな愛」です。",
          en: "Cleome has four petals in shades of white, pink, or purple, with very long stamens projecting outward and giving the flower a distinctive butterfly- or spider-like appearance. It blooms from summer into fall, and each flower usually begins opening in the evening and fades the following day. The cleome commonly grown in gardens is native to South America, and the English name “spider flower” refers to its long, spider-leg-like stamens. Common flower meanings include “a secret moment,” “intoxicated by your beauty,” and “little love.”",
          es: "La cleome tiene cuatro pétalos blancos, rosados o morados y estambres muy largos que sobresalen, dándole un aspecto peculiar parecido a una mariposa o una araña. Florece desde el verano hasta el otoño, y cada flor suele comenzar a abrirse al atardecer y se marchita al día siguiente. La cleome cultivada habitualmente en jardines es originaria de Sudamérica, y el nombre inglés “spider flower” alude a sus largos estambres, parecidos a patas de araña. Sus significados florales más conocidos son “un momento secreto”, “embriagado por tu belleza” y “pequeño amor”.",
          fr: "Le cléome possède quatre pétales blancs, roses ou violets et de très longues étamines qui dépassent largement, donnant à la fleur une silhouette originale évoquant un papillon ou une araignée. Il fleurit de l’été à l’automne, chaque fleur commençant généralement à s’ouvrir le soir avant de se faner le lendemain. Le cléome couramment cultivé dans les jardins est originaire d’Amérique du Sud, et son nom anglais « spider flower » fait référence à ses longues étamines ressemblant aux pattes d’une araignée. Ses significations florales les plus connues sont « moment secret », « enivré par ta beauté » et « petit amour ».",

let currentSceneId = "room";
let currentItemId = null;

let currentLanguage = "ja";
let easyMode = false;

let volume = 1;
let rate = 1;

let availableVoices = [];

function safeGet(key, fallback){
  try{
    const value = localStorage.getItem(key);
    return value === null ? fallback : value;
  }catch(error){
    return fallback;
  }
}

function safeSet(key, value){
  try{
    localStorage.setItem(key, String(value));
  }catch(error){
    /* 保存不可の場合でもアプリは動作継続 */
  }
}

function clamp(value, min, max){
  return Math.min(max, Math.max(min, value));
}

function loadSettings(){
  const savedLanguage = safeGet(STORAGE.language, "ja");

  if(LANGS[savedLanguage]){
    currentLanguage = savedLanguage;
  }

  currentSceneId = safeGet(STORAGE.scene, "room");

  if(!SCENES[currentSceneId]){
    currentSceneId = "room";
  }

  easyMode = safeGet(STORAGE.easy, "false") === "true";

  volume = clamp(
    Number.parseFloat(safeGet(STORAGE.volume, "1")) || 1,
    0,
    1
  );

  rate = clamp(
    Number.parseFloat(safeGet(STORAGE.rate, "1")) || 1,
    0.6,
    1.3
  );
}

function applySettings(){
  languageSelect.value = currentLanguage;

  easyButton.setAttribute(
    "aria-pressed",
    easyMode ? "true" : "false"
  );

  app.classList.toggle("easy", easyMode);

  volumeInput.value = String(volume);
  rateInput.value = String(rate);

  volumeOutput.value =
    Math.round(volume * 100) + "%";

  rateOutput.value =
    rate.toFixed(2).replace(/0$/,"") + "×";
}

function getScene(){
  return SCENES[currentSceneId];
}

function getItemById(id){
  return getScene().items.find(item => item.id === id) || null;
}

function getLocalizedItem(item){
  if(!item) return null;

  return (
    item.words[currentLanguage] ||
    item.words.en ||
    item.words.ja
  );
}

let fadeTimer = null;

function wakePanel(){
  window.clearTimeout(fadeTimer);
  wordPanel.classList.remove("faded");
}

function schedulePanelFade(){
  wakePanel();
  fadeTimer = window.setTimeout(() => {
    wordPanel.classList.add("faded");
  }, 3500);
}

function setIdlePrompt(){
  const scene = getScene();

  wakePanel();
  wordPanel.classList.add("idle");

  bigWord.textContent =
    currentLanguage === "ja"
      ? "タッチしてね"
      : "Touch";

  reading.textContent =
    currentLanguage === "ja"
      ? scene.promptJa
      : "Tap an object";
}

function renderSceneSwitcher(){
  const focusedId =
    sceneSwitcher.contains(document.activeElement)
      ? document.activeElement.dataset.sceneId
      : null;

  sceneSwitcher.textContent = "";
  sceneLabel.textContent =
    SCENE_LABELS[currentLanguage] || SCENE_LABELS.en;

  for(const scene of Object.values(SCENES)){
    const button = document.createElement("button");

    button.type = "button";
    button.className = "sceneButton";
    button.dataset.sceneId = scene.id;

    button.setAttribute(
      "aria-pressed",
      scene.id === currentSceneId ? "true" : "false"
    );

    const icon = scene.icon || "📍";
    let name =
      scene.title[currentLanguage] ||
      scene.title.en ||
      scene.id;

    if(name.startsWith(icon)){
      name = name.slice(icon.length).trim();
    }

    const iconEl = document.createElement("span");
    iconEl.className = "sceneIcon";
    iconEl.setAttribute("aria-hidden", "true");
    iconEl.textContent = icon;

    const textEl = document.createElement("span");
    textEl.className = "sceneText";
    textEl.textContent = name;

    const checkEl = document.createElement("span");
    checkEl.className = "sceneCheck";
    checkEl.setAttribute("aria-hidden", "true");
    checkEl.textContent = "✓";

    button.append(iconEl, textEl, checkEl);

    button.addEventListener("click", () => {
      if(scene.id === currentSceneId){
        return;
      }

      currentSceneId = scene.id;
      currentItemId = null;
      closeZoomOverlay();

      safeSet(
        STORAGE.scene,
        currentSceneId
      );

      if("speechSynthesis" in window){
        window.speechSynthesis.cancel();
      }

      renderScene();
      setIdlePrompt();
      updateVoiceStatus(false);
    });

    sceneSwitcher.appendChild(button);

    if(scene.id === focusedId){
      button.focus({ preventScroll: true });
    }
  }
}

function createHotspot(item){
  const button = document.createElement("button");

  button.type = "button";
  button.className = "hotspot";
  button.dataset.itemId = item.id;

  button.style.left = item.x + "%";
  button.style.top = item.y + "%";
  button.style.width = item.w + "%";
  button.style.height = item.h + "%";
  button.style.zIndex = String(item.z || 1);

  const localized = getLocalizedItem(item);

  button.setAttribute(
    "aria-label",
    localized ? localized.word : item.id
  );

  const tag = document.createElement("span");
  tag.className = "hotspotTag";
  tag.textContent =
    item.emoji + " " +
    (localized ? localized.word : item.id);

  button.appendChild(tag);

  button.addEventListener("pointerup", event => {
    event.preventDefault();
    selectItem(item.id, true);
  });

  button.addEventListener("keydown", event => {
    if(event.key === "Enter" || event.key === " "){
      event.preventDefault();
      selectItem(item.id, true);
    }
  });

  return button;
}

function renderScene(){
  const scene = getScene();

  sceneImage.src = scene.background;
  stageBg.src = scene.background;
  sceneImage.alt = scene.alt || "";

  sceneName.textContent =
    scene.title[currentLanguage] ||
    scene.title.en ||
    scene.id;

  subtitle.textContent =
    scene.subtitle;

  document.title =
    scene.documentTitle;

  helpText.textContent =
    scene.help;

  sceneShell.setAttribute(
    "aria-label",
    scene.ariaLabel
  );

  renderSceneSwitcher();
  updateSceneToggle();

  const existing =
    sceneEl.querySelectorAll(".hotspot");

  existing.forEach(node => node.remove());

  const sortedItems = [...scene.items].sort(
    (a,b) => (a.z || 0) - (b.z || 0)
  );

  for(const item of sortedItems){
    sceneEl.appendChild(createHotspot(item));
  }

  if(currentItemId){
    const selected = getItemById(currentItemId);

    if(selected){
      showItem(selected);
    }
  }
}

function showItem(item){
  const localized = getLocalizedItem(item);

  if(!localized) return;

  wordPanel.classList.remove("idle");
  schedulePanelFade();

  bigWord.textContent = localized.word;

  reading.textContent =
    localized.reading
      ? localized.reading
      : "";

  document.documentElement.lang = currentLanguage;

  updateVoiceStatus(false);
}

function setPanelCollapsed(collapsed){
  wordPanel.classList.toggle("collapsed", collapsed);

  panelToggle.setAttribute(
    "aria-expanded",
    collapsed ? "false" : "true"
  );

  panelToggle.textContent =
    collapsed ? "▴ 単語" : "▾ 閉じる";
}

function updateSceneToggle(){
  const scene = getScene();
  const icon = scene.icon || "📍";
  let name =
    scene.title[currentLanguage] ||
    scene.title.en ||
    scene.id;

  if(name.startsWith(icon)){
    name = name.slice(icon.length).trim();
  }

  sceneToggleText.textContent = icon + " " + name;
}

function setScenesOpen(open){
  headerEl.classList.toggle("scenesClosed", !open);

  sceneToggle.setAttribute(
    "aria-expanded",
    open ? "true" : "false"
  );
}

sceneToggle.addEventListener("click", () => {
  setScenesOpen(headerEl.classList.contains("scenesClosed"));
});

sceneSwitcher.addEventListener("click", () => {
  setScenesOpen(false);
});

sceneEl.addEventListener("pointerdown", () => {
  setScenesOpen(false);
});

function setMenuOpen(open){
  menuPanel.hidden = !open;

  menuButton.setAttribute(
    "aria-expanded",
    open ? "true" : "false"
  );
}

panelToggle.addEventListener("click", () => {
  setPanelCollapsed(
    !wordPanel.classList.contains("collapsed")
  );
});

menuButton.addEventListener("click", () => {
  setMenuOpen(menuPanel.hidden);
});

document.addEventListener("pointerdown", event => {
  if(
    !menuPanel.hidden &&
    !menuPanel.contains(event.target) &&
    !menuButton.contains(event.target)
  ){
    setMenuOpen(false);
  }
});

document.addEventListener("keydown", event => {
  if(event.key === "Escape"){
    if(isZoomOpen()){
      closeZoomOverlay();
      return;
    }
    if(!menuPanel.hidden){
      setMenuOpen(false);
      menuButton.focus();
    }
  }
});

function selectItem(itemId, shouldSpeak){
  const item = getItemById(itemId);

  if(!item) return;

  currentItemId = itemId;

  setPanelCollapsed(false);

  showItem(item);

  if(shouldSpeak){
    speakCurrentItem();
  }

  if(getScene().zoom && item.desc){
    openZoomOverlay(item);
  }else if(isZoomOpen()){
    closeZoomOverlay();
  }
}

function loadVoices(){
  if(!("speechSynthesis" in window)){
    availableVoices = [];
    updateVoiceStatus(true);
    return;
  }

  availableVoices =
    window.speechSynthesis.getVoices() || [];

  updateVoiceStatus(false);
}

function normalizeLanguageTag(tag){
  return String(tag || "")
    .trim()
    .toLowerCase()
    .replace("_","-");
}

function chooseVoice(locale){
  if(!availableVoices.length){
    return null;
  }

  const target =
    normalizeLanguageTag(locale);

  const base =
    target.split("-")[0];

  const exactLocal =
    availableVoices.find(voice =>
      normalizeLanguageTag(voice.lang) === target &&
      voice.localService
    );

  if(exactLocal){
    return exactLocal;
  }

  const exact =
    availableVoices.find(voice =>
      normalizeLanguageTag(voice.lang) === target
    );

  if(exact){
    return exact;
  }

  const baseLocal =
    availableVoices.find(voice =>
      normalizeLanguageTag(voice.lang).split("-")[0] === base &&
      voice.localService
    );

  if(baseLocal){
    return baseLocal;
  }

  const baseMatch =
    availableVoices.find(voice =>
      normalizeLanguageTag(voice.lang).split("-")[0] === base
    );

  if(baseMatch){
    return baseMatch;
  }

  return null;
}

function updateVoiceStatus(forceUnsupported){
  if(
    forceUnsupported ||
    !("speechSynthesis" in window) ||
    !("SpeechSynthesisUtterance" in window)
  ){
    voiceStatus.innerHTML =
      '<span class="noSpeech">' +
      "このブラウザでは音声読み上げを利用できません。" +
      "</span>";

    speakAgain.disabled = true;
    speakAgain.setAttribute("aria-disabled","true");

    return;
  }

  speakAgain.disabled = false;
  speakAgain.setAttribute("aria-disabled","false");

  const locale =
    LANGS[currentLanguage].locale;

  const voice =
    chooseVoice(locale);

  if(!availableVoices.length){
    voiceStatus.textContent =
      "端末の音声一覧を読み込み中です。";
    return;
  }

  if(!voice){
    voiceStatus.innerHTML =
      '<span class="noSpeech">' +
      LANGS[currentLanguage].label +
      " の対応音声が端末に見つかりません。" +
      "</span>";

    return;
  }

  voiceStatus.textContent =
    "🔊 " +
    LANGS[currentLanguage].label +
    " / " +
    voice.name;
}

function speakCurrentItem(){
  if(!currentItemId){
    return;
  }

  const item =
    getItemById(currentItemId);

  if(!item){
    return;
  }

  const localized =
    getLocalizedItem(item);

  if(!localized){
    return;
  }

  if(
    !("speechSynthesis" in window) ||
    !("SpeechSynthesisUtterance" in window)
  ){
    updateVoiceStatus(true);
    return;
  }

  const langInfo =
    LANGS[currentLanguage];

  const utterance =
    new SpeechSynthesisUtterance(localized.word);

  utterance.lang =
    langInfo.locale;

  utterance.volume =
    volume;

  utterance.rate =
    rate;

  utterance.pitch =
    1;

  const voice =
    chooseVoice(langInfo.locale);

  if(voice){
    utterance.voice = voice;
  }

  utterance.onstart = () => {
    if(voice){
      voiceStatus.textContent =
        "🔊 発音中 / " +
        voice.name;
    }else{
      voiceStatus.textContent =
        "🔊 発音中";
    }
  };

  utterance.onend = () => {
    updateVoiceStatus(false);
  };

  utterance.onerror = event => {
    if(
      event.error === "canceled" ||
      event.error === "interrupted"
    ){
      return;
    }

    voiceStatus.innerHTML =
      '<span class="noSpeech">' +
      "音声を再生できませんでした。" +
      "</span>";
  };

  window.speechSynthesis.cancel();

  window.setTimeout(() => {
    window.speechSynthesis.speak(utterance);
  }, 40);
}

languageSelect.addEventListener(
  "change",
  () => {
    const value =
      languageSelect.value;

    if(!LANGS[value]){
      return;
    }

    currentLanguage = value;

    safeSet(
      STORAGE.language,
      currentLanguage
    );

    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
    }

    renderScene();

    if(isZoomOpen() && zoomItemId){
      const zItem = getItemById(zoomItemId);
      if(zItem && zItem.desc){
        fillZoomOverlay(zItem);
      }else{
        closeZoomOverlay();
      }
    }

    if(currentItemId){
      speakCurrentItem();
    }else{
      updateVoiceStatus(false);
    }
  }
);

easyButton.addEventListener(
  "click",
  () => {
    easyMode = !easyMode;

    safeSet(
      STORAGE.easy,
      easyMode
    );

    applySettings();
    renderScene();
  }
);

volumeInput.addEventListener(
  "input",
  () => {
    volume =
      clamp(
        Number.parseFloat(volumeInput.value),
        0,
        1
      );

    safeSet(
      STORAGE.volume,
      volume
    );

    volumeOutput.value =
      Math.round(volume * 100) + "%";
  }
);

rateInput.addEventListener(
  "input",
  () => {
    rate =
      clamp(
        Number.parseFloat(rateInput.value),
        0.6,
        1.3
      );

    safeSet(
      STORAGE.rate,
      rate
    );

    rateOutput.value =
      rate.toFixed(2).replace(/0$/,"") + "×";
  }
);

speakAgain.addEventListener(
  "pointerup",
  event => {
    event.preventDefault();

    if(currentItemId){
      schedulePanelFade();
      speakCurrentItem();
    }
  }
);

sceneImage.addEventListener(
  "error",
  () => {
    voiceStatus.innerHTML =
      '<span class="noSpeech">' +
      "背景画像 " +
      getScene().background +
      " を読み込めません。" +
      "</span>";
  }
);

if("speechSynthesis" in window){
  window.speechSynthesis.onvoiceschanged =
    loadVoices;
}


/* ===== florist zoom overlay (scene.zoom + item.desc) ===== */
const zoomOverlay = document.getElementById("zoomOverlay");
const zoomCrop = document.getElementById("zoomCrop");
const zoomCropInner = document.getElementById("zoomCropInner");
const zoomEmoji = document.getElementById("zoomEmoji");
const zoomWord = document.getElementById("zoomWord");
const zoomReading = document.getElementById("zoomReading");
const zoomDesc = document.getElementById("zoomDesc");
const zoomSpeakDesc = document.getElementById("zoomSpeakDesc");
const zoomHint = document.getElementById("zoomHint");
let zoomItemId = null;
let zoomIgnoreUntil = 0;

const ZOOM_HINT = {
  ja: "タップで戻る",
  en: "Tap to close",
  es: "Toca para cerrar",
  fr: "Touchez pour fermer",
  de: "Tippen zum Schließen",
  zh: "点按即可返回",
  ko: "탭하면 돌아갑니다"
};
const ZOOM_SPEAK_LABEL = {
  ja: "🔊 解説を読む",
  en: "🔊 Read description",
  es: "🔊 Leer descripción",
  fr: "🔊 Lire la description",
  de: "🔊 Beschreibung vorlesen",
  zh: "🔊 朗读说明",
  ko: "🔊 설명 읽기"
};

function isZoomOpen(){
  return zoomOverlay && !zoomOverlay.hidden;
}

function getItemDesc(item){
  if(!item || !item.desc) return "";
  return item.desc[currentLanguage] || item.desc.en || item.desc.ja || "";
}

function closeZoomOverlay(){
  if(!zoomOverlay || zoomOverlay.hidden) return;
  zoomOverlay.hidden = true;
  zoomItemId = null;
  zoomCropInner.style.backgroundImage = "";
  document.body.style.overflow = "";
}

function layoutZoomCrop(item){
  const img = sceneImage;
  const iw = img.naturalWidth || 941;
  const ih = img.naturalHeight || 1672;
  const x = Number(item.x) || 0;
  const y = Number(item.y) || 0;
  const w = Math.max(Number(item.w) || 1, 1);
  const h = Math.max(Number(item.h) || 1, 1);
  const cropAspect = (w / 100 * iw) / (h / 100 * ih);

  const maxW = Math.min(window.innerWidth * 0.92, 520);
  const maxH = Math.min(window.innerHeight * 0.52, 520);
  let cw = maxW;
  let ch = cw / cropAspect;
  if(ch > maxH){
    ch = maxH;
    cw = ch * cropAspect;
  }
  zoomCrop.style.width = cw + "px";
  zoomCrop.style.height = ch + "px";

  const fullW = cw * (100 / w);
  const fullH = ch * (100 / h);
  zoomCropInner.style.width = fullW + "px";
  zoomCropInner.style.height = fullH + "px";
  zoomCropInner.style.left = (-x / w * cw) + "px";
  zoomCropInner.style.top = (-y / h * ch) + "px";
  zoomCropInner.style.backgroundImage =
    'url("' + getScene().background.replace(/"/g, '\\"') + '")';
  zoomCropInner.style.backgroundSize = "100% 100%";
  zoomCropInner.style.backgroundPosition = "0 0";
}

function fillZoomOverlay(item){
  const localized = getLocalizedItem(item);
  if(!localized) return;
  zoomEmoji.textContent = item.emoji || "";
  zoomWord.textContent = localized.word;
  zoomReading.textContent = localized.reading || "";
  zoomDesc.textContent = getItemDesc(item);
  zoomHint.textContent =
    ZOOM_HINT[currentLanguage] || ZOOM_HINT.en;
  zoomSpeakDesc.textContent =
    ZOOM_SPEAK_LABEL[currentLanguage] || ZOOM_SPEAK_LABEL.en;
  layoutZoomCrop(item);
}

function openZoomOverlay(item){
  if(!getScene().zoom || !item || !item.desc) return;
  zoomItemId = item.id;
  fillZoomOverlay(item);
  zoomOverlay.hidden = false;
  document.body.style.overflow = "hidden";
  zoomIgnoreUntil = Date.now() + 400;
  zoomOverlay.focus({ preventScroll: true });
}

function speakZoomDescription(){
  const item = zoomItemId ? getItemById(zoomItemId) : null;
  const text = getItemDesc(item);
  if(!text) return;
  if(
    !("speechSynthesis" in window) ||
    !("SpeechSynthesisUtterance" in window)
  ){
    return;
  }
  const langInfo = LANGS[currentLanguage];
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = langInfo.locale;
  utterance.volume = volume;
  utterance.rate = rate;
  utterance.pitch = 1;
  const voice = chooseVoice(langInfo.locale);
  if(voice) utterance.voice = voice;
  window.speechSynthesis.cancel();
  window.setTimeout(() => {
    window.speechSynthesis.speak(utterance);
  }, 40);
}

if(zoomOverlay){
  zoomOverlay.tabIndex = -1;
  zoomOverlay.addEventListener("pointerup", event => {
    if(Date.now() < zoomIgnoreUntil) return;
    if(event.target.closest("#zoomSpeakDesc")) return;
    event.preventDefault();
    closeZoomOverlay();
  });
  zoomSpeakDesc.addEventListener("pointerup", event => {
    event.preventDefault();
    event.stopPropagation();
    speakZoomDescription();
  });
  zoomSpeakDesc.addEventListener("click", event => {
    event.preventDefault();
    event.stopPropagation();
  });
}

window.addEventListener("resize", () => {
  if(isZoomOpen() && zoomItemId){
    const item = getItemById(zoomItemId);
    if(item) layoutZoomCrop(item);
  }
});

function init(){
  loadSettings();

  applySettings();

  renderScene();

  loadVoices();

  setIdlePrompt();

  updateVoiceStatus(false);
}

init();
</script>
