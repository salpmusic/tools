<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#162018">
<title>SALP WORDS | 単語学習 部屋編</title>

<style>
:root{
  --bg:#101510;
  --panel:rgba(18,27,20,.94);
  --panel2:rgba(255,255,255,.95);
  --text:#fffdf6;
  --sub:#d5ddcf;
  --accent:#ffd86a;
  --accent2:#94d68b;
  --danger:#ff9c8d;
  --line:rgba(255,255,255,.18);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    "Noto Sans",
    sans-serif;
}

body{
  overscroll-behavior:none;
}

button,
select,
input,
a{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  padding-top:var(--safe-top);
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(12,18,14,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.headerTop{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px 8px;
}

.backLink{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:48px;
  min-height:48px;
  padding:0 12px;
  color:white;
  text-decoration:none;
  border:1px solid rgba(255,255,255,.22);
  border-radius:14px;
  background:rgba(255,255,255,.08);
  font-weight:700;
}

.titleWrap{
  min-width:0;
  flex:1;
}

.title{
  margin:0;
  font-size:1.12rem;
  font-weight:900;
  letter-spacing:.02em;
}

.subtitle{
  margin-top:2px;
  color:var(--sub);
  font-size:.79rem;
  font-weight:700;
}

.sceneSwitcher{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:0 12px 10px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

.sceneSwitcher::-webkit-scrollbar{
  display:none;
}

.sceneButton{
  flex:1 0 auto;
  min-width:138px;
  min-height:50px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:14px;
  padding:0 14px;
  background:rgba(255,255,255,.08);
  color:var(--text);
  font-weight:900;
  white-space:nowrap;
}

.sceneButton[aria-pressed="true"]{
  border-color:var(--accent);
  background:var(--accent);
  color:#1e210f;
}

.controls{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:8px;
  padding:0 12px 10px;
}

select,
.modeButton{
  min-height:48px;
  border:none;
  border-radius:14px;
  color:#182018;
  background:#fffdf6;
  padding:0 12px;
  font-weight:900;
}

.modeButton{
  min-width:116px;
}

.modeButton[aria-pressed="true"]{
  background:var(--accent);
}

.settingsRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:0 12px 10px;
}

.setting{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;
  padding:8px 10px;
}

.setting label{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  color:var(--sub);
  font-size:.78rem;
  font-weight:800;
  margin-bottom:5px;
}

.setting output{
  color:white;
  font-variant-numeric:tabular-nums;
}

input[type="range"]{
  width:100%;
  accent-color:var(--accent);
}

main{
  flex:1;
  display:flex;
  justify-content:center;
  padding:10px 8px calc(132px + var(--safe-bottom));
}

.sceneShell{
  width:min(100%,620px);
  display:flex;
  flex-direction:column;
  gap:8px;
}

.sceneInfo{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:2px 3px;
  color:var(--sub);
  font-size:.78rem;
}

.scene{
  position:relative;
  width:100%;
  aspect-ratio:9 / 16;
  overflow:hidden;
  border-radius:22px;
  background:#263027;
  box-shadow:0 10px 35px rgba(0,0,0,.32);
  user-select:none;
  touch-action:manipulation;
}

.sceneImage{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  pointer-events:none;
}

.hotspot{
  position:absolute;
  border:0;
  padding:0;
  margin:0;
  background:transparent;
  border-radius:18px;
  touch-action:manipulation;
  cursor:pointer;
}

.hotspot::before{
  content:"";
  position:absolute;
  inset:2px;
  border:2px solid transparent;
  border-radius:inherit;
  transition:
    background .15s ease,
    border-color .15s ease,
    transform .15s ease;
}

.hotspot:active::before{
  transform:scale(.96);
  background:rgba(255,222,97,.25);
}

.hotspot:focus-visible::before{
  outline:4px solid #fff;
  outline-offset:2px;
  border-color:#ffd75e;
  background:rgba(255,215,94,.18);
}

.easy .hotspot::before{
  border-color:rgba(255,242,166,.62);
  background:rgba(255,224,99,.09);
  box-shadow:
    0 0 0 2px rgba(0,0,0,.14),
    inset 0 0 16px rgba(255,236,145,.10);
}

.hotspotTag{
  display:none;
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  white-space:nowrap;
  pointer-events:none;
  padding:4px 7px;
  border-radius:999px;
  background:rgba(10,15,11,.82);
  color:white;
  font-size:.67rem;
  font-weight:900;
  box-shadow:0 2px 8px rgba(0,0,0,.24);
}

.easy .hotspotTag{
  display:block;
}

.wordPanel{
  position:fixed;
  z-index:1500;
  left:50%;
  bottom:calc(10px + var(--safe-bottom));
  transform:translateX(-50%);
  width:min(calc(100% - 16px),620px);
  min-height:106px;
  border-radius:22px;
  padding:10px 12px;
  background:rgba(14,20,15,.95);
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 10px 35px rgba(0,0,0,.38);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.wordTop{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:8px;
}

.wordText{
  min-width:0;
}

.bigWord{
  font-size:clamp(2rem,8vw,3.2rem);
  line-height:1.04;
  font-weight:950;
  overflow-wrap:anywhere;
}

.reading{
  min-height:1.25em;
  margin-top:4px;
  color:#ffe891;
  font-size:clamp(.9rem,3.8vw,1.12rem);
  font-weight:800;
}

.speakAgain{
  min-width:62px;
  min-height:62px;
  border:0;
  border-radius:18px;
  background:var(--accent);
  color:#1e210f;
  font-size:1.7rem;
  font-weight:900;
}

.voiceStatus{
  margin-top:7px;
  font-size:.78rem;
  color:var(--sub);
  min-height:1em;
}

.easy .bigWord{
  font-size:clamp(2.6rem,11vw,4.1rem);
}

.easy .reading{
  font-size:clamp(1.15rem,4.8vw,1.45rem);
}

.easy .wordPanel{
  min-height:128px;
  border:3px solid #ffe278;
}

.easy select,
.easy .modeButton,
.easy .sceneButton,
.easy .backLink{
  min-height:56px;
  font-size:1.02rem;
}

.help{
  padding:9px 12px;
  border-radius:14px;
  color:#e8eee5;
  background:rgba(255,255,255,.06);
  font-size:.79rem;
  line-height:1.5;
}

.noSpeech{
  color:var(--danger);
  font-weight:800;
}

@media (min-width:700px){
  main{
    padding-top:16px;
  }

  .scene{
    border-radius:28px;
  }
}

@media (max-width:420px){
  .title{
    font-size:1rem;
  }

  .subtitle{
    font-size:.72rem;
  }

  .settingsRow{
    gap:7px;
  }
}
</style>
</head>

<body>
<div class="app" id="app">

<header>
  <div class="headerTop">
    <a class="backLink" href="../index.html" aria-label="indexに戻る">←</a>

    <div class="titleWrap">
      <h1 class="title">🗣 SALP WORDS</h1>
      <div class="subtitle" id="subtitle">単語学習 部屋編</div>
    </div>
  </div>

  <div
    class="sceneSwitcher"
    id="sceneSwitcher"
    aria-label="学習シーンを切り替える"
  ></div>

  <div class="controls">
    <select id="languageSelect" aria-label="学習する言語">
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="zh">中文</option>
      <option value="ko">한국어</option>
    </select>

    <button
      type="button"
      class="modeButton"
      id="easyButton"
      aria-pressed="false"
    >
      👀 見やすい
    </button>
  </div>

  <div class="settingsRow">
    <div class="setting">
      <label for="volume">
        <span>🔊 音量</span>
        <output id="volumeOutput">100%</output>
      </label>
      <input
        id="volume"
        type="range"
        min="0"
        max="1"
        step="0.05"
        value="1"
      >
    </div>

    <div class="setting">
      <label for="rate">
        <span>🐢 速度</span>
        <output id="rateOutput">1.0×</output>
      </label>
      <input
        id="rate"
        type="range"
        min="0.6"
        max="1.3"
        step="0.05"
        value="1"
      >
    </div>
  </div>
</header>

<main>
  <section class="sceneShell" id="sceneShell" aria-label="部屋の単語学習">
    <div class="sceneInfo">
      <span id="sceneName">🏠 部屋</span>
      <span>物をタッチ</span>
    </div>

    <div class="scene" id="scene">
      <img
        id="sceneImage"
        class="sceneImage"
        src="room.webp"
        alt="明るい部屋のイラスト"
        draggable="false"
      >
    </div>

    <div class="help" id="helpText">
      絵の中の物をタッチすると、名前を表示して読み上げます。
      同じ物を何度タッチしても発音できます。
      「見やすい」をONにするとタッチ場所も表示します。
    </div>
  </section>
</main>

<section
  class="wordPanel"
  id="wordPanel"
  aria-live="polite"
  aria-atomic="true"
>
  <div class="wordTop">
    <div class="wordText">
      <div class="bigWord" id="bigWord">タッチしてね</div>
      <div class="reading" id="reading">Touch an object</div>
    </div>

    <button
      id="speakAgain"
      class="speakAgain"
      type="button"
      aria-label="もう一度発音する"
      title="もう一度発音する"
    >
      🔊
    </button>
  </div>

  <div class="voiceStatus" id="voiceStatus">
    音声を準備しています…
  </div>
</section>

</div>

const app = document.getElementById("app");
const sceneEl = document.getElementById("scene");
const sceneImage = document.getElementById("sceneImage");
const sceneName = document.getElementById("sceneName");
const sceneShell = document.getElementById("sceneShell");
const sceneSwitcher = document.getElementById("sceneSwitcher");
const subtitle = document.getElementById("subtitle");
const helpText = document.getElementById("helpText");

const languageSelect = document.getElementById("languageSelect");
const easyButton = document.getElementById("easyButton");

const volumeInput = document.getElementById("volume");
const rateInput = document.getElementById("rate");
const volumeOutput = document.getElementById("volumeOutput");
const rateOutput = document.getElementById("rateOutput");

const bigWord = document.getElementById("bigWord");
const reading = document.getElementById("reading");
const voiceStatus = document.getElementById("voiceStatus");
const speakAgain = document.getElementById("speakAgain");

let currentSceneId = "room";
let currentItemId = null;

let currentLanguage = "ja";
let easyMode = false;

let volume = 1;
let rate = 1;

let availableVoices = [];

function safeGet(key, fallback){
  try{
    const value = localStorage.getItem(key);
    return value === null ? fallback : value;
  }catch(error){
    return fallback;
  }
}

function safeSet(key, value){
  try{
    localStorage.setItem(key, String(value));
  }catch(error){
    /* 保存不可の場合でもアプリは動作継続 */
  }
}

function clamp(value, min, max){
  return Math.min(max, Math.max(min, value));
}

function loadSettings(){
  const savedLanguage = safeGet(STORAGE.language, "ja");

  if(LANGS[savedLanguage]){
    currentLanguage = savedLanguage;
  }

  currentSceneId = safeGet(STORAGE.scene, "room");

  if(!SCENES[currentSceneId]){
    currentSceneId = "room";
  }

  easyMode = safeGet(STORAGE.easy, "false") === "true";

  volume = clamp(
    Number.parseFloat(safeGet(STORAGE.volume, "1")) || 1,
    0,
    1
  );

  rate = clamp(
    Number.parseFloat(safeGet(STORAGE.rate, "1")) || 1,
    0.6,
    1.3
  );
}

function applySettings(){
  languageSelect.value = currentLanguage;

  easyButton.setAttribute(
    "aria-pressed",
    easyMode ? "true" : "false"
  );

  app.classList.toggle("easy", easyMode);

  volumeInput.value = String(volume);
  rateInput.value = String(rate);

  volumeOutput.value =
    Math.round(volume * 100) + "%";

  rateOutput.value =
    rate.toFixed(2).replace(/0$/,"") + "×";
}

function getScene(){
  return SCENES[currentSceneId];
}

function getItemById(id){
  return getScene().items.find(item => item.id === id) || null;
}

function getLocalizedItem(item){
  if(!item) return null;

  return (
    item.words[currentLanguage] ||
    item.words.en ||
    item.words.ja
  );
}

function setIdlePrompt(){
  const scene = getScene();

  bigWord.textContent =
    currentLanguage === "ja"
      ? "タッチしてね"
      : "Touch";

  reading.textContent =
    currentLanguage === "ja"
      ? scene.promptJa
      : "Tap an object";
}

function renderSceneSwitcher(){
  sceneSwitcher.textContent = "";

  for(const scene of Object.values(SCENES)){
    const button = document.createElement("button");

    button.type = "button";
    button.className = "sceneButton";
    button.dataset.sceneId = scene.id;

    button.setAttribute(
      "aria-pressed",
      scene.id === currentSceneId ? "true" : "false"
    );

    button.textContent =
      scene.title[currentLanguage] ||
      scene.title.en ||
      scene.id;

    button.addEventListener("click", () => {
      if(scene.id === currentSceneId){
        return;
      }

      currentSceneId = scene.id;
      currentItemId = null;

      safeSet(
        STORAGE.scene,
        currentSceneId
      );

      if("speechSynthesis" in window){
        window.speechSynthesis.cancel();
      }

      renderScene();
      setIdlePrompt();
      updateVoiceStatus(false);
    });

    sceneSwitcher.appendChild(button);
  }
}

function createHotspot(item){
  const button = document.createElement("button");

  button.type = "button";
  button.className = "hotspot";
  button.dataset.itemId = item.id;

  button.style.left = item.x + "%";
  button.style.top = item.y + "%";
  button.style.width = item.w + "%";
  button.style.height = item.h + "%";
  button.style.zIndex = String(item.z || 1);

  const localized = getLocalizedItem(item);

  button.setAttribute(
    "aria-label",
    localized ? localized.word : item.id
  );

  const tag = document.createElement("span");
  tag.className = "hotspotTag";
  tag.textContent =
    item.emoji + " " +
    (localized ? localized.word : item.id);

  button.appendChild(tag);

  button.addEventListener("pointerup", event => {
    event.preventDefault();
    selectItem(item.id, true);
  });

  button.addEventListener("keydown", event => {
    if(event.key === "Enter" || event.key === " "){
      event.preventDefault();
      selectItem(item.id, true);
    }
  });

  return button;
}

function renderScene(){
  const scene = getScene();

  sceneImage.src = scene.background;
  sceneImage.alt = scene.alt || "";

  sceneName.textContent =
    scene.title[currentLanguage] ||
    scene.title.en ||
    scene.id;

  subtitle.textContent =
    scene.subtitle;

  document.title =
    scene.documentTitle;

  helpText.textContent =
    scene.help;

  sceneShell.setAttribute(
    "aria-label",
    scene.ariaLabel
  );

  renderSceneSwitcher();

  const existing =
    sceneEl.querySelectorAll(".hotspot");

  existing.forEach(node => node.remove());

  const sortedItems = [...scene.items].sort(
    (a,b) => (a.z || 0) - (b.z || 0)
  );

  for(const item of sortedItems){
    sceneEl.appendChild(createHotspot(item));
  }

  if(currentItemId){
    const selected = getItemById(currentItemId);

    if(selected){
      showItem(selected);
    }
  }
}

function showItem(item){
  const localized = getLocalizedItem(item);

  if(!localized) return;

  bigWord.textContent = localized.word;

  reading.textContent =
    localized.reading
      ? localized.reading
      : "";

  document.documentElement.lang = currentLanguage;

  updateVoiceStatus(false);
}

function selectItem(itemId, shouldSpeak){
  const item = getItemById(itemId);

  if(!item) return;

  currentItemId = itemId;

  showItem(item);

  if(shouldSpeak){
    speakCurrentItem();
  }
}

function loadVoices(){
  if(!("speechSynthesis" in window)){
    availableVoices = [];
    updateVoiceStatus(true);
    return;
  }

  availableVoices =
    window.speechSynthesis.getVoices() || [];

  updateVoiceStatus(false);
}

function normalizeLanguageTag(tag){
  return String(tag || "")
    .trim()
    .toLowerCase()
    .replace("_","-");
}

function chooseVoice(locale){
  if(!availableVoices.length){
    return null;
  }

  const target =
    normalizeLanguageTag(locale);

  const base =
    target.split("-")[0];

  const exactLocal =
    availableVoices.find(voice =>
      normalizeLanguageTag(voice.lang) === target &&
      voice.localService
    );

  if(exactLocal){
    return exactLocal;
  }

  const exact =
    availableVoices.find(voice =>
      normalizeLanguageTag(voice.lang) === target
    );

  if(exact){
    return exact;
  }

  const baseLocal =
    availableVoices.find(voice =>
      normalizeLanguageTag(voice.lang).split("-")[0] === base &&
      voice.localService
    );

  if(baseLocal){
    return baseLocal;
  }

  const baseMatch =
    availableVoices.find(voice =>
      normalizeLanguageTag(voice.lang).split("-")[0] === base
    );

  if(baseMatch){
    return baseMatch;
  }

  return null;
}

function updateVoiceStatus(forceUnsupported){
  if(
    forceUnsupported ||
    !("speechSynthesis" in window) ||
    !("SpeechSynthesisUtterance" in window)
  ){
    voiceStatus.innerHTML =
      '<span class="noSpeech">' +
      "このブラウザでは音声読み上げを利用できません。" +
      "</span>";

    speakAgain.disabled = true;
    speakAgain.setAttribute("aria-disabled","true");

    return;
  }

  speakAgain.disabled = false;
  speakAgain.setAttribute("aria-disabled","false");

  const locale =
    LANGS[currentLanguage].locale;

  const voice =
    chooseVoice(locale);

  if(!availableVoices.length){
    voiceStatus.textContent =
      "端末の音声一覧を読み込み中です。";
    return;
  }

  if(!voice){
    voiceStatus.innerHTML =
      '<span class="noSpeech">' +
      LANGS[currentLanguage].label +
      " の対応音声が端末に見つかりません。" +
      "</span>";

    return;
  }

  voiceStatus.textContent =
    "🔊 " +
    LANGS[currentLanguage].label +
    " / " +
    voice.name;
}

function speakCurrentItem(){
  if(!currentItemId){
    return;
  }

  const item =
    getItemById(currentItemId);

  if(!item){
    return;
  }

  const localized =
    getLocalizedItem(item);

  if(!localized){
    return;
  }

  if(
    !("speechSynthesis" in window) ||
    !("SpeechSynthesisUtterance" in window)
  ){
    updateVoiceStatus(true);
    return;
  }

  const langInfo =
    LANGS[currentLanguage];

  const utterance =
    new SpeechSynthesisUtterance(localized.word);

  utterance.lang =
    langInfo.locale;

  utterance.volume =
    volume;

  utterance.rate =
    rate;

  utterance.pitch =
    1;

  const voice =
    chooseVoice(langInfo.locale);

  if(voice){
    utterance.voice = voice;
  }

  utterance.onstart = () => {
    if(voice){
      voiceStatus.textContent =
        "🔊 発音中 / " +
        voice.name;
    }else{
      voiceStatus.textContent =
        "🔊 発音中";
    }
  };

  utterance.onend = () => {
    updateVoiceStatus(false);
  };

  utterance.onerror = event => {
    if(
      event.error === "canceled" ||
      event.error === "interrupted"
    ){
      return;
    }

    voiceStatus.innerHTML =
      '<span class="noSpeech">' +
      "音声を再生できませんでした。" +
      "</span>";
  };

  window.speechSynthesis.cancel();

  window.setTimeout(() => {
    window.speechSynthesis.speak(utterance);
  }, 40);
}

languageSelect.addEventListener(
  "change",
  () => {
    const value =
      languageSelect.value;

    if(!LANGS[value]){
      return;
    }

    currentLanguage = value;

    safeSet(
      STORAGE.language,
      currentLanguage
    );

    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
    }

    renderScene();

    if(currentItemId){
      speakCurrentItem();
    }else{
      updateVoiceStatus(false);
    }
  }
);

easyButton.addEventListener(
  "click",
  () => {
    easyMode = !easyMode;

    safeSet(
      STORAGE.easy,
      easyMode
    );

    applySettings();
    renderScene();
  }
);

volumeInput.addEventListener(
  "input",
  () => {
    volume =
      clamp(
        Number.parseFloat(volumeInput.value),
        0,
        1
      );

    safeSet(
      STORAGE.volume,
      volume
    );

    volumeOutput.value =
      Math.round(volume * 100) + "%";
  }
);

rateInput.addEventListener(
  "input",
  () => {
    rate =
      clamp(
        Number.parseFloat(rateInput.value),
        0.6,
        1.3
      );

    safeSet(
      STORAGE.rate,
      rate
    );

    rateOutput.value =
      rate.toFixed(2).replace(/0$/,"") + "×";
  }
);

speakAgain.addEventListener(
  "pointerup",
  event => {
    event.preventDefault();

    if(currentItemId){
      speakCurrentItem();
    }
  }
);

sceneImage.addEventListener(
  "error",
  () => {
    voiceStatus.innerHTML =
      '<span class="noSpeech">' +
      "背景画像 " +
      getScene().background +
      " を読み込めません。" +
      "</span>";
  }
);

if("speechSynthesis" in window){
  window.speechSynthesis.onvoiceschanged =
    loadVoices;
}

function init(){
  loadSettings();

  applySettings();

  renderScene();

  loadVoices();

  setIdlePrompt();

  updateVoiceStatus(false);
}

init();
</script>
</body>
</html>
