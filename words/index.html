<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#162018">
<title>SALP WORDS | 単語学習 部屋編</title>

<style>
:root{
  --bg:#101510;
  --panel:rgba(18,27,20,.94);
  --panel2:rgba(255,255,255,.95);
  --text:#fffdf6;
  --sub:#d5ddcf;
  --accent:#ffd86a;
  --accent2:#94d68b;
  --danger:#ff9c8d;
  --line:rgba(255,255,255,.18);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    "Noto Sans",
    sans-serif;
}

body{
  overscroll-behavior:none;
}

button,
select,
input,
a{
  font:inherit;
}

button{
  cursor:pointer;
}

:root{
  --sw:min(100vw,calc(100vh * 9 / 16));
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
}

@supports (height:100dvh){
  :root{
    --sw:min(100vw,calc(100dvh * 9 / 16));
  }
}

html,body{
  height:100%;
  overflow:hidden;
}

.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  margin:-1px;
  padding:0;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}

.app{
  position:relative;
  height:100vh;
  height:100dvh;
  overflow:hidden;
}

/* ---------- 上部コンパクトバー(絵に重ねる) ---------- */
header{
  position:fixed;
  z-index:2000;
  top:0;
  left:calc((100% - var(--sw)) / 2);
  width:var(--sw);
  padding:calc(var(--safe-top) + 6px) 8px 8px;
  border-radius:0 0 18px 18px;
  background:rgba(12,18,14,.62);
  pointer-events:none;
}

header a,
header button,
header select,
header input,
.sceneBand,
.menuPanel{
  pointer-events:auto;
}

.sceneToggle{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  min-width:0;
  min-height:48px;
  padding:0 12px;
  border:3px solid var(--accent);
  border-radius:14px;
  background:#12301c;
  color:#ffe278;
  font-weight:900;
  font-size:.95rem;
  text-align:left;
}

.sceneToggleText{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

header.scenesClosed .sceneBand{
  display:none;
}

header.scenesClosed .headerTop{
  padding-bottom:0;
}

header.scenesClosed{
  padding-bottom:6px;
}

header::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  border-radius:inherit;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.headerTop{
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 0 6px;
}

.backLink{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:none;
  min-width:48px;
  min-height:48px;
  padding:0 10px;
  color:white;
  text-decoration:none;
  border:1px solid rgba(255,255,255,.28);
  border-radius:14px;
  background:rgba(255,255,255,.12);
  font-weight:700;
}

.titleWrap{
  min-width:0;
  flex:1;
}

.title{
  margin:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:1rem;
  font-weight:900;
  letter-spacing:.02em;
}

.subtitle{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  margin-top:1px;
  color:var(--sub);
  font-size:.72rem;
  font-weight:700;
}

.sceneBand{
  padding:0;
}

.sceneLabel{
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
}

.sceneSwitcher{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  grid-auto-flow:row;
  gap:6px;
}

.sceneButton:last-child:nth-child(3n+1){
  grid-column:1 / -1;
}

.sceneButton{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  min-width:0;
  min-height:58px;
  border:3px solid #4d5f4f;
  border-radius:14px;
  padding:4px 4px;
  background:#fff;
  color:#17201a;
  font-size:.8rem;
  font-weight:800;
  line-height:1.15;
  text-align:center;
}

.sceneIcon{
  flex:none;
  font-size:1.5rem;
  line-height:1;
}

.sceneText{
  min-width:0;
  max-width:100%;
  overflow-wrap:anywhere;
}

.sceneCheck{
  display:none;
  position:absolute;
  top:1px;
  right:5px;
  font-size:.9rem;
  font-weight:900;
}

.sceneButton[aria-pressed="true"]{
  border-color:var(--accent);
  background:#12301c;
  color:#ffe278;
  font-weight:900;
  box-shadow:0 4px 10px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.25);
}

.sceneButton[aria-pressed="true"] .sceneCheck{
  display:inline;
}

@media (max-width:380px){
  .sceneButton{
    padding:4px 2px;
    font-size:.74rem;
  }
}

.sceneButton:focus-visible{
  outline:4px solid #0b57d0;
  outline-offset:2px;
}

.sceneButton[aria-pressed="true"]:focus-visible{
  outline-color:#fff;
}

@media (prefers-reduced-motion:no-preference){
  .sceneButton{
    transition:background-color .15s,color .15s,box-shadow .15s;
  }
}

select,
.modeButton,
.menuButton{
  min-height:48px;
  border:none;
  border-radius:14px;
  color:#182018;
  background:#fffdf6;
  padding:0 12px;
  font-weight:900;
}

.modeButton{
  flex:none;
  padding:0 10px;
  font-size:.86rem;
  white-space:nowrap;
}

.modeButton[aria-pressed="true"]{
  background:var(--accent);
}

.menuButton{
  flex:none;
  min-width:48px;
  padding:0;
  font-size:1.3rem;
  line-height:1;
}

.menuButton[aria-expanded="true"]{
  background:var(--accent);
}

/* ---------- 設定ドロワー(言語・音量・速度) ---------- */
.menuPanel{
  position:absolute;
  top:100%;
  left:0;
  right:0;
  margin-top:6px;
  max-height:calc(100vh - 140px);
  max-height:calc(100dvh - 140px);
  overflow-y:auto;
  padding:10px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(12,18,14,.94);
  box-shadow:0 10px 30px rgba(0,0,0,.45);
}

.menuPanel[hidden]{
  display:none;
}

.menuPanel select{
  width:100%;
}

.settingsRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}

.setting{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;
  padding:8px 10px;
}

.setting label{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  color:var(--sub);
  font-size:.78rem;
  font-weight:800;
  margin-bottom:5px;
}

.setting output{
  color:white;
  font-variant-numeric:tabular-nums;
}

input[type="range"]{
  width:100%;
  accent-color:var(--accent);
}

/* ---------- 絵のステージ(全画面) ---------- */
main{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#1d281f;
}

.stageBg{
  position:absolute;
  inset:-6%;
  width:112%;
  height:112%;
  object-fit:cover;
  filter:blur(22px) brightness(.55) saturate(1.1);
  pointer-events:none;
}

.sceneShell{
  position:relative;
  width:var(--sw);
}

.sceneInfo{
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
}

.scene{
  position:relative;
  isolation:isolate;
  width:100%;
  aspect-ratio:9 / 16;
  overflow:hidden;
  background:#263027;
  user-select:none;
  touch-action:manipulation;
}

.sceneImage{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  pointer-events:none;
}

.hotspot{
  position:absolute;
  border:0;
  padding:0;
  margin:0;
  background:transparent;
  border-radius:18px;
  touch-action:manipulation;
  cursor:pointer;
}

.hotspot::before{
  content:"";
  position:absolute;
  inset:2px;
  border:2px solid transparent;
  border-radius:inherit;
  transition:
    background .15s ease,
    border-color .15s ease,
    transform .15s ease;
}

.hotspot:active::before{
  transform:scale(.96);
  background:rgba(255,222,97,.25);
}

.hotspot:focus-visible::before{
  outline:4px solid #fff;
  outline-offset:2px;
  border-color:#ffd75e;
  background:rgba(255,215,94,.18);
}

.easy .hotspot::before{
  border-color:rgba(255,242,166,.62);
  background:rgba(255,224,99,.09);
  box-shadow:
    0 0 0 2px rgba(0,0,0,.14),
    inset 0 0 16px rgba(255,236,145,.10);
}

.hotspotTag{
  display:none;
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  white-space:nowrap;
  pointer-events:none;
  padding:4px 7px;
  border-radius:999px;
  background:rgba(10,15,11,.82);
  color:white;
  font-size:.67rem;
  font-weight:900;
  box-shadow:0 2px 8px rgba(0,0,0,.24);
}

.easy .hotspotTag{
  display:block;
}

/* ---------- 単語オーバーレイ(絵の下部・タップを邪魔しない) ---------- */
.wordPanel{
  position:fixed;
  z-index:1500;
  left:50%;
  bottom:calc(10px + var(--safe-bottom));
  transform:translateX(-50%);
  width:calc(var(--sw) - 16px);
  max-height:42vh;
  max-height:42dvh;
  border-radius:20px;
  padding:10px 12px;
  background:rgba(8,12,9,.66);
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 8px 28px rgba(0,0,0,.4);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.6);
  pointer-events:none;
}

.wordPanel button{
  pointer-events:auto;
}

.wordTop{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:8px;
}

.wordText{
  min-width:0;
}

.bigWord{
  font-size:clamp(1.9rem,calc(var(--sw) * .08),2.9rem);
  line-height:1.08;
  font-weight:900;
  overflow-wrap:anywhere;
  hyphens:auto;
}

.reading{
  min-height:1.25em;
  margin-top:3px;
  color:#ffe891;
  font-size:clamp(.95rem,calc(var(--sw) * .04),1.15rem);
  font-weight:800;
  overflow-wrap:anywhere;
}

.speakAgain{
  min-width:52px;
  min-height:52px;
  border:0;
  border-radius:16px;
  background:var(--accent);
  color:#1e210f;
  font-size:1.6rem;
  font-weight:900;
  text-shadow:none;
}

.voiceStatus{
  margin-top:5px;
  font-size:.7rem;
  line-height:1.3;
  color:var(--sub);
  min-height:1em;
  overflow-wrap:anywhere;
}

.panelToggle{
  position:absolute;
  right:12px;
  bottom:100%;
  margin-bottom:6px;
  min-height:36px;
  padding:0 14px;
  border:1px solid rgba(255,255,255,.3);
  border-radius:999px;
  background:rgba(8,12,9,.7);
  color:#fff;
  font-size:.85rem;
  font-weight:800;
  text-shadow:none;
}

/* 物をタッチして数秒たつと帯を薄くし、下端の物をタッチしやすくする */
@media (prefers-reduced-motion:no-preference){
  .wordPanel{
    transition:opacity .4s ease;
  }
}

.wordPanel.faded{
  opacity:.3;
}

.wordPanel.faded:focus-within{
  opacity:1;
}

.wordPanel.faded .speakAgain,
.wordPanel.faded .panelToggle{
  pointer-events:none;
}

.wordPanel.faded:focus-within .speakAgain,
.wordPanel.faded:focus-within .panelToggle{
  pointer-events:auto;
}

/* 未選択: 小さなヒントだけ */
.wordPanel.idle{
  width:auto;
  max-width:calc(var(--sw) - 16px);
  padding:7px 16px;
  border-radius:999px;
  text-align:center;
}

.wordPanel.idle .bigWord{
  font-size:1.05rem;
  line-height:1.2;
}

.wordPanel.idle .reading{
  min-height:0;
  margin-top:1px;
  font-size:.82rem;
}

.wordPanel.idle .speakAgain,
.wordPanel.idle .panelToggle{
  display:none;
}

.wordPanel.idle .wordTop{
  grid-template-columns:minmax(0,1fr);
}

.wordPanel.idle .voiceStatus:not(:has(.noSpeech)){
  display:none;
}

/* 畳んだ状態: ボタンだけ残す */
.wordPanel.collapsed{
  width:auto;
  padding:0;
  border:0;
  background:none;
  box-shadow:none;
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
}

.wordPanel.collapsed .wordBox{
  display:none;
}

.wordPanel.collapsed .panelToggle{
  position:static;
  margin:0;
  background:rgba(8,12,9,.78);
}

/* 見やすいモード */
.easy .bigWord{
  font-size:clamp(2.2rem,calc(var(--sw) * .1),3.6rem);
  font-weight:950;
}

.easy .reading{
  font-size:clamp(1.2rem,calc(var(--sw) * .05),1.5rem);
}

.easy .wordPanel{
  background:rgba(4,7,5,.9);
  border:3px solid #ffe278;
}

.easy .wordPanel.idle .bigWord{
  font-size:1.35rem;
}

.easy .wordPanel.idle .reading{
  font-size:1.05rem;
}

.easy .speakAgain{
  min-width:60px;
  min-height:60px;
}

.easy .wordPanel.collapsed{
  border:0;
  background:none;
}

.easy .voiceStatus{
  font-size:.82rem;
}

.easy .sceneToggle{
  min-height:56px;
  font-size:1.05rem;
}

.easy select,
.easy .modeButton,
.easy .menuButton,
.easy .backLink{
  min-height:56px;
  font-size:1.02rem;
}

.easy .menuButton,
.easy .backLink{
  min-width:56px;
}

.easy .sceneButton{
  min-height:66px;
  font-size:.95rem;
}

.easy .sceneIcon{
  font-size:1.7rem;
}

.help{
  margin-top:8px;
  padding:9px 12px;
  border-radius:14px;
  color:#e8eee5;
  background:rgba(255,255,255,.06);
  font-size:.79rem;
  line-height:1.5;
}

.noSpeech{
  color:var(--danger);
  font-weight:800;
}

@media (max-width:480px){
  .modeButton{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:0 7px;
    font-size:.72rem;
    line-height:1.15;
  }
}

/* ---------- スマホ横向き: 左に操作レール、右に単語パネル、中央に絵 ---------- */
@media (orientation:landscape) and (max-height:520px){
  header{
    top:0;
    bottom:0;
    left:0;
    width:min(200px,calc((100vw - 100vh * 9 / 16) / 2 - 6px));
    padding:calc(var(--safe-top) + 6px) 8px 6px calc(var(--safe-left) + 8px);
    border-radius:0 18px 18px 0;
    display:flex;
    flex-direction:column;
    gap:6px;
    pointer-events:auto;
  }

  .sceneToggle{
    display:none;
  }

  header.scenesClosed .sceneBand{
    display:block;
  }

  .headerTop{
    padding:0;
    gap:6px;
  }

  .titleWrap{
    display:none;
  }

  .backLink,
  .menuButton{
    min-width:0;
    flex:1;
    min-height:44px;
  }

  .modeButton{
    flex-direction:row;
    gap:3px;
    min-height:44px;
    padding:0 8px;
    font-size:.78rem;
  }

  .sceneBand{
    flex:1;
    min-height:0;
    overflow-y:auto;
  }

  .sceneSwitcher{
    grid-template-columns:none;
    grid-auto-flow:row;
    grid-auto-rows:minmax(38px,1fr);
    grid-auto-columns:auto;
    height:100%;
    max-height:260px;
  }

  .sceneButton{
    flex-direction:row;
    gap:6px;
    min-height:38px;
    padding:2px 6px;
    font-size:.85rem;
    justify-content:flex-start;
  }

  .sceneIcon{
    font-size:1.3rem;
  }

  .sceneCheck{
    top:auto;
    right:6px;
  }

  .easy .sceneButton{
    min-height:40px;
    font-size:.9rem;
  }

  .easy .backLink,
  .easy .menuButton,
  .easy .modeButton{
    min-height:48px;
  }

  .menuPanel{
    top:6px;
    left:100%;
    right:auto;
    margin:0 0 0 6px;
    width:min(340px,calc(100vw - 100% - 16px));
    max-height:calc(100vh - 12px);
    max-height:calc(100dvh - 12px);
  }

  .wordPanel,
  .wordPanel.idle{
    left:calc(50% + var(--sw) / 2 + 10px);
    right:calc(10px + var(--safe-right));
    width:auto;
    max-width:none;
    transform:none;
    max-height:calc(100vh - 70px);
    max-height:calc(100dvh - 70px);
  }

  .wordPanel.collapsed{
    left:auto;
  }

  .wordPanel.faded{
    opacity:1;
  }

  .wordPanel.faded .speakAgain,
  .wordPanel.faded .panelToggle{
    pointer-events:auto;
  }

  .bigWord{
    font-size:clamp(1.5rem,8.5vh,2.3rem);
  }

  .easy .bigWord{
    font-size:clamp(1.8rem,10.5vh,2.9rem);
  }

  .reading{
    font-size:clamp(.9rem,4.5vh,1.1rem);
  }

  .easy .reading{
    font-size:clamp(1.05rem,5.5vh,1.3rem);
  }
}
</style>
</head>

<body>
<div class="app" id="app">

<header>
  <div class="headerTop">
    <a class="backLink" href="../index.html" aria-label="indexに戻る">←</a>

    <div class="titleWrap sr-only">
      <h1 class="title">🗣 SALP WORDS</h1>
      <div class="subtitle" id="subtitle">単語学習 部屋編</div>
    </div>

    <button
      type="button"
      class="sceneToggle"
      id="sceneToggle"
      aria-expanded="true"
      aria-controls="sceneBand"
    >
      <span class="sceneToggleText" id="sceneToggleText">🗣 場面</span>
      <span aria-hidden="true">▾</span>
    </button>

    <button
      type="button"
      class="modeButton"
      id="easyButton"
      aria-pressed="false"
    >
      <span aria-hidden="true">👀</span>
      <span>見やすい</span>
    </button>

    <button
      type="button"
      class="menuButton"
      id="menuButton"
      aria-expanded="false"
      aria-controls="menuPanel"
      aria-label="設定(言語・音量・速度)"
    >
      ⚙
    </button>
  </div>

  <div class="sceneBand" id="sceneBand">
    <div class="sceneLabel" id="sceneLabel">場面をえらぶ / Choose a scene</div>
    <div
      class="sceneSwitcher"
      id="sceneSwitcher"
      role="group"
      aria-labelledby="sceneLabel"
    ></div>
  </div>

  <div class="menuPanel" id="menuPanel" hidden>
    <select id="languageSelect" aria-label="学習する言語">
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="zh">中文</option>
      <option value="ko">한국어</option>
    </select>

    <div class="settingsRow">
      <div class="setting">
        <label for="volume">
          <span>🔊 音量</span>
          <output id="volumeOutput">100%</output>
        </label>
        <input
          id="volume"
          type="range"
          min="0"
          max="1"
          step="0.05"
          value="1"
        >
      </div>

      <div class="setting">
        <label for="rate">
          <span>🐢 速度</span>
          <output id="rateOutput">1.0×</output>
        </label>
        <input
          id="rate"
          type="range"
          min="0.6"
          max="1.3"
          step="0.05"
          value="1"

function safeGet(key, fallback){
  try{
    const value = localStorage.getItem(key);
    return value === null ? fallback : value;
  }catch(error){
    return fallback;
  }
}

function safeSet(key, value){
  try{
    localStorage.setItem(key, String(value));
  }catch(error){
    /* 保存不可の場合でもアプリは動作継続 */
  }
}

function clamp(value, min, max){
  return Math.min(max, Math.max(min, value));
}

function loadSettings(){
  const savedLanguage = safeGet(STORAGE.language, "ja");

  if(LANGS[savedLanguage]){
    currentLanguage = savedLanguage;
  }

  currentSceneId = safeGet(STORAGE.scene, "room");

  if(!SCENES[currentSceneId]){
    currentSceneId = "room";
  }

  easyMode = safeGet(STORAGE.easy, "false") === "true";

  volume = clamp(
    Number.parseFloat(safeGet(STORAGE.volume, "1")) || 1,
    0,
    1
  );

  rate = clamp(
    Number.parseFloat(safeGet(STORAGE.rate, "1")) || 1,
    0.6,
    1.3
  );
}

function applySettings(){
  languageSelect.value = currentLanguage;

  easyButton.setAttribute(
    "aria-pressed",
    easyMode ? "true" : "false"
  );

  app.classList.toggle("easy", easyMode);

  volumeInput.value = String(volume);
  rateInput.value = String(rate);

  volumeOutput.value =
    Math.round(volume * 100) + "%";

  rateOutput.value =
    rate.toFixed(2).replace(/0$/,"") + "×";
}

function getScene(){
  return SCENES[currentSceneId];
}

function getItemById(id){
  return getScene().items.find(item => item.id === id) || null;
}

function getLocalizedItem(item){
  if(!item) return null;

  return (
    item.words[currentLanguage] ||
    item.words.en ||
    item.words.ja
  );
}

let fadeTimer = null;

function wakePanel(){
  window.clearTimeout(fadeTimer);
  wordPanel.classList.remove("faded");
}

function schedulePanelFade(){
  wakePanel();
  fadeTimer = window.setTimeout(() => {
    wordPanel.classList.add("faded");
  }, 3500);
}

function setIdlePrompt(){
  const scene = getScene();

  wakePanel();
  wordPanel.classList.add("idle");

  bigWord.textContent =
    currentLanguage === "ja"
      ? "タッチしてね"
      : "Touch";

  reading.textContent =
    currentLanguage === "ja"
      ? scene.promptJa
      : "Tap an object";
}

function renderSceneSwitcher(){
  const focusedId =
    sceneSwitcher.contains(document.activeElement)
      ? document.activeElement.dataset.sceneId
      : null;

  sceneSwitcher.textContent = "";
  sceneLabel.textContent =
    SCENE_LABELS[currentLanguage] || SCENE_LABELS.en;

  for(const scene of Object.values(SCENES)){
    const button = document.createElement("button");

    button.type = "button";
    button.className = "sceneButton";
    button.dataset.sceneId = scene.id;

    button.setAttribute(
      "aria-pressed",
      scene.id === currentSceneId ? "true" : "false"
    );

    const icon = scene.icon || "📍";
    let name =
      scene.title[currentLanguage] ||
      scene.title.en ||
      scene.id;

    if(name.startsWith(icon)){
      name = name.slice(icon.length).trim();
    }

    const iconEl = document.createElement("span");
    iconEl.className = "sceneIcon";
    iconEl.setAttribute("aria-hidden", "true");
    iconEl.textContent = icon;

    const textEl = document.createElement("span");
    textEl.className = "sceneText";
    textEl.textContent = name;

    const checkEl = document.createElement("span");
    checkEl.className = "sceneCheck";
    checkEl.setAttribute("aria-hidden", "true");
    checkEl.textContent = "✓";

    button.append(iconEl, textEl, checkEl);

    button.addEventListener("click", () => {
      if(scene.id === currentSceneId){
        return;
      }

      currentSceneId = scene.id;
      currentItemId = null;

      safeSet(
        STORAGE.scene,
        currentSceneId
      );

      if("speechSynthesis" in window){
        window.speechSynthesis.cancel();
      }

      renderScene();
      setIdlePrompt();
      updateVoiceStatus(false);
    });

    sceneSwitcher.appendChild(button);

    if(scene.id === focusedId){
      button.focus({ preventScroll: true });
    }
  }
}

function createHotspot(item){
  const button = document.createElement("button");

  button.type = "button";
  button.className = "hotspot";
  button.dataset.itemId = item.id;

  button.style.left = item.x + "%";
  button.style.top = item.y + "%";
  button.style.width = item.w + "%";
  button.style.height = item.h + "%";
  button.style.zIndex = String(item.z || 1);

  const localized = getLocalizedItem(item);

  button.setAttribute(
    "aria-label",
    localized ? localized.word : item.id
  );

  const tag = document.createElement("span");
  tag.className = "hotspotTag";
  tag.textContent =
    item.emoji + " " +
    (localized ? localized.word : item.id);

  button.appendChild(tag);

  button.addEventListener("pointerup", event => {
    event.preventDefault();
    selectItem(item.id, true);
  });

  button.addEventListener("keydown", event => {
    if(event.key === "Enter" || event.key === " "){
      event.preventDefault();
      selectItem(item.id, true);
    }
  });

  return button;
}

function renderScene(){
  const scene = getScene();

  sceneImage.src = scene.background;
  stageBg.src = scene.background;
  sceneImage.alt = scene.alt || "";

  sceneName.textContent =
    scene.title[currentLanguage] ||
    scene.title.en ||
    scene.id;

  subtitle.textContent =
    scene.subtitle;

  document.title =
    scene.documentTitle;

  helpText.textContent =
    scene.help;

  sceneShell.setAttribute(
    "aria-label",
    scene.ariaLabel
  );

  renderSceneSwitcher();
  updateSceneToggle();

  const existing =
    sceneEl.querySelectorAll(".hotspot");

  existing.forEach(node => node.remove());

  const sortedItems = [...scene.items].sort(
    (a,b) => (a.z || 0) - (b.z || 0)
  );

  for(const item of sortedItems){
    sceneEl.appendChild(createHotspot(item));
  }

  if(currentItemId){
    const selected = getItemById(currentItemId);

    if(selected){
      showItem(selected);
    }
  }
}

function showItem(item){
  const localized = getLocalizedItem(item);

  if(!localized) return;

  wordPanel.classList.remove("idle");
  schedulePanelFade();

  bigWord.textContent = localized.word;

  reading.textContent =
    localized.reading
      ? localized.reading
      : "";

  document.documentElement.lang = currentLanguage;

  updateVoiceStatus(false);
}

  );
}

  );

document.addEventListener("pointerdown", event => {
  if(
    !menuPanel.hidden &&
    !menuPanel.contains(event.target) &&
    !menuButton.contains(event.target)
  ){
    setMenuOpen(false);
  }
});

document.addEventListener("keydown", event => {
  if(event.key === "Escape" && !menuPanel.hidden){
    setMenuOpen(false);
    menuButton.focus();
  }
});

function selectItem(itemId, shouldSpeak){
  const item = getItemById(itemId);

  if(!item) return;

  currentItemId = itemId;

  setPanelCollapsed(false);

  showItem(item);

  if(shouldSpeak){
    speakCurrentItem();
  }
}

function loadVoices(){
  if(!("speechSynthesis" in window)){
    availableVoices = [];
    updateVoiceStatus(true);
    return;
  }

  availableVoices =
    window.speechSynthesis.getVoices() || [];

  updateVoiceStatus(false);
}

function normalizeLanguageTag(tag){
  return String(tag || "")
    .trim()
    .toLowerCase()
    .replace("_","-");
}

function chooseVoice(locale){
  if(!availableVoices.length){
    return null;
  }

  const target =
    normalizeLanguageTag(locale);

  const base =
    target.split("-")[0];

  const exactLocal =
    availableVoices.find(voice =>
      normalizeLanguageTag(voice.lang) === target &&
      voice.localService
    );

  if(exactLocal){
    return exactLocal;
  }

  const exact =
    availableVoices.find(voice =>
      normalizeLanguageTag(voice.lang) === target
    );

  if(exact){
    return exact;
  }

  const baseLocal =
    availableVoices.find(voice =>
      normalizeLanguageTag(voice.lang).split("-")[0] === base &&
      voice.localService
    );

  if(baseLocal){
    return baseLocal;
  }

  const baseMatch =
    availableVoices.find(voice =>
      normalizeLanguageTag(voice.lang).split("-")[0] === base
    );

  if(baseMatch){
    return baseMatch;
  }

  return null;
}

function updateVoiceStatus(forceUnsupported){
  if(
    forceUnsupported ||
    !("speechSynthesis" in window) ||
    !("SpeechSynthesisUtterance" in window)
  ){
    voiceStatus.innerHTML =
      '<span class="noSpeech">' +
      "このブラウザでは音声読み上げを利用できません。" +
      "</span>";

    speakAgain.disabled = true;
    speakAgain.setAttribute("aria-disabled","true");

    return;
  }

  speakAgain.disabled = false;
  speakAgain.setAttribute("aria-disabled","false");

  const locale =
    LANGS[currentLanguage].locale;

  const voice =
    chooseVoice(locale);

  if(!availableVoices.length){
    voiceStatus.textContent =
      "端末の音声一覧を読み込み中です。";
    return;
  }

  if(!voice){
    voiceStatus.innerHTML =
      '<span class="noSpeech">' +
      LANGS[currentLanguage].label +
      " の対応音声が端末に見つかりません。" +
      "</span>";

    return;
  }

  voiceStatus.textContent =
    "🔊 " +
    LANGS[currentLanguage].label +
    " / " +
    voice.name;
}

function speakCurrentItem(){
  if(!currentItemId){
    return;
  }

  const item =
    getItemById(currentItemId);

  if(!item){
    return;
  }

  const localized =
    getLocalizedItem(item);

  if(!localized){
    return;
  }

  if(
    !("speechSynthesis" in window) ||
    !("SpeechSynthesisUtterance" in window)
  ){
    updateVoiceStatus(true);
    return;
  }

  const langInfo =
    LANGS[currentLanguage];

  const utterance =
    new SpeechSynthesisUtterance(localized.word);

  utterance.lang =
    langInfo.locale;

  utterance.volume =
    volume;

  utterance.rate =
    rate;

  utterance.pitch =
    1;

  const voice =
    chooseVoice(langInfo.locale);

  if(voice){
    utterance.voice = voice;
  }

  utterance.onstart = () => {
    if(voice){
      voiceStatus.textContent =
        "🔊 発音中 / " +
        voice.name;
    }else{
      voiceStatus.textContent =
        "🔊 発音中";
    }
  };

  utterance.onend = () => {
    updateVoiceStatus(false);
  };

  utterance.onerror = event => {
    if(
      event.error === "canceled" ||
      event.error === "interrupted"
    ){
      return;
    }

    voiceStatus.innerHTML =
      '<span class="noSpeech">' +
      "音声を再生できませんでした。" +
      "</span>";
  };

  window.speechSynthesis.cancel();

  window.setTimeout(() => {
    window.speechSynthesis.speak(utterance);
  }, 40);
}

languageSelect.addEventListener(
  "change",
  () => {
    const value =
      languageSelect.value;

    if(!LANGS[value]){
      return;
    }

    currentLanguage = value;

    safeSet(
      STORAGE.language,
      currentLanguage
    );

    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
    }

    renderScene();

    if(currentItemId){
      speakCurrentItem();
    }else{
      updateVoiceStatus(false);
    }
  }
);

easyButton.addEventListener(
  "click",
  () => {
    easyMode = !easyMode;

    safeSet(
      STORAGE.easy,
      easyMode
    );

    applySettings();
    renderScene();
  }
);

volumeInput.addEventListener(
  "input",
  () => {
    volume =
      clamp(
        Number.parseFloat(volumeInput.value),
        0,
        1
      );

    safeSet(
      STORAGE.volume,
      volume
    );

    volumeOutput.value =
      Math.round(volume * 100) + "%";
  }
);

rateInput.addEventListener(
  "input",
  () => {
    rate =
      clamp(
        Number.parseFloat(rateInput.value),
        0.6,
        1.3
      );

    safeSet(
      STORAGE.rate,
      rate
    );

    rateOutput.value =
      rate.toFixed(2).replace(/0$/,"") + "×";
  }
);

speakAgain.addEventListener(
  "pointerup",
  event => {
    event.preventDefault();

    if(currentItemId){
      schedulePanelFade();
      speakCurrentItem();
    }
  }
);

sceneImage.addEventListener(
  "error",
  () => {
    voiceStatus.innerHTML =
      '<span class="noSpeech">' +
      "背景画像 " +
      getScene().background +
      " を読み込めません。" +
      "</span>";
  }
);

if("speechSynthesis" in window){
  window.speechSynthesis.onvoiceschanged =
    loadVoices;
}

function init(){
  loadSettings();

  applySettings();

  renderScene();

  loadVoices();

  setIdlePrompt();

  updateVoiceStatus(false);
}

init();
</script>
</body>
</html>
