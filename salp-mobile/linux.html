<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>salp Linux — Reset</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eff7ff;font:16px system-ui}header,section{padding:12px}h1{font-size:22px;margin:4px 0}button,input,select{font:inherit}button,a,select{min-height:44px;padding:10px;border:1px solid #4b6d8c;border-radius:10px;background:#122941;color:white}a{display:inline-block;text-decoration:none}button:disabled{opacity:.4}.row{display:flex;gap:8px;flex-wrap:wrap}input{background:#091522;color:white;border:1px solid #36516e;border-radius:8px;padding:10px;min-width:0}#image{width:100%}#command{flex:1;width:0}#status{overflow-wrap:anywhere;line-height:1.5}#output{height:45vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#030a06;color:#a8ffb3;padding:12px;font:13px/1.5 monospace}#screen{position:relative;height:60vh;height:60dvh;overflow:hidden;background:black}canvas{position:absolute;transform-origin:0 0;touch-action:none}details{padding:10px}#diagnostics{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}[hidden]{display:none!important}.error{color:#ffb4b4}label{display:block;margin:10px 0}p{line-height:1.5}
</style></head><body><header><div class="row"><a href="./index.html">← Desktop</a><button id="copy">診断をコピー</button><button id="reload">再読み込み</button></div><h1>salp Linux — Reset v0.1</h1><p id="status" role="status">起動環境を確認中…</p><div class="row"><select id="mode" aria-label="Linux起動モード"><option value="terminal">Linux Terminal</option><option value="gui">Linux GUI（検証用）</option></select><button id="boot" disabled>Linuxを起動</button></div><p>まずTerminalで実際のLinuxコマンドを確認できます。GUIは別の起動モードです。</p></header>
<details><summary>イメージとネットワーク</summary><p>空欄は公式Alpine。任意のext2はHTTPSの直リンクを指定してください。Firefox入りのディスク本体は付属しません。</p><input id="image" type="url" placeholder="https://…/salp-browser.ext2"><button id="network" disabled>Tailscale接続</button><a id="login" hidden target="_blank" rel="noopener">ログイン</a><p id="netStatus"></p></details>
<div id="screen" hidden><canvas id="display" width="720" height="1080" tabindex="0"></canvas></div><pre id="output" aria-label="Linux出力"></pre><section><form id="inputForm" class="row"><input id="command" aria-label="Linuxに送る文字" placeholder="Linuxに送る文字・コマンド" autocapitalize="none" autocomplete="off" disabled><button id="sendBtn" disabled>送信 ↵</button></form><div class="row"><button data-key="3" disabled>Ctrl+C</button><button data-key="9" disabled>Tab</button><button data-key="27" disabled>Esc</button><button data-seq="[A" disabled>↑</button><button data-seq="[B" disabled>↓</button><button data-key="13" disabled>Enter</button></div><p>入力欄と送信はTerminal用です。GUIはLinux画面で操作してください。</p><details open><summary>起動診断</summary><pre id="diagnostics"></pre></details></section>
<script>
window.salpStage=(stage,detail='')=>{document.getElementById('status').textContent=stage+' '+detail;};window.salpFatal=(stage,error)=>{const s=document.getElementById('status');s.textContent=stage+': '+(error?.message||error);s.classList.add('error');};
</script><script src="./runtime-ready.js?v=reset01"></script><script type="module" src="./linux.js?v=reset01"></script></body></html>
