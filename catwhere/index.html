.place .pc svg{width:100%;height:100%;display:block}

.place.bad{animation:shake .3s}
.place:disabled{cursor:default}
.place:not(:disabled):active{transform:scale(.96)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.note{font-size:.75rem;color:#6a8aa5;text-align:center}

/* ===== SalpAudio: 音声アンロック共通ヘルパー(各単一HTMLにインラインコピーして使う) =====

  return true;
}
/* にゃん!風: のこぎり波の高さを上げて下げる + 2つの帯域フィルタ(母音「ア」っぽい響き) */
function meow(i,dur){
  if(!ready())return;
  var t=ctx.currentTime+0.005,f=BASE[i];dur=Math.min(0.4,Math.max(0.16,dur||0.28));
  var o=ctx.createOscillator();o.type='sawtooth';
  o.frequency.setValueAtTime(f*0.8,t);
  o.frequency.linearRampToValueAtTime(f*1.3,t+dur*0.3);
  o.frequency.linearRampToValueAtTime(f*0.85,t+dur);
  var lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=7;lg.gain.value=f*0.015;lfo.connect(lg);lg.connect(o.frequency);
  var f1=ctx.createBiquadFilter();f1.type='bandpass';f1.Q.value=4;
  f1.frequency.setValueAtTime(500,t);f1.frequency.linearRampToValueAtTime(1100,t+dur*0.35);f1.frequency.linearRampToValueAtTime(700,t+dur);
  var f2=ctx.createBiquadFilter();f2.type='bandpass';f2.Q.value=6;
  f2.frequency.setValueAtTime(1800,t);f2.frequency.linearRampToValueAtTime(2600,t+dur*0.35);f2.frequency.linearRampToValueAtTime(2000,t+dur);
  var g1=ctx.createGain(),g2=ctx.createGain(),eg=ctx.createGain();
  g1.gain.value=1.4;g2.gain.value=0.7;
  eg.gain.setValueAtTime(0.0001,t);eg.gain.linearRampToValueAtTime(0.5,t+0.04);
  eg.gain.setValueAtTime(0.5,t+dur*0.6);eg.gain.linearRampToValueAtTime(0.0001,t+dur);
  o.connect(f1);o.connect(f2);f1.connect(g1);f2.connect(g2);g1.connect(eg);g2.connect(eg);eg.connect(master);
  o.start(t);lfo.start(t);o.stop(t+dur+0.03);lfo.stop(t+dur+0.03);
}
function blip(freq,t0,dur,type,vol,slideTo){
  if(!ready())return;
  var o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'triangle';
  o.frequency.setValueAtTime(freq,t0);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
  var v=(vol||1)*0.3;g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(v,t0+0.01);
  g.gain.linearRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.02);
}
function melody(list,step,dur,type,vol){if(!ready())return;var t=ctx.currentTime+0.02;list.forEach(function(f,i){blip(f,t+i*step,dur,type,vol)})}
var sfx={
  clear:function(){melody([784,988,1175,1568],0.09,0.12,'triangle',1)},
  miss:function(){if(!ready())return;var t=ctx.currentTime+0.01;blip(260,t,0.3,'sawtooth',0.6,120)},
  over:function(){melody([523,440,392,330,262],0.2,0.22,'triangle',1)},
  start:function(){melody([660,880,660,990],0.08,0.1,'triangle',.9)}
};


sfx.show=function(){melody([784,988],0.08,0.09,'triangle',.8)};
sfx.hide=function(){melody([988,784,659],0.06,0.07,'triangle',.7)};
sfx.start=function(){melody([660,880,660,990],0.08,0.1,'triangle',.9)};

/* ---------- ゲーム ---------- */
var board=$('board'), places=[];
var G={run:0,phase:'idle',mode:modeKey(),round:0,score:0,lives:LIVES,cats:[],found:0,need:0,wrong:0,timer:null,iv:null,newBest:false};
function after(ms,fn){var r=G.run;clearTimeout(G.timer);G.timer=setTimeout(function(){if(r===G.run)fn()},ms)}
function say(t){$('msg').textContent=t}
function bonusSay(t){$('bonus').textContent=t||''}
function hearts(){var s='';for(var i=0;i<LIVES;i++)s+=i<G.lives?'❤':'♡';return s}
function render(){
  $('sc').textContent=G.score;$('lives').textContent=hearts();
  $('stRound').textContent=G.round>0?G.round:'-';$('stCats').textContent=G.round>0?G.need:'-';
  var m=G.phase==='idle'?modeKey():G.mode;$('stMode').textContent=m==='slow'?'ゆっくり':'ふつう';
  var b=bestOf(m);$('stBest').textContent=b.score;$('stBestR').textContent=b.round;
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

function buildBoard(cols,rows,nCats){
  board.style.setProperty('--cols',cols);board.style.setProperty('--rows',rows);
  board.innerHTML='';places=[];
  var n=cols*rows,idx=shuffle(Array.apply(null,Array(n)).map(function(_,i){return i})).slice(0,nCats);
  var fur=shuffle(Array.apply(null,Array(CATS.length)).map(function(_,i){return i}));
  G.cats={};
  idx.forEach(function(p,k){G.cats[p]=fur[k%fur.length]});
  for(var i=0;i<n;i++){
    var b=document.createElement('button');b.type='button';b.className='place';b.disabled=true;
    b.style.setProperty('--roof',HOUSE[Math.floor(Math.random()*HOUSE.length)]);
    b.setAttribute('aria-label','お家'+(i+1));
    var cat=G.cats[i]!==undefined?svgCat(CATS[G.cats[i]]):'';
    b.innerHTML=houseSVG()+'<div class="pc">'+cat+'</div>';
    (function(k){
      b.addEventListener('pointerdown',function(e){e.preventDefault();unlockAudio();tap(k)});
      b.addEventListener('contextmenu',function(e){e.preventDefault()});
    })(i);
    board.appendChild(b);places.push(b);
  }
}
var lastTE=0;
board.addEventListener('touchend',function(e){var n=Date.now();if(n-lastTE<400)e.preventDefault();lastTE=n},{passive:false});
['gesturestart','gesturechange'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()})});
document.addEventListener('dblclick',function(e){e.preventDefault()});

function setTimerBar(f){$('tbar').style.transform='scaleX('+Math.max(0,Math.min(1,f))+')'}
function startGame(){
  unlockAudio();G.run++;clearTimeout(G.timer);clearInterval(G.iv);
  G.mode=modeKey();G.round=0;G.score=0;G.lives=LIVES;G.newBest=false;
  $('result').hidden=true;var st=$('start');st.textContent='やめる';st.classList.add('stop');$('tSlow').disabled=true;
  sfx.start();say('スタート!お家の猫をよく見てね');render();after(900,nextRound);
}
function stopGame(){
  G.run++;clearTimeout(G.timer);clearInterval(G.iv);G.phase='idle';G.round=0;bonusSay('');setTimerBar(1);
  places.forEach(function(p){p.disabled=true});
  var st=$('start');st.textContent='はじめる';st.classList.remove('stop');$('tSlow').disabled=false;
  say('やめました。「はじめる」でもう一度あそべます。');render();
}
function nextRound(){
  G.round++;var L=levelOf(G.round);G.need=L[2];G.found=0;G.wrong=0;
  buildBoard(L[0],L[1],L[2]);render();
  G.phase='show';say('ラウンド'+G.round+':猫がいるお家を覚えてね('+G.need+'匹)');
  after(500,function(){
    places.forEach(function(p,i){if(G.cats[i]!==undefined)p.classList.add('show')});sfx.show();
    var ms=showMs(G.need),t0=performance.now(),r=G.run;clearInterval(G.iv);
    G.iv=setInterval(function(){
      if(r!==G.run){clearInterval(G.iv);return}
      var f=1-(performance.now()-t0)/ms;setTimerBar(f);if(f<=0){clearInterval(G.iv)}
    },60);
    after(ms,hideCats);
  });
}
function hideCats(){
  clearInterval(G.iv);setTimerBar(0);
  places.forEach(function(p){p.classList.remove('show');p.disabled=false});
  sfx.hide();G.phase='input';say('猫がいたお家をタッチ!(のこり '+(G.need-G.found)+'匹)');
}
function tap(i){
  if(G.phase!=='input')return;
  var p=places[i];if(p.disabled)return;p.disabled=true;
  var mul=G.mode==='slow'?0.7:1;
  if(G.cats[i]!==undefined){
    G.found++;p.classList.add('found','meow');meow(G.cats[i],0.28);setTimeout(function(){p.classList.remove('meow')},300);
    G.score+=Math.round(10*G.round*mul);render();
    if(G.found>=G.need)roundClear();else say('みつけた!のこり '+(G.need-G.found)+'匹');
  }else{
    G.lives--;G.wrong++;p.classList.add('empty','bad');sfx.miss();render();
    if(G.lives<=0){
      G.phase='between';places.forEach(function(q,k){q.disabled=true;if(G.cats[k]!==undefined&&!q.classList.contains('found'))q.classList.add('reveal')});
      say('ざんねん…ハートがなくなりました。猫はここにいたよ');after(2200,gameOver);
    }else say('そこにはいないよ…のこりハート'+G.lives+'こ');
  }
}
function roundClear(){
  G.phase='between';places.forEach(function(p){p.disabled=true});
  var mul=G.mode==='slow'?0.7:1,bonus=Math.round(50*G.round*mul),txt='クリアボーナス +'+bonus;
  if(G.wrong===0){var pb=Math.round(30*G.round*mul);bonus+=pb;txt+=' / ノーミス +'+pb}
  G.score+=bonus;render();say('ラウンド'+G.round+' クリア!');bonusSay(txt);
  setTimeout(sfx.clear,200);after(1700,function(){bonusSay('');nextRound()});
}
function gameOver(){
  var k=G.mode,b=bestOf(k),cleared=Math.max(0,G.round-1),nb={score:b.score,round:b.round};
  if(G.score>nb.score){nb.score=G.score;G.newBest=true}
  if(cleared>nb.round){nb.round=cleared;G.newBest=true}
  if(G.newBest){best[k]=nb;lsSet(LS_BEST,best)}
  G.phase='idle';b=bestOf(k);
  $('result').innerHTML='<h2>ゲームおわり('+(k==='slow'?'ゆっくり':'ふつう')+')</h2><p>得点 <b>'+G.score+'</b> 点 / クリア <b>'+cleared+'</b> ラウンド</p>'+
    (G.newBest?'<p>🎉 ベスト記録を更新!</p>':'<p>ベスト: '+b.score+'点 / '+b.round+'ラウンド</p>');
  $('result').hidden=false;sfx.over();say('おつかれさま!また遊んでね');
  var st=$('start');st.textContent='もう一度あそぶ';st.classList.remove('stop');$('tSlow').disabled=false;
  G.round=0;setTimerBar(1);render();
}

/* 発音はresume完了後に鳴らす(SalpAudio.gate) */
Object.keys(sfx).forEach(function(k){sfx[k]=SalpAudio.gate(sfx[k])});
meow=SalpAudio.gate(meow);

/* ---------- UI ---------- */
function applySet(){
  document.body.classList.toggle('hc',set.hc);document.body.classList.toggle('large',set.large);
  $('tHc').setAttribute('aria-pressed',String(set.hc));$('tLg').setAttribute('aria-pressed',String(set.large));
  $('tSlow').setAttribute('aria-pressed',String(set.slow));
  $('tSound').setAttribute('aria-pressed',String(set.sound));$('tSound').textContent=set.sound?'🔊 音 ON':'🔈 音 OFF';
  $('vol').value=set.vol;applyVol();
}
function save(){lsSet(LS_SET,set)}
$('tSlow').onclick=function(){set.slow=!set.slow;save();applySet();render()};
$('tHc').onclick=function(){set.hc=!set.hc;save();applySet()};
$('tLg').onclick=function(){set.large=!set.large;save();applySet()};
$('tSound').onclick=function(){set.sound=!set.sound;save();applySet();unlockAudio();if(set.sound&&ctx)meow(4,0.28)};
$('vol').oninput=function(){set.vol=+this.value;save();applyVol()};
$('vol').onchange=function(){unlockAudio();if(set.sound&&ctx)meow(4,0.28)};
$('start').onclick=function(){if(G.phase==='idle')startGame();else stopGame()};

/* 待機画面: 2x2のお家を表示 */
buildBoard(2,2,0);applySet();render();
})();
</script>
