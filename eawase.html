const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const reduceMotion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };

/* ===== 状態 ===== */
const prefs = store.get('eawase.prefs', {});
const S = {
  lv: Math.min(8, Math.max(1, +prefs.lv || 1)),
  mode: prefs.mode === 'duo' ? 'duo' : 'solo',
  easy: !!prefs.easy,
  cards: [], open: [], busy: false, started: false, over: false,
  moves: 0, matched: 0, turn: 1, scores: [0, 0],
  t0: 0, elapsed: 0, timer: null, timeouts: []
};
function savePrefs() { store.set('eawase.prefs', { lv: S.lv, mode: S.mode, easy: S.easy }); }

/* ===== ベスト記録（1人プレイ・難易度別） ===== */
function getBest(lv) { const b = store.get('eawase.best', {}); return b[lv] || { moves: null, time: null }; }
function updateBest(lv, moves, sec) {
  const all = store.get('eawase.best', {});
  const cur = all[lv] || { moves: null, time: null };
  let rec = false;
  if (cur.moves === null || moves < cur.moves) { cur.moves = moves; rec = true; }
  if (cur.time === null || sec < cur.time) { cur.time = sec; rec = true; }
  all[lv] = cur; store.set('eawase.best', all);
  return rec;
}
function fmt(sec) { const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + (s < 10 ? '0' : '') + s; }

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function later(fn, ms) { const t = setTimeout(() => { S.timeouts = S.timeouts.filter(x => x !== t); fn(); }, ms); S.timeouts.push(t); return t; }
function clearTimers() { S.timeouts.forEach(clearTimeout); S.timeouts = []; clearInterval(S.timer); S.timer = null; }
function say(msg) { $('live').textContent = msg; }

/* ===== 配札 ===== */
function deal() {
  clearTimers();
  const L = LEVELS[S.lv - 1];
  const ids = shuffle(PICS.map(p => p.id)).slice(0, L.pairs);   // Lv8は14種すべて、他は毎回ランダム
  S.cards = shuffle(ids.concat(ids)).map((id, i) => ({ i, id, flipped: false, matched: false, owner: 0 }));
  S.open = []; S.busy = false; S.started = false; S.over = false;
  S.moves = 0; S.matched = 0; S.turn = 1; S.scores = [0, 0]; S.elapsed = 0;
  document.body.classList.toggle('duo', S.mode === 'duo');
  document.body.classList.toggle('solo', S.mode !== 'duo');
  render(); fit(); updateStats(); updateMenuLabel();
  say('新しいゲームを始めました。' + (S.mode === 'duo' ? 'プレイヤー1の番です。' : ''));
}

function render() {
  const board = $('board');
  board.innerHTML = '';
  board.classList.remove('busy');
  S.cards.forEach(c => {
    const pic = PICS[c.id - 1];
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'card';
    b.dataset.index = c.i;
    b.dataset.pic = c.id;
    b.setAttribute('aria-label', 'カード（ふせてある）');
    b.innerHTML =
      '<div class="card-inner">' +
        '<div class="card-face card-back" aria-hidden="true"></div>' +
        '<div class="card-face card-front" aria-hidden="true">' +
          '<span class="badge"></span>' +
          '<img src="match/' + String(c.id).padStart(2, '0') + '.webp" alt="" decoding="async" draggable="false">' +
          '<span class="cap">' + (CAP_SHORT[pic.name] || pic.name) + '</span>' +
        '</div>' +
      '</div>';
    b.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (!e.isPrimary) return;
      e.preventDefault();
      flip(c.i);
    });
    b.addEventListener('click', e => { if (e.detail === 0) flip(c.i); });   // キーボード操作
    c.el = b;
    board.appendChild(b);
  });
}

/* ===== 画面に収まるサイズ計算（スクロール不要） ===== */
function fit() {
  const wrap = $('boardWrap'), board = $('board');
  const cs = getComputedStyle(wrap);
  const W = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 4;
  const H = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 4;
  const L = LEVELS[S.lv - 1];
  const gap = L.pairs >= 8 ? 6 : 10;
  let best = null;
  [L.p, L.l].forEach(([c, r]) => {
    const s = Math.floor(Math.min((W - gap * (c - 1)) / c, (H - gap * (r - 1)) / r, 200));
    if (!best || s > best.s) best = { c, r, s };
  });
  const s = Math.max(24, best.s);
  board.style.setProperty('--cols', best.c);
  board.style.setProperty('--cs', s + 'px');
  board.style.setProperty('--gap', gap + 'px');
  board.dataset.cols = best.c; board.dataset.rows = best.r;
}

/* ===== めくる ===== */
function flip(i) {
  if (S.busy || S.over || !S.cards[i]) return;
  const c = S.cards[i];
  if (c.flipped || c.matched) return;
  if ($('menu').classList.contains('show') || $('result').classList.contains('show')) return;
  if (!S.started) startTimer();
  c.flipped = true; c.el.classList.add('flipped');
  c.el.setAttribute('aria-label', PICS[c.id - 1].name);
  S.open.push(c);
  if (S.open.length < 2) return;

  S.moves++; S.busy = true; $('board').classList.add('busy');
  const [a, b] = S.open;
  updateStats();
  if (a.id === b.id) {
    later(() => {                                   // 揃った：少し見せてから確定。同じ人が続ける
      [a, b].forEach(x => {
        x.matched = true; x.owner = S.mode === 'duo' ? S.turn : 0;
        x.el.classList.add('matched'); x.el.dataset.owner = x.owner;
        x.el.querySelector('.badge').textContent = x.owner || '';
        x.el.disabled = false;
        x.el.setAttribute('aria-label', PICS[x.id - 1].name + '（そろった）');
      });
      S.matched++; if (S.mode === 'duo') S.scores[S.turn - 1]++;
      S.open = []; S.busy = false; $('board').classList.remove('busy');
      updateStats();
      say(PICS[a.id - 1].name + 'がそろいました。' + (S.mode === 'duo' ? 'プレイヤー' + S.turn + 'が続けてどうぞ。' : ''));
      if (S.matched === S.cards.length / 2) finish();
    }, 600);
  } else {
    const show = S.easy ? 2000 : 1300;              // ゆっくり見せる → ゆっくり裏返す
    later(() => {
      a.flipped = b.flipped = false;
      a.el.classList.remove('flipped'); b.el.classList.remove('flipped');
      a.el.setAttribute('aria-label', 'カード（ふせてある）'); b.el.setAttribute('aria-label', 'カード（ふせてある）');
      later(() => {                                 // 裏返し終わるまで操作を受け付けない（連打防止）
        S.open = []; S.busy = false; $('board').classList.remove('busy');
        if (S.mode === 'duo') { S.turn = 3 - S.turn; say('プレイヤー' + S.turn + 'の番です。'); }
        updateStats();
      }, reduceMotion.matches ? 80 : 650);
    }, show);
  }
}

function startTimer() {
  S.started = true; S.t0 = performance.now();
  S.timer = setInterval(() => { S.elapsed = Math.floor((performance.now() - S.t0) / 1000); $('time').textContent = fmt(S.elapsed); }, 250);
}

function updateStats() {
  const L = LEVELS[S.lv - 1];
  $('moves').textContent = S.moves;
  $('time').textContent = fmt(S.elapsed);
  $('pairs').textContent = S.matched + '/' + L.pairs;
  $('sc1').textContent = S.scores[0]; $('sc2').textContent = S.scores[1];
  $('pl1').classList.toggle('active', S.mode === 'duo' && S.turn === 1);
  $('pl2').classList.toggle('active', S.mode === 'duo' && S.turn === 2);
  $('pl1').setAttribute('aria-current', S.mode === 'duo' && S.turn === 1 ? 'true' : 'false');
  $('pl2').setAttribute('aria-current', S.mode === 'duo' && S.turn === 2 ? 'true' : 'false');
  const b = getBest(S.lv);
  $('bestMoves').textContent = 'ベスト ' + (b.moves !== null ? b.moves + '手' : '--');
  $('bestTime').textContent = 'ベスト ' + (b.time !== null ? fmt(b.time) : '--');
}
function updateMenuLabel() { $('menuBtn').textContent = 'Lv' + S.lv + '・' + (S.mode === 'duo' ? '2人交代' : '1人プレイ') + ' ▾'; }

/* ===== 終了 ===== */
function finish() {
  S.over = true; clearInterval(S.timer); S.timer = null;
  S.elapsed = Math.floor((performance.now() - S.t0) / 1000);
  updateStats();
  const L = LEVELS[S.lv - 1];
  let title, body = '', next = S.lv < 8;
  if (S.mode === 'duo') {
    const [s1, s2] = S.scores;
    title = s1 === s2 ? '🤝 引き分け！' : (s1 > s2 ? '🏆 プレイヤー1の勝ち！' : '🏆 プレイヤー2の勝ち！');
    body = '<p class="sub">Lv' + S.lv + '（' + L.pairs + 'ペア）・手数 ' + S.moves + '・' + fmt(S.elapsed) + '</p>' +
      '<div class="win-score"><div class="w1' + (s1 > s2 ? ' win' : '') + '">プレイヤー1<big>' + s1 + '</big>ペア</div>' +
      '<div class="w2' + (s2 > s1 ? ' win' : '') + '">プレイヤー2<big>' + s2 + '</big>ペア</div></div>';
  } else {
    const rec = updateBest(S.lv, S.moves, S.elapsed);
    updateStats();
    title = '🎉 クリア！';
    const b = getBest(S.lv);
    body = '<p class="sub">Lv' + S.lv + '（' + L.pairs + 'ペア・' + L.pairs * 2 + '枚）</p>' +
      '<div class="result-stat">手数: <span class="num" id="resMoves">' + S.moves + '</span> 手</div>' +
      '<div class="result-stat">タイム: <span class="num" id="resTime">' + fmt(S.elapsed) + '</span></div>' +
      '<div class="result-stat" style="font-size:.85rem">ベスト: ' + b.moves + '手 / ' + fmt(b.time) + '</div>' +
      (rec ? '<div class="new-record" id="resRecord">🏆 新記録！</div>' : '');
  }
  $('resTitle').textContent = title;
  $('resBody').innerHTML = body;
  $('resBtns').innerHTML =
    '<button type="button" class="result-btn" id="againBtn">もう一度</button>' +
    (next && S.mode === 'solo' ? '<button type="button" class="result-btn" id="nextBtn">次のLv' + (S.lv + 1) + 'へ</button>' : '') +
    (next && S.mode === 'duo' ? '<button type="button" class="result-btn" id="nextBtn">次のLv' + (S.lv + 1) + 'へ</button>' : '') +
    '<button type="button" class="result-btn sub-btn" id="menuBtn2">難易度・人数を変える</button>' +
    '<a class="result-btn sub-btn" href="./index.html#cardgames">ホームへ</a>';
  $('againBtn').onclick = () => { hide('result'); deal(); };
  if ($('nextBtn')) $('nextBtn').onclick = () => { S.lv++; savePrefs(); hide('result'); deal(); };
  $('menuBtn2').onclick = () => { hide('result'); openMenu(); };
  say(title);
  later(() => { show('result'); $('againBtn').focus(); }, 500);
}

/* ===== オーバーレイ ===== */
function show(id) { $(id).classList.add('show'); }
function hide(id) { $(id).classList.remove('show'); }

let menuSel = { lv: S.lv, mode: S.mode };
function buildLv() {
  const g = $('lvGrid'); g.innerHTML = '';
  LEVELS.forEach((L, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.dataset.lv = i + 1;
    b.setAttribute('aria-pressed', String(menuSel.lv === i + 1));
    const bs = getBest(i + 1);
    b.innerHTML = '<b>Lv' + (i + 1) + '</b><small>' + L.pairs + 'ペア</small>' + '<small>' + (menuSel.mode === 'solo' && bs.moves !== null ? '★' + bs.moves + '手' : '　') + '</small>';
    b.onclick = () => { menuSel.lv = i + 1; buildLv(); };
    g.appendChild(b);
  });
  g.setAttribute('aria-label', '難易度');
  document.querySelectorAll('#modeSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === menuSel.mode)));
}
function openMenu() { menuSel = { lv: S.lv, mode: S.mode }; buildLv(); $('easyBtn2').setAttribute('aria-pressed', String(S.easy)); show('menu'); $('startBtn').focus(); }
document.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => { menuSel.mode = b.dataset.mode; buildLv(); });
$('startBtn').onclick = () => { S.lv = menuSel.lv; S.mode = menuSel.mode; savePrefs(); hide('menu'); deal(); };
$('closeMenuBtn').onclick = () => hide('menu');
$('menuBtn').onclick = openMenu;
$('resetBtn').onclick = () => { hide('result'); deal(); };

function setEasy(v) {
  S.easy = v; document.body.classList.toggle('accessible-mode', v);
  $('easyBtn').setAttribute('aria-pressed', String(v)); $('easyBtn2').setAttribute('aria-pressed', String(v));
  $('easyBtn').textContent = v ? '見やすい:ON' : '見やすい';
  savePrefs(); fit();
}
$('easyBtn').onclick = () => setEasy(!S.easy);
$('easyBtn2').onclick = () => setEasy(!S.easy);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('menu').classList.contains('show')) hide('menu'); });

/* ===== 画面サイズ変化 ===== */
let raf = 0;
function refit() { cancelAnimationFrame(raf); raf = requestAnimationFrame(fit); }
window.addEventListener('resize', refit);
window.addEventListener('orientationchange', () => setTimeout(fit, 200));
if (window.ResizeObserver) new ResizeObserver(refit).observe($('boardWrap'));
document.addEventListener('dblclick', e => e.preventDefault());

/* ===== 起動：メニューを出す ===== */
setEasy(S.easy);
deal();
openMenu();
})();
</script>
</body>
</html>
