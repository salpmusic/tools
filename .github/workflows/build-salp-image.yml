name: Build salp Linux v1.10.9 Firefox Image

on:
  workflow_dispatch:
    inputs:
      image_size:
        description: ext2 image size (≤800M for GitHub Pages soft limit)
        required: true
        default: 800M
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-salp-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact_name: salp-firefox-v1.10.9-ext2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner disk space
        run: df -h

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah e2fsprogs git uidmap
          buildah version

      - name: Build Firefox ESR ext2 image
        env:
          IMAGE_SIZE: ${{ inputs.image_size }}
        run: |
          sudo --preserve-env=IMAGE_SIZE,GITHUB_WORKSPACE,RUNNER_TEMP \
            bash image/build-image.sh \
            "$RUNNER_TEMP/salp-build" \
            "$GITHUB_WORKSPACE/salp-browser.ext2"
          sudo chown "$USER:$USER" \
            salp-browser.ext2 \
            salp-browser.ext2.sha256 \
            salp-browser.ext2.manifest.txt

      - name: Verify output files
        run: |
          test -s salp-browser.ext2
          test -s salp-browser.ext2.sha256
          test -s salp-browser.ext2.manifest.txt
          sha256sum -c salp-browser.ext2.sha256
          ls -lh salp-browser.ext2*
          cat salp-browser.ext2.manifest.txt
          # Guard: never accidentally stage the huge blob into git
          test ! -f .gitattributes || ! grep -qi 'lfs' .gitattributes || true
          git check-ignore -q salp-browser.ext2 2>/dev/null || \
            echo 'salp-browser.ext2' >> .gitignore || true

      - name: Upload browser image
        uses: actions/upload-artifact@v4
        with:
          name: salp-firefox-v1.10.9-ext2
          path: |
            salp-browser.ext2
            salp-browser.ext2.sha256
            salp-browser.ext2.manifest.txt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ext2 artifact
        uses: actions/download-artifact@v4
        with:
          name: salp-firefox-v1.10.9-ext2
          path: _ext2_artifact

      - name: Place ext2 under salp-linux/ for Pages
        run: |
          mkdir -p salp-linux
          cp -f _ext2_artifact/salp-browser.ext2 salp-linux/salp-browser.ext2
          cp -f _ext2_artifact/salp-browser.ext2.sha256 salp-linux/salp-browser.ext2.sha256
          cp -f _ext2_artifact/salp-browser.ext2.manifest.txt salp-linux/salp-browser.ext2.manifest.txt
          ls -lh salp-linux/salp-browser.ext2*
          # Sanity: must be hundreds of MB, not empty
          test -s salp-linux/salp-browser.ext2
          SIZE_BYTES=$(stat -c%s salp-linux/salp-browser.ext2)
          echo "ext2 bytes=$SIZE_BYTES"
          test "$SIZE_BYTES" -gt 100000000

      - name: Prepare Pages publish tree
        run: |
          # Publish full repo contents (existing HTML site) + salp-linux/ext2.
          # Exclude .git and build debris; Pages artifact must not include .git.
          rm -rf _ext2_artifact .git
          # Ensure we do not ship accidental local build leftovers from checkout root
          rm -f salp-browser.ext2 salp-browser.ext2.sha256 salp-browser.ext2.manifest.txt
          ls -la
          test -f index.html
          test -f salp-linux/salp-browser.html
          test -s salp-linux/salp-browser.ext2

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
