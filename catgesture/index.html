<style>

body{

}

#stage.useart img.art{display:block}#stage.useart svg.cs{display:none}

#bub.on{opacity:1}
#stage.cover::after{content:"?";position:absolute;inset:0;display:none}
.cs *{transform-box:fill-box}
.cs .all{transform-origin:50% 100%}
.cs .head{transform-origin:50% 90%}
.cs .tail{transform-box:view-box;transform-origin:172px 176px}
.cs .mo,.cs .ec,.cs .wp,.cs .zz{display:none}
.cs .wp{opacity:0}
.g-yawn .mo,.g-yawn .ec,.g-stretch .ec,.g-wash .ec,.g-sleep .ec,.g-sleep .zz{display:inline}
.g-yawn .mc,.g-yawn .eo,.g-stretch .eo,.g-wash .eo,.g-sleep .eo{display:none}
.g-wash .wp{display:inline}
.g-yawn .head{animation:yawn var(--d) ease-in-out both}
.g-wash .head{animation:washHead var(--d) ease-in-out both}
.g-wash .wp{animation:washPaw var(--d) ease-in-out both}
.g-stretch .all{animation:stretch var(--d) ease-in-out both}
.g-roll .all{animation:roll var(--d) ease-in-out both;transform-origin:50% 70%}
.g-tail .tail{animation:wag var(--d) ease-in-out both}
.g-jump .all{animation:jump var(--d) ease-in-out both}
.g-sleep .head{animation:sleepHead var(--d) ease-in-out both}
.g-sleep .all{animation:sleepBody var(--d) ease-in-out both}
.g-sleep .zz{animation:zz var(--d) ease-in-out both}
.g-sit .all{animation:sit var(--d) ease-in-out both}
@keyframes yawn{0%{transform:none}35%,70%{transform:translateY(-6%) rotate(-6deg) scale(1.06)}100%{transform:none}}
@keyframes washHead{0%{transform:none}30%,80%{transform:rotate(5deg)}100%{transform:none}}
@keyframes washPaw{0%{opacity:0;transform:none}20%{opacity:1;transform:translate(-50%,-250%)}35%{transform:translate(-110%,-262%)}50%{transform:translate(-20%,-250%)}65%{transform:translate(-110%,-262%)}80%{opacity:1;transform:translate(-50%,-250%)}100%{opacity:0;transform:none}}
@keyframes stretch{0%{transform:none}30%,70%{transform:scale(1.28,.76)}100%{transform:none}}
@keyframes roll{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes wag{0%,100%{transform:rotate(0)}12%{transform:rotate(-28deg)}37%{transform:rotate(28deg)}62%{transform:rotate(-28deg)}87%{transform:rotate(28deg)}}
@keyframes jump{0%{transform:scale(1.1,.86)}30%{transform:translateY(-30%) scale(.92,1.08)}60%{transform:translateY(-30%) scale(.92,1.08)}85%{transform:scale(1.1,.86)}100%{transform:none}}
@keyframes sleepHead{0%{transform:none}35%,80%{transform:translate(4%,14%) rotate(22deg)}100%{transform:none}}
@keyframes sleepBody{0%{transform:none}35%,80%{transform:scale(1.04,.93)}100%{transform:none}}
@keyframes zz{0%{opacity:0;transform:translateY(0)}40%,80%{opacity:1;transform:translateY(-8%)}100%{opacity:0}}
@keyframes sit{0%{transform:none}25%,70%{transform:scale(.92,1.14)}45%{transform:scale(.92,1.14) translateY(-3%)}100%{transform:none}}

.note{font-size:.75rem;color:#6a8aa5;text-align:center}

body.hc #bub{background:#000;color:#ffff00;border-color:#ffff00}
body.hc #dots i{background:#000;border-color:#fff}body.hc #dots i.on{background:#ffff00;border-color:#ffff00}
body.hc .gb{background:#000;border-color:#fff}body.hc .gb .tx{color:#fff}

body.hc .timer{background:#000;border-color:#fff}body.hc .timer i{background:#ffff00}
body.hc .home{background:#000;color:#ffff00;border-color:#ffff00}
body.hc .tog{background:#000;border-color:#fff;color:#fff}

@media (orientation:landscape) and (max-height:620px){
  .app{max-width:1000px;align-items:start;justify-items:stretch;grid-template-columns:auto 1fr;column-gap:14px;
    grid-template-areas:"board head" "board info" "board dots" "board pal" "board ctrl";grid-template-rows:auto auto auto auto 1fr}
  #stage{--sz:max(150px,min(calc(100dvh - 24px),calc(100vw - 420px),360px))}

<body>
<div class="app">
  <header>

    <div class="top">
      <div class="pcard"><div class="name">スコア</div><div class="val" id="sc">0</div></div>
      <div class="pcard"><div class="name">のこり</div><div class="val" id="lives">❤❤❤</div></div>
    </div>

  <div id="dots" aria-hidden="true"></div>
  <div id="pal" role="group" aria-label="しぐさ"></div>

      </div>
    </section>
    <section class="box">
      <h2>音・見やすさ</h2>
      <div class="row">
        <button type="button" class="tog" id="tSound" aria-pressed="true">🔊 音 ON</button>
        <label class="vol">音量 <input type="range" id="vol" min="0" max="100" value="60" aria-label="音量"></label>
      </div>
      <div class="row" style="margin-top:8px">
        <button type="button" class="tog" id="tHc" aria-pressed="false">◐ ハイコントラスト</button>
        <button type="button" class="tog" id="tLg" aria-pressed="false">🔍 大きな表示</button>
      </div>
    </section>
    <p class="note">猫がしぐさを順番に見せてくれます。見終わったら、同じ順番にしぐさのボタンをタップ。ラウンドが進むと順番が長く、しぐさの種類が増え、見せる速さも上がり、高いラウンドでは文字の吹き出しもなくなります。まちがえるとハートがへって、同じ順番をもう一度見せます(ハートは3つ)。得点は 10点×ラウンド+クリアボーナス。</p>
  </div>
</div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var LS_BEST='salpCatGesture_best_v1', LS_SET='salpCatGesture_settings_v1';
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var best=lsGet(LS_BEST)||{};
var set=Object.assign({sound:true,vol:60,hc:false,large:false,slow:false},lsGet(LS_SET)||{});

/* ラウンドごとの設定。進むほど順番が長く・種類が増え・速くなる(15〜20ラウンドで厳しくなりミスで終わる設計) */
function levelOf(r){
  var K=r<=2?4:r<=4?5:r<=6?6:r<=9?7:8;                   /* しぐさの種類 */
  var len=Math.min(14,2+Math.floor(r*0.75));              /* 順番の長さ */
  var dur=Math.max(380,1100-(r-1)*45);                    /* 1つのしぐさを見せる時間(ms) */
  var gap=Math.max(60,220-r*9);                           /* しぐさの間(ms) */
  var L={K:K,len:len,dur:dur,gap:gap,bubble:r<9,mix:r>=13,shufPal:r>=11};
  if(G.mode==='slow'){L.dur=Math.round(dur*1.7);L.gap=Math.round(gap*1.5)}
  return L;
}

var ctx=null, master=null;
/* ===== SalpAudio: 音声アンロック共通ヘルパー(各単一HTMLにインラインコピーして使う) =====

     var ctx=null, master=null;
     SalpAudio.init({onCreate:function(c,m){ctx=c;master=m;applyVol()}});
     var unlockAudio=SalpAudio.unlock;          // 「開始」クリック等の中で呼ぶ

         running になるまでリスナーを外さない。visibilitychange/pageshow/focus/statechange で再アーム。
         'interrupted'(iOS) も running 以外として扱う。navigator.audioSession.type='playback' (対応環境)。 */
var SalpAudio=(function(){
  var ctx=null,master=null,cfg={},armed=false,silentEl=null,silentOk=false;
  var EVS=['touchstart','touchend','pointerdown','mousedown','click','keydown'];
  function AC(){return window.AudioContext||window.webkitAudioContext}
  function session(){try{if(navigator.audioSession&&navigator.audioSession.type!=='playback')navigator.audioSession.type='playback'}catch(e){}}
  function silentWav(){
    var n=800,b=new Uint8Array(44+n),dv=new DataView(b.buffer);
    function s(o,t){for(var i=0;i<t.length;i++)b[o+i]=t.charCodeAt(i)}
    s(0,'RIFF');dv.setUint32(4,36+n,true);s(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
    dv.setUint32(24,8000,true);dv.setUint32(28,8000,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);s(36,'data');dv.setUint32(40,n,true);
    for(var i=0;i<n;i++)b[44+i]=128;
    var str='';for(i=0;i<b.length;i++)str+=String.fromCharCode(b[i]);
    return 'data:audio/wav;base64,'+btoa(str);
  }
  function silentAudio(){ /* iOSのミュートスイッチ回避の補助: 無音の<audio>を1回再生 */
    try{
      if(silentOk)return;
      if(!silentEl){silentEl=new Audio();silentEl.src=silentWav();silentEl.setAttribute('playsinline','');silentEl.preload='auto'}
      var p=silentEl.play();
      if(p&&p.then)p.then(function(){silentOk=true}).catch(function(){silentOk=false});else silentOk=true;
    }catch(e){}
  }
  function silentBuffer(){try{var b=ctx.createBuffer(1,1,22050),s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);s.start(0)}catch(e){}}
  function create(){
    var C=AC();if(!C)return false;
    ctx=new C();master=ctx.createGain();master.connect(ctx.destination);
    try{ctx.onstatechange=function(){if(ctx.state==='running')disarm();else arm()}}catch(e){}
    if(cfg.onCreate)cfg.onCreate(ctx,master);
    return true;
  }
  function resume(){
    if(!ctx)return Promise.resolve(false);
    if(ctx.state==='running')return Promise.resolve(true);
    var p;try{p=ctx.resume()}catch(e){return Promise.resolve(false)}
    return Promise.resolve(p).then(function(){return ctx.state==='running'},function(){return false});
  }
  function unlock(){ /* ユーザー操作の同期区間内で呼ぶ */
    try{
      session();
      if(!ctx||ctx.state==='closed'){if(!create())return}
      if(ctx.state!=='running'){silentBuffer();silentAudio()}
      resume().then(function(ok){if(ok)disarm();else arm()});
    }catch(e){arm()}
  }
  function onEv(){unlock()}
  function arm(){if(armed)return;armed=true;EVS.forEach(function(t){document.addEventListener(t,onEv,{capture:true,passive:true})})}
  function disarm(){if(!armed)return;if(ctx&&ctx.state!=='running')return;armed=false;EVS.forEach(function(t){document.removeEventListener(t,onEv,{capture:true})})}
  function recheck(){ /* 復帰時: 動いていなければ再resumeを試み、次の操作でも再試行できるようアーム */
    if(ctx&&ctx.state!=='running'){resume().then(function(ok){if(!ok)arm()});arm()}
  }
  /* 発音関数を包む: running なら即実行、そうでなければ resume 完了を待ってから実行(失敗時は鳴らさず次回再試行) */
  function gate(fn){
    return function(){
      var self=this,args=arguments,t0=Date.now();
      if(!ctx)return;
      if(ctx.state==='running')return fn.apply(self,args);
      resume().then(function(ok){if(ok&&Date.now()-t0<1200)fn.apply(self,args);else if(!ok)arm()});
    };
  }
  function init(c){
    cfg=c||{};session();arm();
    document.addEventListener('visibilitychange',function(){if(!document.hidden)recheck()});
    window.addEventListener('pageshow',recheck);window.addEventListener('focus',recheck);
  }
  return {init:init,unlock:unlock,gate:gate,resume:resume,get ctx(){return ctx},get master(){return master}};
})();
SalpAudio.init({onCreate:function(c,m){ctx=c;master=m;applyVol()}});
var unlockAudio=SalpAudio.unlock;
var BASE=[440,494,554,622,698,784,880,988,1109]; /* 猫ごとの基本の高さ(Hz) */ /* 猫ごとの基本の高さ(Hz) */
function applyVol(){if(master){master.gain.value=set.sound?Math.pow(set.vol/100,1.4):0}}
function ready(){
  if(!ctx||!set.sound)return false;
  if(ctx.state!=='running'&&ctx.resume)ctx.resume().catch(function(){});
  return true;
}
/* にゃん!風: のこぎり波の高さを上げて下げる + 2つの帯域フィルタ(母音「ア」っぽい響き) */
function meow(i,dur){
  if(!ready())return;
  var t=ctx.currentTime+0.005,f=BASE[i];dur=Math.min(0.4,Math.max(0.16,dur||0.28));
  var o=ctx.createOscillator();o.type='sawtooth';
  o.frequency.setValueAtTime(f*0.8,t);
  o.frequency.linearRampToValueAtTime(f*1.3,t+dur*0.3);
  o.frequency.linearRampToValueAtTime(f*0.85,t+dur);
  var lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=7;lg.gain.value=f*0.015;lfo.connect(lg);lg.connect(o.frequency);
  var f1=ctx.createBiquadFilter();f1.type='bandpass';f1.Q.value=4;
  f1.frequency.setValueAtTime(500,t);f1.frequency.linearRampToValueAtTime(1100,t+dur*0.35);f1.frequency.linearRampToValueAtTime(700,t+dur);
  var f2=ctx.createBiquadFilter();f2.type='bandpass';f2.Q.value=6;
  f2.frequency.setValueAtTime(1800,t);f2.frequency.linearRampToValueAtTime(2600,t+dur*0.35);f2.frequency.linearRampToValueAtTime(2000,t+dur);
  var g1=ctx.createGain(),g2=ctx.createGain(),eg=ctx.createGain();
  g1.gain.value=1.4;g2.gain.value=0.7;
  eg.gain.setValueAtTime(0.0001,t);eg.gain.linearRampToValueAtTime(0.5,t+0.04);
  eg.gain.setValueAtTime(0.5,t+dur*0.6);eg.gain.linearRampToValueAtTime(0.0001,t+dur);
  o.connect(f1);o.connect(f2);f1.connect(g1);f2.connect(g2);g1.connect(eg);g2.connect(eg);eg.connect(master);
  o.start(t);lfo.start(t);o.stop(t+dur+0.03);lfo.stop(t+dur+0.03);
}
function blip(freq,t0,dur,type,vol,slideTo){
  if(!ready())return;
  var o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'triangle';
  o.frequency.setValueAtTime(freq,t0);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
  var v=(vol||1)*0.3;g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(v,t0+0.01);
  g.gain.linearRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.02);
}
function melody(list,step,dur,type,vol){if(!ready())return;var t=ctx.currentTime+0.02;list.forEach(function(f,i){blip(f,t+i*step,dur,type,vol)})}
var sfx={
  clear:function(){melody([784,988,1175,1568],0.09,0.12,'triangle',1)},
  miss:function(){if(!ready())return;var t=ctx.currentTime+0.01;blip(260,t,0.3,'sawtooth',0.6,120)},
  over:function(){melody([523,440,392,330,262],0.2,0.22,'triangle',1)},
  start:function(){melody([660,880,660,990],0.08,0.1,'triangle',.9)}
};


sfx.show=function(){melody([784,988],0.08,0.09,'triangle',.8)};
sfx.hide=function(){melody([988,784,659],0.06,0.07,'triangle',.7)};
sfx.start=function(){melody([660,880,660,990],0.08,0.1,'triangle',.9)};

/* ---------- ゲーム ---------- */
var GES=[
  {id:'yawn',name:'あくび',em:'🥱',say:'ふぁ〜'},{id:'wash',name:'顔洗い',em:'🫧',say:'ごしごし'},
  {id:'stretch',name:'伸び',em:'🙆',say:'ぐ〜っ'},{id:'sit',name:'おすわり',em:'🐈',say:'ちょこん'},
  {id:'roll',name:'ごろん',em:'🔄',say:'ごろん'},{id:'tail',name:'しっぽ',em:'〰️',say:'フリフリ'},
  {id:'jump',name:'ジャンプ',em:'⬆️',say:'ぴょん'},{id:'sleep',name:'ねる',em:'😴',say:'すやすや'}
];
var stage=$('stage'), svgEl=stage.querySelector('svg'), artEl=stage.querySelector('img.art'), bub=$('bub'), pal=$('pal'), dots=$('dots');
var G={run:0,phase:'idle',mode:modeKey(),round:0,score:0,lives:LIVES,L:null,seq:[],pos:0,wrong:0,timer:null,iv:null,newBest:false,furIdx:0};
/* 絵: cat_yawn / cat_wash / cat_stretch / cat_sit / cat_sleep .png が5枚そろえば、そのしぐさだけ画像、無ければSVGアニメーション */
var ART={};
(function(){['yawn','wash','stretch','sit','sleep'].forEach(function(id){var im=new Image();im.onload=function(){ART[id]=im.src};im.src='./cat_'+id+'.png'})})();
function artOK(){return ['yawn','wash','stretch','sit','sleep'].every(function(k){return ART[k]})}
/* しぐさごとの効果音(Web Audio) */
var SG={
  yawn:function(){var t=ctx.currentTime+0.01;blip(700,t,0.5,'sawtooth',.45,260)},
  wash:function(){var t=ctx.currentTime+0.01;[0,.1,.2,.3].forEach(function(d,k){blip(900+(k%2)*200,t+d,0.07,'square',.4)})},
  stretch:function(){var t=ctx.currentTime+0.01;blip(250,t,0.5,'triangle',.9,700)},
  sit:function(){var t=ctx.currentTime+0.01;blip(330,t,0.09,'triangle',1);blip(247,t+0.1,0.14,'triangle',1)},
  roll:function(){var t=ctx.currentTime+0.01;blip(300,t,0.5,'triangle',.8,900);blip(900,t+0.5,0.2,'triangle',.8,300)},
  tail:function(){var t=ctx.currentTime+0.01;[0,.12,.24,.36].forEach(function(d,k){blip(k%2?520:760,t+d,0.1,'triangle',.7)})},
  jump:function(){var t=ctx.currentTime+0.01;blip(300,t,0.18,'square',.5,900);blip(700,t+0.3,0.14,'square',.4,250)},
  sleep:function(){var t=ctx.currentTime+0.01;blip(330,t,0.4,'sine',.9,220);blip(260,t+0.4,0.4,'sine',.7,180)}
};
sfx.gest=function(id){if(!ready())return;SG[id]()};
function after(ms,fn){var r=G.run;clearTimeout(G.timer);G.timer=setTimeout(function(){if(r===G.run)fn()},ms)}
function say(t){$('msg').textContent=t}
function bonusSay(t){$('bonus').textContent=t||''}
function hearts(){var s='';for(var i=0;i<LIVES;i++)s+=i<G.lives?'❤':'♡';return s}
function render(){
  $('sc').textContent=G.score;$('lives').textContent=hearts();
  $('stRound').textContent=G.round>0?G.round:'-';$('stLen').textContent=G.round>0?G.L.len:'-';$('stKinds').textContent=G.round>0?G.L.K:'-';
  var m=G.phase==='idle'?modeKey():G.mode;$('stMode').textContent=m==='slow'?'ゆっくり':'ふつう';
  var b=bestOf(m);$('stBest').textContent=b.score;$('stBestR').textContent=b.round;
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function setCat(idx){svgEl.innerHTML=svgCat(CATS[idx])}
function setTimerBar(f){$('tbar').style.transform='scaleX('+Math.max(0,Math.min(1,f))+')'}
function clearG(){stage.className=stage.className.replace(/\bg-\w+/g,'').replace(/\s+/g,' ').trim();if(!artOK())stage.classList.remove('useart');bub.classList.remove('on')}
function playG(id,dur,withBub){
  clearG();void stage.offsetWidth;
  stage.style.setProperty('--d',dur+'ms');
  if(artOK()&&ART[id]){artEl.src=ART[id];stage.classList.add('useart')}
  stage.classList.add('g-'+id);
  if(withBub){var g=GES[gidx(id)];bub.textContent=g.say;bub.classList.add('on')}
  sfx.gest(id);
}
function gidx(id){for(var i=0;i<GES.length;i++)if(GES[i].id===id)return i;return 0}
function buildPal(L){
  pal.innerHTML='';var order=[];for(var i=0;i<L.K;i++)order.push(i);if(L.shufPal)shuffle(order);
  order.forEach(function(gi){
    var g=GES[gi],b=document.createElement('button');b.type='button';b.className='gb';b.disabled=true;b.dataset.g=g.id;
    b.innerHTML='<span class="em">'+g.em+'</span><span class="tx">'+g.name+'</span>';b.setAttribute('aria-label',g.name);
    b.addEventListener('pointerdown',function(e){e.preventDefault();unlockAudio();tap(gi,b)});
    b.addEventListener('contextmenu',function(e){e.preventDefault()});
    pal.appendChild(b);
  });
}
function setDots(n,on){dots.innerHTML='';for(var i=0;i<n;i++){var d=document.createElement('i');if(i<on)d.className='on';dots.appendChild(d)}}
document.addEventListener('dblclick',function(e){e.preventDefault()});
['gesturestart','gesturechange'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()})});
var lastTE=0;
document.addEventListener('touchend',function(e){var n=Date.now();if(n-lastTE<350&&e.target&&e.target.closest&&e.target.closest('#pal'))e.preventDefault();lastTE=n},{passive:false});

function startGame(){
  unlockAudio();G.run++;clearTimeout(G.timer);clearInterval(G.iv);
  G.mode=modeKey();G.round=0;G.score=0;G.lives=LIVES;G.newBest=false;
  $('result').hidden=true;var st=$('start');st.textContent='やめる';st.classList.add('stop');$('tSlow').disabled=true;
  sfx.start();say('スタート!猫のしぐさをよく見てね');bonusSay('');render();after(900,nextRound);
}
function stopGame(){
  G.run++;clearTimeout(G.timer);clearInterval(G.iv);G.phase='idle';G.round=0;bonusSay('');setTimerBar(1);clearG();
  [].forEach.call(pal.children,function(b){b.disabled=true});setDots(0,0);
  var st=$('start');st.textContent='はじめる';st.classList.remove('stop');$('tSlow').disabled=false;
  say('やめました。「はじめる」でもう一度あそべます。');render();
}
function nextRound(){
  G.round++;var L=levelOf(G.round);G.L=L;G.wrong=0;G.pos=0;
  clearG();
  var seq=[];for(var i=0;i<L.len;i++){var g;do{g=Math.floor(Math.random()*L.K)}while(G.round<=4&&i>0&&g===seq[i-1]);seq.push(g)}
  G.seq=seq;G.furIdx=Math.floor(Math.random()*CATS.length);setCat(G.furIdx);
  buildPal(L);setDots(L.len,0);render();playSeq();
}
function playSeq(){
  var L=G.L,i=0;G.phase='show';G.pos=0;setDots(L.len,0);
  [].forEach.call(pal.children,function(b){b.disabled=true;b.classList.remove('ok','ng')});
  say('ラウンド'+G.round+':猫のしぐさを順番に覚えてね('+L.len+'こ)');
  after(800,function step(){
    if(i>=L.len){
      clearG();setTimerBar(1);G.phase='input';G.pos=0;
      [].forEach.call(pal.children,function(b){b.disabled=false});sfx.hide();
      say('同じ順番にしぐさをタップ!(1こ目から)');return;
    }
    if(L.mix&&i>0){G.furIdx=(G.furIdx+1+Math.floor(Math.random()*(CATS.length-1)))%CATS.length;setCat(G.furIdx)}
    playG(GES[G.seq[i]].id,L.dur,L.bubble);setTimerBar(1-i/L.len);i++;
    after(L.dur+L.gap,function(){clearG();after(L.gap,step)});
  });
}
function tap(gi,btn){
  if(G.phase!=='input')return;
  var mul=G.mode==='slow'?0.7:1;
  playG(GES[gi].id,450,false);setTimeout(function(){if(G.phase!=='show')clearG()},520);
  if(gi===G.seq[G.pos]){
    G.pos++;setDots(G.L.len,G.pos);btn.classList.add('ok');setTimeout(function(){btn.classList.remove('ok')},250);
    G.score+=Math.round(10*G.round*mul);render();
    if(G.pos>=G.L.len)roundClear();else say('そのとおり!あと '+(G.L.len-G.pos)+'こ');
  }else{
    G.lives--;G.wrong++;btn.classList.add('ng');sfx.miss();render();
    G.phase='between';[].forEach.call(pal.children,function(b){b.disabled=true});
    if(G.lives<=0){
      say('ざんねん…ハートがなくなりました。'+(G.pos+1)+'こ目は「'+GES[G.seq[G.pos]].name+'」だったよ');after(2600,gameOver);
    }else{
      say('ちがうよ…(ハート'+G.lives+'こ)。もう一度見てね。'+(G.pos+1)+'こ目は「'+GES[G.seq[G.pos]].name+'」');
      after(2200,function(){clearG();playSeq()});
    }
  }
}
function roundClear(){
  G.phase='between';[].forEach.call(pal.children,function(b){b.disabled=true});
  var mul=G.mode==='slow'?0.7:1,bonus=Math.round(50*G.round*mul),txt='クリアボーナス +'+bonus;
  if(G.wrong===0){var pb=Math.round(30*G.round*mul);bonus+=pb;txt+=' / ノーミス +'+pb}
  G.score+=bonus;render();say('ラウンド'+G.round+' クリア!');bonusSay(txt);
  setTimeout(sfx.clear,200);after(1700,function(){bonusSay('');nextRound()});
}
function gameOver(){
  var k=G.mode,b=bestOf(k),cleared=Math.max(0,G.round-1),nb={score:b.score,round:b.round};
  if(G.score>nb.score){nb.score=G.score;G.newBest=true}
  if(cleared>nb.round){nb.round=cleared;G.newBest=true}
  if(G.newBest){best[k]=nb;lsSet(LS_BEST,best)}
  G.phase='idle';b=bestOf(k);
  $('result').innerHTML='<h2>ゲームおわり('+(k==='slow'?'ゆっくり':'ふつう')+')</h2><p>得点 <b>'+G.score+'</b> 点 / クリア <b>'+cleared+'</b> ラウンド</p>'+
    (G.newBest?'<p>🎉 ベスト記録を更新!</p>':'<p>ベスト: '+b.score+'点 / '+b.round+'ラウンド</p>');
  $('result').hidden=false;sfx.over();say('おつかれさま!また遊んでね');
  var st=$('start');st.textContent='もう一度あそぶ';st.classList.remove('stop');$('tSlow').disabled=false;
  G.round=0;setTimerBar(1);clearG();render();
}

/* 発音はresume完了後に鳴らす(SalpAudio.gate) */
Object.keys(sfx).forEach(function(k){sfx[k]=SalpAudio.gate(sfx[k])});
meow=SalpAudio.gate(meow);

/* ---------- UI ---------- */
function applySet(){
  document.body.classList.toggle('hc',set.hc);document.body.classList.toggle('large',set.large);
  $('tHc').setAttribute('aria-pressed',String(set.hc));$('tLg').setAttribute('aria-pressed',String(set.large));
  $('tSlow').setAttribute('aria-pressed',String(set.slow));
  $('tSound').setAttribute('aria-pressed',String(set.sound));$('tSound').textContent=set.sound?'🔊 音 ON':'🔈 音 OFF';
  $('vol').value=set.vol;applyVol();
}
function save(){lsSet(LS_SET,set)}
$('tSlow').onclick=function(){set.slow=!set.slow;save();applySet();render()};
$('tHc').onclick=function(){set.hc=!set.hc;save();applySet()};
$('tLg').onclick=function(){set.large=!set.large;save();applySet()};
$('tSound').onclick=function(){set.sound=!set.sound;save();applySet();unlockAudio();if(set.sound&&ctx)meow(4,0.28)};
$('vol').oninput=function(){set.vol=+this.value;save();applyVol()};
$('vol').onchange=function(){unlockAudio();if(set.sound&&ctx)meow(4,0.28)};
$('start').onclick=function(){if(G.phase==='idle')startGame();else stopGame()};

/* 待機画面: 2x2のお家を表示 */
setCat(0);G.L=levelOf(1);applySet();render();
})();
</script>
