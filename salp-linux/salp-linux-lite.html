<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>salp Linux Lite</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css"><style>
*{box-sizing:border-box}body{margin:0;background:#0a1110;color:#edf8ee;font:16px system-ui}.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#13251d}small{color:#a4c8b1}button,input,textarea{font:inherit}button{background:#234332;border:1px solid #427957;border-radius:12px;color:white;padding:12px;min-height:48px}button:active{background:#3a7951}.menu{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:9px}.menu button{font-size:12px;padding:8px 1px}.panel{display:none;padding:12px}.panel.active{display:block}.box{background:#111f19;border:1px solid #305341;border-radius:12px;padding:12px;margin-bottom:10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}#term{height:calc(100dvh - 255px);min-height:280px;background:#020806;padding:5px}textarea{width:100%;min-height:38dvh;background:#07120d;color:#e4f7e8;border:1px solid #497356;border-radius:10px;padding:12px;font:15px monospace}input{background:#07120d;color:white;border:1px solid #497356;border-radius:8px;padding:10px;max-width:100%}#status{font-size:12px;color:#b2d8b8}p{line-height:1.55}pre{white-space:pre-wrap;overflow-wrap:anywhere}
#viewToggle{min-height:46px;font-weight:700;white-space:nowrap;font-size:14px;padding:8px 12px}
body.easy{font-size:20px}
body.easy .top{gap:8px;flex-wrap:wrap;padding:14px}
body.easy #viewToggle{font-size:18px;min-height:56px}
body.easy .menu{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:14px}
body.easy .menu button{font-size:21px;line-height:1.55;min-height:112px;border-radius:18px;border-width:2px;font-weight:700}
body.easy button:not(.menu button){font-size:19px;min-height:58px;padding:13px}
body.easy input,body.easy textarea{font-size:20px;min-height:55px}
body.easy .box{padding:18px}
body.easy #status{font-size:16px}
body.easy #term{height:calc(100dvh - 430px);min-height:260px}
@media(max-width:380px){body.easy .menu button{font-size:18px}}
</style></head><body>
<header class="top"><b>🐧 salp Linux Lite v1.0</b><span id="status">未起動</span><button id="viewToggle" type="button" aria-pressed="false">👁 見やすいモード</button></header>
<nav class="menu"><button data-tab="terminal">💻<br>Terminal</button><button data-tab="files">📁<br>Files</button><button data-tab="python">🐍<br>Python</button><button data-tab="editor">📝<br>Editor</button><button data-tab="browser">🌐<br>Browser</button></nav>
<section id="terminal" class="panel active"><div class="row"><button id="boot">▶ Linux起動</button><button id="focus">⌨ キーボード</button><button id="ctrlc">Ctrl+C</button></div><p><small>CheerpXによる実際のDebian Linux。初回はディスクの読み込みに時間がかかります。</small></p><div id="term"></div></section>
<section id="files" class="panel"><div class="box"><b>📁 一時ファイル</b><p>Linuxのホームフォルダーを確認します。保存したファイルはTerminal・Python・Editorで共通です。</p><button data-cmd="pwd; ls -lah">📂 ファイル一覧をTerminalで表示</button><button data-cmd="mkdir -p ~/projects && ls -lah ~/projects">📁 projectsフォルダーを作る</button></div></section>
<section id="python" class="panel"><div class="box"><b>🐍 Python実行</b><p>ここにPythonコードを貼り付けて、そのまま実行できます。</p><textarea id="pythonCode" spellcheck="false" aria-label="Pythonコード入力">print("Hello from salp Linux Lite!")</textarea><div class="row"><button id="pastePy">📋 貼り付け</button><button id="selectPy">✏️ 入力欄を選択</button><button id="copyPy">📄 コピー</button><button id="runpy">▶ コードを実行</button></div><button class="startLinux" type="button">▶ Linuxを起動</button><p id="pythonMsg"><small>コードはブラウザー内に自動保存されます。</small></p><button data-cmd="python3 --version">Pythonバージョン</button><p><small>Pythonがディスクに含まれない場合は実行できません。</small></p></div></section>
<section id="editor" class="panel"><div class="box"><label>ファイル名 <input id="filename" value="hello.py"></label><p><textarea id="code" spellcheck="false">print("Hello from salp Linux Lite!")</textarea></p><button class="startLinux" type="button">▶ Linuxを起動</button><button id="save">💾 Linuxに保存</button><button id="download">⬇ スマホに保存</button><p id="editStatus"></p></div></section>
<section id="browser" class="panel"><div class="box"><b>🌐 スマホのブラウザーを使用</b><p>Linux内のFirefoxは使いません。URLをスマホのブラウザーで開きます。</p><input id="url" placeholder="https://example.com" value="https://salpmusic.github.io/tools/"><button id="openweb">↗ Webサイトを開く</button></div></section>
<script type="module">
import * as CheerpX from "https://cxrtnc.leaningtech.com/1.2.8/cx.esm.js";
import {Terminal} from "https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/+esm";
import {FitAddon} from "https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/+esm";
const $=id=>document.getElementById(id);let cx,send,ready=false,busy=false;
function setEasy(on){document.body.classList.toggle("easy",on);$("viewToggle").textContent=on?"✓ 見やすい ON":"👁 見やすいモード";$("viewToggle").setAttribute("aria-pressed",String(on));try{localStorage.setItem("salp.linuxLite.easy",on?"1":"0")}catch(_){}setTimeout(()=>{if($("terminal").classList.contains("active"))fit.fit()},100)}
$("viewToggle").onclick=()=>setEasy(!document.body.classList.contains("easy"));
try{if(localStorage.getItem("salp.linuxLite.easy")==="1")setEasy(true)}catch(_){} 
const term=new Terminal({cursorBlink:true,convertEol:true,fontSize:14,theme:{background:"#020806",foreground:"#c8ffd5",cursor:"#9fffb5"}});
const fit=new FitAddon();term.loadAddon(fit);term.open($("term"));fit.fit();term.writeln("salp Linux Lite — ▶ Linux起動 を押してください");term.onData(s=>{if(send)for(const c of s)send(c.charCodeAt(0))});
function show(id){document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id===id));if(id==="terminal"){setTimeout(()=>fit.fit(),80)}}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>show(b.dataset.tab));
let inputQueue=Promise.resolve();
function command(s){if(!ready||!send){$("editStatus").textContent="Linuxが未起動です。Terminalで起動してください";$("pythonMsg").textContent="Linuxが未起動です。Terminalで起動してください";return false}
show("terminal");const chars=s+"\\n";inputQueue=inputQueue.then(async()=>{for(let i=0;i<chars.length;i++){if(!ready||!send)break;send(chars.charCodeAt(i));if(i%24===23)await new Promise(r=>setTimeout(r,16))}});return true}
document.querySelectorAll("[data-cmd]").forEach(b=>b.onclick=()=>command(b.dataset.cmd));
$("focus").onclick=()=>term.focus();$("ctrlc").onclick=()=>send?.(3);
$("boot").onclick=async()=>{if(ready){show("terminal");return}if(busy||cx)return;busy=true;$("boot").disabled=true;try{
$("status").textContent="ディスク接続中";term.writeln("\r\n[1/4] Debianディスク接続...");
const cloud=await CheerpX.CloudDevice.create("wss://disks.webvm.io/debian_large_20230522_5044875331.ext2");
term.writeln("[2/4] 一時ストレージ...");
const idb=await CheerpX.IDBDevice.create("salp-linux-lite-v1");
const overlay=await CheerpX.OverlayDevice.create(cloud,idb);
term.writeln("[3/4] Linux起動...");
cx=await CheerpX.Linux.create({mounts:[{type:"ext2",dev:overlay,path:"/"},{type:"devs",path:"/dev"}]});
send=cx.setCustomConsole(buf=>term.write(new Uint8Array(buf)),term.cols,term.rows);
ready=true;$("status").textContent="● Linux Ready";term.writeln("[4/4] Ready");term.focus();
await cx.run("/bin/bash",["--login"],{env:["HOME=/home/user","USER=user","LOGNAME=user","SHELL=/bin/bash","TERM=xterm-256color","LANG=C","PS1=salp-lite:$ "],cwd:"/home/user",uid:1000,gid:1000});
ready=false;$("status").textContent="終了";
}catch(e){term.writeln("\r\nBOOT ERROR: "+String(e?.message||e));$("status").textContent="起動エラー";cx=null;ready=false;$("boot").disabled=false}finally{busy=false}};
const pyBox=$("pythonCode");try{const saved=localStorage.getItem("salp.linuxLite.pythonCode");if(saved!==null)pyBox.value=saved}catch(_){}pyBox.addEventListener("input",()=>{try{localStorage.setItem("salp.linuxLite.pythonCode",pyBox.value)}catch(_){}});
$("pastePy").onclick=async()=>{try{if(!navigator.clipboard?.readText)throw Error("not supported");pyBox.value=await navigator.clipboard.readText();pyBox.dispatchEvent(new Event("input"));$("pythonMsg").textContent="貼り付けました"}catch(e){pyBox.focus();$("pythonMsg").textContent="iPhoneの制限で直接貼り付けできません。コード欄を長押し→「ペースト」で貼り付けてください"}};
$("copyPy").onclick=async()=>{try{await navigator.clipboard.writeText(pyBox.value);$("pythonMsg").textContent="コピーしました"}catch(e){pyBox.focus();pyBox.select();$("pythonMsg").textContent="コードを選択しました。コピーを選んでください"}};
$("selectPy").onclick=()=>{pyBox.focus();$("pythonMsg").textContent="入力欄を長押しして「ペースト」を選んでください"};
document.querySelectorAll(".startLinux").forEach(b=>b.onclick=()=>{show("terminal");if(!ready)$("boot").click()});
function safeName(s){return /^[a-zA-Z0-9_.-]{1,80}$/.test(s)&&s!=="."&&s!==".."}
$("save").onclick=()=>{const name=$("filename").value.trim();if(!safeName(name)){alert("ファイル名は半角英数字と _ . - のみ");return}const data=new TextEncoder().encode($("code").value);let bin="";for(const b of data)bin+=String.fromCharCode(b);const b64=btoa(bin);if(command("printf '%s' '"+b64+"' | base64 -d > "+name+" && echo Saved:"+name))$("editStatus").textContent="保存コマンドを送信しました。Terminalの Saved 表示を確認してください"};
$("runpy").onclick=()=>{const bytes=new TextEncoder().encode(pyBox.value);let bin="";for(const b of bytes)bin+=String.fromCharCode(b);const encoded=btoa(bin);$("pythonMsg").textContent="Terminalに実行コマンドを送ります";command("printf '%s' '"+encoded+"' | base64 -d > /tmp/salp_lite_run.py && python3 /tmp/salp_lite_run.py")};
$("download").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([$("code").value],{type:"text/plain;charset=utf-8"}));a.download=safeName($("filename").value)?$("filename").value:"hello.py";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("openweb").onclick=()=>{let u=$("url").value.trim();if(!/^https?:\/\//i.test(u))u="https://"+u;try{const parsed=new URL(u);if(!["http:","https:"].includes(parsed.protocol))throw Error();window.open(parsed.href,"_blank","noopener,noreferrer")}catch(e){alert("URLを確認してください")}};
window.addEventListener("resize",()=>{if($("terminal").classList.contains("active"))fit.fit()});
</script></body></html>
