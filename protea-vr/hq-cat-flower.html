(function(){

 if(!audio)return;

  if(audio.paused){await audio.play();button.textContent='📻 停止';}
  else{audio.pause();button.textContent='📻 再生';}
 }catch(e){status.textContent='音楽の再生にはブラウザの許可が必要です。もう一度タップしてね。';}

 const imageMatches=[...html.matchAll(/data:image\/(?:png|jpeg|jpg|webp);base64,[A-Za-z0-9+/=]+/g)].map(m=>m[0]);
 const audioMatches=[...html.matchAll(/data:audio\/(?:mpeg|mp3|wav|ogg|mp4|x-m4a);base64,[A-Za-z0-9+/=]+/g)].map(m=>m[0]);
 const image=imageMatches.sort((a,b)=>b.length-a.length)[0];
 const song=audioMatches.sort((a,b)=>b.length-a.length)[0];
 if(image){
  const holder=document.getElementById('art-panels');
  const im=new Image();
  im.onload=()=>{
   let ratio=im.width/im.height;
   const h=2.9,w=Math.max(1.7,Math.min(3.5,h*ratio));
   for(const [x,y,z,rot,scale] of [[5.87,2.9,-2.2,-90,1]]){

    holder.appendChild(p);
   }
  };
  im.src=image;
 }
 if(song){audio=new Audio(song);audio.loop=true;audio.preload='none';button.disabled=false;button.textContent='📻 再生';}
 else{button.textContent='📻 音源未検出';}
 status.textContent=(image?'元の部屋の絵を壁に配置しました。':'画像を検出できませんでした。')+' '+(song?'音楽は📻を押して再生。':'音楽は未検出です。');
 setTimeout(()=>{if(image&&song)status.style.display='none'},7000);
}).catch(err=>{status.textContent='元の部屋を読み込めませんでした: '+err.message;button.textContent='📻 読込失敗';});
})();

(function(){

/* 3D fur and protea surface maps. Canvas images become real UV textures on meshes. */
(function(){
const THREE=AFRAME.THREE,scene=document.querySelector('a-scene');
let seed=918234;function rnd(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;}
function canvas(){const c=document.createElement('canvas');c.width=c.height=1024;return [c,c.getContext('2d')];}
function map(c){const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
function fur(){
const [c,g]=canvas();g.fillStyle='#f7e9d3';g.fillRect(0,0,1024,1024);
for(let j=0;j<17;j++){const x=rnd()*1150-60,y=rnd()*1100-40,rx=45+rnd()*145,ry=35+rnd()*110;g.save();g.translate(x,y);g.rotate(rnd()*6);g.fillStyle=j%3===0?'#342b29':j%3===1?'#bf7846':'#e4a16a';g.beginPath();g.ellipse(0,0,rx,ry,0,0,Math.PI*2);g.fill();g.restore();}
for(let i=0;i<24000;i++){const x=rnd()*1024,y=rnd()*1024;g.strokeStyle=rnd()>.6?'rgba(255,255,242,.34)':'rgba(65,46,38,.12)';g.lineWidth=.4+rnd()*.9;g.beginPath();g.moveTo(x,y);g.lineTo(x+(rnd()-.5)*5,y+3+rnd()*10);g.stroke();}
return map(c);}
function petal(){
const [c,g]=canvas();const grad=g.createLinearGradient(0,0,0,1024);grad.addColorStop(0,'#f5d8ca');grad.addColorStop(.38,'#e5a7a7');grad.addColorStop(.75,'#b65f7c');grad.addColorStop(1,'#85455c');g.fillStyle=grad;g.fillRect(0,0,1024,1024);
for(let i=0;i<170;i++){let x=rnd()*1024;g.strokeStyle=rnd()>.5?'rgba(255,231,214,.25)':'rgba(100,38,67,.18)';g.lineWidth=.5+rnd()*2;g.beginPath();g.moveTo(x,0);g.bezierCurveTo(x-40,300,x+40,700,x+(rnd()-.5)*70,1024);g.stroke();}
for(let i=0;i<2000;i++){g.fillStyle='rgba(255,236,220,.12)';g.fillRect(rnd()*1024,rnd()*1024,1+rnd()*3,2+rnd()*4);}
return map(c);}
const furMap=fur(),petalMap=petal();
function apply(entity,tex,roughness){
entity.querySelectorAll('a-sphere,a-cone').forEach(e=>{
if(e.classList.contains('touchable'))return;
const mesh=e.getObject3D('mesh');if(!mesh||!mesh.material)return;
const mat=mesh.material.clone();mat.map=tex;mat.color.set('#ffffff');mat.roughness=roughness;mat.metalness=0;mat.needsUpdate=true;mesh.material=mat;
});}
function paint(){
const cat=document.querySelector('#cats > a-entity');if(cat)apply(cat,furMap,.96);
const room=document.getElementById('cozy-room');if(room){
room.querySelectorAll('a-cone').forEach(e=>{
const pos=e.getAttribute('position');if(!pos||pos.y<1.1||pos.x<1||pos.x>2.5)return;
const mesh=e.getObject3D('mesh');if(!mesh||!mesh.material)return;
const mat=mesh.material.clone();mat.map=petalMap;mat.color.set('#ffffff');mat.roughness=.83;mat.side=THREE.DoubleSide;mat.needsUpdate=true;mesh.material=mat;
});
room.querySelectorAll('a-sphere').forEach(e=>{
const pos=e.getAttribute('position');if(!pos||pos.x<1||pos.x>2.5||pos.z>-1.9||pos.z<-3||pos.y<1.3)return;
const mesh=e.getObject3D('mesh');if(!mesh||!mesh.material)return;
const mat=mesh.material.clone();mat.map=petalMap;mat.color.set('#ffffff');mat.roughness=.85;mat.needsUpdate=true;mesh.material=mat;
});
}
}
scene.addEventListener('loaded',()=>{setTimeout(paint,500);setTimeout(paint,2000);});
})();

// Dedicated iOS orientation camera controller. A-Frame's magic-window
// controls can be inactive in embedded iOS browsers, so apply quaternion directly.
(function(){
 const button=document.getElementById('motion'),scene=document.querySelector('a-scene');
 const cam=document.getElementById('viewer');
 const THREE=AFRAME.THREE, zee=new THREE.Vector3(0,0,1);
 const euler=new THREE.Euler(), q0=new THREE.Quaternion(), q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5));
 let latest=null,enabled=false,drag=null,yaw=0,pitch=0,zero=null;
 const rad=Math.PI/180;
 function renderOrientation(){
  if(!enabled||!latest||scene.is('vr-mode'))return;
  const {alpha,beta,gamma}=latest;
  const orient=(screen.orientation&&Number.isFinite(screen.orientation.angle)?screen.orientation.angle:(typeof window.orientation==='number'?window.orientation:0))*rad;
  euler.set(beta*rad,alpha*rad,-gamma*rad,'YXZ');
  q0.setFromEuler(euler).multiply(q1).multiply(new THREE.Quaternion().setFromAxisAngle(zee,-orient));
  if(!zero){zero=q0.clone().invert();}
  cam.object3D.quaternion.copy(zero).multiply(q0);
 }
 window.addEventListener('deviceorientation',e=>{
  if(e.alpha==null||e.beta==null||e.gamma==null)return;
  latest={alpha:e.alpha,beta:e.beta,gamma:e.gamma};
  if(enabled){button.textContent='📱 傾き操作 ON';renderOrientation();}
 },{passive:true});
 function begin(){enabled=true;zero=null;cam.setAttribute('look-controls','enabled:false');button.textContent='📱 本体を傾けてね';}
 button.addEventListener('click',async()=>{
  try{
   if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    if(await DeviceOrientationEvent.requestPermission()!=='granted'){button.textContent='センサー許可が必要です';return;}
   }
   begin();
  }catch(err){button.textContent='Safariで開いてね';}
 });
 scene.addEventListener('loaded',()=>{
  // Touch drag fallback remains available when motion data is unavailable.
  const canvas=scene.canvas;if(!canvas)return;
  canvas.addEventListener('touchstart',e=>{if(scene.is('vr-mode')||e.touches.length!==1)return;drag=[e.touches[0].clientX,e.touches[0].clientY];},{passive:true});
  canvas.addEventListener('touchmove',e=>{
   if(scene.is('vr-mode')||!drag||e.touches.length!==1)return;
   e.preventDefault();
   const t=e.touches[0];yaw-=(t.clientX-drag[0])*.22;pitch=Math.max(-80,Math.min(80,pitch-(t.clientY-drag[1])*.22));drag=[t.clientX,t.clientY];
   if(!enabled||!latest){cam.setAttribute('look-controls','enabled:false');cam.object3D.rotation.set(pitch*rad,yaw*rad,0,'YXZ');}
  },{passive:false});
  canvas.addEventListener('touchend',()=>drag=null);
  canvas.addEventListener('touchcancel',()=>drag=null);
 });
 scene.addEventListener('enter-vr',()=>{enabled=false;zero=null;cam.setAttribute('look-controls','enabled:true');button.style.display='none';});
 scene.addEventListener('exit-vr',()=>{button.style.display='block';cam.setAttribute('look-controls','enabled:false');});
 function tick(){renderOrientation();requestAnimationFrame(tick);}requestAnimationFrame(tick);
})();
</script></body></html>
