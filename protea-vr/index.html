<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>プロテアの朝 VR 試作</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><style>html,body{overflow:hidden}canvas.a-canvas{touch-action:none!important}body{margin:0;background:#151e25;font-family:system-ui}#help{position:fixed;top:10px;left:10px;right:10px;z-index:10;background:#14202bdc;color:white;padding:12px;border-radius:12px;font-size:14px;pointer-events:none}#help small{display:block;margin-top:4px}#dismiss{position:fixed;right:20px;top:20px;z-index:11;font-size:20px;background:#fff;border:0;border-radius:50%;width:36px;height:36px}#radio{position:fixed;bottom:85px;left:15px;z-index:20;padding:12px 17px;border-radius:30px;background:#fff;color:#263c32;border:2px solid #719a77;font-size:17px;font-weight:700}#status{position:fixed;bottom:145px;left:15px;right:15px;z-index:20;background:#162e2cc9;color:#fff;border-radius:9px;padding:8px;font-size:12px;pointer-events:none}#original{display:none;position:fixed;inset:0;width:100%;height:100%;border:0;z-index:30;background:#fff}#mode{position:fixed;top:12px;right:12px;z-index:40;background:#fff;color:#253c31;border:0;border-radius:25px;padding:12px;font-weight:bold}body.original #original{display:block}body.original #help,body.original #dismiss,body.original #radio,body.original #status{display:none}</style></head><body><div id="help">🌸 プロテアの朝 — VR試作版 v0.7<small>Quest 3：右下のVRボタンを押す / スマホ：本体を傾けて見回す / 猫を見つめて選ぶと鳴きます。<br>元の猫タッチから背景と音楽を読み込みます。📻で再生。</small></div><button id="dismiss" onclick="document.getElementById('help').remove();this.remove()">×</button><button id="radio" type="button">📻 音楽を準備中</button><div id="status">プロテアの部屋の画像と音楽を読み込み中…</div><iframe id="original" title="元のプロテアの朝の部屋" src="../salp-protea-morning-v1.0.html" loading="lazy" allow="autoplay"></iframe><button id="mode" type="button">🏡 元の部屋を見る</button><a-scene device-orientation-permission-ui="enabled:false" renderer="colorManagement:true" background="color:#b9dce8" vr-mode-ui="enabled:true" webxr="optionalFeatures: local-floor" cursor="rayOrigin:mouse" raycaster="objects:.touchable"><a-sky color="#c4e6ef"></a-sky><a-entity light="type:ambient;intensity:0.85"></a-entity><a-entity light="type:directional;intensity:1.1" position="-2 7 -4"></a-entity><a-circle rotation="-90 0 0" radius="18" color="#8eac7a"></a-circle><a-cylinder position="0 0 -4" radius="1.5" height=".18" color="#d5c4a5"></a-cylinder><a-entity id="garden"></a-entity><a-entity id="art-panels"></a-entity><a-entity id="cats"></a-entity><a-entity position="0 1.6 0" rotation="0 0 0"><a-camera id="viewer" look-controls="magicWindowTrackingEnabled:true; touchEnabled:false; mouseEnabled:true" wasd-controls="enabled:false"><a-cursor color="#ffffff" fuse="true" fuse-timeout="1200" raycaster="objects:.touchable"></a-cursor></a-camera></a-entity><a-entity laser-controls="hand:right" raycaster="objects:.touchable" line="color:#f7f4df"></a-entity><a-entity laser-controls="hand:left" raycaster="objects:.touchable" line="color:#f7f4df"></a-entity></a-scene><script>const garden=document.querySelector('#garden'),cats=document.querySelector('#cats');function el(tag,attrs,parent){let e=document.createElement('a-'+tag);for(let k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e}for(let i=0;i<45;i++){let a=i*2.39996,r=2.8+Math.sqrt(i/45)*10,x=Math.cos(a)*r,z=Math.sin(a)*r;el('cylinder',{position:`${x} .35 ${z}`,radius:'.045',height:'.7',color:'#527c4a'},garden);el('sphere',{position:`${x} .78 ${z}`,radius:'.24',scale:'1 1.25 1',color:i%3===0?'#e59ca0':i%3===1?'#eac6a0':'#f4d5d9'},garden);for(let j=0;j<5;j++){let t=j*Math.PI*2/5;el('sphere',{position:`${x+Math.cos(t)*.14} .8 ${z+Math.sin(t)*.14}`,radius:'.12',color:'#dc8196'},garden)}}let cat=el('entity',{position:'0 0 -2.5'},cats);el('sphere',{position:'0 .35 0',scale:'.75 .55 .5',radius:'.5',color:'#fff2d8'},cat);el('sphere',{position:'0 .78 -.08',radius:'.31',color:'#f6e9d7'},cat);for(let s of [-1,1]){el('cone',{position:`${s*.19} 1.05 -.08`,'radius-bottom':'.14','radius-top':'0',height:'.26',color:s===1?'#ab704f':'#e8ad79'},cat);el('sphere',{position:`${s*.12} .83 -.34`,radius:'.04',color:'#272727'},cat)}el('sphere',{position:'0 .73 -.37',radius:'.035',color:'#d17c87'},cat);el('sphere',{position:'-.22 .92 -.23',radius:'.14',color:'#bd8458'},cat);el('sphere',{position:'.22 .43 -.25',radius:'.16',color:'#34373b'},cat);let hit=el('sphere',{position:'0 .7 -.06',radius:'.55',material:'opacity:0;transparent:true',class:'touchable'},cat);hit.addEventListener('click',()=>{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(650,a.currentTime);o.frequency.exponentialRampToValueAtTime(340,a.currentTime+.25);g.gain.setValueAtTime(.13,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.35);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.36)});

(function(){
const source='../salp-protea-morning-v1.0.html';document.getElementById('mode').addEventListener('click',function(){const original=document.body.classList.toggle('original');this.textContent=original?'🥽 VR空間に戻る':'🏡 元の部屋を見る';});
const status=document.getElementById('status'),button=document.getElementById('radio');
let audio=null;
button.disabled=true;
button.addEventListener('click',async()=>{
 if(!audio)return;
 try{
  if(audio.paused){await audio.play();button.textContent='📻 停止';}
  else{audio.pause();button.textContent='📻 再生';}
 }catch(e){status.textContent='音楽の再生にはブラウザの許可が必要です。もう一度タップしてね。';}
});
fetch(source).then(r=>{if(!r.ok)throw Error('元の部屋が見つかりません ('+r.status+')');return r.text()}).then(html=>{
 const imageMatches=[...html.matchAll(/data:image\/(?:png|jpeg|jpg|webp);base64,[A-Za-z0-9+/=]+/g)].map(m=>m[0]);
 const audioMatches=[...html.matchAll(/data:audio\/(?:mpeg|mp3|wav|ogg|mp4|x-m4a);base64,[A-Za-z0-9+/=]+/g)].map(m=>m[0]);
 const image=imageMatches.sort((a,b)=>b.length-a.length)[0];
 const song=audioMatches.sort((a,b)=>b.length-a.length)[0];
 if(image){
  const holder=document.getElementById('art-panels');
  const im=new Image();
  im.onload=()=>{
   let ratio=im.width/im.height;
   const h=4.8,w=Math.max(2.7,Math.min(8,h*ratio));
   for(const [x,y,z,rot,scale] of [[0,2.4,-8,0,1],[-7,2.4,-3,75,1],[7,2.4,-3,-75,1]]){
    const p=document.createElement('a-plane');
    p.setAttribute('position',x+' '+y+' '+z);
    p.setAttribute('rotation','0 '+rot+' 0');
    p.setAttribute('width',w*scale);p.setAttribute('height',h*scale);
    p.setAttribute('material',{shader:'flat',side:'double',transparent:true,src:image});
    holder.appendChild(p);
   }
  };
  im.src=image;
 }
 if(song){audio=new Audio(song);audio.loop=true;audio.preload='none';button.disabled=false;button.textContent='📻 再生';}
 else{button.textContent='📻 音源未検出';}
 status.textContent=(image?'元の部屋の絵を配置しました。':'画像を検出できませんでした。')+' '+(song?'音楽は📻を押して再生。':'音楽は未検出です。');
 setTimeout(()=>{if(image&&song)status.style.display='none'},7000);
}).catch(err=>{status.textContent='元の部屋を読み込めませんでした: '+err.message;button.textContent='📻 読込失敗';});
})();</script></body></html>
