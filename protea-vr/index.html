<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>プロテアの朝 VR 試作</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><style>html,body{overflow:hidden}canvas.a-canvas{touch-action:none!important}body{margin:0;background:#151e25;font-family:system-ui}#help{position:fixed;top:10px;left:10px;right:10px;z-index:10;background:#14202bdc;color:white;padding:12px;border-radius:12px;font-size:14px;pointer-events:none}#help small{display:block;margin-top:4px}#dismiss{position:fixed;right:20px;top:20px;z-index:11;font-size:20px;background:#fff;border:0;border-radius:50%;width:36px;height:36px}</style></head><body><div id="help">🌸 プロテアの朝 — VR試作版 v0.3<small>Quest 3：右下のVRボタンを押す / スマホ：スワイプで見回す / 猫を見つめて選ぶと鳴きます。<br>※元画像・楽曲は未組込。スマホでは画面を上下左右にドラッグして見回せます。</small></div><button id="dismiss" onclick="document.getElementById('help').remove();this.remove()">×</button><a-scene device-orientation-permission-ui="enabled:false" renderer="colorManagement:true" background="color:#b9dce8" vr-mode-ui="enabled:true" webxr="optionalFeatures: local-floor" cursor="rayOrigin:mouse" raycaster="objects:.touchable"><a-sky color="#c4e6ef"></a-sky><a-entity light="type:ambient;intensity:0.85"></a-entity><a-entity light="type:directional;intensity:1.1" position="-2 7 -4"></a-entity><a-circle rotation="-90 0 0" radius="18" color="#8eac7a"></a-circle><a-cylinder position="0 0 -4" radius="1.5" height=".18" color="#d5c4a5"></a-cylinder><a-entity id="garden"></a-entity><a-entity id="cats"></a-entity><a-entity position="0 1.6 0" rotation="0 0 0"><a-camera id="viewer" look-controls="magicWindowTrackingEnabled:false; touchEnabled:false; mouseEnabled:false" wasd-controls="enabled:false"><a-cursor color="#ffffff" fuse="true" fuse-timeout="1200" raycaster="objects:.touchable"></a-cursor></a-camera></a-entity><a-entity laser-controls="hand:right" raycaster="objects:.touchable" line="color:#f7f4df"></a-entity><a-entity laser-controls="hand:left" raycaster="objects:.touchable" line="color:#f7f4df"></a-entity></a-scene><script>const garden=document.querySelector('#garden'),cats=document.querySelector('#cats');function el(tag,attrs,parent){let e=document.createElement('a-'+tag);for(let k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e}for(let i=0;i<45;i++){let a=i*2.39996,r=2.8+Math.sqrt(i/45)*10,x=Math.cos(a)*r,z=Math.sin(a)*r;el('cylinder',{position:`${x} .35 ${z}`,radius:'.045',height:'.7',color:'#527c4a'},garden);el('sphere',{position:`${x} .78 ${z}`,radius:'.24',scale:'1 1.25 1',color:i%3===0?'#e59ca0':i%3===1?'#eac6a0':'#f4d5d9'},garden);for(let j=0;j<5;j++){let t=j*Math.PI*2/5;el('sphere',{position:`${x+Math.cos(t)*.14} .8 ${z+Math.sin(t)*.14}`,radius:'.12',color:'#dc8196'},garden)}}let cat=el('entity',{position:'0 0 -2.5'},cats);el('sphere',{position:'0 .35 0',scale:'.75 .55 .5',radius:'.5',color:'#fff2d8'},cat);el('sphere',{position:'0 .78 -.08',radius:'.31',color:'#f6e9d7'},cat);for(let s of [-1,1]){el('cone',{position:`${s*.19} 1.05 -.08`,radius-bottom:'.14',radius-top:'0',height:'.26',color:s===1?'#ab704f':'#e8ad79'},cat);el('sphere',{position:`${s*.12} .83 -.34`,radius:'.04',color:'#272727'},cat)}el('sphere',{position:'0 .73 -.37',radius:'.035',color:'#d17c87'},cat);el('sphere',{position:'-.22 .92 -.23',radius:'.14',color:'#bd8458'},cat);el('sphere',{position:'.22 .43 -.25',radius:'.16',color:'#34373b'},cat);let hit=el('sphere',{position:'0 .7 -.06',radius:'.55',material:'opacity:0;transparent:true',class:'touchable'},cat);hit.addEventListener('click',()=>{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(650,a.currentTime);o.frequency.exponentialRampToValueAtTime(340,a.currentTime+.25);g.gain.setValueAtTime(.13,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.35);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.36)});
// iOS touch drag fallback: explicitly rotate the camera outside immersive VR.
(function(){
 const scene=document.querySelector('a-scene');
 const cam=document.querySelector('#viewer');
 let last=null,yaw=0,pitch=0;
 function mobile(){return !scene.is('vr-mode');}
 scene.addEventListener('loaded',()=>{
  cam.setAttribute('look-controls','enabled:false');
  scene.addEventListener('enter-vr',()=>{last=null;cam.setAttribute('rotation','0 0 0');cam.setAttribute('look-controls','enabled:true');});
  scene.addEventListener('exit-vr',()=>{cam.setAttribute('look-controls','enabled:false');cam.setAttribute('rotation',pitch+' '+yaw+' 0');});
  const canvas=scene.canvas;
  canvas.style.touchAction='none';
  canvas.addEventListener('touchstart',e=>{if(!mobile()||e.touches.length!==1)return;last={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
  canvas.addEventListener('touchmove',e=>{if(!mobile()||!last||e.touches.length!==1)return;e.preventDefault();const p=e.touches[0];yaw-=(p.clientX-last.x)*.22;pitch=Math.max(-85,Math.min(85,pitch-(p.clientY-last.y)*.22));cam.setAttribute('rotation',pitch+' '+yaw+' 0');last={x:p.clientX,y:p.clientY};},{passive:false});
  canvas.addEventListener('touchend',()=>last=null);
  canvas.addEventListener('touchcancel',()=>last=null);
  let dragging=false;
  canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&mobile()){dragging=true;last={x:e.clientX,y:e.clientY};}});
  canvas.addEventListener('pointermove',e=>{if(!dragging||!mobile())return;yaw-=(e.clientX-last.x)*.22;pitch=Math.max(-85,Math.min(85,pitch-(e.clientY-last.y)*.22));cam.setAttribute('rotation',pitch+' '+yaw+' 0');last={x:e.clientX,y:e.clientY};});
  window.addEventListener('pointerup',()=>{dragging=false;last=null;});
 });
})();</script></body></html>
