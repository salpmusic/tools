<a-entity laser-controls="hand:left" raycaster="objects:.touchable" line="color:#f7f4df"></a-entity></a-scene><script>const garden=document.querySelector('#garden'),cats=document.querySelector('#cats');function el(tag,attrs,parent){let e=document.createElement('a-'+tag);for(let k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e}for(let i=0;i<45;i++){let a=i*2.39996,r=2.8+Math.sqrt(i/45)*10,x=Math.cos(a)*r,z=Math.sin(a)*r;el('cylinder',{position:`${x} .35 ${z}`,radius:'.045',height:'.7',color:'#527c4a'},garden);el('sphere',{position:`${x} .78 ${z}`,radius:'.24',scale:'1 1.25 1',color:i%3===0?'#e59ca0':i%3===1?'#eac6a0':'#f4d5d9'},garden);for(let j=0;j<5;j++){let t=j*Math.PI*2/5;el('sphere',{position:`${x+Math.cos(t)*.14} .8 ${z+Math.sin(t)*.14}`,radius:'.12',color:'#dc8196'},garden)}}let cat=el('entity',{position:'0 0 -2.5'},cats);el('sphere',{position:'0 .35 0',scale:'.75 .55 .5',radius:'.5',color:'#fff2d8'},cat);el('sphere',{position:'0 .78 -.08',radius:'.31',color:'#f6e9d7'},cat);for(let s of [-1,1]){el('cone',{position:`${s*.19} 1.05 -.08`,'radius-bottom':'.14','radius-top':'0',height:'.26',color:s===1?'#ab704f':'#e8ad79'},cat);el('sphere',{position:`${s*.12} .83 -.34`,radius:'.04',color:'#272727'},cat)}el('sphere',{position:'0 .73 -.37',radius:'.035',color:'#d17c87'},cat);el('sphere',{position:'-.22 .92 -.23',radius:'.14',color:'#bd8458'},cat);el('sphere',{position:'.22 .43 -.25',radius:'.16',color:'#34373b'},cat);let hit=el('sphere',{position:'0 .7 -.06',radius:'.55',material:'opacity:0;transparent:true',class:'touchable'},cat);hit.addEventListener('click',()=>{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(650,a.currentTime);o.frequency.exponentialRampToValueAtTime(340,a.currentTime+.25);g.gain.setValueAtTime(.13,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.35);o.connect(g).connect(a.destination);o.start();o.stop(a.currentT
