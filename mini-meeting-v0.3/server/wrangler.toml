name = "salp-mini-meeting-token"
main = "worker.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://salpmusic.github.io"
# LiveKit Cloud の Project URL を指定（公開情報）
LIVEKIT_URL = "wss://salp-mini-meeting-qv4pbpth.livekit.cloud"

# IP ごとの試行制限。Cloudflare の同一ロケーション単位で適用されます。
[[ratelimits]]
name = "TOKEN_RATE_LIMITER"
namespace_id = "10303"
simple = { limit = 10, period = 60 }

# 以下は `npx wrangler secret put NAME` で登録。値はこのファイルへ書かない。
# LIVEKIT_API_KEY
# LIVEKIT_API_SECRET
# MEETINGS_JSON
