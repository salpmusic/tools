<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>salp 小説エディタ</title><style>body{margin:0;background:#111820;color:#edf3fa;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{position:sticky;top:0;background:#1b2734;padding:12px;z-index:2;border-bottom:1px solid #405064}h1{font-size:17px;margin:0 0 8px}.counts{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}.count-block{min-width:0;flex:1 1 130px}@media(max-width:420px){.counts{gap:10px}.count{font-size:32px}}.count-block small{display:block;margin-bottom:2px}.count{font-size:38px;font-weight:800;color:#9cdeff}small{color:#aebcca}main{max-width:920px;margin:auto;padding:12px}input,textarea{box-sizing:border-box;width:100%;background:#182430;color:#fff;border:1px solid #516071;border-radius:10px;padding:12px;font:inherit}textarea{height:65vh;line-height:1.9;font-size:var(--editor-font-size,26px);resize:vertical}input{margin-bottom:12px}button{background:#30465b;color:white;border:1px solid #66819b;border-radius:9px;padding:10px;margin:4px 3px 4px 0}button:active{background:#456987}.toolbar{display:flex;flex-wrap:wrap}#status{font-size:12px;color:#aee2bc}a{color:#9cdeff}.markbar{border:1px solid #587e76;background:#192c30;border-radius:10px;padding:12px;margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}.markbar #markInfo{color:#aee2bc;font-size:14px;margin-top:4px}.markbar button{font-size:14px;padding:9px}</style><header><h1>✍️ salp 小説エディタ</h1><div class="counts"><div class="count-block"><small id="detail">全文字数（改行を除く）</small><div class="count"><span id="count">0</span><span style="font-size:16px"> 文字</span></div></div><div class="count-block"><small>カーソル位置まで</small><div class="count"><span id="cursorCount">0</span><span style="font-size:16px"> 文字</span></div></div></div><div id="status">準備中</div></header><main><div class="font-controls" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px"><label for="fontSize">本文の文字サイズ</label><button type="button" id="fontDown" aria-label="文字を小さく">−</button><strong id="fontLabel" aria-live="polite">26px</strong><button type="button" id="fontUp" aria-label="文字を大きく">＋</button><input id="fontSize" type="range" min="16" max="48" step="2" value="26" aria-label="本文の文字サイズ" style="width:130px;flex:1;max-width:230px;margin:0"></div><section style="border:1px solid #405064;border-radius:10px;padding:12px;margin-bottom:12px"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><label>章 <select id="chapter" style="width:auto;min-width:110px;padding:9px"></select></label><label>話 <select id="episode" style="width:auto;min-width:120px;padding:9px"></select></label><button id="addChapter" type="button">＋章</button><button id="addEpisode" type="button">＋話</button></div><small>章・話ごとに原稿を個別保存。切替前にも自動保存します。</small></section><section class="markbar"><div><strong>📍 書き直し済みの位置</strong><div id="markInfo">未設定</div></div><div><button type="button" id="setMark">ここまで完了 ✓</button><button type="button" id="jumpMark">目印へ移動</button><button type="button" id="clearMark">解除</button></div></section><input id="title" placeholder="作品名・章タイトル" aria-label="作品名"><textarea id="body" placeholder="ここから物語を書き始めよう…" spellcheck="true" aria-label="本文"></textarea><div class="toolbar"><button id="export">本文をTXT保存</button><button id="backup">バックアップ保存</button><button id="restore">履歴から復元</button><button id="import">TXT読み込み</button><button id="share">全章を共有・保存</button><button id="projectImport">全章を読み込み</button><input type="file" id="projectFile" accept=".json,application/json" hidden><input type="file" id="file" accept=".txt,text/plain" hidden></div><small>この端末・ブラウザーに自動保存します。端末故障やブラウザーデータ削除に備えて、定期的にTXTを保存してください。「全章を共有・保存」でJSONファイルをiCloud DriveやBoxへ保存し、別端末で「全章を読み込み」してください。自動同期ではありません。</small><p><a href="./">← salp Tools</a></p></main><script>(()=>{'use strict';
const $=id=>document.getElementById(id),key='salp.novel.v1',historyKey=key+'.history',projectKey=key+'.project',fontKey=key+'.fontSize';
const load=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?f:v}catch(e){return f}};
const now=()=>new Date().toISOString();
const defaultProject=()=>({format:'salp-novel-project',version:2,chapters:[{id:1,episodes:[{id:1,title:'',body:'',at:now()}]}],selected:{chapter:1,episode:1}});
let project=load(projectKey,null),timer=null;
if(!project||!Array.isArray(project.chapters)||!project.chapters.length){
 const legacy=load(key,{});
 project=defaultProject();
 project.chapters[0].episodes[0]={id:1,title:legacy.title||'',body:legacy.body||'',at:legacy.at||now()};
 try{localStorage.setItem(projectKey,JSON.stringify(project))}catch(e){}
}
const status=s=>$('status').textContent=s;
const safe=()=>{try{localStorage.setItem(projectKey,JSON.stringify(project));return true}catch(e){status('⚠ 保存失敗。全章を共有・保存してください');return false}};
const chapter=()=>project.chapters.find(c=>c.id===project.selected.chapter);
const episode=()=>chapter()?.episodes.find(e=>e.id===project.selected.episode);
const archive=()=>{try{const v={title:$('title').value,body:$('body').value,at:now(),chapter:project.selected.chapter,episode:project.selected.episode};let a=load(historyKey,[]);if(a[0]&&a[0].title===v.title&&a[0].body===v.body&&a[0].chapter===v.chapter&&a[0].episode===v.episode)return;a.unshift(v);localStorage.setItem(historyKey,JSON.stringify(a.slice(0,40)))}catch(e){}};
const save=()=>{const e=episode();if(!e)return false;e.title=$('title').value;e.body=$('body').value;e.at=now();const ok=safe();if(ok)status('自動保存済み '+new Date().toLocaleTimeString('ja-JP'));return ok};
const count=()=>{$('count').textContent=[...$('body').value.replace(/[\r\n]/g,'')].length.toLocaleString('ja-JP')};
const cursorCount=()=>{const el=$('body');$('cursorCount').textContent=[...el.value.slice(0,el.selectionStart||0).replace(/[\r\n]/g,'')].length.toLocaleString('ja-JP')};
let previousBody='';
const markInfo=()=>{const e=episode(),m=e&&Number.isInteger(e.mark)?Math.min(e.mark,$('body').value.length):null;$('markInfo').textContent=m===null?'目印なし': '完了：'+[...$('body').value.slice(0,m).replace(/[\\r\\n]/g,'')].length.toLocaleString('ja-JP')+'文字目';$('jumpMark').disabled=m===null;$('clearMark').disabled=m===null};
const trackMark=()=>{const e=episode(),next=$('body').value,old=previousBody;if(e&&Number.isInteger(e.mark)&&next!==old){let start=0;while(start<old.length&&start<next.length&&old[start]===next[start])start++;let end=0;while(end<old.length-start&&end<next.length-start&&old[old.length-1-end]===next[next.length-1-end])end++;const removed=old.length-start-end,added=next.length-start-end;if(start<e.mark)e.mark=Math.max(start,Math.min(next.length,e.mark+(added-removed)));}previousBody=next;markInfo()};
$('setMark').onclick=()=>{const e=episode();if(!e)return;e.mark=$('body').selectionStart||0;markInfo();save();status('📍 書き直し済みの位置を保存しました')};
$('jumpMark').onclick=()=>{const e=episode();if(!e||!Number.isInteger(e.mark))return;const el=$('body'),p=Math.min(e.mark,el.value.length);el.focus();el.setSelectionRange(p,p);cursorCount();const before=el.value.slice(0,p).split('\\n').length-1;el.scrollTop=Math.max(0,before*parseFloat(getComputedStyle(el).lineHeight)-el.clientHeight/3)};
$('clearMark').onclick=()=>{const e=episode();if(!e||!confirm('この話の目印を解除しますか？'))return;delete e.mark;markInfo();save()};
const changed=()=>{trackMark();count();cursorCount();save();clearTimeout(timer);timer=setTimeout(archive,5000)};
const render=()=>{const c=$('chapter'),e=$('episode');c.replaceChildren();e.replaceChildren();project.chapters.sort((a,b)=>a.id-b.id);for(const ch of project.chapters)c.add(new Option('第'+ch.id+'章',ch.id));const ch=chapter()||project.chapters[0];project.selected.chapter=ch.id;ch.episodes.sort((a,b)=>a.id-b.id);for(const ep of ch.episodes)e.add(new Option('第'+String(ep.id).padStart(3,'0')+'話',ep.id));if(!episode())project.selected.episode=ch.episodes[0].id;c.value=String(project.selected.chapter);e.value=String(project.selected.episode);$('title').value=episode().title||'';$('body').value=episode().body||'';previousBody=$('body').value;count();cursorCount();markInfo();safe()};
const switchTo=(c,e)=>{archive();save();project.selected={chapter:Number(c),episode:Number(e)};render();status('ページを切り替えました')};
$('chapter').onchange=()=>{const c=Number($('chapter').value);const ch=project.chapters.find(x=>x.id===c);switchTo(c,ch.episodes[0].id)};
$('episode').onchange=()=>switchTo(project.selected.chapter,Number($('episode').value));
$('addChapter').onclick=()=>{archive();save();const id=Math.max(0,...project.chapters.map(c=>c.id))+1;project.chapters.push({id,episodes:[{id:1,title:'',body:'',at:now()}]});project.selected={chapter:id,episode:1};render();status('新しい章を追加しました')};
$('addEpisode').onclick=()=>{archive();save();const ch=chapter(),id=Math.max(0,...ch.episodes.map(e=>e.id))+1;ch.episodes.push({id,title:'',body:'',at:now()});project.selected.episode=id;render();status('新しい話を追加しました')};
const clamp=n=>Math.max(16,Math.min(48,Math.round(n/2)*2));
const setFont=n=>{const size=clamp(n);document.documentElement.style.setProperty('--editor-font-size',size+'px');$('fontSize').value=size;$('fontLabel').textContent=size+'px';try{localStorage.setItem(fontKey,String(size))}catch(e){}};
setFont(Number(localStorage.getItem(fontKey))||26);
$('fontDown').onclick=()=>setFont(Number($('fontSize').value)-2);
$('fontUp').onclick=()=>setFont(Number($('fontSize').value)+2);
$('fontSize').oninput=e=>setFont(Number(e.target.value));
$('title').addEventListener('input',changed);$('body').addEventListener('input',changed);
['click','keyup','select','focus','touchend'].forEach(ev=>$('body').addEventListener(ev,cursorCount));
document.addEventListener('selectionchange',()=>{if(document.activeElement===$('body'))cursorCount()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){archive();save()}});
window.addEventListener('pagehide',()=>{archive();save()});
setInterval(()=>{save()},30000);
const download=(name,text,type='text/plain;charset=utf-8')=>{const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000)};
const filename=s=>(s||'小説').replace(/[\\/:*?"<>|]/g,'_');
$('export').onclick=()=>{archive();save();download('第'+project.selected.chapter+'章-第'+String(project.selected.episode).padStart(3,'0')+'話-'+filename($('title').value)+'.txt',$('body').value)};
$('backup').onclick=()=>{archive();save();download('salp-novel-backup-'+now().slice(0,10)+'.json',JSON.stringify({current:{title:$('title').value,body:$('body').value,at:now()},history:load(historyKey,[]),project},null,2),'application/json')};
$('share').onclick=async()=>{archive();save();const name='salp-novel-all-'+now().slice(0,10)+'.json',data=JSON.stringify(project,null,2),file=new File([data],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'小説原稿・全章'});status('共有メニューを開きました');return}catch(e){if(e.name==='AbortError')return}}download(name,data,'application/json');status('全章ファイルを保存しました')};
$('projectImport').onclick=()=>$('projectFile').click();
$('projectFile').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());const p=data.format==='salp-novel-project'?data:data.project;if(!p||!Array.isArray(p.chapters)||!p.chapters.length||!p.chapters.every(c=>Number.isInteger(c.id)&&Array.isArray(c.episodes)&&c.episodes.length&&c.episodes.every(e=>Number.isInteger(e.id)&&typeof e.body==='string'&&typeof e.title==='string')))throw Error('形式が違います');if(!confirm('現在の全章データを読み込んだファイルで置き換えます。先に「全章を共有・保存」でバックアップしてください。続けますか？'))return;archive();save();const old=project;project=p;project.selected=project.selected||{chapter:project.chapters[0].id,episode:project.chapters[0].episodes[0].id};if(!safe()){project=old;throw Error('端末に保存できませんでした')}render();status('全章を読み込みました')}catch(e){alert('読み込みできません：'+e.message)}finally{ev.target.value=''}};
$('restore').onclick=()=>{const a=load(historyKey,[]);if(!a.length)return alert('履歴はまだありません');const s=a.slice(0,20).map((v,i)=>i+1+'：'+new Date(v.at).toLocaleString('ja-JP')+' 第'+(v.chapter||1)+'章 '+(v.title||'無題')).join('\n');const n=Number(prompt('復元する履歴番号を入力してください\n'+s));if(!Number.isInteger(n)||n<1||n>Math.min(a.length,20))return;if(!confirm('現在のページを履歴に退避し、選択した履歴を現在のページへ復元しますか？'))return;archive();$('title').value=a[n-1].title;$('body').value=a[n-1].body;delete episode().mark;previousBody=$('body').value;changed()};
$('import').onclick=()=>$('file').click();
$('file').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;if(!confirm('現在のページを履歴に退避してTXTを読み込みますか？')){ev.target.value='';return}archive();$('body').value=await f.text();delete episode().mark;previousBody=$('body').value;changed();ev.target.value=''};
render();status('原稿を復元しました');
})();</script></html>
