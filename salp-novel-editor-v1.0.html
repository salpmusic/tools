<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>salp 小説エディタ</title><style>body{margin:0;background:#111820;color:#edf3fa;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{position:sticky;top:0;background:#1b2734;padding:12px;z-index:2;border-bottom:1px solid #405064}h1{font-size:17px;margin:0 0 8px}.count{font-size:38px;font-weight:800;color:#9cdeff}small{color:#aebcca}main{max-width:920px;margin:auto;padding:12px}input,textarea{box-sizing:border-box;width:100%;background:#182430;color:#fff;border:1px solid #516071;border-radius:10px;padding:12px;font:inherit}textarea{height:65vh;line-height:1.9;font-size:18px;resize:vertical}input{margin-bottom:12px}button{background:#30465b;color:white;border:1px solid #66819b;border-radius:9px;padding:10px;margin:4px 3px 4px 0}button:active{background:#456987}.toolbar{display:flex;flex-wrap:wrap}#status{font-size:12px;color:#aee2bc}a{color:#9cdeff}</style><header><h1>✍️ salp 小説エディタ</h1><div class="count"><span id="count">0</span><span style="font-size:17px"> 文字</span></div><small id="detail">改行を除く文字数</small><div id="status">準備中</div></header><main><input id="title" placeholder="作品名・章タイトル" aria-label="作品名"><textarea id="body" placeholder="ここから物語を書き始めよう…" spellcheck="true" aria-label="本文"></textarea><div class="toolbar"><button id="export">本文をTXT保存</button><button id="backup">バックアップ保存</button><button id="restore">履歴から復元</button><button id="import">TXT読み込み</button><input type="file" id="file" accept=".txt,text/plain" hidden></div><small>この端末・ブラウザーに自動保存します。端末故障やブラウザーデータ削除に備えて、定期的にTXTを保存してください。別端末とは同期しません。</small><p><a href="./">← salp Tools</a></p></main><script>(()=>{'use strict';const $=x=>document.getElementById(x),key='salp.novel.v1',historyKey=key+'.history';let timer=null,last='';const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f}catch(e){return f}};const snapshot=()=>({title:$('title').value,body:$('body').value,at:new Date().toISOString()});const count=()=>{$('count').textContent=[...$('body').value.replace(/[\r\n]/g,'')].length.toLocaleString('ja-JP')};const status=s=>$('status').textContent=s;const save=()=>{clearTimeout(timer);try{const v=snapshot();localStorage.setItem(key,JSON.stringify(v));last=JSON.stringify(v);status('保存済み '+new Date().toLocaleTimeString('ja-JP'))}catch(e){status('⚠ 保存できません。TXTをダウンロードしてください')}};const archive=()=>{try{let a=load(historyKey,[]),v=snapshot();if(a.length&&a[0].body===v.body&&a[0].title===v.title)return;a.unshift(v);localStorage.setItem(historyKey,JSON.stringify(a.slice(0,40)))}catch(e){status('⚠ 履歴の保存に失敗')}};const changed=()=>{count();status('編集中…');try{localStorage.setItem(key,JSON.stringify(snapshot()));status('自動保存済み')}catch(e){status('⚠ 保存失敗。TXTを保存してください')}clearTimeout(timer);timer=setTimeout(()=>{archive();save()},5000)};let v=load(key,{});$('title').value=v.title||'';$('body').value=v.body||'';count();status('復元しました');last=JSON.stringify(snapshot());$('title').addEventListener('input',changed);$('body').addEventListener('input',changed);document.addEventListener('visibilitychange',()=>{if(document.hidden){archive();save()}});window.addEventListener('pagehide',()=>{archive();save()});setInterval(()=>{if(JSON.stringify(snapshot())!==last){archive();save()}},30000);const download=(name,text)=>{const u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};$('export').onclick=()=>{archive();save();download(($('title').value||'小説').replace(/[\\/:*?"<>|]/g,'_')+'.txt',$('body').value)};$('backup').onclick=()=>{archive();save();download('salp-novel-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({current:snapshot(),history:load(historyKey,[])},null,2))};$('restore').onclick=()=>{const a=load(historyKey,[]);if(!a.length)return alert('履歴はまだありません');const s=a.slice(0,20).map((v,i)=>i+1+'：'+new Date(v.at).toLocaleString('ja-JP')+'　'+(v.title||'無題')+'　'+v.body.length+'文字').join('\n');const n=Number(prompt('復元する履歴番号を入力してください\n'+s));if(!Number.isInteger(n)||n<1||n>a.length)return;if(!confirm('現在の原稿を履歴に退避して復元しますか？'))return;archive();$('title').value=a[n-1].title;$('body').value=a[n-1].body;changed();save()};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!confirm('現在の原稿を履歴に退避し、TXTを読み込みますか？'))return;archive();$('body').value=await f.text();changed();save();e.target.value=''};})();</script></html>
