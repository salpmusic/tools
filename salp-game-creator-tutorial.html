<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>三毛猫と学ぶゲームプログラミング</title><style>:root{font-family:system-ui,sans-serif;background:#101827;color:#f5f8ff}body{margin:0}header{background:#243652;padding:17px}h1{font-size:23px;margin:5px 0}main{max-width:800px;margin:auto;padding:16px}a,button{color:white;background:#3e5b9a;border:0;border-radius:12px;padding:12px 16px;display:inline-block;text-decoration:none;font:inherit;min-height:44px}button{cursor:pointer}.card{background:#233149;border-radius:18px;padding:20px;margin:14px 0}.muted{color:#c2d2ea}.step{color:#9ce7c3;font-weight:bold}.code{background:#101827;border-radius:12px;padding:14px;line-height:2;font-size:18px}.controls{display:flex;gap:9px;justify-content:space-between;flex-wrap:wrap}.progress{height:9px;background:#3b4d67;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:#74e1b1;transition:width .2s}label{display:flex;gap:8px;align-items:center;margin:12px 0}input{width:22px;height:22px}footer{padding:20px;text-align:center;color:#b6c7db}</style></head><body><header><h1>🐈 三毛猫と学ぶゲームプログラミング</h1><div>salp Game Creator 入門チュートリアル</div></header><main><p><a href="./salp-game-creator-v1.1.html">🎮 開発環境を開く</a> <a href="./index.html">🏠 ホームへ</a></p><div class="progress"><div id="bar"></div></div><p id="count" class="muted"></p><section class="card"><div class="step" id="step"></div><h2 id="title"></h2><p id="intro"></p><div class="code" id="example"></div><p id="detail" class="muted"></p><label><input type="checkbox" id="done">このレッスンを試した！</label><div class="controls"><button id="prev">← 前へ</button><button id="next">次へ →</button></div></section><div class="card"><strong>💡 コツ</strong><p>開発環境とチュートリアルをブラウザの別タブで開くと、見比べながら進められるよ。保存は「💾 保存」、再開は「📂 読込」。</p></div></main><footer>無料・登録不要・スマホ対応 · salp Tools</footer><script>
const lessons=[
['はじめての実行','最初から入っているサンプルを動かしてみよう。','▶ 実行 → 🐈 猫が移動 → ジャンプ → 🔔 → ⭐','画面をタップしても実行できるよ。最初は何も変えず、動きを見てみよう。'],
['ノードを動かす','色のついたノードを指でドラッグしてみよう。','🧩 ノードを長押しせずにドラッグ','配置を変えても動作順は変わらないよ。緑の線と「次へ」の接続先が実行順を決めるんだ。'],
['猫を遠くへ動かす','「移動」ノードの値を変えてみよう。','➡ 移動：80 → 180','「⚙ 設定」で移動ノードの「値」を180にして実行。数字が大きいほど遠くへ進むよ。'],
['ジャンプを高くする','ジャンプの高さを調整しよう。','🐈 ジャンプ：90 → 160','ジャンプノードの値を160に変更して実行。ジャンプの高さが変わるよ。'],
['音を変える','音の高さを変えて、ゲームに効果音をつけよう。','🔔 音：440 → 660','音の値は周波数（Hz）。大きくすると高い音になるよ。音が鳴らないときは端末の音量を確認してね。'],
['得点を増やす','ゴールした気分になるように点数を増やそう。','⭐ 得点：10 → 100','得点ノードの値を100にして実行。画面の星の数字を確認しよう。'],
['ノードを追加する','待機ノードを追加して、動作の間を作ろう。','＋ ⏳ 待機 → 値：800','追加したノードの「次へ」と、前のノードの「次へ」を設定して接続しよう。800msは0.8秒だよ。'],
['向きを変える','猫を右へ進めたあと、左へ戻してみよう。','➡ 移動 → ↩ 反転(-1) → ➡ 移動','「反転」ノードを追加して値を-1にする。さらに移動ノードを追加し、順番につなげよう。'],
['実行順を考える','「次へ」を変えて動作順を組み替えよう。','開始 → 移動 → 音 → 得点 → 終了','設定の「次へ」で接続先を選べるよ。開始にするボタンで、最初のノードも変えられる。無限につながないよう注意！'],
['保存して作品を持ち帰る','作ったゲームを保存・書き出ししよう。','💾 保存 / ⬇ JSON / ⬇ 作品HTML','保存は同じブラウザ内、JSONは編集用バックアップ、作品HTMLは遊ぶためのファイル。これで最初の作品が完成！']
];
let index=0;const $=id=>document.getElementById(id);let completed;try{completed=JSON.parse(localStorage.getItem('salp.creator.tutorial.progress')||'[]')}catch{completed=[]}if(!Array.isArray(completed))completed=[];
function render(){let l=lessons[index];$('step').textContent='LESSON '+(index+1);$('title').textContent=l[0];$('intro').textContent=l[1];$('example').textContent=l[2];$('detail').textContent=l[3];$('count').textContent=(index+1)+' / '+lessons.length+' レッスン · 完了 '+completed.length+' 件';$('bar').style.width=(completed.length/lessons.length*100)+'%';$('done').checked=completed.includes(index);$('prev').disabled=index===0;$('next').textContent=index===lessons.length-1?'最初へ ↺':'次へ →'}
$('done').onchange=e=>{completed=e.target.checked?[...new Set([...completed,index])]:completed.filter(n=>n!==index);localStorage.setItem('salp.creator.tutorial.progress',JSON.stringify(completed));render()};$('prev').onclick=()=>{index=Math.max(0,index-1);render();scrollTo(0,0)};$('next').onclick=()=>{index=(index+1)%lessons.length;render();scrollTo(0,0)};render();
</script></body></html>
