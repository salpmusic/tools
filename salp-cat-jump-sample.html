<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>三毛猫ジャンプ | salp Game Creator</title><style>*{box-sizing:border-box}body{margin:0;background:#13213b;color:#fff;font:17px system-ui}header{padding:12px 16px;background:#233957}h1{font-size:22px;margin:3px 0}a{color:#b5e8ff}main{max-width:860px;margin:auto;padding:12px}canvas{display:block;width:100%;aspect-ratio:16/9;background:#a6e2ff;border-radius:14px;touch-action:none}button{font:inherit;min-height:50px;border:0;border-radius:12px;padding:10px 20px;color:white;background:#3e5b9a;margin:6px 3px}#jump{background:#06886d;font-weight:bold;font-size:22px;min-width:180px}#info{color:#c9d9f1}p{line-height:1.6}</style></head><body><header><h1>🐈 三毛猫ジャンプ</h1><div>salp Game Creator · サンプルゲーム 01</div></header><main><p><a href="./salp-game-creator-v1.1.html">← 開発環境へ</a>　<a href="./index.html">🏠 ホームへ</a></p><canvas id="game" width="800" height="450" aria-label="横スクロールジャンプゲーム"></canvas><div><button id="start">▶ スタート / リトライ</button><button id="jump">🐾 ジャンプ！</button></div><p id="info" role="status">スタートを押してね。画面タップ・スペースキーでもジャンプできるよ。</p><p>横スクロールする地面の穴を、ジャンプで飛び越えよう！ 進むほど少しずつ速くなるよ。ゲームオーバー後はリトライできるよ。</p></main><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),info=document.getElementById('info');let state='ready',distance=0,speed=220,playerY=0,vy=0,gaps=[],nextGap=570,last=0,raf=0,best=0;try{best=Number(localStorage.getItem('salp.catjump.best')||0)||0}catch{}const ground=350,px=165,pw=48,ph=54;function reset(){distance=0;speed=220;playerY=0;vy=0;gaps=[];nextGap=570;state='playing';last=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);info.textContent='穴に落ちないようにジャンプ！'}function jump(){if(state!=='playing'){reset();return}if(playerY>=-1&&Math.abs(vy)<5)vy=-650}function isGap(x){return gaps.some(g=>x>=g.x&&x<=g.x+g.w)}function frame(t){if(state!=='playing')return;if(!last)last=t;let dt=Math.min(.035,(t-last)/1000);last=t;distance+=speed*dt;speed=Math.min(410,220+distance*.012);while(nextGap<distance+1150){let w=105+Math.min(35,distance/400)+Math.random()*32;gaps.push({x:nextGap,w});nextGap+=w+300+Math.random()*200}gaps=gaps.filter(g=>g.x+g.w>distance-150);let feet=ground+playerY;if(playerY<0||vy<0||isGap(distance+px+pw*.3)){vy+=1650*dt;playerY+=vy*dt}else{playerY=0;vy=0}if(playerY>110){state='over';const score=Math.floor(distance/10);if(score>best){best=score;try{localStorage.setItem('salp.catjump.best',String(best))}catch{}}info.textContent='ゲームオーバー！ '+score+'点 · 最高 '+best+'点。リトライしよう！'}draw();if(state==='playing')raf=requestAnimationFrame(frame)}
function draw(){let W=800,H=450;ctx.fillStyle='#a7dffc';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff8d0';ctx.beginPath();ctx.arc(690,72,34,0,7);ctx.fill();for(let i=0;i<5;i++){let cx=((i*240-distance*.16)%1100+1100)%1100-100;ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.ellipse(cx,105+i%2*35,60,20,0,0,7);ctx.fill()}ctx.fillStyle='#84bd75';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#6d9854';ctx.fillRect(0,ground+16,W,10);for(let g of gaps){let x=g.x-distance;if(x>W||x+g.w<0)continue;ctx.fillStyle='#34435e';ctx.fillRect(x,ground,g.w,H-ground);ctx.fillStyle='#18253c';ctx.fillRect(x+4,ground+9,Math.max(0,g.w-8),H-ground)}ctx.font='54px system-ui';ctx.textAlign='center';ctx.fillText('🐈',px+pw/2,ground+playerY-4);ctx.fillStyle='#182b45';ctx.textAlign='left';ctx.font='bold 27px system-ui';ctx.fillText('⭐ '+Math.floor(distance/10),18,40);ctx.font='19px system-ui';ctx.fillText('BEST '+best,18,70);if(state!=='playing'){ctx.fillStyle='rgba(14,28,52,.72)';ctx.fillRect(160,145,480,140);ctx.textAlign='center';ctx.fillStyle='white';ctx.font='bold 36px system-ui';ctx.fillText(state==='over'?'ゲームオーバー！':'🐈 三毛猫ジャンプ',400,200);ctx.font='22px system-ui';ctx.fillText(state==='over'?'スタートで再挑戦':'スタートで走り出そう！',400,243)}}document.getElementById('start').onclick=reset;document.getElementById('jump').onclick=jump;canvas.addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)jump()}});draw();
})();
</script></body></html>
