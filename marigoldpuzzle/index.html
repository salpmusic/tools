  function silentAudio(){ /* iOSのミュートスイッチ回避の補助: 無音の<audio>を1回再生 */

    try{ctx.onstatechange=function(){if(ctx.state==='running')disarm();else arm()}}catch(e){}
    if(cfg.onCreate)cfg.onCreate(ctx,master);

  }
  function resume(){
    if(!ctx)return Promise.resolve(false);
    if(ctx.state==='running')return Promise.resolve(true);
    var p;try{p=ctx.resume()}catch(e){return Promise.resolve(false)}

    try{
      session();

function bgmWord(k){return (BGM_WORDS[LANG]||BGM_WORDS.en)[k]||BGM_WORDS.en[k]}
function setBgmVolume(){bgm.volume=Math.min(1,Math.max(0,S.vol/100*0.7))}
function updateBgmUI(){
 var playing=!bgm.paused&&!bgm.ended,b=$('tBgm');if(!b)return;
 b.textContent=bgmWord(playing?'stop':'play');
 b.setAttribute('aria-pressed',String(playing));
 $('bgmStatus').textContent=bgmStatus==='error'?bgmWord('error'):
  bgmStatus==='loading'?bgmWord('loading'):
  bgmTapNeeded?bgmWord('tap'):'♫ Fluffy Marigold Diary · Morning';
}
function playMorningBgm(){
 if(!S.bgm||document.hidden)return;
 if(bgmStatus!=='ready'){loadMorningBgm();return}
 setBgmVolume();bgmTapNeeded=false;
 try{var p=bgm.play();
  if(p&&p.then)p.then(function(){bgmTapNeeded=false;updateBgmUI()},function(){bgmTapNeeded=true;updateBgmUI()});
 }catch(e){bgmTapNeeded=true}
 updateBgmUI();
}
function loadMorningBgm(){
 if(bgmStatus==='ready')return Promise.resolve(true);
 if(bgmPending)return bgmPending;
 bgmStatus='loading';updateBgmUI();
 bgmPending=fetch('../salp-marigold-morning-v1.0.html',{cache:'force-cache'})
 .then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.text()})
 .then(function(html){
   var m=html.match(/<audio\b[^>]*\bsrc=["'](data:audio\/mpeg;base64,[A-Za-z0-9+/=]+)["']/i);
   if(!m)throw Error('Morning MP3 not found');
   bgm.src=m[1];bgmStatus='ready';setBgmVolume();
   if(S.bgm&&G.run)playMorningBgm();
   updateBgmUI();return true;
 }).catch(function(e){bgmStatus='error';updateBgmUI();return false})
 .then(function(ok){bgmPending=null;return ok});
 return bgmPending;
}
$('tBgm').onclick=function(){
 SalpAudio.unlock();
 if(!bgm.paused){S.bgm=false;bgm.pause();bgmTapNeeded=false}
 else{S.bgm=true;if(bgmStatus==='error')bgmPending=null;playMorningBgm()}
 save();updateBgmUI();
};
bgm.addEventListener('play',updateBgmUI);bgm.addEventListener('pause',updateBgmUI);
bgm.addEventListener('error',function(){bgmStatus='error';updateBgmUI()});
window.addEventListener('pagehide',function(){bgm.pause()});
/* ---- game ---- */
var G={C:2,R:4,a:[],blank:0,moves:0,t0:0,el:[],run:false,timer:0,hist:[]};
var board=$('board');
function img(i){return './'+PICS[i]+'.webp'}
function solvable(a,C,R){var inv=0,b=-1,x=[];for(var i=0;i<a.length;i++){if(a[i]<0)b=i;else x.push(a[i])}for(i=0;i<x.length;i++)for(var j=i+1;j<x.length;j++)if(x[i]>x[j])inv++;if(C%2===1)return inv%2===0;var rb=R-Math.floor(b/C);return (inv+rb)%2===1}
function nbrs(p,C,R){var r=Math.floor(p/C),c=p%C,o=[];if(r>0)o.push(p-C);if(r<R-1)o.push(p+C);if(c>0)o.push(p-1);if(c<C-1)o.push(p+1);return o}
function solved(){for(var i=0;i<G.a.length-1;i++)if(G.a[i]!==i)return false;return true}
function shuffle(){var C=G.C,R=G.R,N=C*R,a=[],i;for(i=0;i<N-1;i++)a.push(i);a.push(-1);
 var b=N-1,prev=-1,steps=Math.max(60,N*N*3),hist=[];
 do{for(i=0;i<steps;i++){var ns=nbrs(b,C,R).filter(function(q){return q!==prev});var q=ns[Math.floor(Math.random()*ns.length)];a[b]=a[q];a[q]=-1;prev=b;b=q;hist.push(b)}
   var mis=0;for(i=0;i<N-1;i++)if(a[i]!==i)mis++;}while(mis<Math.ceil((N-1)*0.6));
 if(!solvable(a,C,R))throw new Error('unsolvable');G.a=a;G.blank=b;G.hist=hist}
function layout(){var W=board.clientWidth,H=board.clientHeight,tw=W/G.C,th=H/G.R;
 G.el.forEach(function(el,id){var p=G.a.indexOf(id);el.style.width=tw+'px';el.style.height=th+'px';el.style.backgroundSize=W+'px '+H+'px';el.style.backgroundPosition=(-(id%G.C)*tw)+'px '+(-Math.floor(id/G.C)*th)+'px';el.style.transform='translate('+((p%G.C)*tw)+'px,'+(Math.floor(p/G.C)*th)+'px)'})}
function build(){G.el.forEach(function(e){e.remove()});G.el=[];var N=G.C*G.R;
 for(var id=0;id<N-1;id++){var d=document.createElement('div');d.className='tile';d.style.backgroundImage='url('+img(S.pic)+')';d.innerHTML='<span class="n">'+(id+1)+'</span>';d.dataset.id=id;board.insertBefore(d,$('model'));G.el.push(d)}
 layout()}
function fmt(ms){var s=Math.floor(ms/1000);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function tick(){$('tm').textContent=fmt(G.t0?Date.now()-G.t0:0)}
function key(){return PICS[S.pic]+'_'+LVS[S.lv].join('x')}
function bestText(){var b=S.best[key()];return b?t('bl',b.m,fmt(b.t)):t('nobest')}
function moveTo(p){if(!G.run)return false;var C=G.C,b=G.blank,pr=Math.floor(p/C),pc=p%C,br=Math.floor(b/C),bc=b%C,step;
 if(p===b)return false;
 if(pr===br)step=pc>bc?1:-1;else if(pc===bc)step=pr>br?C:-C;else{sfx.bump();board.animate&&board.animate([{transform:'translateX(-3px)'},{transform:'translateX(3px)'},{transform:'none'}],{duration:180});return false}
 if(!G.t0){G.t0=Date.now();G.timer=setInterval(tick,250)}
 while(b!==p){var q=b+step;G.a[b]=G.a[q];G.a[q]=-1;b=q;G.moves++}
 G.blank=b;sfx.slide();layout();$('mv').textContent=G.moves;
 if(solved())win();return true}
board.addEventListener('pointerdown',function(e){var el=e.target.closest('.tile');if(!el)return;e.preventDefault();moveTo(G.a.indexOf(+el.dataset.id))});
document.addEventListener('keydown',function(e){if(!G.run||$('tut').classList.contains('open'))return;var C=G.C,b=G.blank,r=Math.floor(b/C),c=b%C,p=-1;
 if(e.key==='ArrowLeft'&&c<C-1)p=b+1;else if(e.key==='ArrowRight'&&c>0)p=b-1;else if(e.key==='ArrowUp'&&r<G.R-1)p=b+C;else if(e.key==='ArrowDown'&&r>0)p=b-C;else return;e.preventDefault();moveTo(p)});
function start(){SalpAudio.unlock();playMorningBgm();G.C=LVS[S.lv][0];G.R=LVS[S.lv][1];shuffle();G.moves=0;G.t0=0;clearInterval(G.timer);G.run=true;
 board.classList.remove('done');$('full').classList.remove('show');$('result').hidden=true;build();try{board.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}$('mv').textContent='0';tick();say('playing');sfx.start();$('start').textContent=t('restart')}
function win(){G.run=false;clearInterval(G.timer);var ms=Date.now()-G.t0;$('tm').textContent=fmt(ms);
 var k=key(),b=S.best[k],nb=!b||G.moves<b.m||(G.moves===b.m&&ms<b.t);
 if(nb)S.best[k]={m:G.moves,t:ms};else{if(ms<b.t){b.t=ms;nb=true}}
 S.clr=S.clr||{};S.clr[k]=1;save();
 board.classList.add('done');$('full').src=img(S.pic);setTimeout(function(){$('full').classList.add('show')},150);sfx.win();
 var last=S.lv>=LVS.length-1;
 var r=$('result');r.innerHTML='<h2>'+t('clear')+'</h2><img src="'+img(S.pic)+'" alt="">'+'<div><b>'+t('res',G.moves,fmt(ms))+'</b></div>'+(nb?'<div>'+t('nb')+'</div>':'')+'<div>'+bestText()+'</div>'+(last?'<div>'+t('allclear')+'</div>':'')+'<div class="bt">'+(last?'':'<button type="button" class="main" id="bNext">'+t('next')+'</button>')+'<button type="button" class="tog" id="bAgain">'+t('again')+'</button></div>';
 r.hidden=false;say('clear');$('start').textContent=t('start');drawPick();
 var bn=$('bNext');if(bn)bn.onclick=function(){S.lv++;save();drawPick();start()};$('bAgain').onclick=start;
 window.__mpWins=(window.__mpWins||0)+1}
var lastMsg='ready';function say(k){lastMsg=k;$('msg').textContent=t(k)}
function drawPick(){var p=document.querySelector('.pics');p.innerHTML=PICS.map(function(n,i){return '<button type="button" data-p="'+i+'" class="'+(i===S.pic?'on':'')+'" aria-pressed="'+(i===S.pic)+'"><img src="./'+n+'-s.webp" alt="">'+t('p'+i)+'</button>'}).join('');
 var l=document.querySelector('.lvs');l.innerHTML=LVS.map(function(z,i){var c=S.clr&&S.clr[PICS[S.pic]+'_'+z.join('x')];return '<button type="button" data-l="'+i+'" class="'+(i===S.lv?'on':'')+'" aria-pressed="'+(i===S.lv)+'">'+t('l'+i)+(c?' <span class="ck">✓</span>':'')+'<small>'+z[0]+'×'+z[1]+'</small></button>'}).join('');
 $('bestLine').textContent=t('best')+' — '+bestText().replace(/^[^:]*:\s*/,'')}
document.querySelector('.pics').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S.pic=+b.dataset.p;save();idle()});
document.querySelector('.lvs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S.lv=+b.dataset.l;save();idle()});
function idle(){G.run=false;clearInterval(G.timer);G.t0=0;G.moves=0;G.C=LVS[S.lv][0];G.R=LVS[S.lv][1];var N=G.C*G.R;G.a=[];for(var i=0;i<N-1;i++)G.a.push(i);G.a.push(-1);G.blank=N-1;
 build();board.classList.add('done');$('full').src=img(S.pic);$('full').classList.add('show');$('model').src=img(S.pic);$('result').hidden=true;$('mv').textContent='0';tick();say('ready');$('start').textContent=t('start');drawPick()}
$('start').onclick=function(){if(!S.tut){S.tut=true;save();openTut(0,true);return}start()};
var mOn=false;$('bModel').onclick=function(){mOn=!mOn;this.setAttribute('aria-pressed',mOn);$('model').src=img(S.pic);$('model').classList.toggle('show',mOn)};
function setNum(){board.classList.toggle('nums',S.num||S.hc);$('bNum').setAttribute('aria-pressed',S.num)}
$('bNum').onclick=function(){S.num=!S.num;save();setNum()};
function setSnd(){$('tSound').textContent=t(S.snd?'son':'soff');$('tSound').setAttribute('aria-pressed',S.snd);$('vol').value=S.vol;applyVol()}
$('tSound').onclick=function(){S.snd=!S.snd;save();setSnd();SalpAudio.unlock();sfx.slide()};
$('vol').oninput=function(){S.vol=+this.value;save();applyVol();setBgmVolume()};
$('vol').onchange=function(){SalpAudio.unlock();sfx.slide()};
function setVis(){document.body.classList.toggle('hc',S.hc);document.body.classList.toggle('large',S.lg);$('tHc').setAttribute('aria-pressed',S.hc);$('tLg').setAttribute('aria-pressed',S.lg);setNum();setTimeout(layout,30)}
$('tHc').onclick=function(){S.hc=!S.hc;save();setVis()};$('tLg').onclick=function(){S.lg=!S.lg;save();setVis()};
/* tutorial */
var TS=0,tutStart=false,tAnim=0;
function mini(cells){return '<div class="mini">'+cells.map(function(c){if(c==='e')return '<div class="mc e"></div>';var id=c.id,x=id%3,y=Math.floor(id/3);return '<div class="mc" style="background-image:url('+img(S.pic)+');background-size:132px 156px;background-position:'+(-x*44)+'px '+(-y*52)+'px">'+(c.f?'<span class="fg">👆</span>':'')+'</div>'}).join('')+'</div>'}
function drawTut(){clearInterval(tAnim);var v=$('tvis');
 if(TS===0){v.innerHTML='<div style="display:flex;gap:6px;justify-content:center">'+PICS.map(function(n){return '<img src="./'+n+'-s.webp" style="width:52px;height:92px;border-radius:6px;border:2px solid #f2cfa4;object-fit:cover" alt="">'}).join('')+'</div>'}
 else if(TS===1){var f=0,A=[[{id:0},{id:1},{id:2},{id:3},{id:5},'e',{id:6},{id:7},{id:4,f:1}],[{id:0},{id:1},{id:2},{id:3},{id:5},{id:4},{id:6},{id:7},'e']];v.innerHTML=mini(A[0]);tAnim=setInterval(function(){f^=1;v.innerHTML=mini(A[f])},1100)}
 else{var g=0,B=[[{id:0},{id:1},{id:2},{id:3},{id:4},{id:5},{id:6},'e',{id:7,f:1}],[{id:0},{id:1},{id:2},{id:3},{id:4},{id:5},{id:6},{id:7},'e']];v.innerHTML=mini(B[0]);tAnim=setInterval(function(){g^=1;v.innerHTML=mini(B[g])},1100)}
 $('tcap').textContent=t('c'+(TS+1));$('th').textContent=t('th'+(TS+1));$('tb').textContent=t('tb'+(TS+1));
 [].forEach.call($('tdots').children,function(d,i){d.className=i===TS?'on':''});$('tPrev').disabled=TS===0;$('tNext').textContent=t(TS===2?'done':'nxt')}
function openTut(s,st){TS=s||0;tutStart=!!st;$('tut').classList.add('open');drawTut()}
function closeTut(){clearInterval(tAnim);$('tut').classList.remove('open');if(tutStart){tutStart=false;start()}}
$('tPrev').onclick=function(){if(TS>0){TS--;drawTut()}};$('tNext').onclick=function(){if(TS<2){TS++;drawTut()}else closeTut()};$('tClose').onclick=closeTut;
$('bHelp').onclick=function(){openTut(0,false)};
/* i18n */
function applyLang(){document.documentElement.lang=LANG;document.title='🌼 '+t('title')+' | salp Tools';
 [].forEach.call(document.querySelectorAll('[data-i]'),function(e){e.textContent=t(e.dataset.i)});
 [].forEach.call(document.querySelectorAll('[data-ia]'),function(e){e.setAttribute('aria-label',t(e.dataset.ia))});
 [].forEach.call(document.querySelectorAll('.lng button'),function(b){b.classList.toggle('on',b.dataset.lg===LANG)});
 $('start').textContent=t(G.run?'restart':'start');say(lastMsg);setSnd();drawPick();updateBgmUI();if($('tut').classList.contains('open'))drawTut()}
document.querySelector('.lng').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;LANG=b.dataset.lg;try{localStorage.setItem(LK,LANG)}catch(x){}applyLang()});
addEventListener('resize',function(){layout()});
window.__mp={G:G,start:start,solvable:solvable,shuffle:shuffle,moveTo:moveTo,S:S};
applyLang();setVis();idle();loadMorningBgm();
})();
