<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>salp Mini Meeting | 端末確認</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7fb;color:#17314c;font:21px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}main{max-width:740px;margin:auto;padding:18px 16px 40px}h1{font-size:30px}h2{font-size:24px}.panel{background:#fff;border:2px solid #dce5ef;border-radius:18px;padding:18px;margin:18px 0}.note{background:#fff4d9;padding:14px;border-radius:12px;font-size:18px}button{display:block;width:100%;min-height:70px;margin:12px 0;border:0;border-radius:14px;background:#18783d;color:#fff;font-size:24px;font-weight:bold}button.secondary{background:#245d94}button.stop{background:#a42e3a}button:disabled{background:#8a9aa7}video{width:100%;max-height:340px;background:#233548;border-radius:12px}.hide{display:none}.row{display:flex;gap:10px}.row button{font-size:19px}.status{font-weight:bold}small,footer,details{font-size:16px}#meterOuter{height:25px;border-radius:14px;background:#e1e9f1;overflow:hidden}#meter{height:100%;width:0;background:#16834d}details{overflow-wrap:anywhere}
</style></head><body><main><h1>🌷 salp Mini Meeting</h1><p>みんなで、かんたんにお話し。</p><p class="note">これは<strong>端末確認版</strong>です。まだほかの人とは通話できません。カメラとマイクが使えるかを調べます。</p><section class="panel"><h2>① カメラとマイクの確認</h2><p>下の緑のボタンを押してください。</p><button id="start">カメラとマイクを確認する</button><p id="status" class="status" role="status" aria-live="polite">まだ確認していません</p><video id="preview" autoplay muted playsinline webkit-playsinline class="hide"></video><div id="controls" class="hide"><div class="row"><button id="camera" class="secondary">カメラを切る</button><button id="mic" class="secondary">マイクを切る</button></div><button id="stop" class="stop">確認を終了する</button></div></section><section class="panel"><h2>② 音声の確認</h2><p>声を出すと、緑の棒が動きます。</p><div id="meterOuter"><div id="meter"></div></div><p id="audioStatus" class="status">マイクの確認前です</p></section><section class="panel"><h2>③ 端末情報</h2><p id="support"></p><details><summary>くわしい情報を見る</summary><p id="details"></p></details></section><footer>この確認版では映像・音声を外部に送信しません。HTTPSでご利用ください。</footer></main><script>
(function(){'use strict';var stream=null,ctx=null,source=null,analyser=null,timer=null,micOn=true,cameraOn=true;function e(id){return document.getElementById(id)}function msg(s){e('status').textContent=s}function stop(){if(timer){clearInterval(timer);timer=null}if(source){try{source.disconnect()}catch(x){}source=null}if(ctx){try{ctx.close()}catch(x){}ctx=null}if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}e('preview').srcObject=null;e('preview').className='hide';e('controls').className='hide';e('start').disabled=false;e('start').textContent='もう一度確認する';e('meter').style.width='0';e('audioStatus').textContent='確認を終了しました';msg('確認を終了しました')}function meter(s){var AC=window.AudioContext||window.webkitAudioContext;if(!AC){e('audioStatus').textContent='音声メーターは使えません';return}try{ctx=new AC();source=ctx.createMediaStreamSource(s);analyser=ctx.createAnalyser();analyser.fftSize=512;source.connect(analyser);var data=new Uint8Array(512);timer=setInterval(function(){if(!micOn){e('meter').style.width='0';return}analyser.getByteTimeDomainData(data);var sum=0;for(var i=0;i<data.length;i++){var v=(data[i]-128)/128;sum+=v*v}e('meter').style.width=Math.min(100,Math.round(Math.sqrt(sum/data.length)*420))+'%'},140);e('audioStatus').textContent='話すと緑の棒が動きます'}catch(x){e('audioStatus').textContent='音声メーターを開始できませんでした'}}e('start').onclick=function(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg('このブラウザは対応していません');return}e('start').disabled=true;msg('カメラとマイクの許可を確認しています…');navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:{width:{ideal:320},height:{ideal:240},frameRate:{ideal:10,max:15},facingMode:'user'}}).then(function(s){stream=s;micOn=true;cameraOn=true;e('preview').srcObject=s;e('preview').className='';e('controls').className='';e('camera').textContent='カメラを切る';e('mic').textContent='マイクを切る';msg('カメラとマイクが使えます！');meter(s)}).catch(function(x){e('start').disabled=false;msg((x.name==='NotAllowedError'?'カメラとマイクを許可してください。':x.name==='NotFoundError'?'カメラかマイクが見つかりません。':'確認できませんでした。')+' ('+x.name+')')})};e('stop').onclick=stop;e('camera').onclick=function(){if(!stream)return;cameraOn=!cameraOn;stream.getVideoTracks().forEach(function(t){t.enabled=cameraOn});e('camera').textContent=cameraOn?'カメラを切る':'カメラを入れる';msg(cameraOn?'カメラが入っています':'カメラは切れています')};e('mic').onclick=function(){if(!stream)return;micOn=!micOn;stream.getAudioTracks().forEach(function(t){t.enabled=micOn});e('mic').textContent=micOn?'マイクを切る':'マイクを入れる';e('audioStatus').textContent=micOn?'マイクが入っています':'マイクは切れています'};e('support').textContent=(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia?'カメラ・マイク：対応':'カメラ・マイク：未対応')+' ／ '+(window.RTCPeerConnection?'WebRTC：対応':'WebRTC：未対応');e('details').textContent=navigator.userAgent;window.addEventListener('pagehide',stop)})();
</script></body></html>
